<h1>
  Checkout
</h1><div
  id="loading"
  class="loading"
>
  Loading selected song...
</div><div
  id="error"
  class="error"
  style="display:none;"
></div><div
  id="checkoutCard"
  class="card"
  style="display:none;"
>  <div class="song-preview"><div id="coverContainer"></div>

<div>

  <div
    id="checkoutTitle"
    class="song-title"
  >
    Selected Song
  </div>

  <div
    id="artistName"
    class="artist"
  >
    Unknown Artist
  </div>

  <div
    id="genre"
    class="genre"
  >
    Music
  </div>

</div>

  </div>  <div class="price-box"><div class="price-label">
  Music price
</div>

<div
  id="checkoutPrice"
  class="price"
>
  UGX 700
</div>

  </div>  <div class="payment-title">
    Choose payment method
  </div>  <div class="payment-text">
    Select your preferred payment method to continue
    with your PASONG purchase.
  </div>  <div class="payment-buttons"><button
  class="payment-button"
  onclick="startPayment('MTN MoMo')"
>
  📱 MTN MoMo
</button>

<button
  class="payment-button"
  onclick="startPayment('Airtel Money')"
>
  📱 Airtel Money
</button>

<button
  class="payment-button"
  onclick="startPayment('Card')"
>
  💳 Card
</button>

  </div>  <div
    id="paymentStatus"
    class="status"
  ></div></div></main><footer>
  PASONG © 2026 • Music • Artists • Opportunity
</footer><script>

const API_URL =
  "https://pasong-api.vercel.app";


let selectedSong = null;


/* =========================
   GET SONG ID
   ========================= */

function getSongId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =========================
   SHOW ERROR
   ========================= */

function showError(message){

  document.getElementById(
    "loading"
  ).style.display = "none";

  document.getElementById(
    "checkoutCard"
  ).style.display = "none";

  const error =
    document.getElementById("error");

  error.textContent =
    message;

  error.style.display =
    "block";

}


/* =========================
   LOAD SONG
   ========================= */

async function loadCheckout(){

  const songId =
    getSongId();


  if(!songId){

    showError(
      "No song was selected for checkout."
    );

    return;

  }


  try{

    const response =
      await fetch(
        API_URL +
        "/api/songs/" +
        encodeURIComponent(songId)
      );


    if(!response.ok){

      throw new Error(
        "Song could not be loaded."
      );

    }


    const result =
      await response.json();


    selectedSong =
      result.song ||
      result;


    if(
      !selectedSong ||
      !selectedSong.id
    ){

      throw new Error(
        "Invalid song information."
      );

    }


    /* =====================
       TITLE
       ===================== */

    document.getElementById(
      "checkoutTitle"
    ).textContent =
      selectedSong.title ||
      "Untitled Song";


    /* =====================
       ARTIST
       ===================== */

    document.getElementById(
      "artistName"
    ).textContent =
      selectedSong.artist_name ||
      selectedSong.artist?.stage_name ||
      selectedSong.artist?.artist_name ||
      selectedSong.artist_profiles?.stage_name ||
      selectedSong.artist_profiles?.artist_name ||
      "Unknown Artist";


    /* =====================
       GENRE
       ===================== */

    document.getElementById(
      "genre"
    ).textContent =
      selectedSong.genre ||
      "Music";


    /* =====================
       PRICE
       ===================== */

    const marketplacePrice =
      Number(
        selectedSong.marketplace_price
      );

    const databasePrice =
      Number(
        selectedSong.price
      );


    const finalPrice =
      Number.isFinite(
        marketplacePrice
      )
      ? marketplacePrice
      : (
          Number.isFinite(
            databasePrice
          )
          ? databasePrice
          : 700
        );


    const currency =
      selectedSong.marketplace_currency ||
      selectedSong.currency ||
      "UGX";


    const label =
      selectedSong.marketplace_label ||
      (
        finalPrice.toLocaleString() +
        " " +
        currency
      );


    document.getElementById(
      "checkoutPrice"
    ).textContent =
      label;


    /* =====================
       COVER
       ===================== */

    const coverContainer =
      document.getElementById(
        "coverContainer"
      );


    if(selectedSong.cover_url){

      coverContainer.innerHTML = `
        <img
          src="${selectedSong.cover_url}"
          class="cover"
          alt="Song cover"
        >
      `;

    }else{

      coverContainer.innerHTML = `
        <div class="no-cover">
          PASONG
        </div>
      `;

    }


    /* =====================
       SHOW
       ===================== */

    document.getElementById(
      "loading"
    ).style.display = "none";


    document.getElementById(
      "checkoutCard"
    ).style.display = "block";


  }catch(error){

    console.error(
      "PASONG CHECKOUT:",
      error
    );


    showError(
      error.message ||
      "Failed to load checkout."
    );

  }

}


/* =========================
   PAYMENT BUTTON
   ========================= */

function startPayment(method){

  const status =
    document.getElementById(
      "paymentStatus"
    );


  status.style.display =
    "block";


  /*
    Payment processing is NOT connected yet.

    This is intentionally not pretending
    that a payment has been made.
  */

  status.textContent =
    method +
    " checkout is being connected. " +
    "No payment has been taken yet.";

}


/* =========================
   START
   ========================= */

loadCheckout();

</script></body>
</html>
