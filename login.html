<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>PASONG — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#09090f;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.box{
width:100%;
max-width:390px;
background:#12121b;
border:1px solid #292938;
border-radius:16px;
padding:30px;
box-shadow:0 18px 50px rgba(0,0,0,.35)
}
.logo{
text-align:center;
font-size:22px;
font-weight:800;
margin-bottom:8px
}
.subtitle{
text-align:center;
color:#9999aa;
font-size:13px;
margin-bottom:24px
}
h1{
font-size:24px;
margin-bottom:22px;
text-align:center
}
label{
display:block;
font-size:13px;
font-weight:700;
color:#dddde8;
margin-bottom:7px
}
.field{
margin-bottom:16px
}
.password-wrap{
position:relative
}
input{
width:100%;
height:46px;
padding:12px 14px;
border-radius:10px;
border:1px solid #303040;
background:#171720;
color:#fff;
outline:none;
font-size:15px
}
input:focus{
border-color:#8b5cf6;
box-shadow:0 0 0 2px rgba(139,92,246,.12)
}
input::placeholder{
color:#777789
}
.password-wrap input{
padding-right:50px
}
.toggle{
position:absolute;
right:5px;
top:4px;
width:38px;
height:38px;
padding:0;
border:0;
background:transparent;
color:#aaaabd;
cursor:pointer;
font-size:17px
}
.toggle:hover{
background:transparent;
color:#c084fc
}
.login-btn{
width:100%;
height:46px;
margin-top:4px;
border:0;
border-radius:10px;
background:#8b5cf6;
color:#fff;
font-weight:700;
font-size:15px;
cursor:pointer
}
.login-btn:hover{
background:#7c4ee8
}
.login-btn:disabled{
opacity:.6;
cursor:not-allowed
}
.links{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:16px;
font-size:13px
}
a{
color:#c084fc;
text-decoration:none
}
a:hover{
color:#ec4899
}
.bottom{
text-align:center;
margin-top:22px;
font-size:13px
}
.error,.success{
display:none;
padding:10px 12px;
border-radius:9px;
font-size:13px;
line-height:1.4;
margin-bottom:14px
}
.error{
color:#ff9a9a;
background:#1b1218;
border:1px solid #493344
}
.success{
color:#d7b7ff;
background:#17121f;
border:1px solid #49366b
}
.status{
min-height:18px;
margin-top:12px;
text-align:center;
font-size:13px;
color:#9999aa
}
footer{
margin-top:22px;
padding-top:18px;
border-top:1px solid #252533;
text-align:center;
color:#777788;
font-size:12px
}
@media(max-width:430px){
body{padding:14px}
.box{padding:25px 20px}
}
</style>
</head><body><div class="box"><div class="logo">◈ PASONG</div>
<div class="subtitle">Music • Artists • Opportunity</div><h1>Login</h1><div id="err" class="error"></div>
<div id="success" class="success"></div><form id="loginForm"><div class="field">
<label for="email">Email</label>
<input
id="email"
type="email"
placeholder="Your email"
autocomplete="email"
required
>
</div><div class="field">
<label for="password">Password</label>
<div class="password-wrap">
<input
id="password"
type="password"
placeholder="Your password"
autocomplete="current-password"
required
>
<button
type="button"
class="toggle"
id="togglePassword"
aria-label="Show password"
>👁</button>
</div>
</div><button
type="submit"
class="login-btn"
id="loginButton"

«»

Login
</button>

</form><div class="links">
<a href="#" id="forgotPassword">Forgot password?</a>
<a href="/signup.html">Create account</a>
</div><div class="status" id="status"></div><div class="bottom">
<a href="/index.html">← Home</a>
</div><footer>
PASONG © 2026 • Music • Artists • Opportunity
</footer></div><script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const form=document.getElementById("loginForm");
const email=document.getElementById("email");
const password=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const togglePassword=document.getElementById("togglePassword");
const forgotPassword=document.getElementById("forgotPassword");
const err=document.getElementById("err");
const success=document.getElementById("success");
const status=document.getElementById("status");

function clearMessages(){
err.style.display="none";
success.style.display="none";
err.textContent="";
success.textContent="";
status.textContent="";
}

function showError(message){
success.style.display="none";
err.textContent=message;
err.style.display="block";
}

function showSuccess(message){
err.style.display="none";
success.textContent=message;
success.style.display="block";
}

function friendlyError(message){
const m=String(message||"").toLowerCase();

if(m.includes("invalid login credentials")){
return"Email or password is incorrect.";
}

if(m.includes("email not confirmed")){
return"Please confirm your email address before logging in.";
}

if(m.includes("too many requests")){
return"Too many attempts. Please wait a moment and try again.";
}

return message||"Login failed. Please try again.";
}

togglePassword.addEventListener("click",function(){
if(password.type==="password"){
password.type="text";
togglePassword.textContent="🙈";
togglePassword.setAttribute("aria-label","Hide password");
}else{
password.type="password";
togglePassword.textContent="👁";
togglePassword.setAttribute("aria-label","Show password");
}
});

form.addEventListener("submit",async function(e){
e.preventDefault();

clearMessages();

const emailValue=email.value.trim();
const passwordValue=password.value;

if(!emailValue){
showError("Please enter your email.");
email.focus();
return;
}

if(!passwordValue){
showError("Please enter your password.");
password.focus();
return;
}

loginButton.disabled=true;
loginButton.textContent="Logging in...";
status.textContent="Checking your account...";

const {data,error}=await supabaseClient.auth.signInWithPassword({
email:emailValue,
password:passwordValue
});

if(error){
showError(friendlyError(error.message));
status.textContent="";
loginButton.disabled=false;
loginButton.textContent="Login";
return;
}

if(!data||!data.session){
showError("Login was not completed. Please try again.");
status.textContent="";
loginButton.disabled=false;
loginButton.textContent="Login";
return;
}

showSuccess("Login successful.");
status.textContent="Opening your account...";
loginButton.textContent="Success";

setTimeout(function(){
window.location.href="/account.html";
},700);
});

forgotPassword.addEventListener("click",async function(e){
e.preventDefault();

clearMessages();

const emailValue=email.value.trim();

if(!emailValue){
showError("Enter your email first, then tap Forgot password.");
email.focus();
return;
}

if(!emailValue.includes("@")){
showError("Please enter a valid email address.");
email.focus();
return;
}

forgotPassword.textContent="Sending...";

const {error}=await supabaseClient.auth.resetPasswordForEmail(
emailValue,
{
redirectTo:window.location.origin+"/login.html"
}
);

if(error){
showError(friendlyError(error.message));
forgotPassword.textContent="Forgot password?";
return;
}

showSuccess("If this email is registered, a password reset link has been sent.");
forgotPassword.textContent="Forgot password?";
});
</script></body>
</html>
