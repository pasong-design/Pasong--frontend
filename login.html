<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>PASONG — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#09090f;
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}
.box{
  background:#12121b;
  border:1px solid #292938;
  border-radius:16px;
  padding:30px;
  width:100%;
  max-width:380px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)
}
.logo{
  text-align:center;
  color:#c084fc;
  font-size:14px;
  font-weight:700;
  margin-bottom:12px
}
h1{
  font-size:24px;
  margin-bottom:20px;
  text-align:center
}
.field{
  position:relative;
  margin-bottom:12px
}
input{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid #303040;
  background:#171720;
  color:#fff;
  outline:none;
  font-size:15px
}
input:focus{
  border-color:#8b5cf6;
  box-shadow:0 0 0 2px rgba(139,92,246,.12)
}
.password-input{
  padding-right:48px
}
.toggle{
  position:absolute;
  right:8px;
  top:5px;
  width:38px;
  height:38px;
  padding:0;
  border:0;
  background:transparent;
  color:#aaaabd;
  cursor:pointer;
  font-size:16px
}
.toggle:hover{
  background:transparent;
  color:#c084fc
}
button.login-btn{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:0;
  background:#8b5cf6;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
  margin-top:2px
}
button.login-btn:hover{
  background:#7c4ee8
}
button.login-btn:disabled{
  opacity:.65;
  cursor:not-allowed
}
.links{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:14px;
  font-size:13px
}
a{
  color:#c084fc;
  text-decoration:none
}
a:hover{
  color:#ec4899
}
.muted{
  color:#aaaabd;
  font-size:13px;
  margin-top:16px;
  text-align:center
}
.error{
  color:#ff8a8a;
  font-size:13px;
  line-height:1.45;
  margin-bottom:12px;
  padding:10px;
  border:1px solid #493344;
  background:#17121a;
  border-radius:8px;
  display:none
}
.success{
  color:#c084fc;
  font-size:13px;
  line-height:1.45;
  margin-bottom:12px;
  padding:10px;
  border:1px solid #3b2d55;
  background:#15121d;
  border-radius:8px;
  display:none
}
.status{
  min-height:18px;
  color:#9999aa;
  font-size:13px;
  margin-top:12px;
  text-align:center
}
@media(max-width:430px){
  body{padding:14px}
  .box{padding:24px 20px}
}
</style>
</head>
<body><div class="box"><div class="logo">◈ PASONG</div>
<h1>Login</h1><div id="err" class="error"></div>
<div id="success" class="success"></div><form id="loginForm"><div class="field">
<input
  id="email"
  type="email"
  placeholder="Email"
  autocomplete="email"
  required
>
</div><div class="field">
<input
  id="password"
  class="password-input"
  type="password"
  placeholder="Password"
  autocomplete="current-password"
  required
>
<button
  type="button"
  class="toggle"
  id="togglePassword"
  aria-label="Show password"
>👁</button>
</div><button
type="submit"
class="login-btn"
id="loginButton"

«»

Login
</button>

</form><div class="links">
<a href="#" id="forgotPassword">Forgot password?</a>
<a href="/signup.html">Create account</a>
</div><div class="muted">
<a href="/index.html">← Home</a>
</div><div class="status" id="status"></div></div><script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const loginForm=document.getElementById("loginForm");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginButton=document.getElementById("loginButton");
const togglePassword=document.getElementById("togglePassword");
const forgotPassword=document.getElementById("forgotPassword");
const errBox=document.getElementById("err");
const successBox=document.getElementById("success");
const statusBox=document.getElementById("status");

function showError(message){
  successBox.style.display="none";
  successBox.textContent="";
  errBox.textContent=message;
  errBox.style.display="block";
}

function showSuccess(message){
  errBox.style.display="none";
  errBox.textContent="";
  successBox.textContent=message;
  successBox.style.display="block";
}

function clearMessages(){
  errBox.style.display="none";
  successBox.style.display="none";
  errBox.textContent="";
  successBox.textContent="";
  statusBox.textContent="";
}

function friendlyError(message){
  const text=String(message||"");

  if(text.toLowerCase().includes("invalid login credentials")){
    return "Email or password is incorrect.";
  }

  if(text.toLowerCase().includes("email not confirmed")){
    return "Please confirm your email address before logging in.";
  }

  if(text.toLowerCase().includes("too many requests")){
    return "Too many login attempts. Please wait a moment and try again.";
  }

  return text||"Unable to log in. Please try again.";
}

togglePassword.addEventListener("click",function(){
  if(passwordInput.type==="password"){
    passwordInput.type="text";
    togglePassword.textContent="🙈";
    togglePassword.setAttribute("aria-label","Hide password");
  }else{
    passwordInput.type="password";
    togglePassword.textContent="👁";
    togglePassword.setAttribute("aria-label","Show password");
  }
});

loginForm.addEventListener("submit",login);

async function login(event){
  event.preventDefault();

  clearMessages();

  const email=emailInput.value.trim();
  const password=passwordInput.value;

  if(!email){
    showError("Please enter your email address.");
    emailInput.focus();
    return;
  }

  if(!email.includes("@")){
    showError("Please enter a valid email address.");
    emailInput.focus();
    return;
  }

  if(!password){
    showError("Please enter your password.");
    passwordInput.focus();
    return;
  }

  loginButton.disabled=true;
  loginButton.textContent="Logging in...";
  statusBox.textContent="Checking your account...";

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    showError(friendlyError(error.message));
    statusBox.textContent="";
    loginButton.disabled=false;
    loginButton.textContent="Login";
    return;
  }

  if(!data||!data.user){
    showError("Login was not completed. Please try again.");
    statusBox.textContent="";
    loginButton.disabled=false;
    loginButton.textContent="Login";
    return;
  }

  showSuccess("Login successful.");
  statusBox.textContent="Opening your account...";
  loginButton.textContent="Success";

  setTimeout(function(){
    window.location.href="/account.html";
  },500);
}

forgotPassword.addEventListener("click",async function(event){
  event.preventDefault();

  clearMessages();

  const email=emailInput.value.trim();

  if(!email){
    showError("Enter your email address first, then tap Forgot password.");
    emailInput.focus();
    return;
  }

  if(!email.includes("@")){
    showError("Please enter a valid email address.");
    emailInput.focus();
    return;
  }

  forgotPassword.textContent="Sending...";

  const redirectUrl=window.location.origin+"/login.html";

  const {error}=await supabaseClient.auth.resetPasswordForEmail(
    email,
    {
      redirectTo:redirectUrl
    }
  );

  if(error){
    showError(friendlyError(error.message));
    forgotPassword.textContent="Forgot password?";
    return;
  }

  showSuccess("If this email is registered, a password reset link has been sent.");
  statusBox.textContent="";
  forgotPassword.textContent="Forgot password?";
});

async function checkExistingSession(){
  const {data}=await supabaseClient.auth.getSession();

  if(data&&data.session&&data.session.user){
    statusBox.textContent="You are already logged in. Opening your account...";

    setTimeout(function(){
      window.location.href="/account.html";
    },500);
  }
}

checkExistingSession();
</script></body>
</html>
