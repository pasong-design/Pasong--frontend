<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Promotion Checkout - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<script src="pasong-global-price-controller.js"></script>
<style>body{background:#08030f;color:#fff;font-family:Inter,Arial}</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="sticky top-0 z-20 bg-[#08030f]/90 backdrop-blur border-b border-white/10 p-4">
<div class="max-w-[900px] mx-auto flex justify-between"><b>PASONG</b><a href="promotion.html" class="text-xs bg-white text-black px-4 py-2 rounded-full">← Back</a></div>
</header>
<main class="max-w-[900px] mx-auto w-full p-5">
<h1 class="text-[32px] font-black">Checkout</h1>
<p class="text-slate-400 text-sm mt-2">Secure promotion payment via PesaPal</p>

<div class="mt-6 grid md:grid-cols-[1fr_340px] gap-6">
<div class="bg-[#171122] border border-white/10 rounded-[20px] p-6">
<h2 class="font-black text-xs tracking-widest text-purple-300">PROMOTION SUMMARY</h2>
<div id="summary" class="mt-4 text-sm text-slate-300">Loading...</div>
<div id="priceBox" class="mt-6 text-3xl font-black text-white">UGX 0</div>
<p id="packageInfo" class="text-xs text-slate-500 mt-1"></p>
</div>

<div class="bg-[#171122] border border-white/10 rounded-[20px] p-6 h-fit">
<h2 class="font-black text-xs">PAY NOW</h2>
<button id="payBtn" class="mt-4 w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black py-4 rounded-xl">Pay UGX 0 with PesaPal →</button>
<p class="text-[10px] text-slate-500 mt-3 text-center">Amount comes from your selected package. No more UGX 700.</p>
<div id="status" class="hidden mt-3 p-3 rounded-xl text-xs"></div>
</div>
</div>
</main>

<script>
const SUPABASE_URL='https://mtufczmjlkvycarxylgh.supabase.co';
const SUPABASE_KEY='sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP';
let db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(window.location.search);
const promotion_id=params.get('promotion_id');
const song=params.get('song')||params.get('song_title')||'Your Track';
const amount=params.get('amount')||'50000';
const pkg=params.get('package')||'starter';
const type=params.get('type')||'Song';

document.getElementById('summary').innerHTML=`
<b class="text-white">${song}</b> • ${type}<br>
Package: ${pkg.toUpperCase()}<br>
Promotion ID: ${promotion_id||'N/A'}<br>
Duration: 30 days
`;

function formatUGX(n){return 'UGX '+Number(n).toLocaleString();}
document.getElementById('priceBox').textContent=formatUGX(amount);
document.getElementById('packageInfo').textContent=pkg.toUpperCase()+' • 30 DAYS';
document.getElementById('payBtn').textContent=`Pay ${formatUGX(amount)} with PesaPal →`;

document.getElementById('payBtn').onclick=async()=>{
  const btn=document.getElementById('payBtn');
  const status=document.getElementById('status');
  btn.disabled=true; btn.textContent='Creating PesaPal order...';
  try{
    // CALL YOUR SERVER.JS / PESAPAL ENDPOINT HERE
    // Example: POST to your backend with amount and promotion_id
    const res=await fetch('/api/pesapal/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({promotion_id, amount:Number(amount), package:pkg})});
    // If you use direct Supabase function, replace above
    
    status.className='mt-3 p-3 rounded-xl text-xs bg-green-500/10 border border-green-500/20 text-green-300 block';
    status.textContent='✅ Redirecting to PesaPal...';
    // window.location.href = (await res.json()).redirect_url;
    
    // TEMP FOR TESTING - remove when backend ready:
    alert(`Ready to pay ${formatUGX(amount)} for ${pkg} package. Connect your server.js PesaPal here.`);
    btn.disabled=false; btn.textContent=`Pay ${formatUGX(amount)} with PesaPal →`;
  }catch(e){
    status.className='mt-3 p-3 rounded-xl text-xs bg-red-500/10 border border-red-500/20 text-red-300 block';
    status.textContent='Error: '+e.message;
    btn.disabled=false;
  }
};
</script>
</body>
</html>
