<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<script src="pasong-global-price-controller.js"></script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen flex flex-col">

<header class="p-5 flex justify-between items-center max-w-[1100px] mx-auto w-full">
<a href="/index.html" class="font-black text-xl tracking-widest">PASONG</a>
<a href="/advertise.html" class="text-xs bg-white/10 border border-white/10 px-4 py-2 rounded-full">← Advertise</a>
</header>

<main class="flex-1 max-w-[1100px] mx-auto w-full px-5 pb-10">
<h1 class="text-[32px] font-black leading-none">My Profile</h1>
<p class="text-white/50 mt-2 text-sm">Promote your profile to get real followers</p>

<!-- PROFILE PREVIEW - SAME STYLE AS YOUR CARDS -->
<div class="mt-6 bg-[#14141c] border border-white/10 rounded-[20px] p-5 flex gap-4 items-center" id="profileBox">
<img id="pAvatar" src="https://ui-avatars.com/api/?name=P&background=3b82f6&color=fff" class="w-14 h-14 rounded-full bg-[#0a0a0f]">
<div>
<h3 id="pName" class="font-black">Loading...</h3>
<p id="pHandle" class="text-white/50 text-xs">@...</p>
<p id="pFollowers" class="price text-[#60a5fa] text-xs font-bold mt-1">0 followers</p>
</div>
</div>

<!-- PACKAGES - 30 DAYS FIXED -->
<div class="grid grid-cols-1 gap-3 mt-6">
<button onclick="choose('starter',55000)" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-5">
<h4 class="font-black text-[15px]">Starter Growth</h4>
<p class="text-white/50 text-xs">2K - 5K profile visits</p>
<p class="price text-[#60a5fa] font-bold mt-2 text-[14px] global-price" data-ugx="55000">From UGX 55,000 <small class="text-white/40">/ 30 days</small></p>
</button>

<button onclick="choose('growth',120000)" class="text-left bg-[#1c1c28] border border-blue-500/30 rounded-[20px] p-5 relative">
<span class="absolute -top-2 right-4 bg-blue-500 text-black text-[9px] font-black px-3 py-1 rounded-full">POPULAR</span>
<h4 class="font-black text-[15px]">Viral Growth</h4>
<p class="text-white/50 text-xs">10K - 25K profile visits</p>
<p class="price text-[#60a5fa] font-bold mt-2 text-[14px] global-price" data-ugx="120000">From UGX 120,000 <small class="text-white/40">/ 30 days</small></p>
</button>

<button onclick="choose('pro',250000)" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-5">
<h4 class="font-black text-[15px]">Pro Artist</h4>
<p class="text-white/50 text-xs">50K+ profile visits + Homepage feature</p>
<p class="price text-[#60a5fa] font-bold mt-2 text-[14px] global-price" data-ugx="250000">From UGX 250,000 <small class="text-white/40">/ 30 days</small></p>
</button>
</div>

<!-- PAY PANEL -->
<div class="mt-6 bg-[#1c1c28] border border-white/10 rounded-[20px] p-6">
<p id="chosen" class="text-xs text-white/50">Select a package</p>
<button id="btnPay" onclick="pay()" class="mt-4 w-full bg-[#3b82f6] font-black py-4 rounded-full">Continue → Pay Now</button>
<p id="msg" class="hidden mt-3 text-xs p-3 rounded-xl"></p>
</div>

</main>

<!-- YOUR FOOTER - SAME AS ADVERTISE PAGE -->
<div id="pasong-footer"></div>
<script src="pasong-footer-loader.js"></script>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null, artist=null, amount=55000, pkg='starter';
function choose(id,ugx){ pkg=id; amount=ugx; document.getElementById('chosen').textContent='✅ '+id.toUpperCase()+' selected — UGX '+ugx.toLocaleString()+' / 30 days'; }
async function load(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){ document.getElementById('pName').textContent='Please login to promote'; return; }
  user=session.user;
  let {data}=await supabaseClient.from('artists').select('id, name, handle, avatar_url, followers_count').eq('user_id', user.id).maybeSingle();
  if(!data){ let r=await supabaseClient.from('artists').select('id, name, handle, avatar_url').limit(1).maybeSingle(); data=r.data; }
  if(data){ artist=data; document.getElementById('pName').textContent=data.name; document.getElementById('pHandle').textContent='@'+(data.handle||'artist'); if(data.avatar_url) document.getElementById('pAvatar').src=data.avatar_url; document.getElementById('pFollowers').textContent=(data.followers_count||0)+' followers'; }
}
async function pay(){
  if(!artist){ alert('Login first'); return; }
  const b=document.getElementById('btnPay'); b.disabled=true; b.textContent='Creating...';
  try{
    const start=new Date(); const end=new Date(); end.setDate(end.getDate()+30);
    const {data,error}=await supabaseClient.from('promotions').insert([{artist_id:artist.id, user_id:user.id, amount:amount, currency:'UGX', status:'pending', payment_status:'pending', package_code:pkg, start_date:start.toISOString(), end_date:end.toISOString(), content_type:'Profile', song_title:artist.name}]).select().single();
    if(error) throw error;
    location.href=`pasong_checkout.html?promotion_id=${data.id}&type=profile&package=${pkg}&amount=${amount}`;
  }catch(e){ const m=document.getElementById('msg'); m.className='mt-3 text-xs p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-200 block'; m.textContent=e.message; b.disabled=false; b.textContent='Continue → Pay Now'; }
}
load();
</script>
</body>
</html>
