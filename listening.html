<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>List Studio - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#ca8a04;border:none;border-radius:30px;font-weight:bold;cursor:pointer}</style>
</head><body>
<div class="card">
<h2 style="color:#fbbf24">List Your Studio</h2>
<p>Free basic listing. Paid: UGX 30k - 80k/month for verified badge + Book Now button</p>
<form id="listingForm">
<input type="text" name="studioName" placeholder="Studio Name" required>
<input type="text" name="location" placeholder="Location (e.g. Kawempe, Kampala)" required>
<input type="tel" name="phone" placeholder="Contact Phone" required>
<input type="text" name="price" placeholder="Price per day / song (e.g. UGX 50,000)" required>
<textarea name="services" placeholder="Services: Recording, Mixing, Beats..."></textarea>
<button type="submit">Submit Studio for Listing</button>
</form>
</div>
<script>
document.getElementById('listingForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `LISTING REQUEST:\nStudio:${data.studioName}\nLocation:${data.location}\nPhone:${data.phone}\nPrice:${data.price}\nServices:${data.services}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
}
</script>
</body></html>
