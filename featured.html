<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Featured - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#dc2626;border:none;border-radius:30px;font-weight:bold;color:#fff;cursor:pointer}</style>
</head><body>
<div class="card">
<h2 style="color:#ef4444">Featured Placement</h2>
<p>Price: UGX 150,000 / 7 Days - Top placement + Homepage feature</p>
<form id="featuredForm">
<input type="text" name="studioName" placeholder="Your Studio Name" required>
<input type="tel" name="phone" placeholder="Phone" required>
<input type="number" name="days" placeholder="Days (7, 14, 30)" value="7" required>
<textarea name="promo" placeholder="What do you want featured?"></textarea>
<button type="submit">Request Feature - UGX 150k/7days</button>
</form>
</div>
<script>
document.getElementById('featuredForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `FEATURED REQUEST:\nStudio:${data.studioName}\nPhone:${data.phone}\nDays:${data.days}\nPromo:${data.promo}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
}
</script>
</body></html>
