<div id="panel" class="mt-8 hidden"><div id="panelContent" class="bg-[#1c1c28] border border-white/10 rounded-[20px] p-6"></div></div>
</main>

<div id="pasong-footer-container"></div>
<script src="pasong-footer-loader.js"></script>

<script>
let currentCurrency='UGX';

function updatePrices(currency){
  currentCurrency=currency;
  document.querySelectorAll('.price').forEach(el=>{
    const usd=el.getAttribute('data-usd');
    const ugx=el.getAttribute('data-ugx');
    el.textContent = currency==='UGX' ? `From UGX ${Number(ugx).toLocaleString()}` : `From $${usd}`;
  });
}

// INSTANT - No delay, shows UGX immediately in Kampala
(function instantDetect(){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const cached = localStorage.getItem('pasong_country');
  const cachedTime = localStorage.getItem('pasong_country_time');
  const now = Date.now();
  
  if(cached && cachedTime && (now - parseInt(cachedTime) < 86400000)){
    updatePrices(cached==='UG' ? 'UGX' : 'USD');
    return;
  }
  if(tz==='Africa/Kampala' || tz.includes('Kampala') || cached==='UG'){
    updatePrices('UGX');
  } else {
    updatePrices('UGX'); // Start UGX, background will switch to USD if outside
  }
})();

// BACKGROUND - Confirms IP after load, stays UGX if UG
async function backgroundCheck(){
  let country='';
  const apis=['https://ipwho.is/','https://ipapi.co/json/','https://freeipapi.com/api/json'];
  for(let api of apis){
    try{
      const r=await fetch(api);
      const d=await r.json();
      const code = d.country_code || d.countryCode;
      if(code){ country=code; break; }
    }catch(e){ continue; }
  }
  if(country){
    localStorage.setItem('pasong_country',country);
    localStorage.setItem('pasong_country_time',Date.now().toString());
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if(country==='UG' || tz==='Africa/Kampala'){
      updatePrices('UGX');
    } else {
      updatePrices('USD');
    }
  }
}
setTimeout(backgroundCheck, 1000);

function show(type){
  const panel=document.getElementById('panel');
  const c=document.getElementById('panelContent');
  panel.classList.remove('hidden');
  panel.scrollIntoView({behavior:'smooth'});
  const p=(usd,ugx)=>currentCurrency==='UGX'?`UGX ${Number(ugx).toLocaleString()}`:`$${usd}`;
  if(type==='song') c.innerHTML=`<h4 class='font-black'>🎵 Promote Your Song</h4><button class='mt-4 w-full bg-white text-black font-black py-3 rounded-full'>Continue ${p('9.99','42000')}</button>`;
  if(type==='profile') c.innerHTML=`<h4 class='font-black'>👤 Promote Your Profile</h4><button class='mt-4 w-full bg-blue-500 font-black py-3 rounded-full'>Promote ${p('12.99','55000')}</button>`;
  if(type==='business') c.innerHTML=`<h4 class='font-black'>🏪 Promote Your Business</h4><button class='mt-4 w-full bg-orange-400 text-black font-black py-3 rounded-full'>Upload ${p('24.99','105000')}</button>`;
  if(type==='tiktok') c.innerHTML=`<h4 class='font-black'>🎬 TikTok Promo</h4><p class='text-xs text-white/50 mt-2'>Direct to TikTok Promotion Program</p><button class='mt-4 w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black py-3.5 rounded-full'>Send to TikTok → ${p('19.99','84000')}</button>`;
}
</script>
