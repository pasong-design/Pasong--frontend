<script>
/* YOUR PASONG GLOBAL PRICE CONTROLLER */
(function () {
  "use strict";
  if (window.PASONGGlobalPriceController) return;
  const API_BASE = "https://pasong-api.vercel.app";
  const FX_API = "https://open.er-api.com/v6/latest/USD";
  const COUNTRY_CURRENCY = { UG: "UGX", KE: "KES", TZ: "TZS", RW: "RWF", US: "USD", GB: "GBP", FR: "EUR", DE: "EUR", AU: "AUD", CA: "CAD" };
  const COUNTRY_NAMES = { UG: "Uganda", KE: "Kenya", TZ: "Tanzania", RW: "Rwanda", US: "United States", GB: "United Kingdom" };
  const state = { ready: false, country: null, countryName: null, currency: null, rates: null, source: null, error: null };
  let initPromise = null;
  function safeJSON(response) { if (!response.ok) throw new Error("Request failed: " + response.status); return response.json(); }
  async function fetchCountry() {
    try {
      const response = await fetch(API_BASE + "/api/pricing", { method: "GET", mode: "cors", cache: "no-store", headers: { "Accept": "application/json" } });
      const data = await safeJSON(response);
      const country = String(data.country || "").trim().toUpperCase();
      if (/^[A-Z]{2}$/.test(country)) { state.country = country; state.countryName = COUNTRY_NAMES[country] || country; state.currency = COUNTRY_CURRENCY[country] || "USD"; state.source = "PASONG API"; return; }
    } catch (error) {}
    try {
      const response = await fetch("https://ipwho.is/", { method: "GET", mode: "cors", cache: "no-store" });
      const data = await safeJSON(response);
      if (data.success && data.country_code) {
        const country = String(data.country_code).trim().toUpperCase();
        if (/^[A-Z]{2}$/.test(country)) { state.country = country; state.countryName = data.country || COUNTRY_NAMES[country] || country; state.currency = COUNTRY_CURRENCY[country] || "USD"; state.source = "IP fallback"; return; }
      }
    } catch (error) {}
    state.country = null; state.countryName = "International"; state.currency = "USD"; state.source = "Default";
  }
  async function fetchExchangeRates() {
    try { const response = await fetch(FX_API, { mode: "cors", cache: "no-store" }); const data = await safeJSON(response); if (data.result === "success" && data.rates) { state.rates = data.rates; return; } } catch (e) { state.rates = null; }
  }
  async function init() {
    if (initPromise) return initPromise;
    initPromise = (async function () { await fetchCountry(); await fetchExchangeRates(); state.ready = true; document.documentElement.dataset.pasongCountry = state.country || "unknown"; document.documentElement.dataset.pasongCurrency = state.currency || "USD"; window.dispatchEvent(new CustomEvent("pasong:currency-ready", { detail: getInfo() })); return getInfo(); })();
    return initPromise;
  }
  function getInfo() { return { ready: state.ready, country: state.country, countryName: state.countryName, currency: state.currency, ratesAvailable: !!state.rates, source: state.source, error: state.error }; }
  window.PASONGGlobalPriceController = { init, getInfo };
  init();
})();
</script>

<script>
let currentCurrency='UGX';

function updatePrices(currency){
  currentCurrency=currency;
  document.querySelectorAll('.price').forEach(el=>{
    const usd=el.getAttribute('data-usd');
    const ugx=el.getAttribute('data-ugx');
    el.textContent = currency==='UGX' ? `From UGX ${Number(ugx).toLocaleString()}` : `From $${usd}`;
  });
}

window.addEventListener('pasong:currency-ready', (e)=>{
  const c = e.detail.country;
  if(c === 'UG'){ updatePrices('UGX'); } else { updatePrices('USD'); }
});

function show(type){
  const panel=document.getElementById('panel');
  const c=document.getElementById('panelContent');
  panel.classList.remove('hidden');
  panel.scrollIntoView({behavior:'smooth'});
  const p=(usd,ugx)=>currentCurrency==='UGX'?`UGX ${Number(ugx).toLocaleString()}`:`$${usd}`;
  if(type==='song') c.innerHTML=`<h4 class='font-black'>🎵 Promote Your Song</h4><button class='mt-4 w-full bg-white text-black font-black py-3 rounded-full'>Continue ${p('9.99','42000')}</button>`;
  if(type==='profile') c.innerHTML=`<h4 class='font-black'>👤 Promote Your Profile</h4><button class='mt-4 w-full bg-blue-500 font-black py-3 rounded-full'>Promote ${p('12.99','55000')}</button>`;
  if(type==='business') c.innerHTML=`<h4 class='font-black'>🏪 Promote Your Business</h4><button class='mt-4 w-full bg-orange-400 text-black font-black py-3 rounded-full'>Upload ${p('24.99','105000')}</button>`;
  if(type==='tiktok') c.innerHTML=`<h4 class='font-black'>🎬 TikTok Promo</h4><p class='text-xs text-white/50 mt-2'>Direct to TikTok Promotion Program</p><button class='mt-4 w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black py-3.5 rounded-full'>Send to TikTok → ${p('19.99','84000')}</button>`;
}
