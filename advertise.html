<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertise - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen flex flex-col">

<header class="p-5 flex justify-between items-center max-w-[1100px] mx-auto w-full">
<a href="/index.html" class="font-black text-xl tracking-widest">PASONG</a>
<a href="/ads-manager.html" class="text-xs bg-white/10 border border-white/10 px-4 py-2 rounded-full">Ads Manager</a>
</header>

<main class="flex-1 max-w-[1100px] mx-auto w-full px-5 pb-10">
<h1 class="text-[36px] font-black leading-none mt-4">Promote on PASONG</h1>
<p class="text-white/50 mt-2 text-sm">Pick a promotion to grow your audience</p>

<div class="grid grid-cols-1 gap-4 mt-8">

<!-- MY SONG -->
<button onclick="show('song')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4">
<div class="w-14 h-14 min-w-[56px] bg-[#8b5cf6] rounded-full flex items-center justify-center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
</div>
<div>
<h3 class="text-[18px] font-black">My Song</h3>
<p class="text-white/50 text-[12px]">Boost to more listeners</p>
<p class="text-[#4ade80] text-[12px] font-bold mt-1">From $9.99</p>
</div>
</button>

<!-- MY PROFILE -->
<button onclick="show('profile')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4">
<div class="w-14 h-14 min-w-[56px] bg-[#3b82f6] rounded-full flex items-center justify-center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg>
</div>
<div>
<h3 class="text-[18px] font-black">My Profile</h3>
<p class="text-white/50 text-[12px]">Grow followers</p>
<p class="text-[#60a5fa] text-[12px] font-bold mt-1">From $12.99</p>
</div>
</button>

<!-- MY BUSINESS -->
<button onclick="show('business')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4">
<div class="w-14 h-14 min-w-[56px] bg-[#fb923c] rounded-full flex items-center justify-center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M4 10V8h16v2h-2v8H6v-8H4zm2-4V4h12v2H6zm2 10h2v-2H8v2zm4 0h2v-2h-2v2z"/></svg>
</div>
<div>
<h3 class="text-[18px] font-black">My Business</h3>
<p class="text-white/50 text-[12px]">Promote brand to fans</p>
<p class="text-[#fb923c] text-[12px] font-bold mt-1">From $24.99</p>
</div>
</button>

<!-- TIKTOK PROMO -->
<button onclick="show('tiktok')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4 relative">
<span class="absolute top-3 right-3 bg-white text-black text-[9px] font-black px-2.5 py-1 rounded-full">VIRAL</span>
<div class="w-14 h-14 min-w-[56px] bg-white rounded-full flex items-center justify-center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="black"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V8.5a6.27 6.27 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 14.79a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.75a8.08 8.08 0 0 0 4.76 1.52V6.84a4.83 4.83 0 0 1-1-.15z"/></svg>
</div>
<div>
<h3 class="text-[18px] font-black leading-[1.1]">TikTok Promo / Short Video</h3>
<p class="text-white/50 text-[12px]">Reach viral audiences</p>
<p class="text-[#f472b6] text-[12px] font-bold mt-1">From $19.99</p>
</div>
</button>

</div>

<div id="panel" class="mt-8 hidden"><div id="panelContent" class="bg-[#1c1c28] border border-white/10 rounded-[20px] p-6"></div></div>
</main>

<div id="pasong-footer-container"></div>
<script src="pasong-footer-loader.js"></script>

<script>
const TIKTOK_CLIENT_KEY="YOUR_CLIENT_KEY";
const REDIRECT_URI=window.location.origin+"/advertise.html";

function show(type){
  const panel=document.getElementById('panel');
  const c=document.getElementById('panelContent');
  panel.classList.remove('hidden');
  panel.scrollIntoView({behavior:'smooth'});
  if(type==='song'){
    c.innerHTML=`<h4 class='font-black'>🎵 Promote Your Song</h4><div class='mt-4 p-4 bg-white/5 rounded-xl text-xs text-white/40'>Your songs from database will load here</div><button class='mt-4 w-full bg-white text-black font-black py-3 rounded-full'>Continue $9.99</button>`;
  }
  if(type==='profile'){
    c.innerHTML=`<h4 class='font-black'>👤 Promote Your Profile</h4><button class='mt-4 w-full bg-blue-500 font-black py-3 rounded-full'>Promote Profile $12.99</button>`;
  }
  if(type==='business'){
    c.innerHTML=`<h4 class='font-black'>🏪 Promote Your Business</h4><input placeholder='Business Name' class='w-full mt-3 bg-white/10 rounded-xl px-4 py-3 text-sm'><label class='mt-3 block border border-dashed border-white/20 rounded-xl p-6 text-center text-sm cursor-pointer bg-white/5'>Upload Flyer / Video<input type=file class='hidden'></label><button class='mt-4 w-full bg-orange-400 text-black font-black py-3 rounded-full'>Upload to Ads Manager</button>`;
  }
  if(type==='tiktok'){
    c.innerHTML=`
    <h4 class='font-black text-lg'>🎬 TikTok Promo - Direct to TikTok</h4>
    <p class='text-xs text-white/50 mt-2'>Connect your TikTok, we send video direct to TikTok promotion program</p>
    <div class='mt-4 space-y-3'>
      <button onclick='connectTikTok()' class='w-full bg-white text-black py-3 rounded-full font-bold text-sm'>🔗 Connect TikTok Account</button>
      <input id='tiktokLink' placeholder='Or paste TikTok link' class='w-full bg-white/10 rounded-xl px-4 py-3 text-sm'>
      <label class='block border border-dashed border-white/20 rounded-xl p-6 text-center text-sm cursor-pointer bg-white/5'>Upload short video (60s) - sends to TikTok<input type=file id='ttVideo' accept='video/*' class='hidden'><p id='ttFileName' class='text-xs text-white/40 mt-2'></p></label>
      <button onclick='sendToTikTok()' class='w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black py-3.5 rounded-full'>Send to TikTok Promotion → $19.99</button>
    </div>`;
    setTimeout(()=>{document.getElementById('ttVideo')?.addEventListener('change',e=>{document.getElementById('ttFileName').textContent=e.target.files[0]?.name||''});},100);
  }
}
function connectTikTok(){
  const scope="user.info.basic,video.publish,video.upload";
  const url=`https://www.tiktok.com/v2/auth/authorize/?client_key=${TIKTOK_CLIENT_KEY}&scope=${scope}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=pasong123`;
  window.location.href=url;
}
function sendToTikTok(){
  const file=document.getElementById('ttVideo')?.files[0];
  const link=document.getElementById('tiktokLink')?.value;
  if(!file&&!link){alert('Upload video or paste link');return;}
  alert('Video queued for TikTok Promotion Program! Will post via TikTok API.');
}
</script>
</body>
</html>
