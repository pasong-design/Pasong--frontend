<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertise - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
(function () {
  "use strict";
  if (window.PASONGGlobalPriceController) return;
  const API_BASE = "https://pasong-api.vercel.app";
  const COUNTRY_CURRENCY = { UG: "UGX", US: "USD", GB: "GBP" };
  const state = { country: null, currency: null };
  let initPromise=null;
  function safeJSON(r){ if(!r.ok) throw new Error(); return r.json(); }
  async function fetchCountry(){
    try{ const res=await fetch(API_BASE+"/api/pricing",{mode:"cors",cache:"no-store"}); const d=await safeJSON(res); const c=String(d.country||"").toUpperCase(); if(/^[A-Z]{2}$/.test(c)){ state.country=c; state.currency=COUNTRY_CURRENCY[c]||"USD"; return; } }catch(e){}
    try{ const res=await fetch("https://ipwho.is/",{mode:"cors"}); const d=await safeJSON(res); if(d.success){ state.country=String(d.country_code).toUpperCase(); state.currency=COUNTRY_CURRENCY[state.country]||"USD"; return; } }catch(e){}
    state.country=null; state.currency="USD";
  }
  async function init(){ if(initPromise) return initPromise; initPromise=(async()=>{ await fetchCountry(); window.dispatchEvent(new CustomEvent("pasong:currency-ready",{detail:state})); return state; })(); return initPromise; }
  window.PASONGGlobalPriceController={ init, getInfo:()=>state };
  init();
})();
</script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen flex flex-col">
<header class="p-5 flex justify-between items-center max-w-[1100px] mx-auto w-full">

<a href="/ads-manager.html" class="text-xs bg-white/10 border border-white/10 px-4 py-2 rounded-full">Ads Manager</a>
</header>
<main class="flex-1 max-w-[1100px] mx-auto w-full px-5 pb-10">
<h1 class="text-[36px] font-black leading-none mt-4">Promote on PASONG</h1>
<p class="text-white/50 mt-2 text-sm">Pick a promotion to grow your audience</p>
<div class="grid grid-cols-1 gap-4 mt-8">

<a href="promote-song.html" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4 block no-underline">
<div class="w-14 h-14 min-w-[56px] bg-[#8b5cf6] rounded-full flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
<div><h3 class="text-[18px] font-black text-white">My Song</h3><p class="text-white/50 text-[12px]">Boost to more listeners</p><p class="price text-[#4ade80] text-[13px] font-bold mt-1" data-usd="9.99" data-ugx="42000">From UGX 42,000</p></div>
</a>

<button onclick="show('profile')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4 w-full">
<div class="w-14 h-14 min-w-[56px] bg-[#3b82f6] rounded-full flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/></svg></div>
<div><h3 class="text-[18px] font-black">My Profile</h3><p class="text-white/50 text-[12px]">Grow followers</p><p class="price text-[#60a5fa] text-[13px] font-bold mt-1" data-usd="12.99" data-ugx="55000">From UGX 55,000</p></div>
</button>

<button onclick="show('business')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4 w-full">
<div class="w-14 h-14 min-w-[56px] bg-[#fb923c] rounded-full flex items-center justify-center"><svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M4 10V8h16v2h-2v8H6v-8H4zm2-4V4h12v2H6zm2 10h2v-2H8v2zm4 0h2v-2h-2v2z"/></svg></div>
<div><h3 class="text-[18px] font-black">My Business</h3><p class="text-white/50 text-[12px]">Promote brand to fans</p><p class="price text-[#fb923c] text-[13px] font-bold mt-1" data-usd="24.99" data-ugx="105000">From UGX 105,000</p></div>
</button>

<div class="relative overflow-visible">
<span class="absolute -top-3 -right-2 z-20 bg-gradient-to-r from-cyan-400 to-pink-500 text-black text-[10px] font-black px-3.5 py-1 rounded-full border-2 border-[#0a0a0f]">VIRAL</span>
<button onclick="show('tiktok')" class="w-full text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 flex items-center gap-4">
<div class="w-14 h-14 min-w-[56px] bg-white rounded-full flex items-center justify-center"><svg width="22" height="22" viewBox="0 0 24 24" fill="black"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg></div>
<div class="pr-6"><h3 class="text-[18px] font-black leading-[1.1]">TikTok Promo / Short Video</h3><p class="text-white/50 text-[12px]">Reach viral audiences</p><p class="price text-[#f472b6] text-[13px] font-bold mt-1" data-usd="19.99" data-ugx="84000">From UGX 84,000</p></div>
</button>
</div>
</div>
<div id="panel" class="mt-8 hidden"><div id="panelContent" class="bg-[#1c1c28] border border-white/10 rounded-[20px] p-6"></div></div>
</main>
<script>
let currentCurrency='UGX';
function updatePrices(currency){
  currentCurrency=currency;
  document.querySelectorAll('.price').forEach(el=>{
    const usd=el.dataset.usd, ugx=el.dataset.ugx;
    el.textContent=currency==='UGX'?`From UGX ${Number(ugx).toLocaleString()}`:`From $${usd}`;
  });
}
window.addEventListener('pasong:currency-ready',(e)=>{ if(e.detail.country==='UG') updatePrices('UGX'); else updatePrices('USD'); });
function show(type){
  const panel=document.getElementById('panel'); const c=document.getElementById('panelContent');
  panel.classList.remove('hidden'); panel.scrollIntoView({behavior:'smooth'});
  const p=(usd,ugx)=>currentCurrency==='UGX'?`UGX ${Number(ugx).toLocaleString()}`:`$${usd}`;
  if(type==='profile') c.innerHTML=`<h4 class='font-black'>👤 Promote Your Profile</h4><button class='mt-4 w-full bg-blue-500 font-black py-3 rounded-full'>Promote ${p('12.99','55000')}</button>`;
  if(type==='business') c.innerHTML=`<h4 class='font-black'>🏪 Promote Your Business</h4><button class='mt-4 w-full bg-orange-400 text-black font-black py-3 rounded-full'>Upload ${p('24.99','105000')}</button>`;
  if(type==='tiktok') c.innerHTML=`<h4 class='font-black'>🎬 TikTok Promo</h4><button class='mt-4 w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black py-3.5 rounded-full'>Send to TikTok → ${p('19.99','84000')}</button>`;
}
</script>
</body>
</html>
