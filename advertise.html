<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promote My Song - Pasong</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen font-sans">
<div class="max-w-[720px] mx-auto p-4 pb-[120px]">
  <div class="flex items-center justify-between mt-2">
    <h1 class="font-black text-[22px] tracking-tight">Promote My Music</h1>
    <div class="text-[11px] text-white/40">4 tracks found</div>
  </div>

  <div id="trackList" class="mt-6 flex flex-col gap-3">
    <p class="text-white/40 text-[13px]">Loading your music...</p>
  </div>

  <div id="summaryBox" class="mt-8 hidden bg-[#1a1a24] border border-white/10 p-5 rounded-[24px]">
    <div class="flex items-center gap-3">
      <img id="sumCover" src="" class="w-[56px] h-[56px] rounded-[14px] object-cover bg-[#222]" />
      <div>
        <p id="sumTitle" class="font-bold text-[15px]"></p>
        <p id="sumType" class="text-[12px] text-white/50"></p>
      </div>
    </div>
    <button onclick="createPromotion()" id="promoBtn" class="mt-5 w-full bg-white text-black font-black text-[14px] py-[16px] rounded-full">Promote for UGX 42,000</button>
    <p id="promoMsg" class="mt-3 text-[12px] text-center"></p>
  </div>
</div>

<script>
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON = "YOUR_ANON_KEY";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let selectedTrack = null;
let allTracks = [];

async function loadMyMusic(){
  const { data:{session} } = await supabase.auth.getSession();
  if(!session){
    document.getElementById('trackList').innerHTML = '<p class="text-white/60 text-[13px]">Please login first</p>';
    return;
  }
  const authId = session.user.id;

  // 1. Get ALL my profile IDs (you have 1 now, but supports 3)
  const { data: profiles } = await supabase.from('artist_profiles').select('id').eq('user_id', authId);
  const profileIds = (profiles||[]).map(p=>p.id);
  if(profileIds.length===0){ document.getElementById('trackList').innerHTML='No profile found'; return; }

  // 2. Load beats + songs - EXACT query that worked for you in SQL Editor
  const [beatsRes, songsRes] = await Promise.all([
    supabase.from('beats').select('id,title,cover_url,producer_id').in('producer_id', profileIds),
    supabase.from('songs').select('id,title,cover_url,artist_id,uploader_user_id').or(`artist_id.in.(${profileIds.join(',')}),uploader_user_id.eq.${authId}`)
  ]);

  const beats = (beatsRes.data||[]).map(b=>({...b, content_type:'beat'}));
  const songs = (songsRes.data||[]).map(s=>({...s, content_type:'song'}));

  // Deduplicate songs (same song may match both conditions)
  const map = new Map();
  [...beats, ...songs].forEach(t=> map.set(t.id, t));
  allTracks = [...map.values()];

  if(allTracks.length===0){
    document.getElementById('trackList').innerHTML='<p class="text-white/60">No tracks found</p>'; return;
  }

  document.getElementById('trackList').innerHTML = allTracks.map((t, idx)=>`
    <button onclick="selectTrack('${t.id}')" id="btn-${t.id}" class="group text-left flex items-center gap-3 p-3 rounded-[16px] border transition-all ${idx===0?'bg-white/10 border-white/20':'bg-[#14141c] border-white/5 hover:border-white/15'}">
      <img src="${t.cover_url}" class="w-[52px] h-[52px] rounded-[12px] object-cover bg-[#222] flex-shrink-0" onerror="this.src='https://via.placeholder.com/52'" />
      <div class="flex-1 min-w-0">
        <p class="font-bold text-[14px] truncate">${t.title}</p>
        <p class="text-[11px] text-white/50 capitalize">${t.content_type} • ${t.cover_url ? 'cover ready' : 'no cover'}</p>
      </div>
      <div class="w-6 h-6 rounded-full border border-white/20 flex items-center justify-center flex-shrink-0"><div id="dot-${t.id}" class="w-3 h-3 bg-white rounded-full ${idx===0?'':'hidden'}"></div></div>
    </button>
  `).join('');

  selectTrack(allTracks[0].id);
}

function selectTrack(id){
  const t = allTracks.find(x=>x.id===id);
  if(!t) return;
  selectedTrack = t;

  document.querySelectorAll('[id^="btn-"]').forEach(b=>{
    b.classList.remove('bg-white/10','border-white/20'); b.classList.add('bg-[#14141c]','border-white/5');
  });
  document.querySelectorAll('[id^="dot-"]').forEach(d=>d.classList.add('hidden'));
  
  document.getElementById(`btn-${id}`)?.classList.add('bg-white/10','border-white/20');
  document.getElementById(`btn-${id}`)?.classList.remove('bg-[#14141c]','border-white/5');
  document.getElementById(`dot-${id}`)?.classList.remove('hidden');

  document.getElementById('sumCover').src = t.cover_url;
  document.getElementById('sumTitle').textContent = t.title;
  document.getElementById('sumType').textContent = t.content_type;
  document.getElementById('summaryBox').classList.remove('hidden');
}

async function createPromotion(){
  if(!selectedTrack) return;
  const btn = document.getElementById('promoBtn');
  const msg = document.getElementById('promoMsg');
  btn.disabled=true; btn.textContent='Creating...';
  
  const { data:{session} } = await supabase.auth.getSession();
  const { data: profile } = await supabase.from('artist_profiles').select('id').eq('user_id', session.user.id).limit(1).single();

  const payload = {
    user_id: session.user.id,
    artist_id: profile?.id || selectedTrack.producer_id || selectedTrack.artist_id,
    amount: 42000,
    currency: 'UGX',
    status: 'pending',
    content_type: selectedTrack.content_type,
    song_title: selectedTrack.title
  };
  if(selectedTrack.content_type==='beat') payload.beat_id = selectedTrack.id;
  else payload.song_id = selectedTrack.id;

  const { error } = await supabase.from('promotions').insert([payload]);
  if(error){ msg.textContent=error.message; msg.className='mt-3 text-[12px] text-center text-red-400'; }
  else { msg.textContent='Promotion created for '+selectedTrack.title; msg.className='mt-3 text-[12px] text-center text-green-400'; }
  btn.disabled=false; btn.textContent='Promote for UGX 42,000';
}

loadMyMusic();
</script>
</body>
</html>
