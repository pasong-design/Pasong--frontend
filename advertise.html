#<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advertise - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-white min-h-screen flex flex-col">

<header class="p-5 flex justify-between items-center max-w-[1100px] mx-auto w-full">
<a href="/index.html" class="font-black text-xl tracking-widest">PASONG</a>
<a href="/ads-manager.html" class="text-xs bg-white/10 border border-white/10 px-4 py-2 rounded-full">Ads Manager</a>
</header>

<main class="flex-1 max-w-[1100px] mx-auto w-full px-5 pb-10">
<h1 class="text-[36px] font-black leading-none mt-4">Promote on PASONG</h1>
<p class="text-white/50 mt-2 text-sm">Pick a promotion to grow your audience</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">

<!-- MY SONG -->
<button onclick="show('song')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6">
<div class="w-14 h-14 bg-purple-500 rounded-full flex items-center justify-center">🎵</div>
<h3 class="text-xl font-black mt-4">My Song</h3><p class="text-white/50 text-xs mt-1">Boost to more listeners</p>
<p class="text-green-400 text-xs font-bold mt-4">From $9.99</p>
</button>

<!-- MY PROFILE -->
<button onclick="show('profile')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6">
<div class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center">👤</div>
<h3 class="text-xl font-black mt-4">My Profile</h3><p class="text-white/50 text-xs mt-1">Grow followers</p>
<p class="text-blue-400 text-xs font-bold mt-4">From $12.99</p>
</button>

<!-- MY BUSINESS -->
<button onclick="show('business')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6">
<div class="w-14 h-14 bg-orange-400 rounded-full flex items-center justify-center">🏪</div>
<h3 class="text-xl font-black mt-4">My Business</h3><p class="text-white/50 text-xs mt-1">Promote brand to fans</p>
<p class="text-orange-300 text-xs font-bold mt-4">From $24.99</p>
</button>

<!-- TIKTOK PROMO -->
<button onclick="show('tiktok')" class="text-left bg-[#14141c] border border-white/10 rounded-[20px] p-6 relative">
<span class="absolute top-3 right-3 bg-gradient-to-r from-cyan-400 to-pink-500 text-[10px] font-black px-2 py-1 rounded-full text-black">VIRAL</span>
<div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-pink-500 rounded-full flex items-center justify-center text-black font-black">♪</div>
<h3 class="text-xl font-black mt-4 leading-none">TikTok Promo /<br>Short Video</h3><p class="text-white/50 text-xs mt-1">Reach viral audiences</p>
<p class="text-pink-400 text-xs font-bold mt-4">From $19.99</p>
</button>

</div>

<div id="panel" class="mt-8 hidden"><div id="panelContent" class="bg-[#1c1c28] border border-white/10 rounded-[20px] p-6"></div></div>
</main>

<div id="pasong-footer-container"></div>
<script src="pasong-footer-loader.js"></script>

<script>
// TIKTOK CONFIG - CHANGE THESE
const TIKTOK_CLIENT_KEY = "YOUR_CLIENT_KEY"; // from TikTok Developers
const REDIRECT_URI = window.location.origin + "/advertise.html";

function show(type){
  const panel=document.getElementById('panel');
  const c=document.getElementById('panelContent');
  panel.classList.remove('hidden');
  panel.scrollIntoView({behavior:'smooth'});

  if(type==='song'){
    c.innerHTML=`<h4 class='font-black'>🎵 Promote Your Song</h4><p class='text-xs text-white/50 mt-2'>Select from your PASONG library</p><div class='mt-4 p-4 bg-white/5 rounded-xl text-xs text-white/40'>Loading your songs...</div><button class='mt-4 w-full bg-white text-black font-black py-3 rounded-full'>Continue $9.99</button>`;
  }
  if(type==='profile'){
    c.innerHTML=`<h4 class='font-black'>👤 Promote Your Profile</h4><button class='mt-4 w-full bg-blue-500 font-black py-3 rounded-full'>Promote Profile $12.99</button>`;
  }
  if(type==='business'){
    c.innerHTML=`<h4 class='font-black'>🏪 Promote Your Business</h4><input id='bname' placeholder='Business Name' class='w-full mt-3 bg-white/10 rounded-xl px-4 py-3 text-sm'><input type=file id=bf class='hidden'><label for=bf class='mt-3 block border border-dashed border-white/20 rounded-xl p-6 text-center text-sm cursor-pointer'>Upload Flyer / Video</label><button onclick='uploadBiz()' class='mt-4 w-full bg-orange-400 text-black font-black py-3 rounded-full'>Upload to Ads Manager</button>`;
  }
  if(type==='tiktok'){
    c.innerHTML=`
    <h4 class='font-black text-lg'>🎬 TikTok Promo - Direct to TikTok</h4>
    <p class='text-xs text-white/50 mt-2'>Connect your TikTok, upload video, we post & promote it via TikTok Business API</p>
    
    <div class='mt-4 space-y-3'>
      <button id='connectTiktok' onclick='connectTikTok()' class='w-full bg-black border border-white/20 py-3 rounded-full font-bold text-sm'>🔗 Connect TikTok Account</button>
      <p id='tiktokStatus' class='text-[11px] text-green-400 hidden'>✓ TikTok Connected</p>
      
      <input id='tiktokLink' placeholder='Or paste TikTok link (https://vt.tiktok.com/...)' class='w-full bg-white/10 rounded-xl px-4 py-3 text-sm'>
      
      <label class='block border border-dashed border-white/20 rounded-xl p-6 text-center text-sm cursor-pointer bg-white/5'>
        <span>Upload short video (max 60s) - will be sent to TikTok direct</span>
        <input type=file id='ttVideo' accept='video/*' class='hidden'>
        <p id='ttFileName' class='text-xs text-white/40 mt-2'></p>
      </label>
      
      <button onclick='sendToTikTok()' class='w-full bg-gradient-to-r from-cyan-400 to-pink-500 text-black font-black py-3.5 rounded-full'>Send to TikTok Promotion Program → $19.99</button>
      <p class='text-[10px] text-white/30 text-center'>By clicking you authorize PASONG to post to your TikTok and create TikTok Ad</p>
    </div>
    `;
    document.getElementById('ttVideo')?.addEventListener('change',e=>{
      document.getElementById('ttFileName').textContent=e.target.files[0]?.name||'';
    });
  }
}

function connectTikTok(){
  // STEP 1: TikTok OAuth - redirects user to TikTok login
  const scope = "user.info.basic,video.publish,video.upload";
  const url = `https://www.tiktok.com/v2/auth/authorize/?client_key=${TIKTOK_CLIENT_KEY}&scope=${scope}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&state=pasong123`;
  window.location.href=url;
}

function sendToTikTok(){
  const file=document.getElementById('ttVideo')?.files[0];
  const link=document.getElementById('tiktokLink')?.value;
  if(!file && !link){ alert('Upload video or paste TikTok link'); return; }
  
  // STEP 2: This is where PASONG backend sends to TikTok API
  // You need backend endpoint /api/tiktok/upload that does:
  // init -> upload -> publish + ad create
  
  alert('Video ready to send to TikTok!\n\nFor now it will save to Ads Manager. After you add your Client Key, it will post direct to TikTok.');
  
  // Save to your Ads Manager (temporary)
  console.log('Sending to TikTok Promo Program:', {file, link});
}

function uploadBiz(){
  alert('Business ad uploaded to PASONG Ads Management!');
}

// Check if returned from TikTok OAuth
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.has('code')){
  document.getElementById('panel')?.classList.remove('hidden');
  show('tiktok');
  document.getElementById('tiktokStatus')?.classList.remove('hidden');
  // Here you should exchange code for access_token on your backend
  const code=urlParams.get('code');
  console.log('TikTok Auth Code:', code);
  fetch('/api/tiktok/callback?code='+code); // create this endpoint
}
</script>
</body>
</html>
