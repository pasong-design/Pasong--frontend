<script>
// FIXED DETECTION - UGX IS DEFAULT, ONLY SWITCHES IF 100% NOT UGANDA
var advertCountry={code:"UG",name:"Uganda",currency:"UGX",detected:false};
var advertCurrencyRates={UGX:1,KES:0.035,TZS:0.70,RWF:0.35,USD:0.00027,EUR:0.00025,GBP:0.00021};

function countryCurrency(code){
 code=(code||"").toUpperCase();
 if(code==="UG") return "UGX";
 if(code==="KE") return "KES";
 if(code==="TZ") return "TZS";
 if(code==="RW") return "RWF";
 if(code==="GB") return "GBP";
 if(["DE","FR","IT","ES","NL","BE","AT","CH","SE","NO","DK","FI","PL","IE","PT"].includes(code)) return "EUR";
 return "USD";
}

async function fetchCountry(url, parser){
 try{
   var r=await fetch(url,{cache:"no-store"});
   if(!r.ok) return null;
   var d=await r.json();
   return parser(d);
 }catch(e){return null}
}

async function detectAdvertCountry(){
 var results = await Promise.all([
   fetchCountry("https://ipwho.is/", d=> d.country_code ? {code:d.country_code, name:d.country} : null),
   fetchCountry("https://ipapi.co/json/", d=> d.country_code ? {code:d.country_code, name:d.country_name} : null),
   fetchCountry("https://freeipapi.com/api/json", d=> d.countryCode ? {code:d.countryCode, name:d.countryName} : null),
   fetchCountry("https://ipinfo.io/json", d=> d.country ? {code:d.country, name:d.country} : null)
 ]);

 // If ANY detection says UG, force UGX (fixes your screenshot issue)
 var hasUganda = results.some(r=> r && String(r.code).toUpperCase()==="UG");
 if(hasUganda){
   advertCountry={code:"UG",name:"Uganda",currency:"UGX",detected:true};
   return advertCountry;
 }

 // Count non-UG detections
 var valid = results.filter(r=> r && r.code);
 if(valid.length===0){
   advertCountry={code:"UG",name:"Uganda",currency:"UGX",detected:false};
   return advertCountry;
 }

 // Majority vote for non-UG
 var counts={};
 valid.forEach(r=>{var c=r.code.toUpperCase(); counts[c]=(counts[c]||0)+1});
 var top = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
 if(top){
   advertCountry={code:top,name:valid.find(x=>x.code.toUpperCase()===top).name||top,currency:countryCurrency(top),detected:true};
 }else{
   advertCountry={code:"UG",name:"Uganda",currency:"UGX",detected:false};
 }
 return advertCountry;
}
</script>
