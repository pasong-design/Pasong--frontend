<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Studio PRO - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#9333ea;border:none;border-radius:30px;font-weight:bold;color:#fff;cursor:pointer}</style>
</head><body>
<div class="card">
<h2 style="color:#a855f7">Studio PRO Plan</h2>
<p>Price: UGX 55,000 / 30 Days - Priority enquiries + Homepage promo</p>
<form id="proForm">
<input type="text" name="studioName" placeholder="Studio Name" required>
<input type="tel" name="phone" placeholder="Phone" required>
<input type="email" name="email" placeholder="Email">
<button type="submit">Upgrade to PRO - UGX 55k/30days</button>
</form>
</div>
<script>
document.getElementById('proForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `PRO UPGRADE:\nStudio:${data.studioName}\nPhone:${data.phone}\nEmail:${data.email}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
}
</script>
</body></html>
