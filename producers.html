<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<title>PASONG — Producers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#09090f;color:#fff;min-height:100vh}
a{color:inherit;text-decoration:none}
.header{position:sticky;top:0;z-index:100;background:#101018;border-bottom:1px solid #252533;padding:14px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:800;white-space:nowrap}
.search{flex:1;min-width:180px;max-width:420px;position:relative}
.search input{width:100%;padding:11px 14px 11px 40px;border-radius:10px;border:1px solid #303040;background:#171720;color:#fff;outline:none}
.search span{position:absolute;left:14px;top:10px;opacity:.7}
.nav{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.nav a{opacity:.85}
.nav a:hover{opacity:1;color:#c084fc}
.account{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px}
.account a{padding:8px 12px;border:1px solid #343444;border-radius:8px}
main{width:min(1200px,94%);margin:0 auto;padding:28px 0 50px}
.hero{margin-bottom:25px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:#aaaabd;line-height:1.5}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:28px 0 15px}
.section-title h2{font-size:20px}
.status{color:#aaaabd;font-size:14px}
.producer-grid,.beat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#12121b;border:1px solid #282836;border-radius:14px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-2px);border-color:#8b5cf6}
.producer-image{width:100%;height:210px;object-fit:cover;background:#1b1b27;display:block}
.beat-image{width:100%;height:180px;object-fit:cover;background:#1b1b27;display:block}
.card-body{padding:15px}
.card h3{font-size:17px;margin-bottom:6px}
.muted{color:#9999aa;font-size:13px;line-height:1.5}
.btn{display:inline-block;margin-top:12px;padding:9px 13px;border-radius:8px;background:#8b5cf6;color:#fff;font-weight:700;font-size:13px}
.btn:hover{background:#7c4ee8}
.beat-card{padding:0}
.beat-card-body{padding:15px}
.beat-card h3{margin-bottom:7px}
.beat-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;color:#aaaabd;font-size:12px}
.price{margin-top:10px;color:#c084fc;font-weight:700}
.detail{display:none}
.detail.active{display:block}
.directory.hidden{display:none}
.back{display:inline-block;margin-bottom:18px;color:#c084fc;font-size:14px}
