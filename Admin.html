<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PASONG Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080810;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
    min-height:100vh;
}

nav{
    background:#10101a;
    border-bottom:1px solid #242436;
    padding:16px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
    background:linear-gradient(90deg,#a855f7,#ec4899);
    -webkit-background-clip:text;
    color:transparent;
}

.nav-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.admin-label{
    font-size:13px;
    color:#aaa;
}

button{
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    color:white;
    background:#242436;
    font-weight:700;
}

button:hover{
    background:#33334b;
}

.logout{
    background:#7f1d1d;
}

.logout:hover{
    background:#991b1b;
}

.container{
    width:min(1200px,94%);
    margin:30px auto 60px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.subtitle{
    color:#999;
    margin-bottom:25px;
}

.status{
    background:#11111c;
    border:1px solid #27273a;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:20px;
    color:#bbb;
}

.status.success{
    border-color:#16a34a;
    color:#86efac;
}

.status.error{
    border-color:#dc2626;
    color:#fca5a5;
}

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:30px;
}

.card{
    background:#11111c;
    border:1px solid #27273a;
    border-radius:14px;
    padding:20px;
}

.card-title{
    color:#999;
    font-size:13px;
    margin-bottom:10px;
}

.number{
    font-size:28px;
    font-weight:900;
}

.section{
    background:#11111c;
    border:1px solid #27273a;
    border-radius:14px;
    margin-bottom:25px;
    overflow:hidden;
}

.section-head{
    padding:18px 20px;
    border-bottom:1px solid #27273a;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.section-head h2{
    font-size:18px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th,td{
    text-align:left;
    padding:14px 16px;
    border-bottom:1px solid #20202d;
    font-size:14px;
}

th{
    color:#aaa;
    font-size:12px;
    text-transform:uppercase;
}

td{
    color:#ddd;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#242436;
    font-size:11px;
}

.empty{
    padding:25px;
    color:#888;
    text-align:center;
}

.loading{
    color:#999;
}

@media(max-width:900px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .stats{
        grid-template-columns:1fr 1fr;
    }

    h1{
        font-size:24px;
    }

    .admin-label{
        display:none;
    }
}
</style></head><body><nav>
    <div class="logo">PASONG</div><div class="nav-right">
    <span class="admin-label" id="adminEmail">Checking admin...</span>
    <button class="logout" onclick="logout()">Logout</button>
</div>

</nav><div class="container"><h1>Admin Dashboard</h1>
<p class="subtitle">
    Manage and monitor your PASONG music platform.
</p>

<div id="status" class="status">
    Connecting to PASONG...
</div>

<div class="stats">

    <div class="card">
        <div class="card-title">Songs</div>
        <div class="number" id="songsCount">—</div>
    </div>

    <div class="card">
        <div class="card-title">Users</div>
        <div class="number" id="usersCount">—</div>
    </div>

    <div class="card">
        <div class="card-title">Orders</div>
        <div class="number" id="ordersCount">—</div>
    </div>

    <div class="card">
        <div class="card-title">Downloads</div>
        <div class="number" id="downloadsCount">—</div>
    </div>

    <div class="card">
        <div class="card-title">Payments</div>
        <div class="number" id="paymentsCount">—</div>
    </div>

</div>

<div class="section">

    <div class="section-head">
        <h2>Recent Songs</h2>
        <button onclick="loadSongs()">Refresh</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Price</th>
                    <th>Currency</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="songsTable">
                <tr>
                    <td colspan="4" class="loading">
                        Loading songs...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<div class="section">

    <div class="section-head">
        <h2>Recent Orders</h2>
        <button onclick="loadOrders()">Refresh</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Amount</th>
                    <th>Currency</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="ordersTable">
                <tr>
                    <td colspan="4" class="loading">
                        Loading orders...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

</div><script>

/* =========================================================
   PASONG SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://mtufczmjlkvycarxylgh.supabase.co";

/*
   IMPORTANT:
   Put your SUPABASE ANON/PUBLIC KEY below.

   DO NOT put the service_role key here.
*/
const SUPABASE_ANON_KEY =
    "sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type=""){
    const box = document.getElementById("status");

    box.textContent = message;
    box.className = "status " + type;
}


/* =========================================================
   ADMIN CHECK
   ========================================================= */

async function checkAdmin(){

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if(error){
        setStatus(
            "Authentication error: " + error.message,
            "error"
        );
        return false;
    }

    if(!user){

        setStatus(
            "You are not logged in. Please log in first.",
            "error"
        );

        setTimeout(()=>{
            window.location.href = "login.html";
        },1500);

        return false;
    }

    document.getElementById("adminEmail").textContent =
        user.email || "Admin";

    /*
       Admin role is checked from Supabase user metadata.
       This does not create an admin account.
    */

    const metadata = user.user_metadata || {};
    const appMetadata = user.app_metadata || {};

    const role =
        metadata.role ||
        appMetadata.role ||
        "";

    if(role !== "admin"){

        setStatus(
            "Access denied. This account is not an admin account.",
            "error"
        );

        return false;
    }

    setStatus(
        "PASONG Admin connected successfully.",
        "success"
    );

    return true;
}


/* =========================================================
   COUNT HELPER
   ========================================================= */

async function getCount(table){

    const {
        count,
        error
    } = await supabaseClient
        .from(table)
        .select("*", {
            count:"exact",
            head:true
        });

    if(error){
        console.log(table, error);
        return "—";
    }

    return count ?? 0;
}


/* =========================================================
   LOAD DASHBOARD COUNTS
   ========================================================= */

async function loadCounts(){

    document.getElementById("songsCount").textContent =
        await getCount("songs");

    document.getElementById("ordersCount").textContent =
        await getCount("orders");

    document.getElementById("downloadsCount").textContent =
        await getCount("downloads");

    document.getElementById("paymentsCount").textContent =
        await getCount("payments");

    /*
       Supabase Auth users cannot normally be counted directly
       from the browser using the anon key.

       Therefore this currently displays "—".
       We will connect the real user count through the secure
       admin backend later.
    */

    document.getElementById("usersCount").textContent = "—";
}


/* =========================================================
   LOAD SONGS
   ========================================================= */

async function loadSongs(){

    const tbody =
        document.getElementById("songsTable");

    tbody.innerHTML =
        '<tr><td colspan="4" class="loading">Loading songs...</td></tr>';

    const {
        data,
        error
    } = await supabaseClient
        .from("songs")
        .select("id,title,price,currency,status")
        .order("created_at", {
            ascending:false
        })
        .limit(10);

    if(error){

        console.error(error);

        tbody.innerHTML =
            '<tr><td colspan="4" class="empty">Unable to load songs.</td></tr>';

        return;
    }

    if(!data || data.length === 0){

        tbody.innerHTML =
            '<tr><td colspan="4" class="empty">No songs found.</td></tr>';

        return;
    }

    tbody.innerHTML = data.map(song => `

        <tr>

            <td>
                ${escapeHtml(song.title || "Untitled")}
            </td>

            <td>
                ${song.price ?? 500}
            </td>

            <td>
                ${escapeHtml(song.currency || "UGX")}
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(song.status || "active")}
                </span>
            </td>

        </tr>

    `).join("");
}


/* =========================================================
   LOAD ORDERS
   ========================================================= */

async function loadOrders(){

    const tbody =
        document.getElementById("ordersTable");

    tbody.innerHTML =
        '<tr><td colspan="4" class="loading">Loading orders...</td></tr>';

    const {
        data,
        error
    } = await supabaseClient
        .from("orders")
        .select("id,total_amount,currency,status")
        .order("created_at", {
            ascending:false
        })
        .limit(10);

    if(error){

        console.error(error);

        tbody.innerHTML =
            '<tr><td colspan="4" class="empty">Unable to load orders.</td></tr>';

        return;
    }

    if(!data || data.length === 0){

        tbody.innerHTML =
            '<tr><td colspan="4" class="empty">No orders found.</td></tr>';

        return;
    }

    tbody.innerHTML = data.map(order => `

        <tr>

            <td>
                ${escapeHtml(String(order.id || "").slice(0,12))}
            </td>

            <td>
                ${order.total_amount ?? "—"}
            </td>

            <td>
                ${escapeHtml(order.currency || "UGX")}
            </td>

            <td>
                <span class="badge">
                    ${escapeHtml(order.status || "pending")}
                </span>
            </td>

        </tr>

    `).join("");
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

    await supabaseClient.auth.signOut();

    window.location.href = "login.html";
}


/* =========================================================
   START
   ========================================================= */

async function start(){

    const isAdmin = await checkAdmin();

    if(!isAdmin) return;

    await loadCounts();
    await loadSongs();
    await loadOrders();
}

start();

</script></body>
</html>
