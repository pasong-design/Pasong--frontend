<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASONG Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

nav{
  padding:18px 22px;
  background:#10101a;
  border-bottom:1px solid #252538;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#d946ef;
}

.admin-label{
  color:#aaa;
  font-size:14px;
}

main{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

h1{
  font-size:30px;
  margin-bottom:8px;
}

.subtitle{
  color:#999;
  margin-bottom:28px;
}

#loading{
  text-align:center;
  padding:50px 20px;
  color:#bbb;
}

#error{
  display:none;
  background:#32131d;
  border:1px solid #8b2940;
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
  color:#ffb8c6;
}

#dashboard{
  display:none;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:16px;
}

.card{
  background:#11111c;
  border:1px solid #252538;
  border-radius:16px;
  padding:22px;
}

.card h3{
  color:#999;
  font-size:14px;
  margin-bottom:10px;
}

.number{
  font-size:30px;
  font-weight:800;
  color:#d946ef;
}

.section{
  margin-top:25px;
  background:#11111c;
  border:1px solid #252538;
  border-radius:16px;
  padding:22px;
}

.section h2{
  margin-bottom:10px;
}

.section p{
  color:#aaa;
  line-height:1.6;
}

button{
  margin-top:20px;
  border:0;
  border-radius:10px;
  padding:12px 18px;
  background:#d946ef;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}
</style>
</head>

<body>

<nav>
  <div class="logo">◈ PASONG</div>
  <div class="admin-label">ADMIN PANEL</div>
</nav>

<main>

  <div id="loading">
    Checking administrator access...
  </div>

  <div id="error"></div>

  <div id="dashboard">

    <h1>Admin Dashboard</h1>
    <p class="subtitle">
      Manage PASONG music, users, sales and platform activity.
    </p>

    <div class="cards">

      <div class="card">
        <h3>Admin</h3>
        <div class="number">✓</div>
      </div>

      <div class="card">
        <h3>Music</h3>
        <div class="number">—</div>
      </div>

      <div class="card">
        <h3>Users</h3>
        <div class="number">—</div>
      </div>

      <div class="card">
        <h3>Sales</h3>
        <div class="number">—</div>
      </div>

    </div>

    <div class="section">
      <h2>Welcome, PASONG Admin</h2>
      <p>
        Your account has administrator access. More management controls
        will be connected here next.
      </p>

      <button onclick="logout()">Logout</button>
    </div>

  </div>

</main>

<script>
const SUPABASE_URL = "https://mtufczmjlkvycarxylgh.supabase.co";

/*
 IMPORTANT:
 Use your Supabase PUBLISHABLE/ANON key here.
 NEVER put the service-role secret key in this file.
*/
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function checkAdmin(){

  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const dashboard = document.getElementById("dashboard");

  try{

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if(sessionError) throw sessionError;

    if(!session){
      window.location.href = "index.html";
      return;
    }

    const user = session.user;

    const role =
      user.app_metadata &&
      user.app_metadata.role;

    if(role !== "admin"){

      loading.style.display = "none";
      error.style.display = "block";

      error.innerHTML =
        "Access denied.<br><br>" +
        "This account does not have administrator permission.";

      return;
    }

    loading.style.display = "none";
    dashboard.style.display = "block";

  }catch(err){

    console.error(err);

    loading.style.display = "none";
    error.style.display = "block";

    error.textContent =
      "Unable to verify administrator access: " +
      err.message;
  }
}

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href = "index.html";
}

checkAdmin();
</script>

</body>
</html>
