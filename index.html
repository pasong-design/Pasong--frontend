<style>
/* ... CLEANED SINGLE MOBILE DESIGN - NO DUPLICATES ... */
body{background:#100f15;color:#f8f6fb;font-family:Arial,sans-serif}
.mobile-home{display:block;padding:0 0 12px}
.mobile-top{display:grid;grid-template-columns:34px 1fr 76px;align-items:center;gap:8px;margin:2px 0 12px}
.mobile-top .brand{text-align:center;font-size:23px;font-weight:900}
.mobile-top .brand i{color:#b56cff;font-style:normal}
.mobile-round{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#211d2a;border:1px solid #383044}
.mobile-search{position:relative;margin:0 0 14px}.mobile-search input{width:100%;min-height:46px;background:#292631;border:1px solid #4b4556;border-radius:11px;padding:12px 14px 12px 42px;color:#fff}
.mobile-hero{height:188px;border:1px solid #383043;border-radius:13px;overflow:hidden;margin:0 0 15px;position:relative;background:#17131d}
.mobile-section{margin:0 0 20px}.mobile-section-head{display:flex;justify-content:space-between;margin-bottom:10px}.mobile-section-head h2{font-size:17px;font-weight:850}
.mobile-list{display:flex;flex-direction:column;gap:10px}
.mobile-list-item{display:grid;grid-template-columns:56px 1fr 86px;gap:10px;align-items:center;background:#211e28;border:1px solid #302a39;border-radius:10px;padding:7px}
.mobile-list-item img{width:56px;height:56px;border-radius:8px;object-fit:cover}
.mobile-list-item b{font-size:12px;display:block}
.mobile-list-item span{font-size:10px;color:#b6afc1;display:block;margin-top:3px}
.mobile-list-item strong{font-size:10px;background:#7650c7;color:#fff;border-radius:8px;padding:8px 9px;text-align:center}
.mobile-bottom{position:fixed;left:10px;right:10px;bottom:8px;z-index:9999;display:grid;grid-template-columns:repeat(5,1fr);height:74px;padding:7px 8px;border:1px solid rgba(178,119,255,.38);border-radius:22px;background:rgba(27,24,36,.98)}
.mobile-bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#bcb5c9;font-size:11px;font-weight:700;border-radius:15px;min-height:56px}
.mobile-bottom a.active{color:#fff;background:linear-gradient(145deg,#7938c8,#51258f)}
</style>
