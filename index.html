<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:#080810;color:#fff;font-family:Arial,Helvetica,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:1000;background:rgba(8,8,16,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.07)}
.navbar{width:100%;max-width:1450px;margin:auto;min-height:70px;padding:12px 22px;display:flex;align-items:center;gap:18px}
.logo{font-size:23px;font-weight:900;white-space:nowrap;letter-spacing:.3px}.logo span{color:#c084fc}
.search-box{flex:1;max-width:450px;position:relative}
.search-box input{width:100%;height:43px;padding:0 15px 0 43px;border-radius:14px;border:1px solid rgba(255,255,255,.08);outline:none;color:#fff;background:#12121d}
.search-box input:focus{border-color:rgba(168,85,247,.55);box-shadow:0 0 0 3px rgba(168,85,247,.08)}
.search-box input::placeholder{color:#77778a}
.search-icon{position:absolute;left:15px;top:10px;color:#9696a9}
.nav-links{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav-links a{padding:10px 10px;border-radius:10px;color:#b8b8c8;font-size:12px;font-weight:700;white-space:nowrap}
.nav-links a:hover{color:#fff;background:rgba(168,85,247,.1)}
.notification-link{position:relative}.notification-count{position:absolute;top:1px;right:0;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px;border-radius:50px;background:#ec4899;color:#fff;font-size:9px;font-weight:800}
.account-link{display:flex!important;align-items:center;gap:7px}
.account-photo{width:31px;height:31px;border-radius:50%;object-fit:cover;border:2px solid rgba(192,132,252,.6);background:#191927}
.account-name{font-size:12px}
.login-button{padding:9px 13px!important;border:1px solid rgba(192,132,252,.35);background:rgba(168,85,247,.10);color:#fff!important;border-radius:10px!important}
.login-button:hover{background:linear-gradient(135deg,#8b5cf6,#ec4899)!important;border-color:transparent!important}
