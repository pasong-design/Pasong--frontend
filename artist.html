<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<meta name="description" content="Discover artists and music on PASONG.">
<title>PASONG — Artist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{--bg:#07060b;--card:#111018;--purple:#8b5cf6;--purple2:#a855f7;--pink:#d946ef;--text:#fff;--muted:#a7a1b3;--border:rgba(255,255,255,.08)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(139,92,246,.20),transparent 35%),linear-gradient(180deg,#0a0710 0%,#07060b 45%,#050409 100%);color:#fff;min-height:100vh;overflow-x:hidden}
button,a{font:inherit}
header{position:sticky;top:0;z-index:1000;height:62px;background:rgba(8,6,13,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav{max-width:1280px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-size:14px;font-weight:900}
.logo-mark{width:10px;height:10px;border-radius:3px 50% 50% 50%;background:linear-gradient(135deg,#a855f7,#d946ef);transform:rotate(45deg);box-shadow:0 0 15px rgba(168,85,247,.75)}
.nav-links{display:flex;align-items:center;gap:25px}
.nav-links a{color:#a9a3b1;text-decoration:none;font-size:11px;font-weight:700}
.nav-links a:hover,.nav-links a.active{color:#fff}
.account-btn{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;font-weight:900;box-shadow:0 0 20px rgba(139,92,246,.30)}
main{max-width:1280px;margin:auto;padding:25px 22px 165px}
.back{display:inline-flex;align-items:center;gap:8px;color:#9e97aa;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:18px}
.back:hover{color:#fff}
.artist-hero{position:relative;overflow:hidden;min-height:360px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(110deg,rgba(30,17,49,.98),rgba(12,9,18,.96));box-shadow:0 30px 90px rgba(0,0,0,.45)}
.hero-background{position:absolute;inset:0;background-position:center;background-size:cover;filter:blur(25px);transform:scale(1.12);opacity:.16}
.hero-background:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#170d26 0%,rgba(17,12,25,.96) 45%,rgba(10,7,14,.98) 100%)}
.hero-content{position:relative;z-index:2;min-height:360px;padding:38px;display:flex;align-items:center;gap:38px}
.artist-photo-wrap{flex:0 0 250px;position:relative}
.artist-photo{width:250px;height:250px;object-fit:cover;border-radius:26px;display:block;background:#1a1325;border:1px solid rgba(255,255,255,.10);box-shadow:0 25px 55px rgba(0,0,0,.55),0 0 60px rgba(139,92,246,.18)}
.photo-ring{position:absolute;inset:-8px;border-radius:32px;border:1px solid rgba(168,85,247,.25);pointer-events:none}
.artist-info{min-width:0;max-width:720px}
.eyebrow{color:#c084fc;font-size:10px;letter-spacing:2px;font-weight:900;text-transform:uppercase;margin-bottom:9px}
.artist-title{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.artist-title h1{font-size:48px;line-height:1;letter-spacing:-1.8px;font-weight:900;overflow-wrap:anywhere}
.verified{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#8b5cf6;color:#fff;font-size:12px;font-weight:900;box-shadow:0 0 18px rgba(139,92,246,.45);flex:0 0 auto}
.artist-meta{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:15px}
.meta-pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);color:#c0bac8;font-size:11px;font-weight:700}
.bio{color:#aaa4b1;line-height:1.65;font-size:13px;margin-top:20px;max-width:680px}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:23px}
.primary-btn,.secondary-btn{border:0;cursor:pointer;border-radius:12px;padding:12px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:900;transition:.2s ease;text-decoration:none;white-space:nowrap}
.primary-btn{background:linear-gradient(135deg,#8b5cf6,#a855f7);color:#fff;box-shadow:0 10px 28px rgba(139,92,246,.28)}
.secondary-btn{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);color:#eee}
.stats{display:flex;flex-wrap:wrap;gap:30px;margin-top:28px}
.stat strong{font-size:20px;font-weight:900}
.stat span{color:#817b89;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.section{margin-top:38px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-title{font-size:21px;font-weight:900;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.section-title:before{content:"";width:4px;height:18px;border-radius:99px;background:linear-gradient(180deg,#8b5cf6,#d946ef)}
.featured{position:relative;overflow:hidden;min-height:210px;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(120deg,rgba(139,92,246,.15),rgba(18,14,25,.96) 65%)}
.featured-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.12;filter:blur(15px)}
.featured-content{position:relative;z-index:2;padding:25px;display:flex;align-items:center;gap:24px}
.featured-cover{width:160px;height:160px;object-fit:cover;border-radius:18px;flex-shrink:0;box-shadow:0 20px 45px rgba(0,0,0,.45)}
.featured-title{font-size:26px;font-weight:900;letter-spacing:-.7px}
.music-list{display:flex;flex-direction:column;gap:10px}
.song-card{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:14px;min-height:78px;padding:8px 12px 8px 8px;border-radius:16px;border:1px solid rgba(255,255,255,.055);background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.018));transition:.2s ease}
.song-card:hover{transform:translateY(-1px);border-color:rgba(139,92,246,.22)}
.song-cover{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#171220}
.song-title{font-size:13px;font-weight:850;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-plays{color:#817b89;font-size:10px;white-space:nowrap}
.play-small{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:#8b5cf6;color:#fff}
.view-btn{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#e7e2eb;padding:8px 12px;border-radius:9px;text-decoration:none;font-size:10px;font-weight:800}
.loading{min-height:320px;display:flex;align-items:center;justify-content:center;color:#918b99;font-size:13px}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.10);border-top-color:#a855f7;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{padding:30px;border-radius:18px;border:1px solid rgba(239,68,68,.18);background:rgba(239,68,68,.06);color:#fca5a5;font-size:13px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:1500;min-height:76px;background:rgba(10,8,15,.97);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08)}
.player-inner{max-width:1280px;margin:auto;min-height:76px;padding:10px 22px;display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);align-items:center;gap:20px}
.now-playing{display:flex;align-items:center;gap:10px;min-width:0}
.now-cover{width:50px;height:50px;object-fit:cover;border-radius:9px}
.now-placeholder{width:50px;height:50px;flex-shrink:0;border-radius:9px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#24123d,#0e0915);color:#a855f7;font-size:17px}
.mobile-nav{display:none}
@media(max-width:700px){
  header{height:54px}.nav{padding:0 14px}.nav-links{display:none}main{padding:15px 12px 180px}
  .hero-content{padding:22px 16px;flex-direction:column;align-items:center;text-align:center;gap:18px}
  .artist-photo{width:180px;height:180px}.artist-title h1{font-size:clamp(30px,9vw,38px)}
  .song-card{grid-template-columns:52px minmax(0,1fr) 39px;padding-bottom:29px}.song-cover{width:52px;height:52px}
  .view-btn{position:absolute;left:70px;bottom:7px;padding:4px 8px;font-size:8px}
  .mobile-nav{display:flex;position:fixed;left:9px;right:9px;bottom:78px;z-index:1400;height:51px;border-radius:16px;background:rgba(18,14,25,.96);border:1px solid rgba(255,255,255,.08);align-items:center;justify-content:space-around}
  .mobile-nav a{color:#797381;text-decoration:none;font-size:8px;font-weight:800;text-align:center}
  .mobile-nav a.active{color:#c084fc}
}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="index.html" class="logo"><span class="logo-mark"></span>PASONG</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="store.html">Music Store</a>
      <a href="charts.html">Charts</a>
      <a href="artists.html" class="active">Artists</a>
      <a href="playlists.html">Playlists</a>
      <a href="promotion.html">Promotion</a>
    </nav>
    <button class="account-btn" onclick="location.href='account.html'">•</button>
  </div>
</header>
<main>
  <a href="artists.html" class="back">← Back to Artists</a>
  <div id="pageContent"><div class="loading"><div class="spinner"></div>Loading artist...</div></div>
</main>
<div class="mobile-nav">
  <a href="index.html">Home</a>
  <a href="store.html">Music</a>
  <a href="artists.html" class="active">Artists</a>
  <a href="charts.html">Charts</a>
  <a href="account.html">Account</a>
</div>
<div class="player">
  <div class="player-inner">
    <div class="now-playing">
      <div id="nowPlaceholder" class="now-placeholder">♫</div>
      <img id="nowCover" class="now-cover" style="display:none" src="">
      <div><div id="nowTitle" style="font-size:11px;font-weight:850">Nothing playing</div><div id="nowArtist" style="color:#777180;font-size:9px">PASONG</div></div>
    </div>
    <div><button id="mainPlay" style="width:40px;height:40px;border-radius:50%;border:0;background:#8b5cf6;color:#fff" onclick="togglePlayer()">▶</button></div>
    <div></div>
  </div>
</div>
<audio id="audioPlayer" preload="metadata"></audio>
<script>
const API_URL="https://pasong-api.vercel.app";
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let artist=null,songs=[],currentSongIndex=-1;
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function getParams(){const p=new URLSearchParams(location.search);return{id:p.get("id")||p.get("artist_id")||p.get("user_id"),name:p.get("name")||p.get("artist")}}
function getArtistName(pr){return pr?.performing_name||pr?.stage_name||pr?.artist_name||pr?.name||"Artist"}
function getArtistImage(pr){return pr?.profile_image_url||pr?.profile_photo_url||pr?.avatar_url||pr?.image_url||""}
function formatNumber(v){const n=Number(v||0);if(n>=1000000)return (n/1000000).toFixed(n>=10000000?0:1).replace(".0","")+"M";if(n>=1000)return (n/1000).toFixed(n>=10000?0:1).replace(".0","")+"K";return n.toLocaleString()}
function fallbackImage(t){return `https://via.placeholder.com/300x300/1a1325/8b5cf6?text=${encodeURIComponent(t||"PASONG")}`}
function getSongId(song){return song?.id||song?.song_id||""}
function getPlayerLink(song){return `/player.html?id=${encodeURIComponent(String(getSongId(song)))}`}

function renderFeatured(song){
  if(!song) return "";
  const cover=song.cover_url||song.artwork_url||fallbackImage(song.title);
  const link=getPlayerLink(song);
  return `<div class="section"><div class="section-title">Featured release</div>
  <div class="featured"><div class="featured-bg" style="background-image:url('${escapeHtml(cover)}')"></div>
  <div class="featured-content"><a href="${link}"><img class="featured-cover" src="${escapeHtml(cover)}"></a>
  <div><div style="color:#c084fc;font-size:9px;letter-spacing:2px;font-weight:900">LATEST RELEASE</div>
  <a href="${link}" style="text-decoration:none;color:inherit"><div class="featured-title">${escapeHtml(song.title)}</div></a>
  <div style="color:#777180;font-size:11px;margin-top:8px">${formatNumber(song.play_count||0)} plays</div>
  <div style="margin-top:14px;display:flex;gap:8px"><a class="primary-btn" href="${link}">▶ Play</a><a class="secondary-btn" href="${link}">View in Player</a></div></div></div></div></div>`;
}
function renderSong(song, idx){
  const cover=song.cover_url||song.artwork_url||fallbackImage(song.title);
  const link=getPlayerLink(song);
  return `<div class="song-card">
    <a href="${link}"><img class="song-cover" src="${escapeHtml(cover)}"></a>
    <div style="min-width:0"><a href="${link}" style="text-decoration:none"><div class="song-title">${escapeHtml(song.title||"Untitled")}</div></a><div style="color:#7e7887;font-size:10px;margin-top:4px">${formatNumber(song.play_count||0)} plays</div></div>
    <div style="color:#817b89;font-size:10px" class="song-plays">${formatNumber(song.play_count||0)}</div>
    <a href="${link}" class="play-small" style="text-decoration:none;display:flex;align-items:center;justify-content:center">▶</a>
    <a href="${link}" class="view-btn">View</a>
  </div>`;
}
function renderArtist(profile, songList){
  const p=profile||{};
  const name=getArtistName(p)||"Artist";
  const img=getArtistImage(p)||fallbackImage(name);
  const bio=p?.bio||p?.description||"Artist on PASONG.";
  const totalPlays=songList.reduce((a,b)=>a+Number(b.play_count||0),0);
  return `<div class="artist-hero"><div class="hero-background" style="background-image:url('${escapeHtml(img)}')"></div>
  <div class="hero-content"><div class="artist-photo-wrap"><img class="artist-photo" src="${escapeHtml(img)}"><div class="photo-ring"></div></div>
  <div class="artist-info"><div class="eyebrow">Artist</div><div class="artist-title"><h1>${escapeHtml(name)}</h1><span class="verified">✓</span></div>
  <div class="artist-meta"><span class="meta-pill">${songList.length} Songs</span><span class="meta-pill">${formatNumber(totalPlays)} Plays</span></div>
  <div class="bio">${escapeHtml(bio)}</div></div></div></div>
  ${renderFeatured(songList[0])}
  <div class="section"><div class="section-title">Music</div><div class="music-list">${songList.map((s,i)=>renderSong(s,i)).join("")}</div></div>`;
}
async function loadArtist(){
  const params=getParams();
  const container=document.getElementById("pageContent");
  try{
    let profile=null;
    if(params.id){try{const {data}=await supabaseClient.from("profiles").select("*").eq("id",params.id).single();if(data)profile=data;}catch(e){}}
    if(!profile){try{const res=await fetch(`${API_URL}/api/artists`);const json=await res.json();const list=Array.isArray(json)?json:json.artists||json.data||[];profile=list.find(a=>String(a.id)===String(params.id)||a.performing_name===params.name)||list[0]||null;}catch(e){}}
    if(!profile){profile={performing_name:params.name||"Artist",bio:"Artist on PASONG."};}
    let allSongs=[];try{const res=await fetch(`${API_URL}/api/songs`);const j=await res.json();allSongs=Array.isArray(j)?j:j.songs||j.data||[];}catch(e){}
    const artistName=getArtistName(profile).toLowerCase();
    songs=allSongs.filter(s=>(s.artist_name||"").toLowerCase().includes(artistName)||String(s.artist_id)===String(profile?.id)||String(s.user_id)===String(profile?.id));
    if(songs.length===0) songs=allSongs.slice(0,20);
    container.innerHTML=renderArtist(profile,songs);
  }catch(e){container.innerHTML=`<div class="error-box">${escapeHtml(e.message)}</div>`}
}
function togglePlayer(){}
loadArtist();
</script>
</body>
</html>
