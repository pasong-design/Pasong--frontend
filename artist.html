<style>

body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(139,92,246,.2),transparent 35%),linear-gradient(180deg,#0a0710,#07060b 45%,#050409);color:#fff;min-height:100vh;overflow-x:hidden}

<script>
"use strict";

const API_URL = "https://pasong-api.vercel.app";
const SUPABASE_URL = "https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY = "sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let artist = null;
let songs = [];

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getParams() {
  const params = new URLSearchParams(location.search);
  return {
    id: params.get("id") ||
        params.get("artist_id") ||
        params.get("artistId") ||
        params.get("user_id") ||
        params.get("userId"),
    name: params.get("name") || params.get("artist")
  };
}

function getArtistName(profile) {
  return profile?.performing_name ||
    profile?.stage_name ||
    profile?.artist_name ||
    profile?.name ||
    "Artist";
}

function getArtistImage(profile) {
  return profile?.profile_image_url ||
    profile?.profile_photo_url ||
    profile?.avatar_url ||
    profile?.image_url ||
    "";
}

function formatNumber(value) {
  const number = Number(value || 0);
  if (number >= 1000000) {
    return (number / 1000000).toFixed(number >= 10000000 ? 0 : 1)
      .replace(".0", "") + "M";
  }
  if (number >= 1000) {
    return (number / 1000).toFixed(number >= 10000 ? 0 : 1)
      .replace(".0", "") + "K";
  }
  return number.toLocaleString();
}

function fallbackImage(title) {
  const safe = escapeHtml(title || "PASONG");
  const svg =
    "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'>" +
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0%' stop-color='#24123d'/>" +
    "<stop offset='100%' stop-color='#0d0815'/>" +
    "</linearGradient></defs>" +
    "<rect width='100%' height='100%' fill='url(#g)'/>" +
    "<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' " +
    "fill='#c084fc' font-size='52' font-family='Arial' font-weight='900'>" +
    safe + "</text></svg>";

  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function getSongCover(song) {
  return song?.cover_url ||
    song?.coverUrl ||
    song?.cover_image_url ||
    song?.artwork_url ||
    song?.image_url ||
    "";
}

async function loadSongs() {
  const response = await fetch(API_URL + "/api/songs", {
    headers: { Accept: "application/json" },
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("Could not load songs. API status: " + response.status);
  }

  const data = await response.json();

  if (Array.isArray(data)) return data;
  if (Array.isArray(data.songs)) return data.songs;
  if (Array.isArray(data.data)) return data.data;

  return [];
}

function getSongArtistProfile(song) {
  return song?.artist || song?.artist_profile ||
    song?.artist_profiles || {};
}

function findArtist(allSongs) {
  const params = getParams();
  const requestedId = String(params.id || "").trim();
  const requestedName = String(params.name || "").trim().toLowerCase();

  const matchingSongs = allSongs.filter(song => {
    const profile = getSongArtistProfile(song);

    const ids = [
      profile?.id,
      song?.artist_id,
      profile?.user_id,
      song?.artist_user_id
    ].map(value => String(value || ""));

    if (requestedId && ids.includes(requestedId)) return true;

    if (requestedName) {
      const names = [
        getArtistName(profile),
        song?.artist_name,
        song?.performing_name,
        song?.stage_name
      ].filter(Boolean).map(value => String(value).toLowerCase());

      return names.includes(requestedName);
    }

    return false;
  });

  if (!matchingSongs.length && !requestedId && !requestedName &&
      allSongs.length) {
    matchingSongs.push(allSongs[0]);
  }

  if (!matchingSongs.length) {
    return { profile: null, songs: [] };
  }

  const firstSong = matchingSongs[0];
  const profile = getSongArtistProfile(firstSong);

  const mergedProfile = {
    ...profile,
    id: profile?.id || firstSong?.artist_id || null,
    user_id: profile?.user_id || firstSong?.artist_user_id || null,
    artist_name: profile?.artist_name || firstSong?.artist_name || null,
    performing_name: profile?.performing_name ||
      firstSong?.performing_name || null,
    stage_name: profile?.stage_name || firstSong?.stage_name || null,
    profile_image_url: profile?.profile_image_url ||
      firstSong?.profile_image_url || null,
    bio: profile?.bio || firstSong?.artist_bio || ""
  };

  return { profile: mergedProfile, songs: matchingSongs };
}

/* All song playback is handled by the central PASONG player. */
function openCentralPlayer(index) {
  const song = songs[index];

  if (!song || !song.id) {
    alert("This song is not available right now.");
    return;
  }

  const playerUrl = new URL("player.html", window.location.href);
  playerUrl.searchParams.set("type", "song");
  playerUrl.searchParams.set("id", String(song.id));

  window.location.href = playerUrl.toString();
}

function playSong(index) {
  openCentralPlayer(index);
}

function playAll() {
  if (songs.length) openCentralPlayer(0);
}

function renderArtist() {
  const container = document.getElementById("pageContent");

  if (!artist) {
    container.innerHTML =
      '<div class="error-box">This artist could not be found.<br><br>' +
      '<a href="artists.html" style="color:#c084fc;font-weight:800">' +
      'Return to Artists</a></div>';
    return;
  }

  const name = getArtistName(artist);
  const image = getArtistImage(artist) || fallbackImage(name);
  const bio = artist.bio || "Discover music from this artist on PASONG.";
  const totalPlays = songs.reduce(
    (total, song) => total + Number(song.play_count || song.plays || 0), 0
  );
  const location = artist.location || "Uganda";
  const featured = songs[0] || null;
  const featuredCover = getSongCover(featured) ||
    fallbackImage(featured?.title || "PASONG");

  container.innerHTML = `
    <section class="artist-hero">
      <div class="hero-background" style="background-image:url('${escapeHtml(image)}')"></div>
      <div class="hero-content">
        <div class="artist-photo-wrap">
          <img class="artist-photo"
               src="${escapeHtml(image)}"
               alt="${escapeHtml(name)}"
               onerror="this.onerror=null;this.src='${fallbackImage(name)}'">
          <div class="photo-ring"></div>
        </div>

        <div class="artist-info">
          <div class="eyebrow">PASONG ARTIST</div>
          <div class="artist-title">
            <h1>${escapeHtml(name)}</h1>
            <span class="verified">✓</span>
            <span class="artist-badge">Official artist</span>
          </div>

          <div class="artist-meta">
            <span class="meta-pill">📍 ${escapeHtml(location)}</span>
            <span class="meta-pill">🎵 Artist</span>
            <span class="meta-pill">PASONG Music</span>
          </div>

          <div id="bioText" class="bio collapsed">${escapeHtml(bio)}</div>
          <button id="readMoreBtn" class="read-more" onclick="toggleBio()">Read more</button>

          <div class="hero-actions">
            <button id="followButton" class="primary-btn" onclick="toggleFollow()">＋ Follow</button>
            <button class="secondary-btn" onclick="playAll()">▶ Play all</button>
            <button class="secondary-btn" onclick="shareArtist()">↗ Share</button>
            <button class="secondary-btn" onclick="tipArtist()">💜 Tip Artist</button>
          </div>

          <div class="stats">
            <div class="stat"><strong>${songs.length}</strong><span>Songs</span></div>
            <div class="stat"><strong>${formatNumber(totalPlays)}</strong><span>Plays</span></div>
            <div class="stat"><strong id="fanCount">0</strong><span>Fans</span></div>
          </div>
        </div>
      </div>
    </section>

    ${featured ? `
      <section class="section">
        <div class="section-head">
          <div>
            <div class="section-title">Featured release</div>
            <div class="section-subtitle">Start listening to ${escapeHtml(name)}</div>
          </div>
        </div>

        <div class="featured">
          <div class="featured-bg" style="background-image:url('${escapeHtml(featuredCover)}')"></div>
          <div class="featured-content">
            <img class="featured-cover"
                 src="${escapeHtml(featuredCover)}"
                 alt="${escapeHtml(featured.title || "Song")}"
                 onerror="this.onerror=null;this.src='${fallbackImage("PASONG")}'">

            <div>
              <div class="featured-label">Featured release</div>
              <div class="featured-title">${escapeHtml(featured.title || "Untitled")}</div>
              <div class="featured-artist">${escapeHtml(name)}</div>
              <div class="featured-meta">
                ${escapeHtml(featured.genre || "Music")} ·
                ${formatNumber(featured.play_count || featured.plays || 0)} plays
              </div>

              <div class="featured-actions">
                <button class="primary-btn" onclick="playSong(0)">▶ Play</button>
                <button class="secondary-btn" onclick="playSong(0)">View in Player ↗</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    ` : ""}

    <section class="section">
      <div class="section-head">
        <div>
          <div class="section-title">Music</div>
          <div class="section-subtitle">Explore music from ${escapeHtml(name)}</div>
        </div>
        ${songs.length ? `
          <button class="secondary-btn" onclick="playAll()" style="padding:8px 12px;font-size:10px">
            ▶ Play all
          </button>
        ` : ""}
      </div>

      <div id="musicList" class="music-list">
        ${songs.length
          ? songs.map((song, index) => renderSong(song, index)).join("")
          : '<div class="error-box">This artist has no published music yet.</div>'}
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <div class="section-title">About ${escapeHtml(name)}</div>
          <div class="section-subtitle">Artist profile</div>
        </div>
      </div>
      <div class="about-card"><p>${escapeHtml(bio)}</p></div>
    </section>
  `;

  setupBioButton();
  applyFollowState();
}

function renderSong(song, index) {
  const cover = getSongCover(song) ||
    fallbackImage(song.title || "PASONG");
  const title = song.title || "Untitled song";
  const genre = song.genre || "Music";
  const plays = Number(song.play_count || song.plays || 0);

  return `
    <div class="song-card">
      <img class="song-cover"
           src="${escapeHtml(cover)}"
           alt="${escapeHtml(title)}"
           onerror="this.onerror=null;this.src='${fallbackImage("PASONG")}'">

      <div class="song-main">
        <div class="song-title">${escapeHtml(title)}</div>
        <div class="song-sub">
          <span>${escapeHtml(genre)}</span>
          <span class="dot"></span>
          <span>${formatNumber(plays)} plays</span>
        </div>
      </div>

      <div class="song-plays">${formatNumber(plays)}</div>

      <button class="play-small"
              onclick="playSong(${index})"
              aria-label="Play ${escapeHtml(title)}">▶</button>
    </div>
  `;
}

function setupBioButton() {
  const bio = document.getElementById("bioText");
  const button = document.getElementById("readMoreBtn");
  if (!bio || !button) return;

  requestAnimationFrame(() => {
    if (bio.scrollHeight > bio.clientHeight + 5) {
      button.style.display = "inline-block";
    }
  });
}

function toggleBio() {
  const bio = document.getElementById("bioText");
  const button = document.getElementById("readMoreBtn");
  if (!bio || !button) return;

  const collapsed = bio.classList.toggle("collapsed");
  button.textContent = collapsed ? "Read more" : "Show less";
}

function getArtistFollowKey() {
  return "pasong_follow_" +
    (artist?.id || artist?.user_id || getArtistName(artist));
}

function getFollowerKey() {
  return "pasong_artist_followers_" +
    (artist?.id || artist?.user_id || getArtistName(artist));
}

function toggleFollow() {
  if (!artist) return;

  const key = getArtistFollowKey();
  const newState = localStorage.getItem(key) !== "true";
  localStorage.setItem(key, String(newState));

  const button = document.getElementById("followButton");
  if (button) {
    button.classList.toggle("following", newState);
    button.innerHTML = newState ? "✓ Following" : "＋ Follow";
  }

  let followers = Number(localStorage.getItem(getFollowerKey()) || 0);
  followers = newState ? followers + 1 : Math.max(0, followers - 1);
  localStorage.setItem(getFollowerKey(), String(followers));
  updateFanCount(followers);
}

function updateFanCount(value) {
  const element = document.getElementById("fanCount");
  if (element) element.textContent = formatNumber(value);
}

function applyFollowState() {
  const button = document.getElementById("followButton");
  const following = localStorage.getItem(getArtistFollowKey()) === "true";
  const followers = Number(localStorage.getItem(getFollowerKey()) || 0);

  updateFanCount(followers);

  if (button && following) {
    button.classList.add("following");
    button.innerHTML = "✓ Following";
  }
}

async function shareArtist() {
  const name = getArtistName(artist);
  const url = location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: name + " — PASONG",
        text: "Listen to " + name + " on PASONG.",
        url
      });
      return;
    } catch (error) {
      if (error?.name === "AbortError") return;
    }
  }

  try {
    await navigator.clipboard.writeText(url);
    alert("Artist link copied.");
  } catch (error) {
    prompt("Copy this artist link:", url);
  }
}

function tipArtist() {
  if (!artist) {
    alert("Artist information is not available.");
    return;
  }

  const artistId = artist.id || artist.user_id;

  if (!artistId) {
    alert("Artist profile ID is missing. Please open this artist from the Artists page.");
    return;
  }

  const url = new URL("tip-artist.html", window.location.href);
  url.searchParams.set("id", String(artistId));
  url.searchParams.set("name", getArtistName(artist));
  window.location.href = url.toString();
}

async function init() {
  const container = document.getElementById("pageContent");

  try {
    const allSongs = await loadSongs();
    const result = findArtist(allSongs);

    artist = result.profile;
    songs = result.songs;

    renderArtist();
  } catch (error) {
    console.error("PASONG artist loading error:", error);

    container.innerHTML = `
      <div class="error-box">
        <strong>PASONG could not load this artist.</strong><br><br>
        Please check your connection and try again.
        <br><br>
        <a href="artists.html" style="color:#c084fc;font-weight:800">
          ← Return to Artists
        </a>
      </div>
    `;
  }
}

init();
</script>
</body>
</html>
