<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<title>PASONG — Artist</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07060b;--purple:#8b5cf6}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(139,92,246,.20),transparent 35%),linear-gradient(180deg,#0a0710 0%,#07060b 45%,#050409 100%);color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:1000;height:62px;background:rgba(8,6,13,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav{max-width:1280px;height:100%;margin:auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-size:14px;font-weight:900}
.logo-mark{width:10px;height:10px;border-radius:3px 50% 50% 50%;background:linear-gradient(135deg,#a855f7,#d946ef);transform:rotate(45deg)}
.nav-links{display:flex;gap:25px}
.nav-links a{color:#a9a3b1;text-decoration:none;font-size:11px;font-weight:700}
.nav-links a.active{color:#fff}
.account-btn{width:30px;height:30px;border-radius:50%;border:0;background:linear-gradient(135deg,#8b5cf6,#d946ef);color:#fff;font-weight:900}
main{max-width:1280px;margin:auto;padding:25px 22px 100px}
.back{color:#9e97aa;text-decoration:none;font-size:12px;font-weight:700}
.artist-hero{position:relative;overflow:hidden;min-height:360px;border-radius:28px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(110deg,rgba(30,17,49,.98),rgba(12,9,18,.96));margin-top:18px}
.hero-background{position:absolute;inset:0;background-position:center;background-size:cover;filter:blur(25px);transform:scale(1.12);opacity:.16}
.hero-content{position:relative;z-index:2;min-height:360px;padding:38px;display:flex;align-items:center;gap:38px}
.artist-photo{width:250px;height:250px;object-fit:cover;border-radius:26px;background:#1a1325}
.artist-title h1{font-size:48px;line-height:1;font-weight:900}
.meta-pill{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);color:#c0bac8;font-size:11px;font-weight:700;margin-right:6px}
.bio{color:#aaa4b1;line-height:1.65;font-size:13px;margin-top:20px;max-width:680px}
.stats{display:flex;gap:30px;margin-top:28px}
.stat strong{font-size:20px;font-weight:900}
.stat span{color:#817b89;font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:800}
.section{margin-top:38px}
.section-title{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.section-title:before{content:"";width:4px;height:18px;border-radius:99px;background:linear-gradient(180deg,#8b5cf6,#d946ef)}
.featured{position:relative;overflow:hidden;min-height:210px;border-radius:22px;border:1px solid rgba(255,255,255,.07);background:linear-gradient(120deg,rgba(139,92,246,.15),rgba(18,14,25,.96) 65%)}
.featured-bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.12;filter:blur(15px)}
.featured-content{position:relative;z-index:2;padding:25px;display:flex;align-items:center;gap:24px}
.featured-cover{width:160px;height:160px;object-fit:cover;border-radius:18px}
.featured-title{font-size:26px;font-weight:900}
.song-card{display:grid;grid-template-columns:64px minmax(0,1fr) 40px;align-items:center;gap:14px;min-height:78px;padding:8px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.055);background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(255,255,255,.018));transition:.2s}
.song-card:hover{border-color:rgba(139,92,246,.22);background:linear-gradient(90deg,rgba(139,92,246,.12),rgba(255,255,255,.025))}
.song-cover{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#171220}
.song-title{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-small{width:40px;height:40px;border-radius:50%;background:#8b5cf6;display:flex;align-items:center;justify-content:center;color:#fff}
.loading{min-height:320px;display:flex;align-items:center;justify-content:center;color:#918b99}
.spinner{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.10);border-top-color:#a855f7;animation:spin .8s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.nav-links{display:none}.hero-content{flex-direction:column;text-align:center}.artist-photo{width:170px;height:170px}.artist-title h1{font-size:32px}.featured-cover{width:92px;height:92px}.song-card{grid-template-columns:52px minmax(0,1fr) 39px}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="/index.html" class="logo"><span class="logo-mark"></span>PASONG</a>
    <nav class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/store.html">Music Store</a>
      <a href="/charts.html">Charts</a>
      <a href="/artists.html" class="active">Artists</a>
      <a href="/playlists.html">Playlists</a>
      <a href="/promotion.html">Promotion</a>
    </nav>
    <button class="account-btn" onclick="location.href='/account.html'">•</button>
  </div>
</header>
<main>
  <a href="/artists.html" class="back">← Back to Artists</a>
  <div id="pageContent"><div class="loading"><div class="spinner"></div>Loading artist...</div></div>
</main>
<script>
const API_URL="https://pasong-api.vercel.app";
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let artist=null; let songs=[];
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function getParams(){const p=new URLSearchParams(location.search);return{id:p.get("id")||p.get("artist_id")||p.get("user_id"),name:p.get("name")||p.get("artist")}}
function getArtistName(pr){return pr?.performing_name||pr?.stage_name||pr?.artist_name||pr?.name||"Artist"}
function getArtistImage(pr){return pr?.profile_image_url||pr?.profile_photo_url||pr?.avatar_url||pr?.image_url||""}
function formatNumber(v){const n=Number(v||0);if(n>=1000000)return (n/1000000).toFixed(n>=10000000?0:1).replace(".0","")+"M";if(n>=1000)return (n/1000).toFixed(n>=10000?0:1).replace(".0","")+"K";return n.toLocaleString()}
function fallbackImage(t){return `https://via.placeholder.com/300x300/1a1325/8b5cf6?text=${encodeURIComponent(t||"PASONG")}`}
function getSongId(song){return song?.id||song?.song_id||song?.uuid||""}
function getSongCover(song){return song?.cover_url||song?.artwork_url||song?.image_url||""}
function getPlayerLink(song){const id=getSongId(song);return `/player.html?id=${encodeURIComponent(String(id))}`}

function renderSong(song){
  const cover=getSongCover(song)||fallbackImage(song.title);
  const title=song.title||"Untitled";
  const plays=formatNumber(song.play_count||song.plays||0);
  const link=getPlayerLink(song);
  return `<a href="${link}" style="text-decoration:none;color:inherit;display:block;margin-bottom:10px">
    <div class="song-card">
      <img class="song-cover" src="${escapeHtml(cover)}" onerror="this.src='${fallbackImage('PASONG')}'">
      <div style="min-width:0"><div class="song-title">${escapeHtml(title)}</div><div style="color:#7e7887;font-size:10px;margin-top:6px">${plays} plays • Tap to play</div></div>
      <div class="play-small">▶</div>
    </div></a>`;
}
function renderFeatured(song){
  if(!song) return "";
  const cover=getSongCover(song)||fallbackImage(song.title);
  const link=getPlayerLink(song);
  return `<div class="section"><div class="section-title">Featured</div>
  <a href="${link}" style="text-decoration:none;color:inherit"><div class="featured"><div class="featured-bg" style="background-image:url('${escapeHtml(cover)}')"></div>
  <div class="featured-content"><img class="featured-cover" src="${escapeHtml(cover)}"><div><div class="featured-title">${escapeHtml(song.title||"Featured")}</div><div style="color:#777180;font-size:11px;margin-top:8px">Click to play in player</div></div></div></div></a></div>`;
}
function renderArtist(profile, songList){
  const p = profile || {};
  const name=getArtistName(p)||"Artist";
  const img=getArtistImage(p)||fallbackImage(name);
  const bio=p.bio||p.description||p.about||"Artist on PASONG. Discover music and tracks.";
  const totalPlays=songList.reduce((a,b)=>a+Number(b.play_count||b.plays||0),0);
  return `<div class="artist-hero"><div class="hero-background" style="background-image:url('${escapeHtml(img)}')"></div>
  <div class="hero-content"><div><img class="artist-photo" src="${escapeHtml(img)}" onerror="this.src='${fallbackImage(name)}'"></div>
  <div><div style="color:#c084fc;font-size:10px;letter-spacing:2px;font-weight:900;margin-bottom:9px">ARTIST</div><div class="artist-title"><h1>${escapeHtml(name)}</h1></div>
  <div style="margin-top:15px"><span class="meta-pill">${songList.length} Songs</span><span class="meta-pill">${formatNumber(totalPlays)} Plays</span></div>
  <div class="bio">${escapeHtml(bio)}</div>
  <div class="stats"><div class="stat"><strong>${songList.length}</strong><span>Songs</span></div><div class="stat"><strong>${formatNumber(totalPlays)}</strong><span>Plays</span></div></div>
  </div></div></div>
  ${renderFeatured(songList[0]||null)}
  <div class="section"><div class="section-title">All Songs</div><div style="margin-top:16px">${songList.map(s=>renderSong(s)).join("")||"<div style='color:#888'>No songs found</div>"}</div></div>`;
}
async function loadArtist(){
  const params=getParams();
  const container=document.getElementById("pageContent");
  try{
    let profile=null;
    if(params.id){
      try{
        const {data} = await supabaseClient.from("profiles").select("*").eq("id",params.id).single();
        if(data) profile=data;
      }catch(e){}
    }
    if(!profile){
      try{
        const res=await fetch(`${API_URL}/api/artists`);
        const json=await res.json();
        const list=Array.isArray(json)?json:json.artists||json.data||[];
        profile=list.find(a=>String(a.id)===String(params.id)||a.performing_name===params.name||a.stage_name===params.name)||list[0]||null;
      }catch(e){}
    }
    if(!profile){
      profile={performing_name: params.name || "Artist", bio: "Artist on PASONG."};
    }
    artist=profile;
    let allSongs=[];
    try{
      const resSongs=await fetch(`${API_URL}/api/songs`);
      const jsonSongs=await resSongs.json();
      allSongs=Array.isArray(jsonSongs)?jsonSongs:jsonSongs.songs||jsonSongs.data||[];
    }catch(e){}
    const artistName=getArtistName(profile).toLowerCase();
    songs=allSongs.filter(s=>(s.artist_name||s.performing_name||"").toLowerCase().includes(artistName)||String(s.artist_id)===String(profile?.id)||String(s.user_id)===String(profile?.id));
    if(songs.length===0) songs=allSongs.slice(0,30);
    container.innerHTML=renderArtist(profile,songs);
  }catch(e){
    console.error(e);
    container.innerHTML=`<div style="padding:20px;color:#fca5a5">Error: ${escapeHtml(e.message)}<br><br>Try reload</div>`;
  }
}
loadArtist();
</script>
</body>
</html>
