<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<meta name="description" content="Discover artists and music on PASONG.">

<title>PASONG — Artist</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#07060b;
  --bg2:#0d0914;
  --card:#111018;
  --card2:#171321;
  --purple:#8b5cf6;
  --purple2:#a855f7;
  --pink:#d946ef;
  --text:#fff;
  --muted:#a7a1b3;
  --muted2:#777180;
  --border:rgba(255,255,255,.08);
  --green:#22c55e;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background:
    radial-gradient(
      circle at 50% -10%,
      rgba(139,92,246,.20),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #0a0710 0%,
      #07060b 45%,
      #050409 100%
    );
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* =========================================================
   HEADER
========================================================= */

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:62px;
  background:rgba(8,6,13,.90);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav{
  max-width:1280px;
  height:100%;
  margin:auto;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:9px;
  color:#fff;
  text-decoration:none;
  font-size:14px;
  font-weight:900;
  letter-spacing:.3px;
}

.logo-mark{
  width:10px;
  height:10px;
  border-radius:3px 50% 50% 50%;
  background:linear-gradient(
    135deg,
    #a855f7,
    #d946ef
  );
  transform:rotate(45deg);
  box-shadow:0 0 15px rgba(168,85,247,.75);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
}

.nav-links a{
  color:#a9a3b1;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
  transition:.2s ease;
}

.nav-links a:hover,
.nav-links a.active{
  color:#fff;
}

.account-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  border:0;
  cursor:pointer;
  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #d946ef
    );
  color:white;
  font-weight:900;
  box-shadow:
    0 0 20px rgba(139,92,246,.30);
}

/* =========================================================
   MAIN
========================================================= */

main{
  max-width:1280px;
  margin:auto;
  padding:25px 22px 150px;
}

.back{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#9e97aa;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
  margin-bottom:18px;
}

.back:hover{
  color:#fff;
}

/* =========================================================
   ARTIST HERO
========================================================= */

.artist-hero{
  position:relative;
  overflow:hidden;
  min-height:360px;
  border-radius:28px;
  border:1px solid rgba(255,255,255,.08);

  background:
    linear-gradient(
      110deg,
      rgba(30,17,49,.98),
      rgba(12,9,18,.96)
    );

  box-shadow:
    0 30px 90px rgba(0,0,0,.45);
}

.hero-background{
  position:absolute;
  inset:0;
  background-position:center;
  background-size:cover;
  filter:blur(25px);
  transform:scale(1.12);
  opacity:.16;
}

.hero-background::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      #170d26 0%,
      rgba(17,12,25,.96) 45%,
      rgba(10,7,14,.98) 100%
    );
}

.hero-content{
  position:relative;
  z-index:2;
  min-height:360px;
  padding:38px;
  display:flex;
  align-items:center;
  gap:38px;
}

.artist-photo-wrap{
  flex:0 0 250px;
  position:relative;
}

.artist-photo{
  width:250px;
  height:250px;
  object-fit:cover;
  border-radius:26px;
  display:block;
  background:#1a1325;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:
    0 25px 55px rgba(0,0,0,.55),
    0 0 60px rgba(139,92,246,.18);
}

.photo-ring{
  position:absolute;
  inset:-8px;
  border-radius:32px;
  border:1px solid rgba(168,85,247,.25);
  pointer-events:none;
}

.artist-info{
  min-width:0;
  max-width:720px;
}

.eyebrow{
  color:#c084fc;
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
  text-transform:uppercase;
  margin-bottom:9px;
}

.artist-title{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

.artist-title h1{
  font-size:48px;
  line-height:1;
  letter-spacing:-1.8px;
  font-weight:900;
}

.verified{
  width:22px;
  height:22px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#8b5cf6;
  color:#fff;
  font-size:12px;
  font-weight:900;
  box-shadow:0 0 18px rgba(139,92,246,.45);
}

.artist-meta{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:9px;
  margin-top:15px;
}

.meta-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.07);
  color:#c0bac8;
  font-size:11px;
  font-weight:700;
}

.bio{
  color:#aaa4b1;
  line-height:1.65;
  font-size:13px;
  margin-top:20px;
  max-width:680px;
}

.bio.collapsed{
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.read-more{
  display:none;
  border:0;
  background:none;
  color:#c084fc;
  cursor:pointer;
  font-size:11px;
  font-weight:800;
  margin-top:6px;
}

.hero-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:23px;
}

.primary-btn,
.secondary-btn{
  border:0;
  cursor:pointer;
  border-radius:12px;
  padding:12px 18px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:12px;
  font-weight:900;
  transition:.2s ease;
}

.primary-btn{
  background:
    linear-gradient(
      135deg,
      #8b5cf6,
      #a855f7
    );
  color:#fff;
  box-shadow:
    0 10px 28px rgba(139,92,246,.28);
}

.primary-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 15px 35px rgba(139,92,246,.38);
}

.secondary-btn{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.10);
  color:#eee;
}

.secondary-btn:hover{
  background:rgba(255,255,255,.09);
}

.following{
  background:rgba(139,92,246,.18);
  border-color:rgba(139,92,246,.35);
}

.stats{
  display:flex;
  flex-wrap:wrap;
  gap:28px;
  margin-top:28px;
}

.stat{
  display:flex;
  flex-direction:column;
  gap:3px;
}

.stat strong{
  font-size:19px;
  font-weight:900;
}

.stat span{
  color:#817b89;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:800;
}

/* =========================================================
   CONTENT
========================================================= */

.section{
  margin-top:38px;
}

.section-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin-bottom:16px;
}

.section-title{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.4px;
}

.section-subtitle{
  color:#756f7d;
  font-size:11px;
  margin-top:4px;
}

.section-action{
  color:#b58cff;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
}

/* =========================================================
   FEATURED
========================================================= */

.featured{
  position:relative;
  overflow:hidden;
  min-height:210px;
  border-radius:22px;
  border:1px solid rgba(255,255,255,.07);
  background:
    linear-gradient(
      120deg,
      rgba(139,92,246,.15),
      rgba(18,14,25,.96) 65%
    );
}

.featured-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  opacity:.12;
  filter:blur(15px);
}

.featured-content{
  position:relative;
  z-index:2;
  padding:25px;
  display:flex;
  align-items:center;
  gap:24px;
}

.featured-cover{
  width:160px;
  height:160px;
  object-fit:cover;
  border-radius:18px;
  flex-shrink:0;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
}

.featured-label{
  color:#c084fc;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:900;
  margin-bottom:7px;
}

.featured-title{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.7px;
}

.featured-artist{
  color:#908999;
  font-size:12px;
  margin-top:5px;
}

.featured-meta{
  color:#777180;
  font-size:11px;
  margin-top:13px;
}

.featured-actions{
  margin-top:20px;
  display:flex;
  gap:9px;
}

/* =========================================================
   SONG LIST
========================================================= */

.music-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.song-card{
  position:relative;
  display:grid;
  grid-template-columns:58px minmax(0,1fr) auto auto;
  align-items:center;
  gap:14px;
  min-height:78px;
  padding:9px 13px 9px 9px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.055);
  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.018)
    );
  transition:.2s ease;
}

.song-card:hover{
  transform:translateY(-1px);
  background:
    linear-gradient(
      90deg,
      rgba(139,92,246,.12),
      rgba(255,255,255,.025)
    );
  border-color:rgba(139,92,246,.22);
}

.song-cover{
  width:58px;
  height:58px;
  border-radius:11px;
  object-fit:cover;
  background:#171220;
}

.song-main{
  min-width:0;
}

.song-title{
  font-size:13px;
  font-weight:850;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-sub{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
  margin-top:6px;
}

.song-sub span{
  color:#7e7887;
  font-size:10px;
}

.dot{
  width:3px;
  height:3px;
  background:#655f6c;
  border-radius:50%;
}

.song-plays{
  color:#817b89;
  font-size:10px;
  white-space:nowrap;
}

.play-small{
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#8b5cf6;
  color:#fff;
  box-shadow:0 7px 20px rgba(139,92,246,.22);
  transition:.2s ease;
}

.play-small:hover{
  transform:scale(1.07);
}

.view-btn{
  border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.04);
  color:#e7e2eb;
  padding:8px 12px;
  border-radius:9px;
  text-decoration:none;
  font-size:10px;
  font-weight:800;
}

.view-btn:hover{
  background:rgba(255,255,255,.08);
}

/* =========================================================
   ABOUT
========================================================= */

.about-card{
  padding:24px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.025);
}

.about-card p{
  color:#96909d;
  line-height:1.75;
  font-size:13px;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading{
  min-height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#918b99;
  font-size:13px;
}

.spinner{
  width:22px;
  height:22px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.10);
  border-top-color:#a855f7;
  animation:spin .8s linear infinite;
  margin-right:10px;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.error-box{
  padding:30px;
  border-radius:18px;
  border:1px solid rgba(239,68,68,.18);
  background:rgba(239,68,68,.06);
  color:#fca5a5;
  font-size:13px;
}

/* =========================================================
   PLAYER
========================================================= */

.player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1500;
  min-height:76px;
  background:rgba(10,8,15,.96);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  box-shadow:0 -20px 50px rgba(0,0,0,.35);
}

.player-inner{
  max-width:1280px;
  margin:auto;
  min-height:76px;
  padding:10px 22px;
  display:grid;
  grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);
  align-items:center;
  gap:20px;
}

.now-playing{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.now-cover{
  width:50px;
  height:50px;
  object-fit:cover;
  border-radius:9px;
  background:#18131f;
}

.now-info{
  min-width:0;
}

.now-title{
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.now-artist{
  color:#777180;
  font-size:9px;
  margin-top:4px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.control-btn{
  border:0;
  background:none;
  color:#aaa4b1;
  cursor:pointer;
  font-size:14px;
}

.control-btn:hover{
  color:#fff;
}

.main-play{
  width:40px;
  height:40px;
  border-radius:50%;
  border:0;
  background:#8b5cf6;
  color:#fff;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(139,92,246,.30);
}

.player-right{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:12px;
}

.volume{
  width:100px;
}

.progress-wrap{
  position:absolute;
  top:-2px;
  left:0;
  right:0;
  height:3px;
  background:rgba(255,255,255,.06);
}

.progress{
  width:0%;
  height:100%;
  background:
    linear-gradient(
      90deg,
      #8b5cf6,
      #d946ef
    );
}

/* =========================================================
   MOBILE
========================================================= */

.mobile-nav{
  display:none;
}

@media(max-width:850px){

  .nav{
    padding:0 14px;
  }

  .nav-links{
    display:none;
  }

  main{
    padding:
      18px
      14px
      145px;
  }

  .artist-hero{
    border-radius:22px;
  }

  .hero-content{
    min-height:auto;
    padding:24px 18px 25px;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:22px;
  }

  .artist-photo-wrap{
    flex-basis:auto;
  }

  .artist-photo{
    width:190px;
    height:190px;
    border-radius:22px;
  }

  .artist-title{
    justify-content:center;
  }

  .artist-title h1{
    font-size:34px;
  }

  .artist-meta{
    justify-content:center;
  }

  .bio{
    font-size:12px;
    max-width:none;
  }

  .hero-actions{
    justify-content:center;
  }

  .stats{
    justify-content:center;
    gap:24px;
  }

  .featured-content{
    padding:18px;
    gap:15px;
  }

  .featured-cover{
    width:110px;
    height:110px;
    border-radius:14px;
  }

  .featured-title{
    font-size:18px;
  }

  .featured-meta{
    font-size:10px;
  }

  .featured-actions{
    margin-top:12px;
  }

  .song-card{
    grid-template-columns:50px minmax(0,1fr) auto;
    gap:10px;
  }

  .song-cover{
    width:50px;
    height:50px;
  }

  .song-plays,
  .view-btn{
    display:none;
  }

  .player-inner{
    padding:8px 12px;
    grid-template-columns:1fr auto;
  }

  .player-right{
    display:none;
  }

  .controls{
    gap:8px;
  }

  .control-btn{
    display:none;
  }

  .main-play{
    width:38px;
    height:38px;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    left:10px;
    right:10px;
    bottom:84px;
    z-index:1400;
    height:52px;
    border-radius:17px;
    background:rgba(18,14,25,.94);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    align-items:center;
    justify-content:space-around;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
  }

  .mobile-nav a{
    color:#797381;
    text-decoration:none;
    font-size:9px;
    font-weight:800;
    text-align:center;
  }

  .mobile-nav a.active{
    color:#c084fc;
  }

  .mobile-nav-icon{
    display:block;
    font-size:16px;
    margin-bottom:2px;
  }
}

@media(max-width:480px){

  .artist-photo{
    width:165px;
    height:165px;
  }

  .artist-title h1{
    font-size:30px;
  }

  .featured{
    min-height:160px;
  }

  .featured-content{
    align-items:flex-start;
  }

  .featured-cover{
    width:92px;
    height:92px;
  }

  .featured-title{
    font-size:16px;
  }

  .primary-btn,
  .secondary-btn{
    padding:11px 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      PASONG
    </a>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="store.html">Music Store</a>
      <a href="charts.html">Charts</a>
      <a href="artists.html" class="active">Artists</a>
      <a href="playlists.html">Playlists</a>
      <a href="promotion.html">Promotion</a>
    </nav>

    <button
      class="account-btn"
      onclick="location.href='account.html'"
      aria-label="Account">
      •
    </button>

  </div>
</header>

<main>

  <a href="artists.html" class="back">
    ← Back to Artists
  </a>

  <div id="pageContent">

    <div class="loading">
      <div class="spinner"></div>
      Loading artist...
    </div>

  </div>

</main>

<div class="mobile-nav">

  <a href="index.html">
    <span class="mobile-nav-icon">⌂</span>
    Home
  </a>

  <a href="store.html">
    <span class="mobile-nav-icon">♫</span>
    Music
  </a>

  <a href="artists.html" class="active">
    <span class="mobile-nav-icon">♟</span>
    Artists
  </a>

  <a href="charts.html">
    <span class="mobile-nav-icon">▥</span>
    Charts
  </a>

  <a href="account.html">
    <span class="mobile-nav-icon">●</span>
    Account
  </a>

</div>

<div class="player">

  <div class="progress-wrap">
    <div class="progress" id="progressBar"></div>
  </div>

  <div class="player-inner">

    <div class="now-playing">

      <img
        id="nowCover"
        class="now-cover"
        src=""
        alt="">

      <div class="now-info">
        <div id="nowTitle" class="now-title">
          Nothing playing
        </div>

        <div id="nowArtist" class="now-artist">
          PASONG
        </div>
      </div>

    </div>

    <div class="controls">

      <button
        class="control-btn"
        onclick="previousSong()">
        ↶
      </button>

      <button
        id="mainPlay"
        class="main-play"
        onclick="togglePlayer()">
        ▶
      </button>

      <button
        class="control-btn"

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function getParams(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return {

    id:
      params.get("id") ||
      params.get("artist_id") ||
      params.get("artistId") ||
      params.get("user_id") ||
      params.get("userId"),

    name:
      params.get("name") ||
      params.get("artist")

  };

}


function getArtistName(profile){

  return (
    profile?.performing_name ||
    profile?.stage_name ||
    profile?.artist_name ||
    "Artist"
  );

}


function getArtistImage(profile){

  return (
    profile?.profile_image_url ||
    profile?.profile_photo_url ||
    profile?.avatar_url ||
    ""
  );

}


function formatNumber(value){

  const number =
    Number(value || 0);

  if(number >= 1000000){

    return (
      (number / 1000000)
        .toFixed(number >= 10000000 ? 0 : 1)
        .replace(".0","")
      + "M"
    );

  }

  if(number >= 1000){

    return (
      (number / 1000)
        .toFixed(number >= 10000 ? 0 : 1)
        .replace(".0","")
      + "K"
    );

  }

  return number.toLocaleString();

}


function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return "0:00";
  }

  const mins =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return mins + ":" + secs;

}


function fallbackImage(text){

  const safe =
    encodeURIComponent(
      text || "PASONG"
    );

  return (
    "data:image/svg+xml;charset=UTF-8," +
    "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'>" +
    "<defs>" +
    "<linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
    "<stop offset='0%' stop-color='#24123d'/>" +
    "<stop offset='100%' stop-color='#0d0815'/>" +
    "</linearGradient>" +
    "</defs>" +
    "<rect width='100%' height='100%' fill='url(#g)'/>" +
    "<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='#c084fc' font-size='52' font-family='Arial' font-weight='900'>" +
    safe +
    "</text>" +
    "</svg>"
  );

}


/* =========================================================
   LOAD SONGS
========================================================= */

async function loadSongs(){

  const response =
    await fetch(
      API_URL + "/api/songs",
      {
        method:"GET",
        headers:{
          "Accept":"application/json"
        }
      }
    );

  if(!response.ok){

    throw new Error(
      "Unable to load PASONG music."
    );

  }

  const data =
    await response.json();

  return Array.isArray(data.songs)
    ? data.songs
    : [];

}


/* =========================================================
   FIND ARTIST
========================================================= */

function findArtist(allSongs){

  const params =
    getParams();

  const requestedId =
    String(params.id || "")
      .trim();

  const requestedName =
    String(params.name || "")
      .trim()
      .toLowerCase();

  let matchingSongs =
    allSongs.filter(song=>{

      const profile =
        song.artist ||
        song.artist_profile ||
        song.artist_profiles ||
        {};

      const profileId =
        String(
          profile.id ||
          song.artist_id ||
          ""
        );

      const userId =
        String(
          profile.user_id ||
          song.artist_user_id ||
          ""
        );

      if(
        requestedId &&
        (
          profileId === requestedId ||
          userId === requestedId ||
          String(song.artist_id || "") === requestedId ||
          String(song.artist_user_id || "") === requestedId
        )
      ){
        return true;
      }

      if(requestedName){

        const name =
          getArtistName(profile)
            .toLowerCase();

        return name === requestedName;

      }

      return false;

    });


  /*
    If no ID/name was supplied, use the
    first artist represented in the song list.
    This keeps the page from appearing blank.
  */

  if(
    !matchingSongs.length &&
    !requestedId &&
    !requestedName &&
    allSongs.length
  ){

    matchingSongs =
      [allSongs[0]];

  }


  if(!matchingSongs.length){

    return {
      profile:null,
      songs:[]
    };

  }


  const first =
    matchingSongs[0];

  const profile =
    first.artist ||
    first.artist_profile ||
    first.artist_profiles ||
    {

      id:first.artist_id ||
      null,

      user_id:first.artist_user_id ||
      null,

      artist_name:
        first.artist_name ||
        null

    };


  return {

    profile,

    songs:
      matchingSongs

  };

}

    <!-- =====================================================

    ${

      ? `

          </div>


          <div class="featured-content">

            <img
              class="featured-cover"

              ">


            <div>

                )}
              </div>

              <div class="featured-artist">

    <!-- =====================================================

/* =========================================================
   SONG CARD

  `;

}


/* =========================================================
   BIO
========================================================= */

function setupBioButton(){

  const bio =
    document.getElementById(
      "bioText"
    );

  const button =
    document.getElementById(
      "readMoreBtn"
    );

  if(!bio || !button){
    return;
  }


  /*
    Show Read More only when the bio
    is actually long enough.
  */

  if(
    bio.scrollHeight >
    bio.clientHeight + 5
  ){

    button.style.display =
      "inline-block";

  }

}


function toggleBio(){

  const bio =
    document.getElementById(
      "bioText"
    );

  const button =
    document.getElementById(
      "readMoreBtn"
    );

  if(!bio || !button){
    return;
  }


  const collapsed =
    bio.classList.toggle(
      "collapsed"
    );


  button.textContent =
    collapsed
      ? "Read more"
      : "Show less";

}


/* =========================================================
   FOLLOW
========================================================= */

function getArtistFollowKey(){

  return (
    "pasong_follow_" +
    (
      artist?.id ||
      artist?.user_id ||
      getArtistName(artist)
    )
  );

}


function toggleFollow(){

  if(!artist){
    return;
  }


  const key =
    getArtistFollowKey();


  const currentlyFollowing =
    localStorage.getItem(key)
      === "true";


  const newState =
    !currentlyFollowing;


  localStorage.setItem(
    key,
    String(newState)
  );


  const button =
    document.getElementById(
      "followButton"
    );


  if(button){

    button.classList.toggle(
      "following",
      newState
    );


    button.innerHTML =
      newState
        ? "✓ Following"
        : "＋ Follow";

  }


  /*
    Local follower display.
    This does not change your Supabase
    database structure.
  */

  const followerKey =
    "pasong_artist_followers_" +
    (
      artist.id ||
      artist.user_id ||
      getArtistName(artist)
    );


  let followers =
    Number(
      localStorage.getItem(
        followerKey
      ) || 0
    );


  if(newState){
    followers++;
  }else{
    followers =
      Math.max(
        0,
        followers - 1
      );
  }


  localStorage.setItem(
    followerKey,
    String(followers)
  );

}


/* =========================================================
   APPLY FOLLOW STATE
========================================================= */

function applyFollowState(){

  const button =
    document.getElementById(
      "followButton"
    );

  if(!button){
    return;
  }


  const following =
    localStorage.getItem(
      getArtistFollowKey()
    ) === "true";


  if(following){

    button.classList.add(
      "following"
    );

    button.innerHTML =
      "✓ Following";

  }

}


/* =========================================================
   SHARE
========================================================= */

async function shareArtist(){

  const name =
    getArtistName(artist);


  const url =
    window.location.href;


  if(
    navigator.share
  ){

    try{

      await navigator.share({
        title:
          name + " — PASONG",
        text:
          "Listen to " +
          name +
          " on PASONG.",
        url
      });

      return;

    }catch(error){

      /*
        User cancelled share.
      */

    }

  }


  try{

    await navigator.clipboard.writeText(
      url
    );

    alert(
      "Artist link copied."
    );

  }catch(error){

    prompt(
      "Copy this artist link:",
      url
    );

  }

}


/* =========================================================
   AUDIO PLAYER
========================================================= */

const audio =
  document.getElementById(
    "audioPlayer"
  );


const mainPlay =
  document.getElementById(
    "mainPlay"
  );


const nowTitle =
  document.getElementById(
    "nowTitle"
  );


const nowArtist =
  document.getElementById(
    "nowArtist"
  );


const nowCover =
  document.getElementById(
    "nowCover"
  );


const progressBar =
  document.getElementById(
    "progressBar"
  );


const timeLabel =
  document.getElementById(
    "timeLabel"
  );


const volumeControl =
  document.getElementById(
    "volumeControl"
  );


audio.volume =
  Number(
    volumeControl.value
  );


volumeControl.addEventListener(
  "input",
  ()=>{
    audio.volume =
      Number(
        volumeControl.value
      );
  }
);


function playSong(index){

  if(
    !songs[index]
  ){
    return;
  }


  const song =
    songs[index];


  const audioUrl =
    song.preview_url ||
    song.audio_url;


  if(!audioUrl){

    alert(
      "This song is not available for streaming right now."
    );

    return;

  }


  currentSongIndex =
    index;


  audio.src =
    audioUrl;


  nowTitle.textContent =
    song.title ||
    "Untitled";


  nowArtist.textContent =
    getArtistName(
      artist
    );


  nowCover.src =
    song.cover_url ||
    fallbackImage(
      song.title ||
      "PASONG"
    );


  audio.play()
    .then(()=>{

      mainPlay.textContent =
        "❚❚";

    })
    .catch(error=>{

      console.error(
        "Audio playback error:",
        error
      );

      mainPlay.textContent =
        "▶";

    });

}


function togglePlayer(){

  if(!audio.src){

    if(songs.length){

      playSong(0);

    }

    return;

  }


  if(audio.paused){

    audio.play();

    mainPlay.textContent =
      "❚❚";

  }else{

    audio.pause();

    mainPlay.textContent =
      "▶";

  }

}


function playAll(){

  if(!songs.length){
    return;
  }

  playSong(0);

}


function nextSong(){

  if(!songs.length){
    return;
  }


  let next =
    currentSongIndex + 1;


  if(next >= songs.length){
    next = 0;
  }


  playSong(next);

}


function previousSong(){

  if(!songs.length){
    return;
  }


  let previous =
    currentSongIndex - 1;


  if(previous < 0){
    previous =
      songs.length - 1;
  }


  playSong(previous);

}


/* =========================================================
   PLAYER EVENTS
========================================================= */

audio.addEventListener(
  "play",
  ()=>{
    mainPlay.textContent =
      "❚❚";
  }
);


audio.addEventListener(
  "pause",
  ()=>{
    mainPlay.textContent =
      "▶";
  }
);


audio.addEventListener(
  "ended",
  ()=>{
    nextSong();
  }
);


audio.addEventListener(
  "timeupdate",
  ()=>{

    const duration =
      audio.duration || 0;

    const current =
      audio.currentTime || 0;


    const percent =
      duration
        ? (current / duration) * 100
        : 0;


    progressBar.style.width =
      percent + "%";


    timeLabel.textContent =
      formatTime(current) +
      " / " +
      formatTime(duration);

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

  try{

    const allSongs =
      await loadSongs();


    const result =
      findArtist(
        allSongs
      );


    artist =
      result.profile;


    songs =
      result.songs;


    renderArtist();


    applyFollowState();


  }catch(error){

    console.error(
      "Artist page error:",
      error
    );


    document.getElementById(
      "pageContent"
    ).innerHTML = `

      <div class="error-box">

        <strong>
          PASONG could not load this artist.
        </strong>

        <br><br>

        Please refresh the page and try again.

        <br><br>

        <a
          href="artists.html"
          style="
            color:#c084fc;
            font-weight:800;
          ">

          ← Return to Artists

        </a>

      </div>

    `;

  }

}


init();

</script>
