<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#8b5cf6">

<title>PASONG Artists</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

nav{
  background:#10101a;
  border-bottom:1px solid #242434;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#b45cff;
}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#aaaabd;
  text-decoration:none;
  padding:8px 10px;
  border-radius:8px;
  font-size:14px;
}

.nav-links a:hover,
.nav-links a.active{
  color:#fff;
  background:#1d1728;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:30px 18px 60px;
}

.hero{
  text-align:center;
  padding:25px 0 35px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero h1 span{
  background:linear-gradient(90deg,#b45cff,#ff4fa3);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#9696aa;
  max-width:600px;
  margin:auto;
  line-height:1.6;
}

.status{
  text-align:center;
  color:#9999aa;
  padding:35px 10px;
}

.artist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}

.artist-card{
  background:#11111b;
  border:1px solid #252536;
  border-radius:16px;
  padding:20px;
  text-align:center;
  transition:.2s;
}

.artist-card:hover{
  transform:translateY(-3px);
  border-color:#8e4bd0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.artist-image{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:#1b1b28;
  border:2px solid #342444;
  margin:0 auto 15px;
  display:block;
}

.artist-placeholder{
  width:105px;
  height:105px;
  border-radius:50%;
  background:linear-gradient(135deg,#241632,#171722);
  border:2px solid #342444;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.artist-name{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px;
}

.artist-info{
  color:#858597;
  font-size:13px;
  margin-bottom:15px;
}

.view-btn{
  display:inline-block;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(90deg,#8d45d2,#d94b9d);
  padding:9px 17px;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
}

.empty{
  background:#11111b;
  border:1px dashed #343445;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  color:#858597;
}

footer{
  border-top:1px solid #20202d;
  color:#707082;
  text-align:center;
  padding:25px 15px;
  font-size:13px;
  margin-top:30px;
}

@media(max-width:600px){

  .hero h1{
    font-size:28px;
  }

  .nav-links{
    width:100%;
    overflow-x:auto;
    flex-wrap:nowrap;
  }

  .nav-links a{
    white-space:nowrap;
  }

}

</style>

</head>

<body>


<nav>

  <a
    class="logo"
    href="index.html">
    ◈ <span>PASONG</span>
  </a>


  <div class="nav-links">

    <a href="index.html">
      Home
    </a>

    <a href="store.html">
      Music Store
    </a>

    <a href="charts.html">
      Charts
    </a>

    <a
      class="active"
      href="artists.html">
      Artists
    </a>

    <a href="playlists.html">
      Playlists
    </a>

    <a href="promotion.html">
      Promotion
    </a>

    <a href="account.html">
      Account
    </a>

  </div>

</nav>


<main class="container">


  <section class="hero">

    <h1>
      PASONG <span>Artists</span>
    </h1>

    <p>
      Discover artists and explore their music on PASONG.
    </p>

  </section>


  <div
    id="status"
    class="status">

    Loading artists...

  </div>


  <div
    id="artists"
    class="artist-grid">
  </div>


</main>


<footer>

  PASONG © 2026 • Music • Artists • Opportunity

</footer>


<script>


const API_BASE =
"https://pasong-api.onrender.com";


function firstValue(){

  const values =
  Array.from(arguments);

  for(
    const value of values
  ){

    if(
      value !== undefined &&
      value !== null &&
      String(value).trim() !== ""
    ){

      return value;

    }

  }

  return "";

}


function getArtistObject(song){

  if(
    song.artist &&
    typeof song.artist === "object"
  ){

    return song.artist;

  }

  if(
    song.artist_profile &&
    typeof song.artist_profile === "object"
  ){

    return song.artist_profile;

  }

  if(
    song.artistProfile &&
    typeof song.artistProfile === "object"
  ){

    return song.artistProfile;

  }

  if(
    song.artist_data &&
    typeof song.artist_data === "object"
  ){

    return song.artist_data;

  }

  if(
    song.artistData &&
    typeof song.artistData === "object"
  ){

    return song.artistData;

  }

  return {};

}


function getArtistProfile(song){

  const artist =
    getArtistObject(song);

  const profile =
    song.artist_profile ||
    song.artistProfile ||
    song.artist_data ||
    song.artistData ||
    artist.profile ||
    artist.profile_data ||
    artist.profileData ||
    {};

  return (
    profile &&
    typeof profile === "object"
  )
    ? profile
    : {};

}


function getArtistId(song){

  const artist =
    getArtistObject(song);

  const profile =
    getArtistProfile(song);

  return firstValue(

    song.artist_id,

    song.artistId,

    song.artistID,

    song.artist_uuid,

    song.artistUuid,

    profile.id,

    profile.artist_id,

    profile.artistId,

    artist.id,

    artist.artist_id,

    artist.artistId

  );

}


function getArtistName(song){

  const artist =
    getArtistObject(song);

  const profile =
    getArtistProfile(song);


  return firstValue(

    song.artist_name,

    song.artistName,

    song.artist_performing_name,

    song.artistPerformingName,

    song.artist_stage_name,

    song.artistStageName,

    song.performing_name,

    song.performingName,

    song.stage_name,

    song.stageName,

    song.performer_name,

    song.performerName,

    profile.performing_name,

    profile.performingName,

    profile.stage_name,

    profile.stageName,

    profile.performer_name,

    profile.performerName,

    artist.performing_name,

    artist.performingName,

    artist.stage_name,

    artist.stageName,

    artist.performer_name,

    artist.performerName,

    artist.name,

    artist.display_name,

    artist.displayName,

    artist.username,

    artist.full_name,

    song.artist

  );

}


function getArtistImage(song){

  const artist =
    getArtistObject(song);

  const profile =
    getArtistProfile(song);


  return firstValue(

    song.artist_avatar,

    song.artistAvatar,

    song.artist_avatar_url,

    song.artistAvatarUrl,

    song.artist_image,

    song.artistImage,

    song.artist_image_url,

    song.artistImageUrl,

    song.artist_profile_image,

    song.artistProfileImage,

    song.artist_profile_image_url,

    song.artistProfileImageUrl,

    song.profile_image_url,

    song.profileImageUrl,

    song.avatar_url,

    song.avatarUrl,

    profile.profile_image_url,

    profile.profileImageUrl,

    profile.avatar_url,

    profile.avatarUrl,

    profile.image_url,

    profile.imageUrl,

    artist.profile_image_url,

    artist.profileImageUrl,

    artist.avatar_url,

    artist.avatarUrl,

    artist.image_url,

    artist.imageUrl

  );

}


function getArtistBio(song){

  const artist =
    getArtistObject(song);

  const profile =
    getArtistProfile(song);


  return firstValue(

    song.artist_bio,

    song.artistBio,

    profile.bio,

    profile.description,

    artist.bio,

    artist.description

  );

}


function getSongs(data){

  if(
    Array.isArray(data)
  ){

    return data;

  }


  if(
    Array.isArray(data.songs)
  ){

    return data.songs;

  }


  if(
    Array.isArray(data.data)
  ){

    return data.data;

  }


  if(
    data.data &&
    Array.isArray(data.data.songs)
  ){

    return data.data.songs;

  }


  if(
    data.result &&
    Array.isArray(data.result)
  ){

    return data.result;

  }


  if(
    data.result &&
    Array.isArray(data.result.songs)
  ){

    return data.result.songs;

  }


  return [];

}


async function loadArtists(){

  const status =
  document.getElementById(
    "status"
  );

  const container =
  document.getElementById(
    "artists"
  );


  status.style.display =
    "block";


  status.textContent =
    "Loading artists...";


  container.innerHTML =
    "";


  try{


    const response =
    await fetch(
      API_BASE +
      "/api/songs",
      {
        method:"GET",
        headers:{
          "Accept":
            "application/json"
        },
        cache:"no-store"
      }
    );


    if(!response.ok){

      throw new Error(
        "API request failed: " +
        response.status
      );

    }


    const data =
    await response.json();


    console.log(
      "PASONG /api/songs:",
      data
    );


    const songs =
    getSongs(data);


    if(!songs.length){

      status.style.display =
        "none";


      container.innerHTML = `

        <div
          class="empty"
          style="grid-column:1/-1;">

          <h3>
            No artists yet
          </h3>

          <p
            style="margin-top:8px;">

            Artists will appear here
            when music is uploaded to PASONG.

          </p>

        </div>

      `;


      return;

    }


    const artistMap = {};


    songs.forEach(
      function(song){

        const artistId =
          getArtistId(song);


        if(!artistId){

          return;

        }


        const artistName =
          getArtistName(song) ||
          "Unknown Artist";


        const artistCover =
          getArtistImage(song);


        const artistBio =
          getArtistBio(song);


        if(!artistMap[artistId]){

          artistMap[artistId] = {

            id:
              artistId,

            name:
              artistName,

            cover:
              artistCover,

            bio:
              artistBio,

            songs:
              0

          };

        }


        else{


          if(

            (
              artistMap[artistId].name ===
              "Unknown Artist"

            ) &&

            (
              artistName !==
              "Unknown Artist"
            )

          ){

            artistMap[artistId].name =
              artistName;

          }


          if(

            !artistMap[artistId].cover &&
            artistCover

          ){

            artistMap[artistId].cover =
              artistCover;

          }


          if(

            !artistMap[artistId].bio &&
            artistBio

          ){

            artistMap[artistId].bio =
              artistBio;

          }

        }


        artistMap[artistId].songs++;

      }
    );


    const artists =
      Object.values(
        artistMap
      );


    status.style.display =
      "none";


    if(!artists.length){

      container.innerHTML = `

        <div
          class="empty"
          style="grid-column:1/-1;">

          <h3>
            No artists found
          </h3>

          <p
            style="margin-top:8px;">

            No artist profiles could be
            identified from the uploaded music.

          </p>

        </div>

      `;


      return;

    }


    container.innerHTML =
      artists.map(
        function(artist){

          const name =
            artist.name ||
            "Unknown Artist";


          const initial =
            name
              .trim()
              .charAt(0)
              .toUpperCase() ||
            "A";


          let image;


          if(artist.cover){

            image = `

              <img
                class="artist-image"
                src="${escapeHtml(
                  artist.cover
                )}"
                alt="${escapeHtml(
                  name
                )}"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >

              <div
                class="artist-placeholder"
                style="display:none;">

                ${escapeHtml(
                  initial
                )}

              </div>

            `;

          }else{

            image = `

              <div
                class="artist-placeholder">

                ${escapeHtml(
                  initial
                )}

              </div>

            `;

          }


          const profileLink =
            "artist.html?id=" +
            encodeURIComponent(
              artist.id
            );


          return `

            <div
              class="artist-card">

              ${image}

              <div
                class="artist-name">

                ${escapeHtml(
                  name
                )}

              </div>

              <div
                class="artist-info">

                ${artist.songs}

                ${
                  artist.songs === 1
                    ? "song"
                    : "songs"
                }

              </div>

              <a
                class="view-btn"
                href="${profileLink}">

                View Artist

              </a>

            </div>

          `;

        }
      ).join("");


  }catch(error){


    console.error(
      "PASONG Artists Error:",
      error
    );


    status.style.display =
      "none";


    container.innerHTML = `

      <div
        class="empty"
        style="grid-column:1/-1;">

        <h3>
          Artists could not be loaded
        </h3>

        <p
          style="margin-top:8px;">

          PASONG could not connect to the
          music service right now.

        </p>

        <button
          onclick="loadArtists()"
          style="
            margin-top:18px;
            border:0;
            padding:10px 18px;
            border-radius:9px;
            background:linear-gradient(
              90deg,
              #8d45d2,
              #d94b9d
            );
            color:#fff;
            cursor:pointer;
            font-weight:600;
          ">

          Try Again

        </button>

      </div>

    `;

  }

}


function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


loadArtists();

</script>


</body>

</html>
