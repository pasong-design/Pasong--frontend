<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PASONG Artists</title><style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

nav{
  background:#10101a;
  border-bottom:1px solid #242434;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  flex-wrap:wrap;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#b45cff;
}

.nav-links{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#aaaabd;
  text-decoration:none;
  padding:8px 10px;
  border-radius:8px;
  font-size:14px;
}

.nav-links a:hover,
.nav-links a.active{
  color:#fff;
  background:#1d1728;
}

.container{
  max-width:1150px;
  margin:auto;
  padding:30px 18px 60px;
}

.hero{
  text-align:center;
  padding:25px 0 35px;
}

.hero h1{
  font-size:34px;
  margin-bottom:10px;
}

.hero h1 span{
  background:linear-gradient(90deg,#b45cff,#ff4fa3);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  color:#9696aa;
  max-width:600px;
  margin:auto;
  line-height:1.6;
}

.status{
  text-align:center;
  color:#9999aa;
  padding:35px 10px;
}

.artist-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}

.artist-card{
  background:#11111b;
  border:1px solid #252536;
  border-radius:16px;
  padding:20px;
  text-align:center;
  transition:.2s;
}

.artist-card:hover{
  transform:translateY(-3px);
  border-color:#8e4bd0;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.artist-image{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  background:#1b1b28;
  border:2px solid #342444;
  margin:0 auto 15px;
  display:block;
}

.artist-placeholder{
  width:105px;
  height:105px;
  border-radius:50%;
  background:linear-gradient(135deg,#241632,#171722);
  border:2px solid #342444;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.artist-name{
  font-size:19px;
  font-weight:700;
  margin-bottom:7px;
}

.artist-info{
  color:#858597;
  font-size:13px;
  margin-bottom:15px;
}

.view-btn{
  display:inline-block;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(90deg,#8d45d2,#d94b9d);
  padding:9px 17px;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
}

.empty{
  background:#11111b;
  border:1px dashed #343445;
  border-radius:15px;
  padding:35px 20px;
  text-align:center;
  color:#858597;
}

footer{
  border-top:1px solid #20202d;
  color:#707082;
  text-align:center;
  padding:25px 15px;
  font-size:13px;
  margin-top:30px;
}

@media(max-width:600px){
  .hero h1{
    font-size:28px;
  }

  .nav-links{
    width:100%;
    overflow-x:auto;
    flex-wrap:nowrap;
  }

  .nav-links a{
    white-space:nowrap;
  }
}
</style></head><body><nav>
  <a class="logo" href="index.html">◈ <span>PASONG</span></a>  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="store.html">Music Store</a>
    <a href="charts.html">Charts</a>
    <a class="active" href="artists.html">Artists</a>
    <a href="playlists.html">Playlists</a>
    <a href="promotion.html">Promotion</a>
    <a href="account.html">Account</a>
  </div>
</nav><main class="container">  <section class="hero">
    <h1>PASONG <span>Artists</span></h1>
    <p>
      Discover artists and explore their music on PASONG.
    </p>
  </section>  <div id="status" class="status">
    Loading artists...
  </div>  <div id="artists" class="artist-grid"></div></main><footer>
  PASONG © 2026 • Music • Artists • Opportunity
</footer><script>
const API_BASE = "https://pasong-api.onrender.com";

async function loadArtists(){

  const status = document.getElementById("status");
  const container = document.getElementById("artists");

  try{

    /*
      We first get songs from the PASONG API.
      Artists are then grouped from the songs returned.
    */

    const response = await fetch(API_BASE + "/api/songs");

    if(!response.ok){
      throw new Error("API request failed");
    }

    const data = await response.json();

    const songs = Array.isArray(data)
      ? data
      : (data.songs || []);

    if(!songs.length){

      status.style.display = "none";

      container.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          <h3>No artists yet</h3>
          <p style="margin-top:8px;">
            Artists will appear here when music is uploaded to PASONG.
          </p>
        </div>
      `;

      return;
    }

    /*
      Group songs by artist.
    */

    const artistMap = {};

    songs.forEach(song => {

      const artistId =
        song.artist_id ||
        song.artistId ||
        song.artist?.id ||
        song.artist?.name ||
        "unknown";

      const artistName =
        song.artist_name ||
        song.artistName ||
        song.artist?.name ||
        song.artist ||
        "Unknown Artist";

      if(!artistMap[artistId]){
        artistMap[artistId] = {
          id: artistId,
          name: artistName,
          cover:
            song.artist_avatar ||
            song.artist_image ||
            song.artist?.avatar_url ||
            song.artist?.image_url ||
            "",
          songs: 0
        };
      }

      artistMap[artistId].songs++;
    });

    const artists = Object.values(artistMap);

    status.style.display = "none";

    if(!artists.length){

      container.innerHTML = `
        <div class="empty" style="grid-column:1/-1;">
          No artists found.
        </div>
      `;

      return;
    }

    container.innerHTML = artists.map(artist => {

      const initial =
        (artist.name || "A").charAt(0).toUpperCase();

      const image = artist.cover
        ? `<img class="artist-image"
               src="${escapeHtml(artist.cover)}"
               alt="${escapeHtml(artist.name)}"
               onerror="this.outerHTML='<div class=\\'artist-placeholder\\'>${initial}</div>'">`
        : `<div class="artist-placeholder">${initial}</div>`;

      const profileLink =
        artist.id !== "unknown"
          ? `artist.html?id=${encodeURIComponent(artist.id)}`
          : "store.html";

      return `
        <div class="artist-card">

          ${image}

          <div class="artist-name">
            ${escapeHtml(artist.name)}
          </div>

          <div class="artist-info">
            ${artist.songs}
            ${artist.songs === 1 ? "song" : "songs"}
          </div>

          <a class="view-btn" href="${profileLink}">
            View Artist
          </a>

        </div>
      `;

    }).join("");

  }catch(error){

    console.error(error);

    status.style.display = "none";

    container.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">

        <h3>Artists could not be loaded</h3>

        <p style="margin-top:8px;">
          PASONG could not connect to the music service right now.
        </p>

        <button
          onclick="loadArtists()"
          style="
            margin-top:18px;
            border:0;
            padding:10px 18px;
            border-radius:9px;
            background:linear-gradient(90deg,#8d45d2,#d94b9d);
            color:#fff;
            cursor:pointer;
            font-weight:600;
          "
        >
          Try Again
        </button>

      </div>
    `;
  }
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

loadArtists();
</script></body>
</html>
