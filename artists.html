  </a>  <div class="nav-links"><a href="index.html">Home</a>

  </div></nav><main class="container">  <a class="back" href="artists.html">
    ← Back to Artists
  </a>  <div id="status" class="status">
    Loading artist...
  </div>  <section id="artistHeader"
           class="artist-header"
           style="display:none"><div id="artistImage"></div>

<div>

  <h1 id="artistName">
    Artist
  </h1>

  <p id="artistDescription">
    PASONG artist
  </p>

  <span class="verified">
    PASONG Artist
  </span>

</div>

  </section>  <section id="songsSection"
           class="section"
           style="display:none"><h2>Music</h2>

<div id="songs"></div>

  </section></main><footer>
  PASONG © 2026 • Music • Artists • Opportunity
</footer><script>

const API_BASE =
  "https://pasong-api.onrender.com";


/*
==================================================
GET ARTIST ID FROM URL
==================================================
*/

function getArtistId(){

  const params =
    new URLSearchParams(window.location.search);

  return params.get("id");

}


/*
==================================================
LOAD ARTIST
==================================================
*/

async function loadArtist(){

  const status =
    document.getElementById("status");

  const artistHeader =
    document.getElementById("artistHeader");

  const songsSection =
    document.getElementById("songsSection");

  const songsContainer =
    document.getElementById("songs");


  const artistId =
    getArtistId();


  if(!artistId){

    status.innerHTML =
      `<div class="error">
        No artist was selected.
      </div>`;

    return;

  }


  try{

    /*
      Get songs from PASONG API.
    */

    const response =
      await fetch(
        API_BASE + "/api/songs"
      );


    if(!response.ok){

      throw new Error(
        "Could not connect to PASONG API."
      );

    }


    const data =
      await response.json();


    const allSongs =
      Array.isArray(data)
        ? data
        : (data.songs || []);


    /*
      Find songs belonging to this artist.
    */

    const artistSongs =
      allSongs.filter(song => {

        const id =
          song.artist_id ||
          song.artistId ||
          song.artist?.id;

        return String(id) === String(artistId);

      });


    if(!artistSongs.length){

      status.innerHTML = `
        <div class="empty">

          <h3>Artist not found</h3>

          <p style="margin-top:8px">
            We could not find music for this artist.
          </p>

        </div>
      `;

      return;

    }


    const firstSong =
      artistSongs[0];


    /*
      Get artist name.
    */

    const artistName =
      firstSong.artist_name ||
      firstSong.artistName ||
      firstSong.artist?.name ||
      firstSong.artist ||
      "Unknown Artist";


    /*
      Get artist image.
    */

    const artistImage =
      firstSong.artist_avatar ||
      firstSong.artist_image ||
      firstSong.artist?.avatar_url ||
      firstSong.artist?.image_url ||
      "";


    document.getElementById("artistName")
      .textContent = artistName;


    document.getElementById("artistDescription")
      .textContent =
        artistSongs.length +
        (artistSongs.length === 1
          ? " song available on PASONG."
          : " songs available on PASONG.");


    /*
      Artist image.
    */

    const imageBox =
      document.getElementById("artistImage");


    if(artistImage){

      imageBox.innerHTML = `
        <img
          class="artist-photo"
          src="${escapeHtml(artistImage)}"
          alt="${escapeHtml(artistName)}"
          onerror="this.outerHTML='<div class=\\'artist-placeholder\\'>${escapeHtml((artistName || 'A').charAt(0).toUpperCase())}</div>'"
        >
      `;

    }else{

      imageBox.innerHTML = `
        <div class="artist-placeholder">
          ${escapeHtml(
            (artistName || "A")
              .charAt(0)
              .toUpperCase()
          )}
        </div>
      `;

    }


    /*
      Display artist header.
    */

    artistHeader.style.display =
      "flex";


    /*
      Display songs.
    */

    songsContainer.innerHTML =
      artistSongs.map(song => {

        const title =
          song.title ||
          "Untitled Song";


        const cover =
          song.cover_url ||
          song.coverUrl ||
          "";


        const price =
          Number(song.price || 500);


        const coverHtml =
          cover
            ? `
              <img
                class="song-cover"
                src="${escapeHtml(cover)}"
                alt=""
                onerror="this.style.display='none'"
              >
            `
            : `
              <div class="song-cover"></div>
            `;


        return `

          <div class="song">

            ${coverHtml}

            <div class="song-info">

              <div class="song-title">
                ${escapeHtml(title)}
              </div>

              <div class="song-meta">
                ${escapeHtml(artistName)}
              </div>

            </div>


            <div>

              <span class="price">
                UGX ${price.toLocaleString()}
              </span>

              <a
                class="buy-btn"
                href="song.html?id=${encodeURIComponent(song.id)}"
              >
                View Song
              </a>

            </div>

          </div>

        `;

      }).join("");


    songsSection.style.display =
      "block";


    status.style.display =
      "none";


    /*
      Update browser title.
    */

    document.title =
      "PASONG — " + artistName;


  }catch(error){

    console.error(error);

    status.innerHTML = `

      <div class="error">

        <h3>Could not load artist</h3>

        <p style="margin-top:8px">
          ${escapeHtml(error.message)}
        </p>

      </div>

    `;

  }

}


/*
==================================================
ESCAPE HTML
==================================================
*/

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
==================================================
START
==================================================
*/

loadArtist();

</script></body>
