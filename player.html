<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}header{padding:14px 5%;display:flex;justify-content:space-between;align-items:center;background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}.hbtn{width:42px;height:42px;border-radius:50%;background:#222;display:grid;place-items:center;cursor:pointer;color:#fff;border:0;font-size:22px}.main{padding:12px 5%}.cover{width:100%;max-width:360px;aspect-ratio:1/1;border-radius:16px;object-fit:cover;display:block;margin:0 auto;background:#222}.info{margin-top:14px}.title{font-size:22px;font-weight:900}.artist{font-size:14px;color:#aaa;margin-top:4px}.bar{height:5px;background:#333;border-radius:10px;margin-top:18px;overflow:hidden;cursor:pointer}.fill{height:100%;background:#1DB954;width:0%}.time{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:6px}.controls{display:flex;justify-content:center;gap:20px;margin-top:18px;align-items:center}.c{width:52px;height:52px;border-radius:50%;background:#222;color:#fff;border:0;display:grid;place-items:center;cursor:pointer;font-size:20px}.c.play{width:68px;height:68px;background:#fff;color:#000;font-size:28px}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;height:42px;border-radius:50px;background:#1e1e1e;border:1px solid #333;color:#fff;display:grid;place-items:center;cursor:pointer;font-weight:700}.btn.buy{background:#1DB954;color:#000;border-color:#1DB954}.btn.active{background:#ff1744;color:#fff}.artist-box{margin:20px 5%;background:#171717;border:1px solid #2a2a2a;border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}.artist-box img{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #1DB954;background:#222}.artist-box .name{font-size:18px;font-weight:900}.artist-box .sub{font-size:12px;color:#aaa;margin-top:4px}.follow{margin-top:8px;background:#1DB954;color:#000;padding:6px 16px;border-radius:50px;font-size:11px;font-weight:900;display:inline-block;text-decoration:none}.section{margin-top:26px}.head{padding:0 5%;margin-bottom:12px}.head h2{font-size:18px;font-weight:800}.list{padding:0 5%;display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;gap:10px;background:#171717;border:1px solid #2a2a2a;border-radius:12px;padding:10px 12px;cursor:pointer}.row .num{color:#1DB954;font-weight:900;width:18px}.row img{width:48px;height:48px;border-radius:6px;background:#222;object-fit:cover}.row .rt{font-size:14px;font-weight:700}.row .ra{font-size:11px;color:#1DB954;margin-top:2px}.grid{display:flex;gap:12px;overflow-x:auto;padding:0 5% 10px}.card{flex:0 0 160px;background:#171717;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222;display:block}.card-info{padding:8px 10px}.card .t{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{font-size:11px;color:#888;margin-top:3px}.empty{color:#888;font-size:13px;padding:8px 5%}.footer{margin-top:40px;padding:20px 5% 30px;border-top:1px solid #222;background:#000}.footer-title{font-size:14px;font-weight:700;margin-top:24px;margin-bottom:8px;color:#fff}.footer a{display:block;color:#aaa;font-size:14px;text-decoration:none;padding:5px 0}.status{padding:12px 5%;font-size:12px;color:#aaa}
</style></head><body>
<header><button class="hbtn" onclick="location.href='store.html'" aria-label="Back">‹</button><div style="font-size:12px;color:#888;font-weight:800">PASONG</div><button class="hbtn" id="shareBtn" aria-label="Share">↗</button></header>
<div class="main"><img id="cover" class="cover" alt="Song cover" src="https://placehold.co/400x400/222/fff?text=PASONG"><div class="info"><div id="title" class="title">Loading song…</div><div id="artistName" class="artist">Loading artist…</div></div><div class="bar" id="seekBar" aria-label="Seek audio"><div id="fill" class="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button class="c" onclick="prev()" aria-label="Previous">⏮</button><button id="playBtn" class="c play" onclick="toggle()" aria-label="Play">▶</button><button class="c" onclick="next()" aria-label="Next">⏭</button></div><div class="actions"><button id="heart" class="btn" onclick="fav()">♡ Favorite</button><button class="btn buy" onclick="buy()">＋ Buy</button></div><audio id="audio" preload="metadata"></audio></div>
<div class="artist-box"><img id="artistImg" alt="Artist profile" src="https://placehold.co/200x200/222/fff?text=Artist"><div style="min-width:0"><div id="artistBoxName" class="name">Artist</div><div id="artistBoxMeta" class="sub">Artist profile details</div><a id="artistLink" class="follow" href="artists.html">VIEW ARTIST</a></div></div>
<div class="section"><div class="head"><h2 id="popTitle">Popular songs</h2></div><div class="list" id="popularList"><div class="empty">Loading approved songs…</div></div></div>
<div class="section"><div class="head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>
<div class="section"><div class="head"><h2>Albums &amp; EPs</h2></div><div class="grid" id="albumGrid"></div></div>
<div class="section"><div class="head"><h2 id="fansTitle">More artists</h2></div><div class="grid" id="fansGrid"></div></div>
<div id="pageStatus" class="status" role="status"></div>
<div class="footer"><div class="footer-title">Company</div><a href="about.html">About</a><a href="about.html">For the Record</a><div class="footer-title">Communities</div><a href="artists.html">For Artists</a><a href="store.html">For Creators</a><div class="footer-title">Useful links</div><a href="store.html">Music Store</a><a href="album-store.html">Album Store</a><div style="margin-top:30px;color:#666;font-size:12px">© 2026 PASONG</div></div>
<script>
'use strict';
const SUPABASE_URL='https://mtufczmjlkvycarxylgh.supabase.co';
const SUPABASE_KEY='sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP';
const API_BASE='https://pasong-api.vercel.app';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const audio=document.getElementById('audio');let songs=[],albums=[],idx=0,currentSong=null;
const FALLBACK_COVER='https://placehold.co/400x400/222/fff?text=PASONG';
function qs(k){return new URLSearchParams(location.search).get(k)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function coverOf(s){return s?.cover_url||s?.cover_image_url||s?.artwork_url||s?.image_url||s?.image||FALLBACK_COVER}
function audioOf(s){return s?.preview_url||s?.audio_url||s?.file_url||s?.stream_url||''}
function artistProfile(s){return s?.artist||s?.artist_profile||s?.artist_profiles||null}
function artistOf(s){const p=artistProfile(s);return p?.performing_name||p?.stage_name||p?.artist_name||s?.performing_name||s?.stage_name||s?.artist_name||'Artist name unavailable'}
function yearOf(s){const d=s?.created_at||s?.release_date;return d?new Date(d).getFullYear():'—'}
function playCount(s){const n=Number(s?.play_count??s?.plays_count??s?.total_plays??0);return Number.isFinite(n)&&n>=0?n.toLocaleString(): '0'}
function formatTime(sec){if(!Number.isFinite(sec)||sec<0)return '0:00';return Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0')}
function setStatus(msg){document.getElementById('pageStatus').textContent=msg||''}
async function fetchJson(url){const r=await fetch(url,{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('API request failed ('+r.status+')');return r.json()}
async function loadSongs(){
  // Use the existing API: it filters to approved songs and attaches real artist profile/play-count data.
  const data=await fetchJson(API_BASE+'/api/songs');
  const raw=Array.isArray(data)?data:(data.songs||data.data||[]);
  return raw.filter(s=>s&&s.id&&audioOf(s)).map(s=>({...s,_kind:'song'}));
}
async function loadCurrentSongDetails(id){if(!id)return null;try{const d=await fetchJson(API_BASE+'/api/songs/'+encodeURIComponent(id));return d.song||d.data||d}catch(e){return null}}
async function loadAlbums(){
  // Album/EP cards come only from the albums table; never reuse song cards here.
  const {data,error}=await db.from('albums').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){console.warn('Album list could not be loaded:',error.message);return []}
  const unique=new Map();(data||[]).forEach(a=>{if(a?.id&&!unique.has(String(a.id)))unique.set(String(a.id),a)});
  return [...unique.values()].filter(a=>a.status==null||['approved','published','active','live'].includes(String(a.status).toLowerCase()));
}
function renderSongLists(){
 const popular=document.getElementById('popularList'),release=document.getElementById('releaseGrid');
 if(!songs.length){popular.innerHTML='<div class="empty">No approved songs are available right now.</div>';release.innerHTML='<div class="empty">No releases available.</div>';return}
 popular.innerHTML=songs.slice(0,6).map((s,i)=>`<div class="row" data-song-id="${esc(s.id)}"><div class="num">${i+1}</div><img src="${esc(coverOf(s))}" alt="" onerror="this.src='${FALLBACK_COVER}'"><div style="flex:1;overflow:hidden"><div class="rt">${esc(s.title||'Untitled')}</div><div class="ra">${esc(artistOf(s))} · ${playCount(s)} plays</div></div><span aria-hidden="true">▶</span></div>`).join('');
 release.innerHTML=songs.slice(0,8).map(s=>`<div class="card" data-song-id="${esc(s.id)}"><img src="${esc(coverOf(s))}" alt="${esc(s.title||'Song cover')}" onerror="this.src='${FALLBACK_COVER}'"><div class="card-info"><div class="t">${esc(s.title||'Untitled')}</div><div class="a">${esc(artistOf(s))} · ${playCount(s)} plays</div></div></div>`).join('');
 document.getElementById('fansGrid').innerHTML=[...new Map(songs.map(s=>{const p=artistProfile(s)||{};const key=String(p.id||p.user_id||artistOf(s));return [key,{p,name:artistOf(s),cover:p.profile_image_url||p.avatar_url||coverOf(s),id:p.id}]}).values()].slice(0,8).map(a=>`<a class="card" href="${a.id?'artist.html?id='+encodeURIComponent(a.id):'artists.html'}" style="text-decoration:none;color:#fff;padding-bottom:10px"><img src="${esc(a.cover)}" alt="" style="border-radius:50%;width:86px;height:86px;margin:12px auto 0;" onerror="this.src='${FALLBACK_COVER}'"><div class="card-info"><div class="t">${esc(a.name)}</div><div class="a">Artist</div></div></a>`).join('');
 document.querySelectorAll('[data-song-id]').forEach(el=>el.addEventListener('click',()=>playSongById(el.dataset.songId)));
}
function renderAlbums(){const box=document.getElementById('albumGrid');if(!albums.length){box.innerHTML='<div class="empty">No albums or EPs are available yet.</div>';return}box.innerHTML=albums.map(a=>`<a class="card" href="album-store.html?id=${encodeURIComponent(a.id)}" style="text-decoration:none;color:#fff"><img src="${esc(coverOf(a))}" alt="${esc(a.title||'Album cover')}" onerror="this.src='${FALLBACK_COVER}'"><div class="card-info"><div class="t">${esc(a.title||a.name||'Untitled album')}</div><div class="a">${esc(a.artist_name||a.performing_name||a.stage_name||'Album / EP')} · ${esc(String(a.type||a.release_type||'Album').toUpperCase())}</div></div></a>`).join('')}
function loadSongUI(s){currentSong=s;document.getElementById('cover').src=coverOf(s);document.getElementById('title').textContent=s.title||'Untitled';const name=artistOf(s);document.getElementById('artistName').textContent=name;document.getElementById('artistBoxName').textContent=name;const p=artistProfile(s)||{};document.getElementById('artistImg').src=p.profile_image_url||p.avatar_url||coverOf(s);document.getElementById('artistBoxMeta').textContent=[p.location,p.bio].filter(Boolean).join(' · ')||('Recorded plays: '+playCount(s));document.getElementById('artistLink').href=p.id?'artist.html?id='+encodeURIComponent(p.id):'artists.html';document.getElementById('popTitle').textContent='Popular by '+name;document.getElementById('fansTitle').textContent='More artists';audio.src=audioOf(s);audio.load();updateHeart();document.getElementById('fill').style.width='0%';document.getElementById('cur').textContent='0:00';document.getElementById('dur').textContent='0:00';document.getElementById('playBtn').textContent='▶'}
async function playSongById(id){let found=songs.findIndex(s=>String(s.id)===String(id));if(found<0){const detail=await loadCurrentSongDetails(id);if(detail&&detail.id){songs.unshift({...detail,_kind:'song'});found=0;renderSongLists()}else return}idx=found;loadSongUI(songs[idx]);toggle()}
async function init(){document.getElementById('shareBtn').addEventListener('click',async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);setStatus('Player link copied.')}}catch(e){}});
 document.getElementById('seekBar').addEventListener('click',e=>{if(!Number.isFinite(audio.duration)||audio.duration<=0)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration});
 const [songResult,albumResult]=await Promise.allSettled([loadSongs(),loadAlbums()]);if(songResult.status==='fulfilled')songs=songResult.value;else{console.error(songResult.reason);setStatus('Could not load songs from PASONG API. Please try again later.')}if(albumResult.status==='fulfilled')albums=albumResult.value;renderSongLists();renderAlbums();
 const requestedId=qs('id');if(requestedId){let n=songs.findIndex(s=>String(s.id)===String(requestedId));if(n>=0){idx=n;loadSongUI(songs[idx])}else{const detail=await loadCurrentSongDetails(requestedId);if(detail&&detail.id){songs.unshift({...detail,_kind:'song'});idx=0;loadSongUI(songs[0]);renderSongLists()}else if(songs.length){idx=0;loadSongUI(songs[0])}}}else if(songs.length){idx=0;loadSongUI(songs[0])}else{document.getElementById('title').textContent='No approved songs found';document.getElementById('artistName').textContent='Check back soon';document.getElementById('artistBoxMeta').textContent='Artist information unavailable'}
}
async function toggle(){if(!audio.src){setStatus('This song has no playable audio file.');return}try{if(audio.paused){await audio.play();document.getElementById('playBtn').textContent='⏸';setStatus('')}else{audio.pause();document.getElementById('playBtn').textContent='▶'}}catch(e){setStatus('Playback could not start. Tap play again or try another song.');document.getElementById('playBtn').textContent='▶'}}
function next(){if(!songs.length)return;idx=(idx+1)%songs.length;loadSongUI(songs[idx]);toggle()}function prev(){if(!songs.length)return;if(audio.currentTime>3){audio.currentTime=0;return}idx=(idx-1+songs.length)%songs.length;loadSongUI(songs[idx]);toggle()}
audio.addEventListener('timeupdate',()=>{const p=audio.duration?audio.currentTime/audio.duration*100:0;document.getElementById('fill').style.width=p+'%';document.getElementById('cur').textContent=formatTime(audio.currentTime)});audio.addEventListener('loadedmetadata',()=>document.getElementById('dur').textContent=formatTime(audio.duration));audio.addEventListener('play',()=>document.getElementById('playBtn').textContent='⏸');audio.addEventListener('pause',()=>document.getElementById('playBtn').textContent='▶');audio.addEventListener('ended',next);audio.addEventListener('error',()=>{if(currentSong)setStatus('Audio file could not be played for this song.')});
function updateHeart(){const id=String(currentSong?.id||'');let w=[];try{w=JSON.parse(localStorage.getItem('wishlist')||'[]')}catch(e){}const yes=w.includes(id);const h=document.getElementById('heart');h.classList.toggle('active',yes);h.textContent=yes?'♥ Favorited':'♡ Favorite'}
function fav(){if(!currentSong)return;let w=[];try{w=JSON.parse(localStorage.getItem('wishlist')||'[]')}catch(e){}const id=String(currentSong.id);w=w.includes(id)?w.filter(x=>x!==id):[...w,id];localStorage.setItem('wishlist',JSON.stringify(w));updateHeart()}
function buy(){if(!currentSong)return;location.href='song.html?id='+encodeURIComponent(currentSong.id)}
init();
</script></body></html>
