<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
:root{
  --bg:#07060b;
  --card:#111018;
  --purple:#8b5cf6;
  --purple2:#a855f7;
  --pink:#d946ef;
  --text:#fff;
  --muted:#a7a1b3;

}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 50% -10%,rgba(139,92,246,.20),transparent 35%),

  overflow-x:hidden
}
button,a{font:inherit}
header{

  z-index:1000;
  height:62px;

.nav{

  padding:0 22px;

  align-items:center;

.logo{

  color:#fff;

}
.logo-mark{

.nav-links{

  align-items:center;

}
.nav-links a{

.nav-links a:hover,.nav-links a.active{color:#fff}
.account-btn{

main{

.artist-hero:before{
  content:"";

  height:420px;

.hero-background:after{

.hero-content{

.artist-photo-wrap{

.artist-photo{

<script>
/* PASONG API */
const API_URL="https://pasong-api.vercel.app";

const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let artist=null;
let songs=[];

/* HTML safety */
function escapeHtml(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* Artist URL parameters */
function getParams(){
  const p=new URLSearchParams(location.search);

  return{
    id:p.get("id")||
       p.get("artist_id")||
       p.get("artistId")||
       p.get("user_id")||
       p.get("userId"),

    name:p.get("name")||p.get("artist")
  };
}

/* Artist information */
function getArtistName(profile){
  return profile?.performing_name||
         profile?.stage_name||
         profile?.artist_name||
         profile?.name||
         "Artist";
}

function getArtistImage(profile){
  return profile?.profile_image_url||
         profile?.profile_photo_url||
         profile?.avatar_url||
         profile?.image_url||
         "";
}

/* Number formatting */
function formatNumber(value){
  const n=Number(value||0);

  if(n>=1000000){
    return(
      (n/1000000)
      .toFixed(n>=10000000?0:1)
      .replace(".0","")
    )+"M";
  }

  if(n>=1000){
    return(
      (n/1000)
      .toFixed(n>=10000?0:1)
      .replace(".0","")
    )+"K";
  }

  return n.toLocaleString();
}

/* Fallback cover */
function fallbackImage(text){
  const safe=encodeURIComponent(text||"PASONG");

  return "data:image/svg+xml;charset=UTF-8,"+
    "<svg xmlns='http://www.w3.org/2000/svg' width='800' height='800'>"+
    "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"+
    "<stop offset='0%' stop-color='#24123d'/>"+
    "<stop offset='100%' stop-color='#0d0815'/>"+
    "</linearGradient></defs>"+
    "<rect width='100%' height='100%' fill='url(#g)'/>"+
    "<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' "+
    "fill='#c084fc' font-size='52' font-family='Arial' font-weight='900'>"+
    safe+"</text></svg>";
}

/* Song cover fields */
function getSongCover(song){
  return song?.cover_url||
         song?.coverUrl||
         song?.cover_image_url||
         song?.artwork_url||
         song?.image_url||
         "";
}

/* Load songs from the existing PASONG API */
async function loadSongs(){
  const response=await fetch(API_URL+"/api/songs",{
    method:"GET",
    headers:{Accept:"application/json"},
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("PASONG API returned HTTP "+response.status);
  }

  const data=await response.json();

  if(Array.isArray(data))return data;
  if(Array.isArray(data.songs))return data.songs;
  if(Array.isArray(data.data))return data.data;

  return [];
}

/* Get artist profile attached to a song */
function getSongArtistProfile(song){
  return song?.artist||
         song?.artist_profile||
         song?.artist_profiles||
         song?.artistProfile||
         {};
}

/* Find songs belonging to the requested artist */
function findArtist(allSongs){
  const params=getParams();

  const requestedId=String(params.id||"").trim();
  const requestedName=String(params.name||"").trim().toLowerCase();

  const matchingSongs=allSongs.filter(song=>{
    const profile=getSongArtistProfile(song);

    const ids=[
      profile?.id,
      song?.artist_id,
      profile?.user_id,
      song?.artist_user_id,
      profile?.artist_id,
      song?.artistId
    ].map(v=>String(v||""));

    if(requestedId&&ids.includes(requestedId)){
      return true;
    }

    if(requestedName){
      const names=[
        getArtistName(profile),
        song?.artist_name,
        song?.performing_name,
        song?.stage_name
      ]
      .filter(Boolean)
      .map(v=>String(v).toLowerCase());

      return names.includes(requestedName);
    }

    return false;
  });

  if(!matchingSongs.length&&!requestedId&&!requestedName&&allSongs.length){
    matchingSongs.push(allSongs[0]);
  }

  if(!matchingSongs.length){
    return{profile:null,songs:[]};
  }

  const first=matchingSongs[0];
  const profile=getSongArtistProfile(first);

  const merged={
    ...profile,

    id:profile?.id||first?.artist_id||null,

    user_id:profile?.user_id||
            first?.artist_user_id||
            null,

    artist_name:profile?.artist_name||
                first?.artist_name||
                null,

    performing_name:profile?.performing_name||
                    first?.performing_name||
                    null,

    stage_name:profile?.stage_name||
               first?.stage_name||
               null,

    profile_image_url:profile?.profile_image_url||
                       first?.profile_image_url||
                       null,

    bio:profile?.bio||
        first?.artist_bio||
        ""
  };

  return{
    profile:merged,
    songs:matchingSongs
  };
}

/* CENTRAL PLAYER CONNECTION
   Every artist song opens the existing player.html.
*/
function openSongInPlayer(song){
  if(!song)return;

  const songId=song.id||song.song_id||song.uuid;

  if(
    songId===undefined||
    songId===null||
    String(songId).trim()===""
  ){
    alert("This song is missing its song ID.");
    return;
  }

  window.location.href=
    "player.html?id="+encodeURIComponent(String(songId));
}

/* Play one selected artist song in the central player */
function playSong(index){
  const song=songs[index];
  openSongInPlayer(song);
}

/* Play All opens the central player with the first artist song */
function playAll(){
  if(songs.length){
    openSongInPlayer(songs[0]);
  }
}

    song.id||
    song.song_id||
    song.uuid||

    "player.html?id="+encodeURIComponent(String(songId));

/* Bio expand/collapse */
function setupBioButton(){

  const bio=document.getElementById("bioText");
  const button=document.getElementById("readMoreBtn");

  if(!bio||!button)return;

  requestAnimationFrame(()=>{

    if(bio.scrollHeight>bio.clientHeight+5){
      button.style.display="inline-block";
    }

  });
}

function toggleBio(){

  const bio=document.getElementById("bioText");
  const button=document.getElementById("readMoreBtn");

  if(!bio||!button)return;

  const collapsed=bio.classList.toggle("collapsed");

  button.textContent=collapsed?"Read more":"Show less";
}

/* Follow system */
function getArtistFollowKey(){
  return "pasong_follow_"+
    (artist?.id||artist?.user_id||getArtistName(artist));
}

function getFollowerKey(){
  return "pasong_artist_followers_"+
    (artist?.id||artist?.user_id||getArtistName(artist));
}

function toggleFollow(){

  if(!artist)return;

  const key=getArtistFollowKey();

  const newState=
    localStorage.getItem(key)!=="true";

  localStorage.setItem(key,String(newState));

  const button=document.getElementById("followButton");

  if(button){

    button.classList.toggle("following",newState);

    button.innerHTML=
      newState?"✓ Following":"＋ Follow";
  }

  let followers=
    Number(localStorage.getItem(getFollowerKey())||0);

  followers=
    newState
    ?followers+1
    :Math.max(0,followers-1);

  localStorage.setItem(
    getFollowerKey(),
    String(followers)
  );

  updateFanCount(followers);
}

function updateFanCount(value){

  const el=document.getElementById("fanCount");

  if(el){
    el.textContent=formatNumber(value);
  }
}

function applyFollowState(){

  const button=document.getElementById("followButton");

  const following=
    localStorage.getItem(getArtistFollowKey())==="true";

  const followers=
    Number(localStorage.getItem(getFollowerKey())||0);

  updateFanCount(followers);

  if(button&&following){

    button.classList.add("following");

    button.innerHTML="✓ Following";
  }
}

/* Share artist */
async function shareArtist(){

  const name=getArtistName(artist);
  const url=location.href;

  if(navigator.share){

    try{

      await navigator.share({
        title:name+" — PASONG",
        text:"Listen to "+name+" on PASONG.",
        url
      });

      return;

    }catch(e){}
  }

  try{

    await navigator.clipboard.writeText(url);

    alert("Artist link copied.");

  }catch(e){

    prompt("Copy this artist link:",url);
  }
}

/* Tip Artist — existing page connection preserved */
function tipArtist(){

  if(!artist){
    alert("Artist information is not available.");
    return;
  }

  const artistId=artist.id||artist.user_id;

  if(!artistId){

    alert(
      "Artist profile ID is missing. Please open this artist from the Artists page."
    );

    return;
  }

  const url=new URL(
    "tip-artist.html",
    window.location.href
  );

  url.searchParams.set("id",String(artistId));

  url.searchParams.set(
    "name",
    getArtistName(artist)
  );

  window.location.href=url.toString();
}

/* Load artist songs from the current PASONG API */
async function init(){

  const container=document.getElementById("pageContent");

  try{

    const allSongs=await loadSongs();

    const result=findArtist(allSongs);

    artist=result.profile;
    songs=result.songs;

    renderArtist();

  }catch(error){

    console.error("Artist page error:",error);

    container.innerHTML=`
      <div class="error-box">

        <strong>PASONG could not load this artist.</strong>

        <br><br>

        Please refresh the page and try again.

        <br><br>

        <a
          href="artists.html"
          style="color:#c084fc;font-weight:800"
        >← Return to Artists</a>

      </div>`;
  }
}

init();
</script>
