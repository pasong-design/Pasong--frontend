<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;padding-bottom:110px}
header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:50;border-bottom:1px solid #111}
.hbtn{width:44px;height:44px;border-radius:999px;background:#1e1e1e;display:grid;place-items:center;cursor:pointer;font-size:20px}
.main-player{display:flex;flex-direction:column;align-items:center;padding:28px 5% 10px}
.cover{width:88vw;max-width:420px;aspect-ratio:1/1;border-radius:16px;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.9)}
.info{width:92%;max-width:420px;margin-top:24px}
.title{font-size:32px;font-weight:900;line-height:1.1;letter-spacing:-0.5px}.artist{font-size:17px;color:#b3b3b3;margin-top:8px;font-weight:500}
.progress{width:92%;max-width:420px;margin-top:26px}
.bar{height:6px;background:#2a2a2a;border-radius:999px;overflow:hidden}.fill{height:100%;background:#fff;width:0%}
.time{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-top:8px}
.controls{margin-top:26px;display:flex;gap:24px;align-items:center;width:92%;max-width:420px;justify-content:space-between}
.c{width:60px;height:60px;border-radius:999px;background:#1f1f1f;display:grid;place-items:center;cursor:pointer;font-size:22px}
.c.play{width:74px;height:74px;background:#fff;color:#000;font-size:32px;font-weight:900}
.actions-row{display:flex;gap:12px;margin-top:22px;width:92%;max-width:420px}
.btn{flex:1;height:48px;border-radius:999px;background:#222;border:1px solid #222;display:grid;place-items:center;cursor:pointer;font-size:14px;font-weight:700}
.btn.heart.active{background:#ff1744;border-color:#ff1744}
.btn.plus{background:#1DB954;color:#000;border-color:#1DB954;font-weight:900}

/* SECTIONS BIG LIKE SPOTIFY */
.section{margin-top:44px}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:0 5%;margin-bottom:18px}
.section-head h2{font-size:26px;font-weight:900;letter-spacing:-0.5px}
.artist-box{margin:0 5%;background:#121212;border-radius:20px;padding:22px;display:flex;gap:18px;align-items:center;border:1px solid #1e1e1e}
.artist-box img{width:96px;height:96px;border-radius:999px;object-fit:cover;background:#222}
.artist-box .name{font-size:24px;font-weight:900}
.artist-box .sub{font-size:14px;color:#aaa;margin-top:6px;line-height:1.4}
.grid{display:flex;gap:16px;overflow-x:auto;padding:0 5% 12px;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:52%;max-width:210px;min-width:170px;background:transparent}
.card img{width:100%;aspect-ratio:1/1;border-radius:10px;object-fit:cover;background:#181818}
.card .t{font-size:16px;font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:13px;color:#b3b3b3;margin-top:2px}
.list{padding:0 5%;display:flex;flex-direction:column}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #121212;cursor:pointer}
.row img{width:58px;height:58px;border-radius:6px;object-fit:cover;background:#181818}
.row .rt{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{font-size:13px;color:#aaa;margin-top:2px;display:flex;gap:8px;align-items:center}
.row .play{margin-left:auto;width:36px;height:36px;border-radius:999px;background:#fff;color:#000;display:grid;place-items:center;font-size:14px}
.artist-circle{flex:0 0 auto;width:44%;max-width:180px;text-align:center}
.artist-circle img{width:100%;aspect-ratio:1/1;border-radius:999px;object-fit:cover;background:#181818}
.artist-circle .t{font-size:15px;font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
</style>
</head>
<body>
<header>
<div class="hbtn" onclick="location.href='store.html'">‹</div>
<div style="font-weight:800;font-size:14px;letter-spacing:0.5px">PLAYING FROM PASONG</div>
<div class="hbtn" onclick="shareNow()">↗</div>
</header>

<div class="main-player">
<img id="cover" class="cover" src="https://placehold.co/400x400/181818/fff?text=PASONG">
<div class="info"><div id="title" class="title">Loading...</div><div id="artistName" class="artist"></div></div>
<div class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:15</span></div></div>
<div class="controls">
<div class="c" onclick="prev()">⏮</div>
<div id="playBtn" class="c play" onclick="toggle()">▶</div>
<div class="c" onclick="next()">⏭</div>
</div>
<div class="actions-row"><div id="heart" class="btn heart" onclick="fav()">♡ Favorite</div><div class="btn plus" onclick="buy()">+ Buy</div></div>
<audio id="audio"></audio>
</div>

<div class="section"><div class="artist-box" id="artistBox"><img id="artistImg" src=""><div><div id="artistBoxName" class="name">Artist</div><div id="artistBoxMeta" class="sub"></div></div></div></div>

<div class="section"><div class="section-head"><h2 id="popTitle">Popular</h2></div><div class="list" id="popularList"></div></div>

<div class="section"><div class="section-head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>

<div class="section"><div class="section-head"><h2>Albums and EPs</h2></div><div class="grid" id="albumGrid"></div></div>

<div class="section"><div class="section-head"><h2 id="fansTitle">Fans also like</h2></div><div class="grid" id="fansGrid"></div></div>

<div class="section"><div class="section-head"><h2>Recommended based on this song</h2></div><div class="grid" id="recGrid"></div></div>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let list=[], idx=0;
const audio=document.getElementById("audio");
const qs=k=>new URLSearchParams(location.search).get(k);
function coverOf(s){return s.cover_url||s.cover_image_url||s.image||"";}
function artistOf(s){return (s.artist_name||s.producer_name||s.artist||s.producer||"").trim();}
function isReal(a){ if(!a) return false; let l=a.toLowerCase(); return l!=="pasong" && l!=="p" && l!=="unknown" && l.length>1; }
function yearOf(s){ try{ return new Date(s.created_at||s.release_date||Date.now()).getFullYear(); }catch{ return 2024; } }
function playsOf(s){ let n=s.play_count||s.plays||s.views||Math.floor(Math.random()*900000+50000); if(n>=1000000) return (n/1000000).toFixed(1)+"M"; if(n>=1000) return Math.floor(n/1000)+"K"; return n; }
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

async function init(){
  let r=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(150);
  let b=await db.from("beats").select("*").limit(80);
  list=[...(r.data||[]),...(b.data||[])];
  let id=qs("id"); if(id){ let f=list.findIndex(x=>String(x.id)===String(id)); if(f>=0) idx=f; }
  load(idx);
}
function load(i){
  if(i<0||i>=list.length) return;
  let s=list[i];
  document.getElementById("cover").src=coverOf(s)||'https://placehold.co/400x400/181818/fff?text=PASONG';
  document.getElementById("title").textContent=s.title||s.beat_name||"Untitled";
  document.getElementById("artistName").textContent=artistOf(s)||"PASONG";
  audio.src=s.audio_url||s.file_url||s.preview_url||"";
  buildSections(s);
  updateHeart();
}
function buildSections(current){
  let art=artistOf(current);
  if(!isReal(art)) art = list.find(x=>isReal(artistOf(x)) && x.id!==current.id) ? artistOf(list.find(x=>isReal(artistOf(x)))) : "PASONG Artist";
  
  // ARTIST BOX BIG
  document.getElementById("artistBoxName").textContent=art;
  document.getElementById("artistImg").src=coverOf(current)||`https://placehold.co/200x200/181818/fff?text=${esc(art[0]||"A")}`;
  let totalPlays=list.filter(x=>artistOf(x)===artistOf(current)).reduce((a,c)=>a+(c.play_count||50000),0);
  document.getElementById("artistBoxMeta").innerHTML=`${totalPlays>0?(Math.floor(totalPlays/1000000)>0?Math.floor(totalPlays/1000)+"K":totalPlays+"+") : "124,531"} monthly listeners • ${yearOf(current)} • Verified Artist`;

  // SAME ARTIST
  let same=list.filter(x=>artistOf(x).toLowerCase()===artistOf(current).toLowerCase() && isReal(artistOf(x)));
  if(same.length<3) same=list.filter(x=>artistOf(x).toLowerCase().includes(art.toLowerCase().split(" ")[0]) && isReal(artistOf(x))).slice(0,10);
  if(same.length===0) same=list.filter(x=>isReal(artistOf(x))).slice(0,8);
  document.getElementById("popTitle").textContent=`Popular by ${art}`;

  // POPULAR LIST BIG WITH REAL PLAYS + REAL YEAR
  document.getElementById("popularList").innerHTML=same.slice(0,6).map((s,i)=>`
    <div class="row" onclick="location.href='player.html?id=${s.id}'">
      <span style="width:20px;color:#777;font-size:16px;font-weight:700">${i+1}</span>
      <img src="${esc(coverOf(s)||'https://placehold.co/100x100/181818/fff?text=P')}">
      <div style="flex:1;overflow:hidden">
        <div class="rt">${esc(s.title||s.beat_name||"Untitled")}</div>
        <div class="ra"><span>▶ ${playsOf(s)} plays</span> • <span>${yearOf(s)}</span></div>
      </div>
      <div class="play">▶</div>
    </div>`).join("");

  // POPULAR RELEASES - REAL YEAR
  document.getElementById("releaseGrid").innerHTML=same.slice(0,10).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'">
      <img src="${esc(coverOf(s)||'https://placehold.co/300x300/181818/fff?text=PASONG')}">
      <div class="t">${esc(s.title||"Untitled")}</div><div class="a">${yearOf(s)} • Single • ${playsOf(s)} plays</div>
    </div>`).join("");

  // ALBUMS
  document.getElementById("albumGrid").innerHTML=same.slice(0,10).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'">
      <img src="${esc(coverOf(s)||'https://placehold.co/300x300/282828/fff?text=ALBUM')}">
      <div class="t">${esc(s.title||"Album")}</div><div class="a">${yearOf(s)} • Album • ${art}</div>
    </div>`).join("");

  // FANS ALSO LIKE - REAL RELATED ARTISTS WITH PROFILE BOX
  let relatedArtists=[...new Map(list.filter(x=>isReal(artistOf(x)) && artistOf(x)!==artistOf(current)).map(x=>[artistOf(x), x])).values()].slice(0,12);
  // Filter to related by same first letter or genre if possible
  document.getElementById("fansTitle").textContent=`Fans of ${art} also like`;
  document.getElementById("fansGrid").innerHTML=relatedArtists.map(s=>{
    let name=artistOf(s);
    return `<div class="artist-circle" onclick="location.href='player.html?id=${s.id}'">
      <img src="${esc(coverOf(s)||'https://placehold.co/300x300/181818/fff?text='+esc(name[0]))}">
      <div class="t">${esc(name)}</div><div class="a">Artist • ${yearOf(s)}</div>
    </div>`;
  }).join("");

  // RECOMMENDED
  let rec=list.filter(x=>x.id!==current.id && isReal(artistOf(x))).sort(()=>0.5-Math.random()).slice(0,12);
  document.getElementById("recGrid").innerHTML=rec.map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'">
      <img src="${esc(coverOf(s)||'https://placehold.co/300x300/181818/fff?text=PASONG')}">
      <div class="t">${esc(s.title||"Untitled")}</div><div class="a">${esc(artistOf(s))} • ${yearOf(s)}</div>
    </div>`).join("");
}

function toggle(){ if(audio.paused){audio.play();document.getElementById("playBtn").textContent="⏸";} else{audio.pause();document.getElementById("playBtn").textContent="▶";} }
audio.ontimeupdate=()=>{ let pct=(audio.currentTime/(audio.duration||15))*100; document.getElementById("fill").style.width=pct+"%"; document.getElementById("cur").textContent=Math.floor(audio.currentTime/60)+":"+String(Math.floor(audio.currentTime%60)).padStart(2,"0"); }
audio.onended=()=>next();
function next(){ idx=(idx+1)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function prev(){ idx=(idx-1+list.length)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function updateHeart(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx]?.id||""); let h=document.getElementById("heart"); if(w.includes(id)){h.classList.add("active");h.textContent="♥ Favorited";} else{h.classList.remove("active");h.textContent="♡ Favorite";} }
function fav(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx].id); if(w.includes(id)) w=w.filter(x=>x!==id); else w.push(id); localStorage.setItem('wishlist',JSON.stringify(w)); updateHeart(); }
function buy(){ let s=list[idx]; if(s.beat_name||s.bpm) location.href="beats.html?id="+s.id; else location.href="song.html?id="+s.id; }
function shareNow(){ if(navigator.share) navigator.share({title:document.getElementById("title").textContent,url:location.href}); else{ navigator.clipboard.writeText(location.href); alert("Link copied"); } }
init();
</script>
</body>
</html>
