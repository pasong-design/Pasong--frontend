<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0F0F14;color:#fff;font-family:sans-serif}
header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:#0F0F14;border-bottom:1px solid #23233A;position:sticky;top:0;z-index:10}
.hbtn{width:44px;height:44px;border-radius:12px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;font-size:22px;color:#fff}
.main{padding:14px 5%}.cover{width:100%;max-width:380px;aspect-ratio:1/1;border-radius:20px;object-fit:cover;display:block;margin:0 auto;background:#1A1A28;border:1px solid #2A2A42}
.title{font-size:28px;font-weight:900;margin-top:18px}.artist{font-size:17px;color:#A78BFA;margin-top:8px;font-weight:700}.meta{font-size:15px;color:#9CA3AF;margin-top:8px}
.bar{height:6px;background:#1A1A28;border-radius:10px;margin-top:20px;overflow:hidden;border:1px solid #2A2A42}.fill{height:100%;background:linear-gradient(90deg,#7C4DFF,#8B5CF6);width:0%}
.time{display:flex;justify-content:space-between;font-size:14px;color:#9CA3AF;margin-top:8px;font-weight:600}
.controls{display:flex;justify-content:center;gap:28px;margin-top:22px;align-items:center}.c{width:56px;height:56px;border-radius:16px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:20px}.c.play{width:74px;height:74px;background:#7C4DFF;color:#fff;font-size:32px;border:none}
.actions{display:flex;gap:12px;margin-top:20px}.btn{flex:1;height:52px;border-radius:14px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;font-weight:800;color:#fff;font-size:15px}.btn.buy{background:#7C4DFF;border:none}.btn.active{background:#FF2D55}
.share-row{display:flex;gap:10px;margin-top:14px}.share-btn{flex:1;height:44px;border-radius:12px;background:#1A1A28;border:1px solid #2A2A42;color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;cursor:pointer}
.artist-box{margin:24px 5%;background:#1A1A28;border:1px solid #2A2A42;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.artist-box img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #7C4DFF;background:#23233A}
.card-box{margin:16px 5%;background:#1A1A28;border:1px solid #2A2A42;border-radius:20px;padding:18px}.card-box h3{font-size:16px;font-weight:900;margin-bottom:12px}.credit{font-size:14px;color:#9CA3AF;padding:8px 0;display:flex;justify-content:space-between;border-bottom:1px solid #23233A}.credit b{color:#fff}
.lyrics{white-space:pre-wrap;font-size:15px;line-height:1.7;color:#D1D5DB}
.section{margin-top:30px}.head{padding:0 5%;margin-bottom:14px}.head h2{font-size:19px;font-weight:800}
.list{padding:0 5%;display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px;background:#1A1A28;border:1px solid #2A2A42;border-radius:16px;padding:14px;cursor:pointer}.row .num{color:#7C4DFF;font-weight:900;width:22px}.row img{width:56px;height:56px;border-radius:10px;object-fit:cover}.row .rt{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .ra{font-size:13px;color:#9CA3AF;margin-top:3px}
.grid{display:flex;gap:14px;overflow-x:auto;padding:0 5% 12px;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}.card{flex:0 0 180px;background:#1A1A28;border:1px solid #2A2A42;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.card-info{padding:10px 12px}.card .t{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{font-size:13px;color:#9CA3AF;margin-top:2px}
.comment-input{width:100%;height:48px;background:#0F0F14;border:1px solid #2A2A42;border-radius:12px;padding:0 14px;color:#fff;font-size:14px;margin-top:10px}.comment-row{padding:14px 0;border-bottom:1px solid #23233A;display:flex;gap:10px;justify-content:space-between}
.like-btn{font-size:12px;color:#9CA3AF;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:6px;font-weight:700}.like-btn.liked{color:#FF2D55}
</style>
</head>
<body>
<header><div class="hbtn" onclick="history.back()">‹</div><div style="font-size:13px;color:#9CA3AF;font-weight:800">PASONG</div><div class="hbtn" onclick="shareLink()">↗</div></header>

<div class="main">
<img id="cover" class="cover">
<div id="title" class="title">Loading...</div><div id="artistName" class="artist"></div><div id="meta" class="meta"></div>
<div class="bar"><div id="fill" class="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="controls"><div class="c" onclick="prev()">⏮</div><div id="playBtn" class="c play" onclick="toggle()">▶</div><div class="c" onclick="next()">⏭</div></div>
<div class="actions"><div id="heart" class="btn" onclick="toggleFav()">♡ Favorite</div><div class="btn buy" onclick="buy()">+ Buy</div></div>
<div class="share-row"><div class="share-btn" onclick="shareWA()">WhatsApp</div><div class="share-btn" onclick="shareLink()">Copy Link</div><div class="share-btn" onclick="downloadSong()">Download</div></div>
<audio id="audio"></audio>
</div>

<div class="artist-box"><img id="artistImg"><div><div id="artistBoxName" class="name" style="font-size:20px;font-weight:900"></div><div id="artistBoxMeta" class="sub" style="font-size:14px;color:#A0A0B8;margin-top:6px"></div></div></div>

<div class="card-box"><h3>Credits</h3><div id="credits">Loading credits...</div></div>
<div class="card-box"><h3>Lyrics</h3><div id="lyrics" class="lyrics">Lyrics not available yet.</div></div>

<div class="section"><div class="head"><h2 id="popTitle">Popular</h2></div><div class="list" id="popularList"></div></div>
<div class="section"><div class="head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>
<div class="section"><div class="head"><h2>Recommended for you</h2></div><div class="grid" id="recommendedGrid"></div></div>
<div class="section"><div class="head"><h2>Albums & EPs</h2></div><div class="grid" id="albumGrid"></div></div>
<div class="section"><div class="head"><h2 id="fansTitle">Fans also like</h2></div><div class="grid" id="fansGrid"></div></div>

<div class="card-box"><h3>Comments <span id="commentCount" style="color:#7C4DFF;font-size:13px"></span></h3><input id="commentText" class="comment-input" placeholder="Add a comment and press Enter..."><div id="commentsList" style="margin-top:12px"></div></div>

<footer style="background:#080810;border-top:1px solid #23233A;padding:32px 5% 90px;margin-top:30px"><div style="text-align:center;color:#666;font-size:12px">© 2026 PASONG • Made in Uganda</div></footer>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let list=[], idx=0, current=null; const audio=document.getElementById("audio");
function qs(k){return new URLSearchParams(location.search).get(k);}
function formatTime(t){if(!t||isNaN(t)) return "0:00"; let m=Math.floor(t/60); let s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0");}

async function init(){
  let id=qs("id");
  console.log("Player ID:", id);
  
  // 1. If ID exists, load that specific song directly first (fixes Loading...)
  if(id){
    let direct = await db.from("beats").select("*").eq("id", id).maybeSingle();
    if(!direct.data || direct.error){
      direct = await db.from("songs").select("*").eq("id", id).maybeSingle();
    }
    if(direct.data){
      list=[direct.data];
      idx=0;
      load(0);
      // then load more for lists
      let b=await db.from("beats").select("*").order("created_at",{ascending:false}).limit(50);
      let s=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(50);
      if(b.data) list=[...list, ...b.data.filter(x=>x.id!=id)];
      if(s.data) list=[...list, ...s.data.filter(x=>x.id!=id)];
      return;
    }
  }
  
  // 2. Fallback: load all
  let b=await db.from("beats").select("*").order("created_at",{ascending:false}).limit(80);
  let s=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(80);
  console.log("beats:", b, "songs:", s);
  list=[...(b.data||[]), ...(s.data||[])];
  if(list.length) load(0);
  else {
    document.getElementById("title").textContent="No songs found - Check Supabase RLS";
  }
}

async function load(i){
 current=list[i]; if(!current) return;
 document.getElementById("cover").src=current.cover_url||"https://via.placeholder.com/400";
 document.getElementById("artistImg").src=current.cover_url||"https://via.placeholder.com/100";
 document.getElementById("title").textContent=current.title||"Untitled";
 audio.src=current.audio_url||current.preview_url||current.stream_url||"";
 let name=current.artist_name||current.producer_name||"PASONG Artist", img=current.cover_url, bio="", verified=false, genre=current.genre||"";
 let realPlays=current.plays||current.play_count||0;
 if(current.producer_id){
   try{let p=await db.from("profiles").select("*").eq("id",current.producer_id).maybeSingle(); if(p.data){name=p.data.full_name||p.data.username||name; bio=p.data.bio||""; if(p.data.avatar_url) img=p.data.avatar_url;}}catch(e){}
   try{let ap=await db.from("artist_profiles").select("*").eq("user_id",current.producer_id).maybeSingle(); if(ap.data){name=ap.data.artist_name||ap.data.stage_name||name; bio=ap.data.bio||bio; verified=ap.data.verified||false; if(ap.data.profile_image_url) img=ap.data.profile_image_url; else if(ap.data.profile_photo_url) img=ap.data.profile_photo_url;}}catch(e){}
 }
 document.getElementById("artistName").textContent=name;
 document.getElementById("artistBoxName").textContent=name+(verified?" ✓":"");
 document.getElementById("artistImg").src=img||current.cover_url;
 document.getElementById("meta").textContent=`${realPlays.toLocaleString()} plays • ${genre} • ${current.bpm||""} BPM`;
 document.getElementById("artistBoxMeta").textContent=(bio||genre||"Producer").slice(0,120);
 document.getElementById("credits").innerHTML=`<div class="credit"><span>Artist</span><b>${name}</b></div><div class="credit"><span>Genre</span><b>${genre||"-"}</b></div><div class="credit"><span>BPM</span><b>${current.bpm||"-"}</b></div><div class="credit"><span>Key</span><b>${current.key||current.music_key||"-"}</b></div><div class="credit"><span>Plays</span><b>${realPlays.toLocaleString()}</b></div><div class="credit"><span>Year</span><b>${current.created_at?new Date(current.created_at).getFullYear():"2026"}</b></div>`;
 document.getElementById("lyrics").textContent=current.lyrics||current.lyric||"Lyrics not available yet.";
 document.getElementById("popTitle").textContent="Popular by "+name;
 document.getElementById("fansTitle").textContent="Fans of "+name+" also like";

 let same=list.filter(x=>(current.producer_id?x.producer_id===current.producer_id:true)).slice(0,10);
 let pop=""; same.slice(0,6).forEach((x,j)=>{pop+=`<div class="row" onclick="location.href='player.html?id=${x.id}'"><div class="num">${j+1}</div><img src="${x.cover_url||''}"><div style="flex:1;overflow:hidden"><div class="rt">${x.title||'Untitled'}</div><div class="ra">${(x.plays||0).toLocaleString()} plays</div></div></div>`;});
 document.getElementById("popularList").innerHTML=pop||"<div style='color:#666;padding:10px'>No popular tracks</div>";

 try{
   let alb=await db.from("albums").select("*").order("created_at",{ascending:false}).limit(20);
   let releaseHtml=""; if((alb.data||[]).length){alb.data.slice(0,10).forEach(a=>{releaseHtml+=`<div class="card" onclick="location.href='album.html?id=${a.id}'"><img src="${a.cover_url||current.cover_url}"><div class="card-info"><div class="t">${a.title||a.name||"Album"}</div><div class="a">${a.release_year||"Release"}</div></div></div>`;});} else {same.slice(0,8).forEach(x=>{releaseHtml+=`<div class="card" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}"><div class="card-info"><div class="t">${x.title}</div><div class="a">Single</div></div></div>`;});}
   document.getElementById("releaseGrid").innerHTML=releaseHtml;
   let albumHtml=""; if((alb.data||[]).length){alb.data.forEach(a=>{albumHtml+=`<div class="card" onclick="location.href='album.html?id=${a.id}'"><img src="${a.cover_url||current.cover_url}"><div class="card-info"><div class="t">${a.title||a.name||"Album"}</div><div class="a">${a.release_year||"Album"}</div></div></div>`;});} else {albumHtml=`<div style="padding:20px;color:#666;font-size:14px">No albums yet</div>`;}
   document.getElementById("albumGrid").innerHTML=albumHtml;
 }catch(e){}

 let rec=list.filter(x=>x.id!==current.id).slice(0,12); let recHtml=""; rec.forEach(x=>{recHtml+=`<div class="card" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}"><div class="card-info"><div class="t">${x.title}</div><div class="a">${x.genre||"Recommended"}</div></div></div>`;});
 document.getElementById("recommendedGrid").innerHTML=recHtml||"<div style='color:#666'>No recommendations</div>";

 let fansList=list.slice(0,8); let fans=""; fansList.forEach(x=>{fans+=`<div class="card" style="padding:14px;text-align:center" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}" style="width:76px;height:76px;border-radius:50%;margin:0 auto;display:block;border:3px solid #7C4DFF"><div class="t" style="margin-top:10px">${(x.title||'').slice(0,18)}</div></div>`;});
 document.getElementById("fansGrid").innerHTML=fans;

 checkFav(); loadComments();
}

async function checkFav(){try{let {data}=await db.from("favorites").select("*").eq("song_id", current.id).limit(1); let b=document.getElementById("heart"); if(data&&data.length){b.classList.add("active"); b.textContent="♥ Favorited";} else{b.classList.remove("active"); b.textContent="♡ Favorite";}}catch(e){}}
async function toggleFav(){try{let u=(await db.auth.getUser()).data.user; if(!u){alert("Login to favorite"); return;} let {data}=await db.from("favorites").select("*").eq("song_id", current.id).eq("user_id", u.id).limit(1); if(data&&data.length){await db.from("favorites").delete().eq("id", data[0].id);} else{await db.from("favorites").insert({song_id:current.id, user_id:u.id});} checkFav();}catch(e){alert(e.message);}}
function toggle(){if(audio.paused){audio.play(); document.getElementById("playBtn").textContent="⏸";} else{audio.pause(); document.getElementById("playBtn").textContent="▶";}}
audio.ontimeupdate=()=>{document.getElementById("fill").style.width=(audio.currentTime/(audio.duration||1)*100)+"%"; document.getElementById("cur").textContent=formatTime(audio.currentTime);}
audio.onloadedmetadata=()=>{document.getElementById("dur").textContent=formatTime(audio.duration);}
audio.onended=()=>next();
function next(){idx=(idx+1)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸";}
function prev(){idx=(idx-1+list.length)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸";}
function buy(){location.href=(current.producer_id?"beats.html":"song.html")+"?id="+current.id;}
function shareLink(){navigator.clipboard.writeText(location.href); alert("Link copied!");}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent(location.href));}
function downloadSong(){if(audio.src) window.open(audio.src,"_blank");}

async function loadComments(){
  try{
    let r=await db.from("comments").select("*").eq("song_id", current.id).order("created_at",{ascending:false}).limit(50);
    let data=r.data||[];
    document.getElementById("commentCount").textContent="("+data.length+")";
    let h="";
    if(!data.length) h="<div style='color:#666;font-size:13px;padding:12px 0'>No comments yet. Be first!</div>";
    else data.forEach(c=>{
      let name=c.username||c.user_name||"User";
      let text=c.text||c.comment||c.content||"";
      let likes=c.likes||c.likes_count||0;
      h+=`<div class="comment-row"><div style="display:flex;gap:10px;flex:1"><div style="width:32px;height:32px;background:#7C4DFF;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;flex-shrink:0">${name[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:14px">${name}</b><p style="font-size:13px;color:#9CA3AF;margin-top:4px">${text}</p><div class="like-btn ${localStorage.getItem('liked_'+c.id)?'liked':''}" onclick="likeComment('${c.id}', ${likes})">♥ ${likes} likes</div></div></div></div>`;
    });
    document.getElementById("commentsList").innerHTML=h;
  }catch(e){console.log(e);}
}
async function likeComment(id, currentLikes){
  if(localStorage.getItem('liked_'+id)){alert("Already liked"); return;}
  try{
    let newLikes=currentLikes+1;
    await db.from("comments").update({likes: newLikes, likes_count: newLikes}).eq("id", id);
    localStorage.setItem('liked_'+id, '1');
    loadComments();
  }catch(err){alert(err.message);}
}
document.getElementById("commentText").addEventListener("keydown", async (e)=>{
  if(e.key==="Enter"){
    let t=e.target.value.trim(); if(!t) return;
    let input=e.target; input.disabled=true; input.placeholder="Posting...";
    try{
      let uData=await db.auth.getUser(); let user=uData.data.user;
      let username="Guest"; if(user){username=user.user_metadata?.full_name||user.email?.split("@")[0]||"User";} else {username="Guest_"+Math.floor(Math.random()*999);}
      let insertObj={song_id: current.id, text: t, comment: t, content: t, username: username, user_name: username, likes:0, likes_count:0};
      if(user) insertObj.user_id=user.id;
      let res=await db.from("comments").insert(insertObj).select();
      if(res.error){alert("Error: "+res.error.message); input.disabled=false; return;}
      e.target.value=""; loadComments();
    }catch(err){alert(err.message);}
    input.disabled=false; input.placeholder="Add a comment and press Enter...";
  }
});
init();
</script>
</body>
</html>
