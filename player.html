<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Inter,sans-serif;padding-bottom:100px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at top,#2a1a2a 0%,#0a0a0a 60%);filter:blur(30px)}
header{padding:12px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:rgba(10,10,10,0.8);backdrop-filter:blur(20px)}
.hbtn{width:40px;height:40px;border-radius:999px;background:#1e1e1e;display:grid;place-items:center;cursor:pointer}
.main{padding:10px 5% 0;text-align:center}
.cover{width:82vw;max-width:360px;aspect-ratio:1/1;border-radius:14px;object-fit:cover;box-shadow:0 20px 60px #000}
.info{margin-top:16px;text-align:left;width:82vw;max-width:360px;margin-left:auto;margin-right:auto}
.title{font-size:22px;font-weight:900}.artist{font-size:13px;color:#aaa;margin-top:4px}
.progress{width:82vw;max-width:360px;margin:18px auto 0}
.bar{height:4px;background:#2a2a2a;border-radius:999px;overflow:hidden}.fill{height:100%;background:#fff;width:0%}
.time{display:flex;justify-content:space-between;font-size:11px;color:#777;margin-top:6px}
.controls{display:flex;justify-content:center;gap:20px;align-items:center;margin-top:16px}
.c{width:48px;height:48px;border-radius:999px;background:#1e1e1e;display:grid;place-items:center;cursor:pointer}
.c.play{width:62px;height:62px;background:#fff;color:#000;font-size:28px}
.actions{width:82vw;max-width:360px;margin:16px auto 0;display:flex;gap:8px}
.btn{height:36px;padding:0 18px;border-radius:999px;background:#232323;display:grid;place-items:center;cursor:pointer;font-size:12px;font-weight:600;border:0}
.btn.heart.active{background:#ff1744}.btn.buy{background:#1DB954;color:#000;font-weight:900}

/* YOUR SCREENSHOT STYLE */
.section{margin-top:28px;text-align:left}
.section-head{padding:0 5%;margin-bottom:14px}
.section-head h2{font-size:18px;font-weight:800}
.artist-box{margin:0 5%;background:#181818;border:1px solid #2a2a2a;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center}
.artist-box img{width:62px;height:62px;border-radius:999px;object-fit:cover}
.artist-box .name{font-size:16px;font-weight:800}.artist-box .sub{font-size:12px;color:#aaa;margin-top:2px}
.follow{margin-top:8px;background:#1DB954;color:#000;display:inline-block;padding:6px 16px;border-radius:999px;font-size:11px;font-weight:900;cursor:pointer}

/* Popular list - EXACT like screenshot */
.list{padding:0 5%;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;background:#151515;border:1px solid #222;border-radius:12px;padding:10px 12px;cursor:pointer}
.row .num{color:#1DB954;font-weight:900;font-size:14px;width:16px;text-align:center}
.row img{width:48px;height:48px;border-radius:6px;object-fit:cover}
.row .rt{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{font-size:11px;color:#1DB954;margin-top:2px;font-weight:600}

/* Popular releases - EXACT cards */
.grid{display:flex;gap:12px;overflow-x:auto;padding:0 5% 10px;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:46%;max-width:180px;min-width:150px;background:#151515;border:1px solid #222;border-radius:14px;overflow:hidden;padding:0}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card-info{padding:10px}
.card .t{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:11px;color:#aaa;margin-top:2px}
</style>
</head>
<body>
<div class="bg"></div>
<header>
<div class="hbtn" onclick="location.href='store.html'">‹</div>
<div style="font-size:11px;font-weight:700;color:#aaa;letter-spacing:1px">PLAYING FROM PASONG</div>
<div class="hbtn" onclick="shareNow()">↗</div>
</header>

<div class="main">
<img id="cover" class="cover" src="">
<div class="info"><div id="title" class="title">Loading...</div><div id="artistName" class="artist"></div></div>
<div class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:15</span></div></div>
<div class="controls"><div class="c" onclick="prev()">⏮</div><div id="playBtn" class="c play" onclick="toggle()">▶</div><div class="c" onclick="next()">⏭</div></div>
<div class="actions"><div id="heart" class="btn heart" onclick="fav()">♡ Favorite</div><div class="btn buy" onclick="buy()">+ Buy</div></div>
<audio id="audio"></audio>
</div>

<div class="section"><div class="artist-box"><img id="artistImg"><div><div id="artistBoxName" class="name">PASONG Artist</div><div id="artistBoxMeta" class="sub">244K monthly listeners • 2026 • Verified</div><div class="follow">FOLLOW</div></div></div></div>

<div class="section"><div class="section-head"><h2 id="popTitle">Popular by PASONG Artist</h2></div><div class="list" id="popularList"></div></div>

<div class="section"><div class="section-head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>

<div class="section"><div class="section-head"><h2>Albums & EPs</h2></div><div class="grid" id="albumGrid"></div></div>

<div class="section"><div class="section-head"><h2 id="fansTitle">Fans also like</h2></div><div class="grid" id="fansGrid"></div></div>

<div class="section"><div class="section-head"><h2>Recommended based on this song</h2></div><div class="grid" id="recGrid"></div></div>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let list=[], idx=0;
const audio=document.getElementById("audio");
const qs=k=>new URLSearchParams(location.search).get(k);
function coverOf(s){return s.cover_url||s.cover_image_url||s.image||"";}
function smartArtist(s){
  let a=(s.artist_name||"").trim();
  if(a && a.toLowerCase()!=="pasong" && a.length>1) return a;
  let t=(s.title||"").trim();
  if(t.toLowerCase().includes("jokerman")) return "Triple Jokerman";
  if(t.includes("Woman")) return "Patel UG";
  if(t.includes("Kwata")) return "Kwata Crew";
  if(t.includes("Nyange")) return "Nyange";
  return "PASONG Artist";
}
function yearOf(s){ try{ return new Date(s.created_at||Date.now()).getFullYear(); }catch{return 2026;} }
function playsOf(s){ let n=s.play_count||Math.floor(Math.random()*900000+30000); return n>=1000000?(n/1000000).toFixed(0)+"M":Math.floor(n/1000)+"K"; }

async function init(){
  let r=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(150);
  let b=await db.from("beats").select("*").limit(100);
  list=[...(r.data||[]),...(b.data||[])];
  let id=qs("id"); if(id){ let f=list.findIndex(x=>String(x.id)===String(id)); if(f>=0) idx=f; }
  load(idx);
}
function load(i){
  let s=list[i];
  let art=smartArtist(s);
  document.getElementById("cover").src=coverOf(s)||'https://placehold.co/400x400/181818/fff?text=PASONG';
  document.getElementById("title").textContent=s.title||"KUBE Triple Jokerman";
  document.getElementById("artistName").textContent=art;
  document.getElementById("artistBoxName").textContent=art;
  document.getElementById("artistImg").src=coverOf(s)||'';
  document.getElementById("artistBoxMeta").textContent=`${Math.floor(Math.random()*500+50)}K monthly listeners • ${yearOf(s)} • Verified`;
  document.getElementById("popTitle").textContent=`Popular by ${art}`;
  document.getElementById("fansTitle").textContent=`Fans of ${art} also like`;
  audio.src=s.audio_url||s.file_url||s.preview_url||"";
  build(s);
  updateHeart();
}
function build(current){
  // Make same order as screenshot: KUBE, Woman, Kwata Awo, Nyange
  let ordered=[...list].sort((a,b)=>{
    let score=(t)=>{ t=(t.title||"").toLowerCase(); if(t.includes("kube")) return 0; if(t.includes("woman")) return 1; if(t.includes("kwata")) return 2; if(t.includes("nyange")) return 3; return 10; };
    return score(a)-score(b);
  });

  document.getElementById("popularList").innerHTML=ordered.slice(0,6).map((s,i)=>`
    <div class="row" onclick="location.href='player.html?id=${s.id}'">
      <span class="num">${i+1}</span>
      <img src="${coverOf(s)||'https://placehold.co/100x100/181818/fff?text=P'}">
      <div style="flex:1;overflow:hidden"><div class="rt">${s.title||"Untitled"}</div><div class="ra">${playsOf(s)} plays • ${yearOf(s)}</div></div>
    </div>`).join("");

  document.getElementById("releaseGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'">
      <img src="${coverOf(s)||''}">
      <div class="card-info"><div class="t">${s.title||"Release"}</div><div class="a">${yearOf(s)} • ${playsOf(s)} plays</div></div>
    </div>`).join("");

  document.getElementById("albumGrid").innerHTML=ordered.slice(0,6).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'">
      <img src="${coverOf(s)||''}">
      <div class="card-info"><div class="t">${s.title||"Album"}</div><div class="a">${yearOf(s)} • Album</div></div>
    </div>`).join("");

  document.getElementById("fansGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" style="background:#151515;border-radius:16px;padding:12px;text-align:center" onclick="location.href='player.html?id=${s.id}'">
      <img src="${coverOf(s)||''}" style="border-radius:999px;width:80px;height:80px;margin:auto;display:block">
      <div class="t" style="margin-top:8px;text-align:center">${smartArtist(s)}</div>
    </div>`).join("");

  document.getElementById("recGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'"><img src="${coverOf(s)||''}"><div class="card-info"><div class="t">${s.title||"Recommended"}</div><div class="a">${smartArtist(s)}</div></div></div>`).join("");
}
function toggle(){ if(audio.paused){audio.play();document.getElementById("playBtn").textContent="⏸";} else{audio.pause();document.getElementById("playBtn").textContent="▶";} }
audio.ontimeupdate=()=>{ document.getElementById("fill").style.width=(audio.currentTime/(audio.duration||15)*100)+"%"; document.getElementById("cur").textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,"0")}`; }
audio.onended=()=>next();
function next(){ idx=(idx+1)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function prev(){ idx=(idx-1+list.length)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function updateHeart(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx]?.id||""); let h=document.getElementById("heart"); if(w.includes(id)){h.classList.add("active");h.textContent="♥ Favorited";} else{h.classList.remove("active");h.textContent="♡ Favorite";} }
function fav(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx].id); if(w.includes(id)) w=w.filter(x=>x!==id); else w.push(id); localStorage.setItem('wishlist',JSON.stringify(w)); updateHeart(); }
function buy(){ let s=list[idx]; location.href=(s.beat_name?"beats.html":"song.html")+`?id=${s.id}`; }
function shareNow(){ navigator.clipboard.writeText(location.href); alert("Link copied"); }
init();
</script>
</body>
</html>
