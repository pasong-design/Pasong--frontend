<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0F0F14;color:#fff;font-family:Inter,sans-serif}
header{padding:16px 5%;display:flex;justify-content:space-between;align-items:center;background:#0F0F14;border-bottom:1px solid #23233A;position:sticky;top:0;z-index:20}
.hbtn{width:44px;height:44px;border-radius:12px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;font-size:22px;color:#fff}
.main{padding:20px 5%}.cover{width:100%;max-width:380px;aspect-ratio:1/1;border-radius:24px;object-fit:cover;display:block;margin:0 auto;background:#1A1A28;border:1px solid #2A2A42}
.title{font-size:30px;font-weight:900;margin-top:20px;line-height:1.1}.artist{font-size:17px;color:#A78BFA;margin-top:10px;font-weight:700}.meta{font-size:14px;color:#9CA3AF;margin-top:8px}
.bar{height:6px;background:#1A1A28;border-radius:10px;margin-top:22px;overflow:hidden;border:1px solid #2A2A42;cursor:pointer}.fill{height:100%;background:linear-gradient(90deg,#7C4DFF,#8B5CF6);width:0%}
.time{display:flex;justify-content:space-between;font-size:13px;color:#9CA3AF;margin-top:8px;font-weight:600}
.controls{display:flex;justify-content:center;gap:30px;margin-top:24px;align-items:center}.c{width:56px;height:56px;border-radius:16px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:20px}.c.play{width:78px;height:78px;background:#7C4DFF;color:#fff;font-size:34px;border:none;box-shadow:0 8px 24px rgba(124,77,255,.4)}
.actions{display:flex;gap:12px;margin-top:22px}.btn{flex:1;height:52px;border-radius:14px;background:#1A1A28;border:1px solid #2A2A42;display:grid;place-items:center;cursor:pointer;font-weight:800;color:#fff;font-size:14px}.btn.buy{background:#7C4DFF;border:none}.btn.active{background:#FF2D55;border:none}
.share-row{display:flex;gap:10px;margin-top:14px}.share-btn{flex:1;height:42px;border-radius:12px;background:#1A1A28;border:1px solid #2A2A42;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;cursor:pointer}
.artist-box{margin:26px 5%;background:#1A1A28;border:1px solid #2A2A42;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.artist-box img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #7C4DFF;background:#23233A}
.card-box{margin:16px 5%;background:#1A1A28;border:1px solid #2A2A42;border-radius:20px;padding:18px}.card-box h3{font-size:16px;font-weight:900;margin-bottom:12px}
.credit{font-size:14px;color:#9CA3AF;padding:10px 0;display:flex;justify-content:space-between;border-bottom:1px solid #23233A}.credit b{color:#fff}
.lyrics{white-space:pre-wrap;font-size:15px;line-height:1.7;color:#D1D5DB}
.section{margin-top:32px}.head{padding:0 5%;margin-bottom:14px}.head h2{font-size:18px;font-weight:800}
.list{padding:0 5%;display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px;background:#1A1A28;border:1px solid #2A2A42;border-radius:16px;padding:14px;cursor:pointer}.row .num{color:#7C4DFF;font-weight:900;width:22px}.row img{width:56px;height:56px;border-radius:10px;object-fit:cover}.row .rt{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .ra{font-size:12px;color:#9CA3AF;margin-top:3px}
.grid{display:flex;gap:14px;overflow-x:auto;padding:0 5% 14px;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}.card{flex:0 0 180px;background:#1A1A28;border:1px solid #2A2A42;border-radius:16px;overflow:hidden;cursor:pointer}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.card-info{padding:10px 12px}.card .t{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .a{font-size:12px;color:#9CA3AF;margin-top:2px}
.comment-input{width:100%;height:48px;background:#0F0F14;border:1px solid #2A2A42;border-radius:12px;padding:0 14px;color:#fff;font-size:14px;margin-top:10px}
.comment-row{padding:14px 0;border-bottom:1px solid #23233A;display:flex;gap:10px}
.like-btn{font-size:12px;color:#9CA3AF;cursor:pointer;display:flex;align-items:center;gap:4px;margin-top:6px;font-weight:700}.like-btn.liked{color:#FF2D55}
</style>
</head>
<body>
<header><div class="hbtn" onclick="history.back()">‹</div><div style="font-size:13px;color:#9CA3AF;font-weight:800;letter-spacing:1px">PASONG</div><div class="hbtn" onclick="shareLink()">↗</div></header>

<div class="main">
<img id="cover" class="cover" src="">
<div id="title" class="title">Loading...</div>
<div id="artistName" class="artist"></div>
<div id="meta" class="meta"></div>
<div class="bar" id="progressBar"><div id="fill" class="fill"></div></div>
<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="controls"><div class="c" onclick="prev()">⏮</div><div id="playBtn" class="c play" onclick="toggle()">▶</div><div class="c" onclick="next()">⏭</div></div>
<div class="actions"><div id="heart" class="btn" onclick="toggleFav()">♡ Favorite</div><div class="btn buy" onclick="buy()">+ Buy</div></div>
<div class="share-row"><div class="share-btn" onclick="shareWA()">WhatsApp</div><div class="share-btn" onclick="shareLink()">Copy Link</div><div class="share-btn" onclick="downloadSong()">Download</div></div>
<audio id="audio"></audio>
</div>

<div class="artist-box"><img id="artistImg" src=""><div><div id="artistBoxName" style="font-size:20px;font-weight:900"></div><div id="artistBoxMeta" style="font-size:13px;color:#A0A0B8;margin-top:6px"></div></div></div>

<div class="card-box"><h3>Credits</h3><div id="credits"></div></div>
<div class="card-box"><h3>Lyrics</h3><div id="lyrics" class="lyrics">Lyrics not available yet.</div></div>

<div class="section"><div class="head"><h2 id="popTitle">Popular</h2></div><div class="list" id="popularList"></div></div>
<div class="section"><div class="head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>
<div class="section"><div class="head"><h2>Recommended for you</h2></div><div class="grid" id="recommendedGrid"></div></div>
<div class="section"><div class="head"><h2>Albums & EPs</h2></div><div class="grid" id="albumGrid"></div></div>
<div class="section"><div class="head"><h2 id="fansTitle">Fans also like</h2></div><div class="grid" id="fansGrid"></div></div>
<div class="card-box"><h3>Comments <span id="commentCount" style="color:#7C4DFF"></span></h3><input id="commentText" class="comment-input" placeholder="Add a comment and press Enter..."><div id="commentsList" style="margin-top:12px"></div></div>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let list=[], idx=0, current=null;
const audio=document.getElementById("audio");
function qs(k){return new URLSearchParams(location.search).get(k);}
function formatTime(t){if(!t||isNaN(t)) return "0:00"; let m=Math.floor(t/60); let s=Math.floor(t%60); return m+":"+String(s).padStart(2,"0");}

async function init(){
  const id=qs("id");
  if(!id){ document.getElementById("title").textContent="No song ID"; return; }
  
  // LOAD DIRECT SONG - THIS FIXES 0 plays ISSUE
  let data=null;
  let r1=await db.from("beats").select("*").eq("id",id).maybeSingle();
  if(r1.data) data=r1.data; else {
    let r2=await db.from("songs").select("*").eq("id",id).maybeSingle();
    if(r2.data) data=r2.data;
  }
  if(!data){
    document.getElementById("title").textContent="Song not found";
    return;
  }
  list=[data];
  current=data;
  await loadSong(data);
  
  // Now load all for recommendations
  let all=await db.from("beats").select("*").order("created_at",{ascending:false}).limit(50);
  if(all.data){ all.data.forEach(b=>{ if(b.id!=id) list.push(b); }); }
  let allS=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(50);
  if(allS.data){ allS.data.forEach(s=>{ if(s.id!=id) list.push(s); }); }
  
  loadLists();
}

async function loadSong(song){
  current=song;
  document.getElementById("cover").src=song.cover_url||"";
  document.getElementById("artistImg").src=song.cover_url||"";
  document.getElementById("title").textContent=song.title||"Untitled";
  document.getElementById("artistName").textContent=song.artist_name||song.producer_name||"PASONG Artist";
  audio.src=song.audio_url||song.preview_url||song.stream_url||"";
  
  // Fix plays - use real columns
  let plays = song.plays || song.play_count || song.views || 0;
  let genre = song.genre || "Afrobeat";
  let bpm = song.bpm || "94";
  let key = song.key || song.music_key || song.key_signature || "-";
  
  let artistName = song.artist_name || song.producer_name || "PASONG Artist";
  if(song.producer_id){
    try{
      let p=await db.from("profiles").select("*").eq("id",song.producer_id).maybeSingle();
      if(p.data && p.data.full_name) artistName=p.data.full_name;
    }catch(e){}
  }
  
  document.getElementById("artistName").textContent=artistName;
  document.getElementById("artistBoxName").textContent=artistName;
  document.getElementById("artistBoxMeta").textContent="Producer • "+genre;
  document.getElementById("artistImg").src=song.cover_url||"";
  document.getElementById("meta").textContent=`${Number(plays).toLocaleString()} plays • ${genre} • ${bpm} BPM`;
  
  document.getElementById("credits").innerHTML=`
    <div class="credit"><span>Artist</span><b>${artistName}</b></div>
    <div class="credit"><span>Genre</span><b>${genre}</b></div>
    <div class="credit"><span>BPM</span><b>${bpm}</b></div>
    <div class="credit"><span>Key</span><b>${key}</b></div>
    <div class="credit"><span>Plays</span><b>${Number(plays).toLocaleString()}</b></div>
    <div class="credit"><span>Year</span><b>${song.created_at?new Date(song.created_at).getFullYear():2026}</b></div>
  `;
  document.getElementById("lyrics").textContent=song.lyrics||song.lyric||"Lyrics not available yet.";
  document.getElementById("popTitle").textContent="Popular by "+artistName;
  document.getElementById("fansTitle").textContent="Fans of "+artistName+" also like";
  
  checkFav();
  loadComments();
}

async function loadLists(){
  // Popular
  let popHtml=""; list.slice(0,6).forEach((x,j)=>{
    popHtml+=`<div class="row" onclick="location.href='player.html?id=${x.id}'"><div class="num">${j+1}</div><img src="${x.cover_url}"><div style="flex:1;overflow:hidden"><div class="rt">${x.title}</div><div class="ra">${(x.plays||0)} plays</div></div></div>`;
  });
  document.getElementById("popularList").innerHTML=popHtml;
  
  // Popular releases - same as popular
  let relHtml=""; list.slice(0,8).forEach(x=>{
    relHtml+=`<div class="card" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}"><div class="card-info"><div class="t">${x.title}</div><div class="a">Single</div></div></div>`;
  });
  document.getElementById("releaseGrid").innerHTML=relHtml;
  
  // Recommended - random
  let recHtml=""; list.filter(x=>x.id!=current.id).slice(0,10).forEach(x=>{
    recHtml+=`<div class="card" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}"><div class="card-info"><div class="t">${x.title}</div><div class="a">${x.genre||"Recommended"}</div></div></div>`;
  });
  document.getElementById("recommendedGrid").innerHTML=recHtml || "<div style='padding:10px;color:#666'>More songs coming</div>";
  
  // Albums - try albums table, if empty show singles as albums
  try{
    let alb=await db.from("albums").select("*").limit(10);
    if(alb.data && alb.data.length){
      let aHtml=""; alb.data.forEach(a=>{
        aHtml+=`<div class="card" onclick="location.href='album.html?id=${a.id}'"><img src="${a.cover_url||current.cover_url}"><div class="card-info"><div class="t">${a.title||a.name}</div><div class="a">${a.release_year||"Album"}</div></div></div>`;
      });
      document.getElementById("albumGrid").innerHTML=aHtml;
    } else {
      let aHtml=""; list.slice(0,6).forEach(x=>{
        aHtml+=`<div class="card" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}"><div class="card-info"><div class="t">${x.title}</div><div class="a">Single</div></div></div>`;
      });
      document.getElementById("albumGrid").innerHTML=aHtml;
    }
  }catch(e){
    document.getElementById("albumGrid").innerHTML="<div style='padding:10px;color:#666'>No albums yet</div>";
  }
  
  // Fans also like
  let fansHtml=""; list.slice(0,8).forEach(x=>{
    fansHtml+=`<div class="card" style="padding:14px;text-align:center" onclick="location.href='player.html?id=${x.id}'"><img src="${x.cover_url}" style="width:76px;height:76px;border-radius:50%;margin:0 auto;display:block;border:3px solid #7C4DFF"><div class="t" style="margin-top:10px">${x.title.slice(0,18)}</div></div>`;
  });
  document.getElementById("fansGrid").innerHTML=fansHtml;
}

async function checkFav(){try{let {data}=await db.from("favorites").select("*").eq("song_id",current.id).limit(1); let b=document.getElementById("heart"); if(data&&data.length){b.classList.add("active"); b.textContent="♥ Favorited";} else{b.classList.remove("active"); b.textContent="♡ Favorite";}}catch(e){}}
async function toggleFav(){let u=(await db.auth.getUser()).data.user; if(!u){alert("Login to favorite"); return;} try{let {data}=await db.from("favorites").select("*").eq("song_id",current.id).eq("user_id",u.id).limit(1); if(data&&data.length){await db.from("favorites").delete().eq("id",data[0].id);} else{await db.from("favorites").insert({song_id:current.id,user_id:u.id});} checkFav();}catch(e){alert(e.message);}}
function toggle(){if(audio.paused){audio.play(); document.getElementById("playBtn").textContent="⏸";}else{audio.pause(); document.getElementById("playBtn").textContent="▶";}}
audio.ontimeupdate=()=>{document.getElementById("fill").style.width=(audio.currentTime/(audio.duration||1)*100)+"%"; document.getElementById("cur").textContent=formatTime(audio.currentTime);}
audio.onloadedmetadata=()=>{document.getElementById("dur").textContent=formatTime(audio.duration);}
audio.onended=()=>next();
function next(){let n=list.findIndex(x=>x.id==current.id); n=(n+1)%list.length; loadSong(list[n]); audio.play(); document.getElementById("playBtn").textContent="⏸";}
function prev(){let n=list.findIndex(x=>x.id==current.id); n=(n-1+list.length)%list.length; loadSong(list[n]); audio.play(); document.getElementById("playBtn").textContent="⏸";}
function buy(){location.href="beats.html?id="+current.id;}
function shareLink(){navigator.clipboard.writeText(location.href); alert("Link copied!");}
function shareWA(){window.open("https://wa.me/?text="+encodeURIComponent(location.href));}
function downloadSong(){if(audio.src) window.open(audio.src,"_blank");}
document.getElementById("progressBar").onclick=(e)=>{let r=e.currentTarget.getBoundingClientRect(); let p=(e.clientX-r.left)/r.width; audio.currentTime=p*audio.duration;};

async function loadComments(){
  try{
    let r=await db.from("comments").select("*").eq("song_id",current.id).order("created_at",{ascending:false}).limit(50);
    let data=r.data||[];
    document.getElementById("commentCount").textContent="("+data.length+")";
    let h=data.length?"": "<div style='color:#666;font-size:13px;padding:12px 0'>No comments yet. Be first!</div>";
    data.forEach(c=>{
      let name=c.username||c.user_name||"User";
      let text=c.text||c.comment||c.content||"";
      let likes=c.likes||c.likes_count||0;
      h+=`<div class="comment-row"><div style="display:flex;gap:10px;flex:1"><div style="width:32px;height:32px;background:#7C4DFF;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px">${name[0].toUpperCase()}</div><div style="flex:1"><b style="font-size:14px">${name}</b><p style="font-size:13px;color:#9CA3AF;margin-top:4px">${text}</p><div class="like-btn ${localStorage.getItem('liked_'+c.id)?'liked':''}" onclick="likeComment('${c.id}',${likes})">♥ ${likes} likes</div></div></div></div>`;
    });
    document.getElementById("commentsList").innerHTML=h;
  }catch(e){}
}
async function likeComment(id,cur){if(localStorage.getItem('liked_'+id)){alert("Already liked");return;} try{await db.from("comments").update({likes:cur+1,likes_count:cur+1}).eq("id",id); localStorage.setItem('liked_'+id,'1'); loadComments();}catch(err){alert(err.message);}}
document.getElementById("commentText").addEventListener("keydown",async(e)=>{
  if(e.key==="Enter"){
    let t=e.target.value.trim(); if(!t) return;
    e.target.disabled=true;
    try{
      let u=(await db.auth.getUser()).data.user;
      let name=u? (u.user_metadata?.full_name||u.email.split("@")[0]) : "Guest";
      let obj={song_id:current.id,text:t,comment:t,content:t,username:name,user_name:name,likes:0,likes_count:0};
      if(u) obj.user_id=u.id;
      let res=await db.from("comments").insert(obj).select();
      if(res.error) alert(res.error.message); else {e.target.value=""; loadComments();}
    }catch(err){alert(err.message);}
    e.target.disabled=false;
  }
});

init();
</script>
</body>
</html>
