<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player - PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,sans-serif;padding-bottom:100px}
header{padding:14px 5%;display:flex;justify-content:space-between;align-items:center;background:#000;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.hbtn{width:44px;height:44px;border-radius:999px;background:#222;display:grid;place-items:center;cursor:pointer;color:#fff;font-size:20px}
.main{padding:12px 5% 0}
.cover{width:100%;max-width:360px;aspect-ratio:1/1;border-radius:16px;object-fit:cover;display:block;margin:0 auto}
.info{margin-top:16px}
.title{font-size:24px;font-weight:900;color:#fff}.artist{font-size:14px;color:#aaa;margin-top:4px}
.progress{margin-top:18px}
.bar{height:5px;background:#2a2a2a;border-radius:999px;overflow:hidden}.fill{height:100%;background:#fff;width:0%}
.time{display:flex;justify-content:space-between;font-size:11px;color:#888;margin-top:6px}
.controls{display:flex;justify-content:center;gap:24px;align-items:center;margin-top:18px}
.c{width:52px;height:52px;border-radius:999px;background:#222;display:grid;place-items:center;cursor:pointer;font-size:20px;color:#fff}
.c.play{width:68px;height:68px;background:#fff;color:#000;font-size:30px}
.actions{margin-top:18px;display:flex;gap:10px}
.btn{flex:1;height:42px;border-radius:999px;background:#1e1e1e;border:1px solid #2a2a2a;display:grid;place-items:center;cursor:pointer;font-weight:700;font-size:13px;color:#fff}
.btn.buy{background:#1DB954;color:#000;border-color:#1DB954;font-weight:900}
.btn.active{background:#ff1744;border-color:#ff1744}

/* ARTIST PROFILE BOX - PUT BACK BIG VISIBLE */
.artist-profile{margin:24px 5% 0;background:#171717;border:1px solid #2a2a2a;border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.artist-profile img{width:80px;height:80px;border-radius:999px;object-fit:cover;border:3px solid #1DB954;flex-shrink:0}
.artist-profile .name{font-size:20px;font-weight:900;color:#fff}
.artist-profile .sub{font-size:12px;color:#aaa;margin-top:4px;line-height:1.4}
.artist-profile .follow{margin-top:10px;background:#1DB954;color:#000;padding:8px 20px;border-radius:999px;font-size:12px;font-weight:900;display:inline-block;cursor:pointer}

.section{margin-top:28px}
.head{padding:0 5%;margin-bottom:14px}
.head h2{font-size:19px;font-weight:800;color:#fff}
.list{padding:0 5%;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;background:#171717;border:1px solid #2a2a2a;border-radius:14px;padding:12px 14px}
.row .num{color:#1DB954;font-weight:900;font-size:15px;width:18px}
.row img{width:50px;height:50px;border-radius:8px;object-fit:cover;background:#222;flex-shrink:0}
.row .rt{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ra{font-size:11px;color:#1DB954;margin-top:2px;font-weight:600}
.grid{display:flex;gap:12px;overflow-x:auto;padding:0 5% 10px;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:48%;max-width:185px;min-width:155px;background:#171717;border:1px solid #2a2a2a;border-radius:16px;overflow:hidden}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#222}
.card-info{padding:10px 12px 12px}
.card .t{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .a{font-size:11px;color:#888;margin-top:3px}
</style>
</head>
<body>
<header>
<div class="hbtn" onclick="location.href='store.html'">‹</div>
<div style="font-size:12px;font-weight:800;color:#888">PASONG</div>
<div class="hbtn" onclick="shareNow()">↗</div>
</header>

<div class="main">
<img id="cover" class="cover" src="">
<div class="info"><div id="title" class="title">Loading...</div><div id="artistName" class="artist">PASONG Artist</div></div>
<div class="progress"><div class="bar"><div id="fill" class="fill"></div></div><div class="time"><span id="cur">0:00</span><span id="dur">0:15</span></div></div>
<div class="controls"><div class="c" onclick="prev()">⏮</div><div id="playBtn" class="c play" onclick="toggle()">▶</div><div class="c" onclick="next()">⏭</div></div>
<div class="actions"><div id="heart" class="btn" onclick="fav()">♡ Favorite</div><div class="btn buy" onclick="buy()">+ Buy</div></div>
<audio id="audio"></audio>
</div>

<!-- ARTIST PROFILE BOX UNDER PLAYER - NOW BACK -->
<div class="artist-profile" id="artistProfileBox">
<img id="artistImg" src="https://placehold.co/200x200/1DB954/000?text=A">
<div>
<div id="artistBoxName" class="name">PASONG Artist</div>
<div id="artistBoxMeta" class="sub">244K monthly listeners • 2026 • Verified<br>Ugandan Artist • Follow to get new releases</div>
<div class="follow">FOLLOW</div>
</div>
</div>

<div class="section"><div class="head"><h2 id="popTitle">Popular by PASONG Artist</h2></div><div class="list" id="popularList"></div></div>
<div class="section"><div class="head"><h2>Popular releases</h2></div><div class="grid" id="releaseGrid"></div></div>
<div class="section"><div class="head"><h2>Albums & EPs</h2></div><div class="grid" id="albumGrid"></div></div>
<div class="section"><div class="head"><h2 id="fansTitle">Fans also like</h2></div><div class="grid" id="fansGrid"></div></div>
<div class="section"><div class="head"><h2>Recommended</h2></div><div class="grid" id="recGrid"></div></div>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let list=[], idx=0;
const audio=document.getElementById("audio");
const qs=k=>new URLSearchParams(location.search).get(k);
function coverOf(s){return s.cover_url||s.cover_image_url||s.image||"";}
function smartArtist(s){
  let a=(s.artist_name||"").trim();
  if(a && a.toLowerCase()!=="pasong") return a;
  let t=(s.title||"").toLowerCase();
  if(t.includes("jokerman")) return "Triple Jokerman";
  if(t.includes("woman")) return "Patel UG x Jonah Rable";
  if(t.includes("kwata")) return "Kwata Awo";
  if(t.includes("nyange")) return "Nyange";
  return "PASONG Artist";
}
function yearOf(s){ try{return new Date(s.created_at||Date.now()).getFullYear();}catch{return 2026;} }
function playsOf(s){ let n=s.play_count||Math.floor(Math.random()*900000+30000); return n>=1000000?(n/1000000).toFixed(0)+"M":Math.floor(n/1000)+"K"; }

async function init(){
  let r=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(150);
  let b=await db.from("beats").select("*").limit(100);
  list=[...(r.data||[]),...(b.data||[])];
  let id=qs("id"); if(id){ let f=list.findIndex(x=>String(x.id)===String(id)); if(f>=0) idx=f; }
  if(list.length) load(idx);
}
function load(i){
  let s=list[i]; let art=smartArtist(s);
  document.getElementById("cover").src=coverOf(s)||'';
  document.getElementById("title").textContent=s.title||"KUBE Triple Jokerman";
  document.getElementById("artistName").textContent=art;
  document.getElementById("artistBoxName").textContent=art;
  document.getElementById("artistImg").src=coverOf(s)||'';
  document.getElementById("artistBoxMeta").innerHTML=`${Math.floor(Math.random()*900+100)}K monthly listeners • ${yearOf(s)} • Verified<br>${art} • ${yearOf(s)} releases`;
  document.getElementById("popTitle").textContent=`Popular by ${art}`;
  document.getElementById("fansTitle").textContent=`Fans of ${art} also like`;
  audio.src=s.audio_url||s.file_url||s.preview_url||"";
  build();
  updateHeart();
}
function build(){
  let ordered=[...list].sort((a,b)=>{
    let v=t=>{ t=(t.title||"").toLowerCase(); if(t.includes("kube")) return 0; if(t.includes("woman")) return 1; if(t.includes("kwata")) return 2; if(t.includes("nyange")) return 3; return 10; };
    return v(a)-v(b);
  });
  document.getElementById("popularList").innerHTML=ordered.slice(0,6).map((s,i)=>`
    <div class="row" onclick="location.href='player.html?id=${s.id}'">
      <div class="num">${i+1}</div>
      <img src="${coverOf(s)||''}">
      <div style="flex:1;overflow:hidden"><div class="rt">${s.title||"Untitled"}</div><div class="ra">${playsOf(s)} plays • ${yearOf(s)}</div></div>
    </div>`).join("");

  document.getElementById("releaseGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'"><img src="${coverOf(s)||''}"><div class="card-info"><div class="t">${s.title||"Release"}</div><div class="a">${yearOf(s)} • ${playsOf(s)} plays</div></div></div>`).join("");

  document.getElementById("albumGrid").innerHTML=ordered.slice(0,6).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'"><img src="${coverOf(s)||''}"><div class="card-info"><div class="t">${s.title||"Album"}</div><div class="a">${yearOf(s)} • Album</div></div></div>`).join("");

  document.getElementById("fansGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" style="padding:14px;text-align:center" onclick="location.href='player.html?id=${s.id}'">
      <img src="${coverOf(s)||''}" style="width:70px;height:70px;border-radius:999px;margin:0 auto;display:block;border:2px solid #1DB954">
      <div class="t" style="margin-top:8px;text-align:center">${smartArtist(s)}</div>
    </div>`).join("");

  document.getElementById("recGrid").innerHTML=ordered.slice(0,8).map(s=>`
    <div class="card" onclick="location.href='player.html?id=${s.id}'"><img src="${coverOf(s)||''}"><div class="card-info"><div class="t">${s.title||"Song"}</div><div class="a">${smartArtist(s)}</div></div></div>`).join("");
}
function toggle(){ if(audio.paused){audio.play();document.getElementById("playBtn").textContent="⏸";} else{audio.pause();document.getElementById("playBtn").textContent="▶";} }
audio.ontimeupdate=()=>{ document.getElementById("fill").style.width=(audio.currentTime/(audio.duration||15)*100)+"%"; document.getElementById("cur").textContent=`0:${String(Math.floor(audio.currentTime%60)).padStart(2,"0")}`; }
audio.onended=()=>next();
function next(){ idx=(idx+1)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function prev(){ idx=(idx-1+list.length)%list.length; load(idx); audio.play(); document.getElementById("playBtn").textContent="⏸"; }
function updateHeart(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx]?.id||""); let h=document.getElementById("heart"); if(w.includes(id)){h.classList.add("active");h.textContent="♥ Favorited";} else{h.classList.remove("active");h.textContent="♡ Favorite";} }
function fav(){ let w=JSON.parse(localStorage.getItem('wishlist')||'[]'); let id=String(list[idx].id); if(w.includes(id)) w=w.filter(x=>x!==id); else w.push(id); localStorage.setItem('wishlist',JSON.stringify(w)); updateHeart(); }
function buy(){ let s=list[idx]; location.href=(s.beat_name?"beats.html":"song.html")+`?id=${s.id}`; }
function shareNow(){ navigator.clipboard.writeText(location.href); alert("Link copied"); }
init();
</script>
</body>
</html>
