<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Matching - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#16a34a;border:none;border-radius:30px;font-weight:bold;color:#fff;cursor:pointer}</style>
</head><body>
<div class="card">
<h2 style="color:#22c55e">Find Matching Studios</h2>
<p>Price: UGX 10,000 per studio - We match you to 3 best studios</p>
<form id="matchingForm">
<input type="text" name="name" placeholder="Your Artist Name" required>
<input type="tel" name="phone" placeholder="Phone" required>
<select name="budget"><option>Budget: UGX 50k-100k</option><option>UGX 100k-200k</option><option>UGX 200k+</option></select>
<select name="service"><option>Need: Recording</option><option>Mixing & Mastering</option><option>Beats</option><option>Full Package</option></select>
<textarea name="details" placeholder="Tell us your song & needs"></textarea>
<button type="submit">Find Matches - UGX 10k/studio</button>
</form>
</div>
<script>
document.getElementById('matchingForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `MATCHING LEADS:\nName:${data.name}\nPhone:${data.phone}\nBudget:${data.budget}\nService:${data.service}\nDetails:${data.details}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
}
</script>
</body></html>
