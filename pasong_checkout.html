<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PASONG Checkout</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:20px;
}

.header{
  text-align:center;
  padding:20px 0;
}

.logo{
  font-size:30px;
  font-weight:bold;
  background:linear-gradient(
    90deg,
    #8b5cf6,
    #c084fc,
    #ec4899
  );
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card{
  background:#11111c;
  border:1px solid #29293c;
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

h1{
  font-size:24px;
  margin-bottom:8px;
}

.subtitle{
  color:#aaa;
  margin-bottom:22px;
}

.price{
  font-size:28px;
  font-weight:bold;
  margin:20px 0;
  color:#c084fc;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ddd;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #33334a;
  background:#080810;
  color:white;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#8b5cf6;
}

.payment-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:20px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.mtn{
  background:#8b5cf6;
}

.airtel{
  background:#ec4899;
}

.message{
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#0b0b15;
  border:1px solid #29293c;
  line-height:1.6;
  word-break:break-word;
}

.success{
  color:#86efac;
}

.error{
  color:#fca5a5;
}

.pending{
  color:#c084fc;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:15px;
  line-height:1.5;
}

.spinner{
  display:inline-block;
  width:15px;
  height:15px;
  border:2px solid #555;
  border-top-color:#c084fc;
  border-radius:50%;
  animation:spin 1s linear infinite;
  vertical-align:middle;
  margin-right:7px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#c084fc;
  text-decoration:none;
}

@media(max-width:480px){
  .container{
    padding:14px;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">◈ PASONG</div>
  </div>

  <div class="card">

    <h1>Checkout</h1>

    <div class="subtitle">
      Complete your payment securely.
    </div>

    <div id="songInfo">
      Loading...
    </div>

    <div class="price" id="price">
      UGX 700
    </div>

    <label for="phone">
      MTN Mobile Money Number
    </label>

    <input
      id="phone"
      type="tel"
      placeholder="07XXXXXXXX"
      autocomplete="tel"
    >

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
    >

    <div class="payment-buttons">

      <button
        id="mtnBtn"
        class="mtn"
        onclick="startMtnPayment()"
      >
        Pay with MTN MoMo
      </button>

      <button
        id="airtelBtn"
        class="airtel"
        onclick="startAirtelPayment()"
      >
        Pay with Airtel Money
      </button>

    </div>

    <div id="msg" class="message">
      Select a payment method to continue.
    </div>

    <div class="small">
      Your payment is processed securely. Do not make another
      payment while a payment request is still being checked.
    </div>

    <a href="index.html" class="back">
      ← Back to PASONG
    </a>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==============================
   PASONG CONFIG
============================== */

const PAYMENT_API =
  "https://pasong-mom.vercel.app/api/pay";

const API_BASE =
  "https://pasong-api.onrender.com";

const SUPABASE_URL =
  "https://mtufczmjlkvycarxylgh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==============================
   VARIABLES
============================== */

let currentReference = null;
let pollingTimer = null;

const POLL_INTERVAL = 5000;
const MAX_POLLS = 60;


/* ==============================
   HTML ESCAPE
============================== */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
   CHECKOUT SESSION
============================== */

function getCheckoutSession(){

  try{

    const raw =
      sessionStorage.getItem(
        "pasongCheckout"
      );

    if(!raw){
      return null;
    }

    return JSON.parse(raw);

  }catch(error){

    console.error(
      "Checkout session error:",
      error
    );

    return null;
  }

}


/* ==============================
   LOAD SONG
============================== */

async function loadSong(){

  const session =
    getCheckoutSession();

  if(!session){

    document.getElementById(
      "songInfo"
    ).innerHTML =
      '<span class="error">' +
      'Checkout session not found.' +
      '</span>';

    return;
  }

  const songId =
    session.songId;

  if(!songId){

    document.getElementById(
      "songInfo"
    ).innerHTML =
      '<span class="error">' +
      'Song information is missing.' +
      '</span>';

    return;
  }

  try{

    const response =
      await fetch(
        API_BASE +
        "/api/songs"
      );

    const songs =
      await response.json();

    const song =
      Array.isArray(songs)
        ? songs.find(
            s => String(s.id) === String(songId)
          )
        : null;

    if(song){

      document.getElementById(
        "songInfo"
      ).innerHTML =
        "<strong>" +
        escapeHTML(song.title) +
        "</strong><br>" +
        "by " +
        escapeHTML(
          song.artist_name ||
          song.performing_name ||
          "Artist"
        );

      const price =
        Number(song.price || 700);

      document.getElementById(
        "price"
      ).textContent =
        "UGX " +
        price.toLocaleString();

    }else{

      document.getElementById(
        "songInfo"
      ).innerHTML =
        "PASONG Music";

    }

  }catch(error){

    console.error(
      "Song loading error:",
      error
    );

    document.getElementById(
      "songInfo"
    ).innerHTML =
      "PASONG Music";

  }

}


/* ==============================
   SESSION TOKEN
============================== */

async function getAccessToken(){

  const {
    data,
    error
  } =
    await supabaseClient.auth.getSession();

  if(error){
    throw error;
  }

  return data &&
    data.session
      ? data.session.access_token
      : null;

}


/* ==============================
   PHONE NORMALIZATION
============================== */

function normalizeUgandaPhone(phone){

  let value =
    String(phone || "")
      .replace(/\s+/g,"")
      .replace(/-/g,"");

  if(value.startsWith("+256")){
    value =
      "0" +
      value.substring(4);
  }

  if(value.startsWith("256")){
    value =
      "0" +
      value.substring(3);
  }

  return value;

}


/* ==============================
   VALIDATE PHONE
============================== */

function validUgandaPhone(phone){

  return /^07\d{8}$/.test(phone);

}


/* ==============================
   DISABLE BUTTONS
============================== */

function setPaymentButtonsDisabled(
  disabled
){

  document.getElementById(
    "mtnBtn"
  ).disabled = disabled;

  document.getElementById(
    "airtelBtn"
  ).disabled = disabled;

}


/* ==============================
   MTN PAYMENT
============================== */

async function startMtnPayment(){

  const phone =
    normalizeUgandaPhone(
      document.getElementById(
        "phone"
      ).value
    );

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const session =
    getCheckoutSession();

  if(!session){

    document.getElementById(
      "msg"
    ).innerHTML =
      '<span class="error">' +
      'Checkout session not found.' +
      '</span>';

    return;
  }

  if(!session.songId){

    document.getElementById(
      "msg"
    ).innerHTML =
      '<span class="error">' +
      'Song ID is missing.' +
      '</span>';

    return;
  }

  if(!validUgandaPhone(phone)){

    document.getElementById(
      "msg"
    ).innerHTML =
      '<span class="error">' +
      'Enter a valid Uganda mobile number, ' +
      'for example 0769719539.' +
      '</span>';

    return;
  }

  setPaymentButtonsDisabled(true);

  document.getElementById(
    "msg"
  ).innerHTML =
    '<span class="pending">' +
    '<span class="spinner"></span>' +
    'Starting MTN payment...' +
    '</span>';

  try{

    const token =
      await getAccessToken();

    const payload = {

      songId:
        session.songId,

      content_type:
        session.content_type ||
        "song",

      amount:
        session.amount ||
        700,

      currency:
        session.currency ||
        "UGX",

      phone:
        phone,

      email:
        email,

      method:
        "MTN MoMo",

      country:
        session.country ||
        "UG",

      songAmount:
        session.songAmount ||
        session.amount ||
        700,

      tipAmount:
        session.tipAmount ||
        0,

      artistPercentage:
        session.artistPercentage ||
        70,

      pasongPercentage:
        session.pasongPercentage ||
        30

    };

    const response =
      await fetch(
        PAYMENT_API,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            ...(token
              ? {
                  Authorization:
                    "Bearer " +
                    token
                }
              : {})
          },

          body:
            JSON.stringify(payload)
        }
      );

    const rawText =
      await response.text();

    let data = {};

    try{

      data =
        rawText
          ? JSON.parse(rawText)
          : {};

    }catch(parseError){

      data = {};

    }

    if(!response.ok){

      throw new Error(

        "HTTP " +
        response.status +
        " — " +

        (
          data.error ||
          data.message ||
          data.details ||
          rawText ||
          "Unable to start MTN payment."
        )

      );

    }

    if(
      !data.referenceId &&
      !data.reference
    ){

      throw new Error(

        data.error ||
        data.message ||
        "MTN did not return a payment reference."

      );

    }

    currentReference =
      data.referenceId ||
      data.reference;

    document.getElementById(
      "msg"
    ).innerHTML =

      '<span class="pending">' +

      '<b>MTN payment request sent.</b>' +

      '<br><br>' +

      'Please approve the payment request ' +
      'on your MTN phone.' +

      '<br><br>' +

      'Amount: UGX ' +
      Number(
        session.amount || 700
      ).toLocaleString() +

      '<br>' +

      'Reference: ' +
      escapeHTML(
        currentReference
      ) +

      '<br><br>' +

      '<span class="spinner"></span>' +

      'Waiting for MTN confirmation...' +

      '</span>';

    startPolling();

  }catch(error){

    console.error(
      "MTN payment error:",
      error
    );

    document.getElementById(
      "msg"
    ).innerHTML =

      '<span class="error">' +

      '<b>MTN payment error:</b>' +

      '</span><br><br>' +

      escapeHTML(
        error.message ||
        String(error) ||
        "Unable to start payment."
      );

    setPaymentButtonsDisabled(false);

  }

}


/* ==============================
   START POLLING
============================== */

function startPolling(){

  stopPolling();

  let attempts = 0;

  async function check(){

    attempts++;

    if(!currentReference){

      return;
    }

    try{

      const token =
        await getAccessToken();

      const response =
        await fetch(

          PAYMENT_API +
          "?reference=" +
          encodeURIComponent(
            currentReference
          ),

          {
            method:"GET",

            headers:{

              "Accept":
                "application/json",

              ...(token
                ? {
                    Authorization:
                      "Bearer " +
                      token
                  }
                : {})
            }

          }

        );


      /*
       * IMPORTANT:
       * Read the raw response first.
       * This allows us to see the real
       * MTN/Vercel error instead of
       * showing a blank error message.
       */

      const rawText =
        await response.text();

      let data = {};

      try{

        data =
          rawText
            ? JSON.parse(rawText)
            : {};

      }catch(parseError){

        data = {};

      }


      if(!response.ok){

        throw new Error(

          "HTTP " +
          response.status +
          " — " +

          (
            data.error ||
            data.message ||
            data.details ||
            rawText ||
            "Unable to check payment status."
          )

        );

      }


      /*
       * If the server returned an empty
       * response, show it clearly.
       */

      if(
        !rawText &&
        !data
      ){

        throw new Error(
          "Empty response from payment server."
        );

      }


      console.log(
        "Payment status:",
        data
      );


      const mtnStatus =
        String(
          data.status ||
          data.mtn_status ||
          ""
        ).toUpperCase();


      /*
       * SUCCESS
       */

      if(
        mtnStatus ===
        "SUCCESSFUL" &&
        data.paid === true &&
        data.pasong_completed === true
      ){

        stopPolling();

        paymentSuccessful(
          data
        );

        return;
      }


      /*
       * PAYMENT RECEIVED BUT
       * PASONG COMPLETION IS STILL RUNNING
       */

      if(
        mtnStatus ===
        "SUCCESSFUL" &&
        data.paid === true &&
        data.pasong_completed !== true
      ){

        document.getElementById(
          "msg"
        ).innerHTML =

          '<span class="pending">' +

          '<b>Payment received.</b>' +

          '<br><br>' +

          'PASONG is securely recording ' +
          'your purchase...' +

          '<br><br>' +

          '<span class="spinner"></span>' +

          'Please wait.' +

          '</span>';

        pollingTimer =
          setTimeout(
            check,
            POLL_INTERVAL
          );

        return;
      }


      /*
       * FAILED
       */

      if(
        mtnStatus ===
          "FAILED" ||
        mtnStatus ===
          "REJECTED"
      ){

        stopPolling();

        document.getElementById(
          "msg"
        ).innerHTML =

          '<span class="error">' +

          '<b>Payment failed.</b>' +

          '<br><br>' +

          escapeHTML(
            data.reason ||
            data.message ||
            "The MTN payment was not successful."
          ) +

          '</span>';

        setPaymentButtonsDisabled(false);

        return;
      }


      /*
       * STILL PENDING
       */

      document.getElementById(
        "msg"
      ).innerHTML =

        '<span class="pending">' +

        '<span class="spinner"></span>' +

        '<b>Payment pending...</b>' +

        '<br><br>' +

        'Please approve the payment ' +
        'request on your MTN phone.' +

        '<br><br>' +

        'Waiting for confirmation...' +

        '<br><br>' +

        'Check ' +
        attempts +
        ' of ' +
        MAX_POLLS +

        '</span>';


      if(
        attempts >=
        MAX_POLLS
      ){

        stopPolling();

        document.getElementById(
          "msg"
        ).innerHTML +=

          '<br><br>' +

          '<span class="error">' +

          'No payment has been marked ' +
          'successful. ' +

          'Please do not pay again until ' +
          'the problem is resolved.' +

          '</span>';

        setPaymentButtonsDisabled(false);

        return;
      }


      pollingTimer =
        setTimeout(
          check,
          POLL_INTERVAL
        );


    }catch(error){

      console.error(
        "Payment status error:",
        error
      );


      /*
       * SHOW THE REAL ERROR.
       */

      document.getElementById(
        "msg"
      ).innerHTML =

        '<span class="error">' +

        '<b>Payment status check error:</b>' +

        '</span><br><br>' +

        escapeHTML(

          error &&
          (
            error.message ||
            String(error)
          )

          ||

          "Unknown payment status error."

        ) +

        '<br><br>' +

        'Check ' +
        attempts +
        ' of ' +
        MAX_POLLS;


      if(
        attempts >=
        MAX_POLLS
      ){

        stopPolling();

        document.getElementById(
          "msg"
        ).innerHTML +=

          '<br><br>' +

          'No payment has been marked successful. ' +

          'Please do not pay again until the problem is resolved.';

        setPaymentButtonsDisabled(false);

        return;
      }


      pollingTimer =
        setTimeout(
          check,
          POLL_INTERVAL
        );

    }

  }


  check();

}


/* ==============================
   STOP POLLING
============================== */

function stopPolling(){

  if(pollingTimer){

    clearTimeout(
      pollingTimer
    );

    pollingTimer = null;

  }

}


/* ==============================
   PAYMENT SUCCESSFUL
============================== */

function paymentSuccessful(
  data
){

  document.getElementById(
    "msg"
  ).innerHTML =

    '<span class="success">' +

    '<b>Payment successful! 🎉</b>' +

    '<br><br>' +

    'Your PASONG purchase has been ' +
    'recorded successfully.' +

    '<br><br>' +

    'You can find the song in ' +
    'My Downloads.' +

    '</span>';

  setPaymentButtonsDisabled(false);

}


/* ==============================
   AIRTEL
============================== */

function startAirtelPayment(){

  document.getElementById(
    "msg"
  ).innerHTML =

    '<span class="pending">' +

    '<b>Airtel Money</b>' +

    '<br><br>' +

    'Airtel Money is not connected yet.' +

    '</span>';

}


/* ==============================
   LOAD
============================== */

loadSong();

</script>

</body>
</html>
