<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasong Music Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:white;font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:48px;font-weight:800;letter-spacing:-2px;margin-bottom:10px}
.subtitle{color:#777;margin-bottom:50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px;width:100%;max-width:1100px}
.card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-radius:20px;
  padding:16px;
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s
}
.card:hover{background:rgba(255,255,255,0.06);border-color:rgba(168,85,247,0.3);transform:translateY(-4px)}
.cover{width:100%;aspect-ratio:1;background:rgba(0,0,0,0.3);border-radius:14px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid rgba(255,255,255,0.05)}
/* WHITE + PURPLE GLOW - NO YELLOW */
.play-btn{width:56px;height:56px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;z-index:1}
.play-btn::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#a855f7,#ec4899,#8b5cf6,#a855f7);animation:spin 2s linear infinite;z-index:-1}
.play-btn::after{content:'';position:absolute;inset:0;border-radius:50%;background:white;z-index:-1}
.play-btn svg{width:22px;height:22px;fill:black;margin-left:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.play-btn{box-shadow:0 0 20px rgba(168,85,247,0.6),0 0 40px rgba(168,85,247,0.25)}
.info h3{font-size:16px;margin-bottom:4px}
.info p{font-size:13px;color:#888}
</style>
</head>
<body>
<h1>Pasong</h1>
<p class="subtitle">Music Store • Transparent Glass</p>
<div class="grid">
<div class="card"><div class="cover"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div></div><div class="info"><h3>Midnight Vibes</h3><p>Kivumbi • 3:42</p></div></div>
<div class="card"><div class="cover"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div></div><div class="info"><h3>Urban Dreams</h3><p>Pasong • 2:58</p></div></div>
<div class="card"><div class="cover"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div></div><div class="info"><h3>Neon Lights</h3><p>DJ Lenz • 4:11</p></div></div>
</div>
</body>
</html>
