<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASONG Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#07090b;color:#fff}header{height:76px;border-bottom:1px solid #272b30;display:flex;align-items:center;padding:0 5%;gap:22px;position:sticky;top:0;background:#07090b;z-index:20}.logo{font-size:27px;font-weight:900}.logo span{color:#c850ff}.nav{display:flex;gap:20px;font-weight:700}.nav .active{color:#c850ff}.search{margin-left:auto;width:260px;background:#15191e;border:1px solid #343941;border-radius:25px;padding:11px 16px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#111519;border:1px solid #2f2a3d;border-radius:14px;overflow:hidden;position:relative}.card::before{content:'';position:absolute;inset:-2px;background:linear-gradient(90deg,#c850ff,#ff6bd5,#8a5cff,#c850ff);background-size:300% 300%;animation:moveBorder 3s linear infinite;border-radius:16px;z-index:-1;filter:blur(1px)}@keyframes moveBorder{0%{background-position:0% 50%}100%{background-position:300% 50%}}.cover{height:220px;position:relative;background:#222}.cover img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);cursor:pointer}.play div{width:66px;height:66px;background:#ffffff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:28px;font-weight:900;animation:pulsePurple 1.8s infinite}.pulse{box-shadow:0 0 0 0 rgba(200,80,255,.9)}@keyframes pulsePurple{0%{box-shadow:0 0 0 0 rgba(200,80,255,.9)}70%{box-shadow:0 0 0 20px rgba(200,80,255,0)}100%{box-shadow:0 0 0 0 rgba(200,80,255,0)}}.body{padding:15px}.price{color:#d27bff;font-weight:900}.btns{display:flex;gap:8px;margin-top:10px}.btns button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.btns .v{background:#252a30;color:#fff}.btns .b{background:linear-gradient(90deg,#c850ff,#a855f7);color:#fff}</style></head><body>
<header><a class="logo" href="/">◉ PA<span>SONG</span></a><nav class="nav"><a href="/">Home</a><a class="active" href="#">Music Store</a></nav><input id="s" class="search" placeholder="Search..." oninput="render()"></header>
<div style="width:90%;max-width:1250px;margin:auto;padding:30px 0"><h1>Music Store</h1><div id="grid" class="grid"></div></div>
<script>const API="https://pasong-api.vercel.app";let prods=[];async function load(){const r=await fetch(API+"/api/songs");const d=await r.json();prods=d.songs||[];render()}function render(){const q=document.getElementById('s').value.toLowerCase();const list=prods.filter(p=>p.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><div class="cover">${p.cover_url?`<img src="${p.cover_url}">`:`<div style="padding:20px">${p.title}</div>`}<div class="play" onclick="playIt('${p.id}')"><div id="b-${p.id}">▶</div></div><audio id="a-${p.id}" src="${p.audio_url||p.preview_url}"></audio></div><div class="body"><h3>${p.title}</h3><div style="color:#999">${p.genre}</div><div class="price">UGX ${p.price}</div><div class="btns"><button class="v" onclick="location.href='pasong_checkout.html?songId=${p.id}'">View</button><button class="b" onclick="location.href='pasong_checkout.html?songId=${p.id}'">Buy</button></div></div></div>`).join('')}let cur=null,btn=null,t=null;function playIt(id){const a=document.getElementById('a-'+id),b=document.getElementById('b-'+id);if(cur&&cur!==a){cur.pause();cur.currentTime=0;if(btn)btn.textContent='▶'}if(a.paused){a.currentTime=0;a.play();b.textContent='⏸';cur=a;btn=b;clearTimeout(t);t=setTimeout(()=>{a.pause();b.textContent='▶'},20000)}else{a.pause();b.textContent='▶'}}load();</script></body></html>
