<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Store</title><style>body{margin:0;font-family:Arial;background:#07090b;color:#fff}header{height:76px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 5%;gap:20px;background:#07090b;position:sticky;top:0}.logo{font-size:27px;font-weight:900}.logo span{color:#c850ff}.nav{display:flex;gap:18px;font-weight:700}.active{color:#c850ff}.search{margin-left:auto;width:240px;background:#15191e;border:1px solid #333;border-radius:20px;padding:10px 14px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#111519;border:1px solid #2a2f37;border-radius:12px;overflow:hidden}.cover{height:210px;position:relative;background:#222}.cover img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer}.play div{width:64px;height:64px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:28px;animation:pulse 1.8s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #c850ff}70%{box-shadow:0 0 0 18px transparent}100%{box-shadow:0 0 0 0 transparent}}.body{padding:14px}.price{color:#d27bff;font-weight:900}.btns{display:flex;gap:7px;margin-top:10px}.btns button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800}.v{background:#252a30;color:#fff}.b{background:#c850ff;color:#fff}</style></head><body><header><div class="logo">PA<span>SONG</span></div><div class="nav"><a href="/">Home</a><a class="active">Music Store</a></div><input id="s" class="search" placeholder="Search..." oninput="render()"></header><div style="width:92%;max-width:1200px;margin:auto;padding:25px 0"><h1>Music Store</h1><div id="grid" class="grid"></div></div><script>const API="https://pasong-api.vercel.app";let all=[];async function load(){let r=await fetch(API+"/api/songs");let d=await r.json();all=d.songs||[];render()}function render(){let q=document.getElementById('s').value.toLowerCase();let f=all.filter(x=>x.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=f.map(p=>`<div class="card"><div class="cover">${p.cover_url?`<img src="${p.cover_url}">`:p.title}<div class="play" onclick="playIt('${p.id}')"><div id="b-${p.id}">▶</div></div><audio id="a-${p.id}" src="${p.audio_url||p.preview_url}"></audio></div><div class="body"><h3>${p.title}</h3><div style="color:#888">${p.genre}</div><div class="price">UGX ${p.price}</div><div class="btns"><button class="v">View</button><button class="b">Buy</button></div></div></div>`).join('')}let cur=null,bb=null,tt=null;function playIt(id){let a=document.getElementById('a-'+id),b=document.getElementById('b-'+id);if(cur&&cur!=a){cur.pause();cur.currentTime=0;if(bb)bb.textContent='▶'}if(a.paused){a.currentTime=0;a.play();b.textContent='⏸';cur=a;bb=b;clearTimeout(tt);tt=setTimeout(()=>{a.pause();b.textContent='▶'},20000)}else{a.pause();b.textContent='▶'}}load();</script></body></html>
