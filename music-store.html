<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASONG — Music Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07090b;color:#fff}button,input{font:inherit}a{text-decoration:none;color:inherit}
header{height:76px;border-bottom:1px solid #272b30;display:flex;align-items:center;padding:0 5%;gap:24px;position:sticky;top:0;background:#07090b;z-index:20}.logo{font-size:27px;font-weight:900}.logo span{color:#ffb414}.logo small{display:block;font-size:7px;letter-spacing:4px;color:#888}.nav{display:flex;gap:22px;font-size:14px;font-weight:700}.nav a:hover,.nav .active{color:#ffb414}.topsearch{margin-left:auto;width:270px;background:#15191e;border:1px solid #343941;border-radius:25px;padding:11px 16px;color:#fff;outline:none}.cart{font-size:22px;cursor:pointer}.count{background:#ffb414;color:#111;border-radius:50%;font-size:10px;padding:2px 5px;vertical-align:top}
.container{width:90%;max-width:1250px;margin:auto}.title{padding:42px 0 20px}.title h1{font-size:42px;margin:0 0 8px}.title p{color:#999;margin:0}.filters{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap}.filter{background:#15191e;border:1px solid #30353b;color:#ddd;border-radius:20px;padding:9px 16px;cursor:pointer}.filter.active,.filter:hover{background:#ffb414;color:#111;border-color:#ffb414}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#111519;border:1px solid #292f35;border-radius:13px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#ffb414}.cover{height:220px;padding:18px;display:flex;align-items:flex-end;font-size:34px;font-weight:900;color:#ffb414;background:linear-gradient(135deg,#44210b,#101b29)}.c2{background:linear-gradient(135deg,#444,#111)}.c3{background:linear-gradient(135deg,#867a61,#17191d)}.c4{background:linear-gradient(135deg,#a63a0e,#20100c)}.c5{background:linear-gradient(135deg,#07558e,#07101a)}.c6{background:linear-gradient(135deg,#44413d,#111)}
.body{padding:15px}.body h3{margin:0;font-size:17px}.artist{color:#999;font-size:13px;margin:4px 0 10px}.price{color:#ffb414;font-weight:900;margin-bottom:13px}.actions{display:flex;gap:8px}.preview,.buy{border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:800}.preview{background:#252a30;color:#fff;flex:1}.buy{background:#ffb414;color:#111;flex:1}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{width:100%;max-width:760px;background:#111519;border:1px solid #343941;border-radius:16px;padding:25px;position:relative}.close{position:absolute;right:18px;top:14px;background:none;border:0;color:#aaa;font-size:25px;cursor:pointer}.detail{display:grid;grid-template-columns:260px 1fr;gap:25px}.detail-cover{height:260px;border-radius:12px;background:linear-gradient(135deg,#ffb414,#211306);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:900;color:#111}.detail h2{font-size:30px;margin:0}.muted{color:#999}.buybig{margin-top:20px;background:#ffb414;border:0;border-radius:10px;padding:13px 22px;font-weight:900;cursor:pointer;width:100%}
.cartpanel{display:none;position:fixed;right:20px;top:85px;width:340px;background:#111519;border:1px solid #3a3f45;border-radius:14px;padding:20px;z-index:40;box-shadow:0 15px 50px #000}.cartpanel.show{display:block}.cartrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292e34}.checkout{width:100%;margin-top:15px;padding:13px;background:#ffb414;border:0;border-radius:10px;font-weight:900}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#ffb414;color:#111;padding:13px 20px;border-radius:10px;font-weight:800;display:none;z-index:100}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}.topsearch{margin-left:auto}.detail{grid-template-columns:1fr}.detail-cover{height:190px}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.topsearch{width:180px}.title h1{font-size:32px}}
</style>
</head>
<body>

<header>
 <a class="logo" href="index.html">◉ PA<span>SONG</span><small>MUSIC MARKETPLACE</small></a>
 <nav class="nav"><a href="index.html">Home</a><a class="active" href="#">Music Store</a><a href="upload.html">Upload Song</a><a href="#">Artists</a><a href="#">Albums</a><a href="#">Beats</a></nav>
 <input id="search" class="topsearch" placeholder="Search music..." oninput="render()">
 <div class="cart" onclick="toggleCart()">🛒 <span id="count" class="count">0</span></div>
</header>

<main class="container">
 <section class="title"><h1>Music Store</h1><p>Discover and buy songs from independent artists on PASONG.</p></section>
 <div class="filters"><button class="filter active" onclick="setFilter('all',this)">All</button><button class="filter" onclick="setFilter('songs',this)">Songs</button><button class="filter" onclick="setFilter('albums',this)">Albums</button><button class="filter" onclick="setFilter('beats',this)">Beats</button></div>
 <section id="grid" class="grid"></section>
</main>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
 <div class="box"><button class="close" onclick="closeDetail()">×</button><div class="detail">
  <div id="detailCover" class="detail-cover"></div>
  <div><p class="muted">PASONG MUSIC STORE</p><h2 id="detailTitle"></h2><p id="detailArtist" class="muted"></p><p id="detailType"></p><h3 id="detailPrice" style="color:#ffb414"></h3><p class="muted">Digital purchase • Instant download after successful payment.</p><audio id="player" controls style="width:100%;margin-top:10px"></audio><button id="detailBuy" class="buybig">Buy Now</button></div>
 </div></div>
</div>

<div id="cartPanel" class="cartpanel">
 <h2>Your Cart</h2><div id="cartItems"></div><h3 id="total"></h3><button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>
<div id="toast"></div>

<script>
const API_BASE = "https://pasong-api.vercel.app";
let products = [];
let filter = "all", cart = [];

function money(n){ return "UGX " + Number(n || 2000).toLocaleString(); }

async function loadProducts(){
  try {
    const r = await fetch(API_BASE + "/api/songs");
    const data = await r.json();
    products = (data.songs || []).map((s, i) => ({
      id: s.id || ("song-" + i),
      title: s.songTitle || "Untitled Song",
      artist: s.artistName || "Unknown Artist",
      price: 2000,
      type: "songs",
      coverUrl: s.coverUrl || ""
    }));
    render();
  } catch(e) {
    document.getElementById("grid").innerHTML =
      '<p style="color:#999">Could not load songs. Please refresh.</p>';
  }
}

function render(){
  const q = document.getElementById("search").value.toLowerCase();
  const list = products.filter(p =>
    (filter === "all" || p.type === filter) &&
    (`${p.title} ${p.artist}`.toLowerCase().includes(q))
  );

  document.getElementById("grid").innerHTML =
    list.map(p => `
      <article class="card">
        <div class="cover ${p.coverUrl ? '' : 'c1'}"
             style="${p.coverUrl ? `background-image:url('${p.coverUrl}');background-size:cover;background-position:center;` : ''}">
          ${p.coverUrl ? '' : escapeHtml(p.title)}
        </div>
        <div class="body">
          <h3>${escapeHtml(p.title)}</h3>
          <div class="artist">${escapeHtml(p.artist)}</div>
          <div class="price">${money(p.price)}</div>
          <div class="actions">
            <button class="preview" onclick="openDetail('${encodeURIComponent(p.id)}')">View</button>
            <button class="buy" onclick="addToCart('${encodeURIComponent(p.id)}')">Buy Now</button>
          </div>
        </div>
      </article>
    `).join("") || "<p>No music found.</p>";
}

function escapeHtml(v){
  return String(v).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  el.classList.add("active");
  render();
}

function getProduct(id){
  return products.find(x => x.id === id);
}

function openDetail(encodedId){
  const p = getProduct(decodeURIComponent(encodedId));
  if(!p) return;
  detailTitle.textContent = p.title;
  detailArtist.textContent = "By " + p.artist;
  detailType.textContent = "Category: " + p.type;
  detailPrice.textContent = money(p.price);
  detailCover.textContent = p.coverUrl ? "" : p.title;
  detailCover.style.backgroundImage = p.coverUrl ? `url('${p.coverUrl}')` : "";
  detailCover.style.backgroundSize = "cover";
  detailCover.style.backgroundPosition = "center";
  player.removeAttribute("src");
  detailBuy.onclick = () => addToCart(p.id);
  detailModal.classList.add("show");
}

function closeDetail(){ detailModal.classList.remove("show"); player.pause(); }

function addToCart(id){
  if(!cart.includes(id)) cart.push(id);
  updateCart();
  toast("Added to cart");
}

function updateCart(){
  count.textContent = cart.length;
  cartItems.innerHTML = cart.length
    ? cart.map(id => {
        const p = getProduct(id);
        return `<div class="cartrow"><span>${escapeHtml(p.title)}<br><small class="muted">${escapeHtml(p.artist)}</small></span><b>${money(p.price)}</b></div>`;
      }).join("")
    : "<p class='muted'>Your cart is empty.</p>";
  total.textContent = cart.length
    ? "Total: " + money(cart.reduce((s,id)=>s + getProduct(id).price,0))
    : "";
}

function toggleCart(){ cartPanel.classList.toggle("show"); updateCart(); }

function checkout(){
  if(!cart.length) return toast("Your cart is empty");
  const p = getProduct(cart[0].id || cart[0]);
  location.href = "pasong_checkout.html?song=" + encodeURIComponent(p.title);
}

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.style.display="block";
  setTimeout(()=>t.style.display="none",2200);
}

loadProducts();
</script>
</body>
</html>
