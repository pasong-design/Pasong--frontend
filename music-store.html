<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PASONG Music Store</title>

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

/* =========================
   NAVIGATION
========================= */

nav{
  display:flex;
  align-items:center;
  gap:24px;

  padding:15px 22px;

  background:#0a0a14;

  border-bottom:1px solid rgba(255,255,255,.06);

  position:sticky;
  top:0;
  z-index:1000;

  flex-wrap:wrap;
}

nav b{
  font-size:22px;
  font-weight:800;
}

nav b span{
  color:#c084fc;
}

nav a{
  color:#888;
  text-decoration:none;
  font-size:13px;
}

nav a:hover{
  color:#c084fc;
}

nav a.active{
  color:#c084fc;
  border-bottom:2px solid #a855f7;
  padding-bottom:4px;
}

.nav-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-icon{
  color:#aaa;
  text-decoration:none;
  font-size:19px;
}


/* =========================
   MAIN
========================= */

.wrap{
  max-width:900px;
  margin:auto;

  padding:28px 18px 60px;
}

h1{
  font-size:32px;
  font-weight:800;
}

h1 span{
  color:#c026d3;
}

.sub{
  color:#888;
  font-size:13px;
  margin-top:6px;
}

.line{
  width:48px;
  height:3px;

  background:#c026d3;

  border-radius:10px;

  margin:12px 0 25px;
}


/* =========================
   FLYERS
========================= */

.flyers-section{
  margin-bottom:32px;
}

.flyers-title{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;
}

.flyers-title h2{
  font-size:17px;
  font-weight:700;
}

.flyers-title span{
  color:#777;
  font-size:11px;
}

.flyers{
  display:flex;
  gap:14px;

  overflow-x:auto;

  padding-bottom:8px;

  scroll-snap-type:x mandatory;
}

.flyers::-webkit-scrollbar{
  height:5px;
}

.flyers::-webkit-scrollbar-thumb{
  background:#2a2035;
  border-radius:10px;
}


/* INDIVIDUAL FLYER */

.flyer{
  flex:0 0 270px;

  height:150px;

  border-radius:16px;

  overflow:hidden;

  position:relative;

  background:#11111d;

  border:1px solid rgba(255,255,255,.08);

  scroll-snap-align:start;
}

.flyer img{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;
}


/* =========================
   TRANSPARENT FLYER PLAY
========================= */

.flyer-play{

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:62px;
  height:62px;

  display:flex !important;

  align-items:center;
  justify-content:center;

  z-index:20;

  border-radius:50%;

  background:rgba(8,8,16,.35);

  border:2px solid rgba(255,255,255,.9);

  color:#fff;

  font-size:23px;

  line-height:1;

  cursor:pointer;

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);

  box-shadow:
    0 4px 20px rgba(0,0,0,.5);

  transition:.2s ease;
}

.flyer-play:hover{

  background:rgba(8,8,16,.6);

  border-color:#c084fc;

  transform:
    translate(-50%,-50%)
    scale(1.08);
}

.flyer-play:active{

  transform:
    translate(-50%,-50%)
    scale(.94);
}


/* =========================
   FLYER TEXT
========================= */

.flyer-overlay{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  z-index:10;

  padding:40px 12px 10px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.9)
    );
}

.flyer-overlay strong{
  font-size:14px;
}

.flyer-overlay small{
  display:block;

  color:#bbb;

  font-size:10px;

  margin-top:3px;
}


/* =========================
   SONG SECTION
========================= */

.section-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:12px;
}

.section-title h2{
  font-size:18px;
}

#status{

  color:#777;

  font-size:12px;

  margin-bottom:15px;
}


/* =========================
   SONG LIST
========================= */

.song-list{

  display:flex;

  flex-direction:column;

  gap:10px;
}

.song{

  display:flex;

  align-items:center;

  gap:12px;

  padding:11px;

  background:#10101a;

  border:1px solid rgba(255,255,255,.06);

  border-radius:15px;
}


/* COVER */

.cover{

  width:58px;
  height:58px;

  flex-shrink:0;

  border-radius:11px;

  object-fit:cover;

  background:#1b1622;
}


/* SONG INFORMATION */

.song-info{

  flex:1;

  min-width:0;
}

.song-title{

  font-size:14px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.song-artist{

  color:#888;

  font-size:11px;

  margin-top:4px;
}

.song-price{

  color:#c084fc;

  font-size:12px;

  margin-top:5px;

  font-weight:700;
}


/* =========================
   SONG PLAY BUTTON
========================= */

.play-wrap{

  flex-shrink:0;

  display:block !important;
}

.play-btn{

  width:42px;
  height:42px;

  border-radius:50%;

  border:1px solid #c084fc;

  background:#17101f;

  color:#fff;

  cursor:pointer;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:17px;

  transition:.2s;
}

.play-btn:hover{

  background:#c084fc;

  color:#080810;

  transform:scale(1.05);
}

.play-btn.playing{

  background:#c084fc;

  color:#080810;
}


/* =========================
   BUY NOW
========================= */

.buy-btn{

  position:relative;

  border:0;

  border-radius:10px;

  padding:9px 13px;

  background:#11111b;

  color:#fff;

  cursor:pointer;

  font-weight:700;

  font-size:11px;

  overflow:hidden;

  z-index:1;

  white-space:nowrap;
}

.buy-btn::before{

  content:"";

  position:absolute;

  inset:-2px;

  z-index:-2;

  border-radius:12px;

  background:
    conic-gradient(
      from 0deg,
      #c026d3,
      #7c3aed,
      #ec4899,
      #c026d3
    );

  animation:spin 3s linear infinite;
}

.buy-btn::after{

  content:"";

  position:absolute;

  inset:2px;

  z-index:-1;

  background:#11111b;

  border-radius:8px;
}

@keyframes spin{

  to{
    transform:rotate(360deg);
  }
}


/* =========================
   MESSAGE
========================= */

.message{

  text-align:center;

  padding:35px 15px;

  color:#777;

  background:#10101a;

  border-radius:15px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  nav{

    gap:14px;

    padding:13px 15px;
  }

  nav b{

    width:100%;
  }

  nav a{

    font-size:11px;
  }

  .wrap{

    padding:22px 13px 50px;
  }

  h1{

    font-size:27px;
  }

  .flyer{

    flex-basis:250px;

    height:140px;
  }

  .flyer-play{

    width:60px;
    height:60px;

    font-size:22px;
  }

  .song{

    gap:8px;
  }

  .cover{

    width:50px;
    height:50px;
  }

  .play-btn{

    width:40px;
    height:40px;
  }

  .buy-btn{

    padding:8px 10px;

    font-size:10px;
  }
}


/* VERY SMALL PHONES */

@media(max-width:380px){

  .song{

    flex-wrap:wrap;
  }

  .song-info{

    min-width:120px;
  }

  .play-wrap{

    display:block !important;
  }

  .buy-btn{

    margin-left:auto;
  }
}

</style>
</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav>

  <b>
    ◈ PASONG<span>.</span>
  </b>

  <a href="index.html">
    Home
  </a>

  <a href="store.html" class="active">
    Music Store
  </a>

  <a href="charts.html">
    Charts
  </a>

  <a href="artists.html">
    Artists
  </a>

  <a href="playlists.html">
    Playlists
  </a>

  <div class="nav-right">

    <a
      href="search.html"
      class="nav-icon"
    >
      ⌕
    </a>

    <a
      href="account.html"
      class="nav-icon"
    >
      ◉
    </a>

  </div>

</nav>



<!-- =========================
     MAIN
========================= -->

<main class="wrap">


  <h1>
    Music <span>Store</span>
  </h1>

  <div class="sub">
    Listen to a 20-second preview, then support the artist.
  </div>

  <div class="line"></div>



  <!-- =========================
       FLYERS
  ========================= -->

  <section class="flyers-section">

    <div class="flyers-title">

      <h2>
        Featured
      </h2>

      <span>
        Swipe →
      </span>

    </div>


    <div class="flyers">


      <!-- FLYER 1 -->

      <div class="flyer">

        <img
          src="assets/flyer1.jpg"
          alt="PASONG music"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured music"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            Buy Music
          </strong>

          <small>
            Support Ugandan artists
          </small>

        </div>

      </div>



      <!-- FLYER 2 -->

      <div class="flyer">

        <img
          src="assets/flyer2.jpg"
          alt="PASONG artists"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured music"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            Trending Music
          </strong>

          <small>
            Discover new sounds
          </small>

        </div>

      </div>



      <!-- FLYER 3 -->

      <div class="flyer">

        <img
          src="assets/flyer3.jpg"
          alt="PASONG promotion"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured music"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            PASONG
          </strong>

          <small>
            Music marketplace
          </small>

        </div>

      </div>


    </div>

  </section>



  <!-- =========================
       SONGS
  ========================= -->

  <section>

    <div class="section-title">

      <h2>
        Latest Songs
      </h2>

    </div>


    <div id="status">
      Loading songs...
    </div>


    <div
      id="songList"
      class="song-list"
    ></div>

  </section>


</main>



<script>

/* =========================
   PASONG API
========================= */

const API_URL =
  "https://pasong-api.vercel.app";


/* =========================
   AUDIO VARIABLES
========================= */

let currentAudio = null;

let currentButton = null;

let previewTimer = null;


/* =========================
   STORE SONGS
========================= */

window.pasongSongs = [];


/* =========================
   LOAD SONGS
========================= */

async function loadSongs(){

  const status =
    document.getElementById("status");

  const list =
    document.getElementById("songList");


  try{

    const response =
      await fetch(
        API_URL + "/api/songs"
      );


    if(!response.ok){

      throw new Error(
        "API returned " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "PASONG API:",
      data
    );


    const songs =
      Array.isArray(data)
        ? data
        : (data.songs || []);


    window.pasongSongs =
      songs;


    if(!songs.length){

      status.textContent =
        "No songs available yet.";

      list.innerHTML = `
        <div class="message">
          No songs have been uploaded yet.
        </div>
      `;

      return;
    }


    status.textContent =
      songs.length +
      " songs";


    list.innerHTML =
      songs
      .map(song =>
        createSongHTML(song)
      )
      .join("");


  }catch(error){

    console.error(error);


    status.textContent =
      "Unable to load songs";


    list.innerHTML = `

      <div class="message">

        Failed to fetch songs.

        <br><br>

        <small>
          ${escapeHTML(error.message)}
        </small>

      </div>

    `;

  }

}


/* =========================
   CREATE SONG
========================= */

function createSongHTML(song){

  const title =
    song.title ||
    song.name ||
    "Untitled Song";


  const artist =
    song.artist_name ||
    song.artist ||
    "Unknown Artist";


  const cover =
    song.cover_url ||
    song.cover ||
    "assets/default-cover.jpg";


  const price =
    song.price ||
    500;


  return `

    <div class="song">


      <img

        class="cover"

        src="${escapeAttribute(cover)}"

        alt=""

        onerror="
          this.src='assets/default-cover.jpg'
        "

      >


      <div class="song-info">


        <div class="song-title">

          ${escapeHTML(title)}

        </div>


        <div class="song-artist">

          ${escapeHTML(artist)}

        </div>


        <div class="song-price">

          UGX
          ${Number(price).toLocaleString()}

        </div>


      </div>



      <!-- PLAY -->

      <div class="play-wrap">

        <button

          class="play-btn"

          onclick="playPreviewFromButton(this)"

          title="Play 20-second preview"

        >
          ▶
        </button>

      </div>



      <!-- BUY -->

      <button

        class="buy-btn"

        onclick="buySongFromButton(this)"

        data-song='${escapeAttribute(
          JSON.stringify(song)
        )}'

      >
        🛒 BUY NOW

      </button>


    </div>

  `;

}


/* =========================
   GET SONG FROM BUTTON
========================= */

function getSongFromButton(button){

  try{

    return JSON.parse(
      button.dataset.song
    );

  }catch(error){

    console.error(error);

    return null;
  }

}


/* =========================
   PLAY SONG FROM BUTTON
========================= */

function playPreviewFromButton(button){

  const songElement =
    button.closest(".song");


  const index =
    Array.from(
      document.querySelectorAll(".song")
    ).indexOf(songElement);


  const song =
    window.pasongSongs[index];


  if(!song){

    alert(
      "Song information is unavailable."
    );

    return;
  }


  playPreview(
    song,
    button
  );

}


/* =========================
   PLAY PREVIEW
========================= */

function playPreview(
  song,
  button
){

  console.log(
    "PLAY SONG:",
    song
  );


  const audioURL =
    song.preview_url ||
    song.audio_url ||
    song.audioUrl ||
    song.url ||
    song.audio;


  if(!audioURL){

    alert(
      "This song has no audio file yet."
    );

    console.error(
      "Missing audio URL:",
      song
    );

    return;
  }


  /* STOP OLD AUDIO */

  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime = 0;

  }


  if(currentButton){

    currentButton.classList.remove(
      "playing"
    );

    currentButton.textContent =
      "▶";

  }


  if(previewTimer){

    clearTimeout(
      previewTimer
    );

  }


  /* IF SAME SONG */

  if(currentButton === button){

    currentAudio = null;

    currentButton = null;

    return;
  }


  /* CREATE AUDIO */

  const audio =
    new Audio();


  audio.preload =
    "auto";


  audio.src =
    audioURL;


  currentAudio =
    audio;


  currentButton =
    button;


  button.textContent =
    "…";


  /* AUDIO READY */

  audio.addEventListener(
    "canplay",
    function(){

      button.textContent =
        "❚❚";

      button.classList.add(
        "playing"
      );

    },
    {
      once:true
    }
  );


  /* AUDIO ERROR */

  audio.addEventListener(
    "error",
    function(){

      console.error(
        "Audio error:",
        audio.error,
        audioURL
      );


      button.textContent =
        "▶";


      button.classList.remove(
        "playing"
      );


      currentAudio =
        null;


      currentButton =
        null;


      alert(
        "This song could not be played.\n\n" +
        "Check that its audio_url is a public MP3 or WAV file."
      );

    }
  );


  /* AUDIO ENDED */

  audio.addEventListener(
    "ended",
    function(){

      button.textContent =
        "▶";


      button.classList.remove(
        "playing"
      );


      currentAudio =
        null;


      currentButton =
        null;

    }
  );


  /* START AUDIO */

  audio.play()

    .then(function(){

      button.textContent =
        "❚❚";


      button.classList.add(
        "playing"
      );


      /* 20 SECOND PREVIEW */

      previewTimer =
        setTimeout(
          function(){

            audio.pause();

            audio.currentTime =
              0;


            button.textContent =
              "▶";


            button.classList.remove(
              "playing"
            );


            currentAudio =
              null;


            currentButton =
              null;

          },
          20000
        );

    })

    .catch(function(error){

      console.error(
        "Play failed:",
        error
      );


      button.textContent =
        "▶";


      button.classList.remove(
        "playing"
      );


      alert(
        "Unable to play this audio file."
      );

    });

}


/* =========================
   FLYER PLAY
========================= */

function playFlyer(button){

  /* STOP CURRENT AUDIO */

  if(currentAudio){

    currentAudio.pause();

    currentAudio.currentTime =
      0;

  }


  if(currentButton){

    currentButton.classList.remove(
      "playing"
    );

    currentButton.textContent =
      "▶";

  }


  if(previewTimer){

    clearTimeout(
      previewTimer
    );

  }


  /* IF FLYER IS PLAYING */

  if(
    button.dataset.playing ===
    "true"
  ){

    button.dataset.playing =
      "false";

    button.textContent =
      "▶";

    return;
  }


  /* FIND FIRST AVAILABLE SONG */

  const song =
    window.pasongSongs &&
    window.pasongSongs.length
      ? window.pasongSongs[0]
      : null;


  if(!song){

    alert(
      "No songs are available yet."
    );

    return;
  }


  const audioURL =
    song.preview_url ||
    song.audio_url ||
    song.audioUrl ||
    song.url ||
    song.audio;


  if(!audioURL){

    alert(
      "The featured song has no audio file yet."
    );

    return;
  }


  const audio =
    new Audio(audioURL);


  audio.preload =
    "auto";


  currentAudio =
    audio;


  button.dataset.playing =
    "true";


  button.textContent =
    "❚❚";


  currentButton =
    null;


  audio.play()

    .then(function(){

      previewTimer =
        setTimeout(
          function(){

            audio.pause();

            audio.currentTime =
              0;


            button.dataset.playing =
              "false";


            button.textContent =
              "▶";


            currentAudio =
              null;

          },
          20000
        );

    })

    .catch(function(error){

      console.error(
        error
      );


      button.dataset.playing =
        "false";


      button.textContent =
        "▶";


      currentAudio =
        null;


      alert(
        "Unable to play the featured song."
      );

    });


  audio.addEventListener(
    "ended",
    function(){

      button.dataset.playing =
        "false";


      button.textContent =
        "▶";


      currentAudio =
        null;

    }
  );

}


/* =========================
   BUY SONG
========================= */

function buySongFromButton(button){

  const song =
    getSongFromButton(button);


  if(!song){

    alert(
      "Song information is unavailable."
    );

    return;
  }


  buySong(song);

}


/* =========================
   BUY
========================= */

function buySong(song){

  const title =
    song.title ||
    song.name ||
    "this song";


  const price =
    song.price ||
    500;


  const confirmed =
    confirm(

      "🛒 Buy " +

      title +

      " for UGX " +

      Number(price)
        .toLocaleString() +

      "?"

    );


  if(!confirmed){

    return;
  }


  /*
    PAYMENT WILL BE CONNECTED
    TO MTN MOMO / AIRTEL MONEY
    AFTER THE PAYMENT ENDPOINT
    IS READY.

    DO NOT MARK SONG AS
    PURCHASED HERE YET.
  */


  alert(

    "Payment system is being connected.\n\n" +

    "Song: " +
    title +

    "\nPrice: UGX " +
    Number(price).toLocaleString()

  );

}


/* =========================
   SECURITY / TEXT ESCAPE
========================= */

function escapeHTML(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function escapeAttribute(value){

  return escapeHTML(
    value
  );

}


/* =========================
   START STORE
========================= */

loadSongs();

</script>

</body>
</html>
