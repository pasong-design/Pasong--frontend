<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASONG Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#07090b;color:#fff}a{color:inherit;text-decoration:none}header{height:76px;border-bottom:1px solid #272b30;display:flex;align-items:center;padding:0 5%;gap:22px;position:sticky;top:0;background:#07090b;z-index:20}.logo{font-size:27px;font-weight:900}.logo span{color:#ffb414}.nav{display:flex;gap:20px;font-weight:700}.nav .active{color:#ffb414}.search{margin-left:auto;width:260px;background:#15191e;border:1px solid #343941;border-radius:25px;padding:11px 16px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#111519;border:1px solid #292f35;border-radius:13px;overflow:hidden}.cover{height:220px;position:relative;background:#222}.cover img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);cursor:pointer}.play div{width:64px;height:64px;background:#ffffff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:28px;font-weight:900;box-shadow:0 0 0 0 rgba(200,80,255,0.8);animation:pulse 1.8s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,100,255,0.9)}70%{box-shadow:0 0 0 18px rgba(216,100,255,0)}100%{box-shadow:0 0 0 0 rgba(216,100,255,0)}}.body{padding:15px}.price{color:#d27bff;font-weight:900}.btns{display:flex;gap:8px;margin-top:10px}.btns button{flex:1;border:0;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.btns .v{background:#252a30;color:#fff}.btns .b{background:#c850ff;color:#fff}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><a class="logo" href="/">◉ PA<span style="color:#c850ff">SONG</span></a><nav class="nav"><a href="/">Home</a><a class="active" href="#">Music Store</a></nav><input id="s" class="search" placeholder="Search..." oninput="render()"></header>
<div style="width:90%;max-width:1250px;margin:auto;padding:30px 0"><h1>Music Store</h1><div id="grid" class="grid"></div></div>
<script>
const API="https://pasong-api.vercel.app";let prods=[];
async function load(){const r=await fetch(API+"/api/songs");const d=await r.json();prods=d.songs||[];render()}
function render(){const q=document.getElementById('s').value.toLowerCase();const list=prods.filter(p=>p.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=list.map(p=>`<div class="card"><div class="cover">${p.cover_url?`<img src="${p.cover_url}">`:`<div style="padding:20px">${p.title}</div>`}<div class="play" onclick="playIt('${p.id}')"><div id="b-${p.id}">▶</div></div><audio id="a-${p.id}" src="${p.audio_url||p.preview_url}"></audio></div><div class="body"><h3>${p.title}</h3><div style="color:#999">${p.genre}</div><div class="price">UGX ${p.price}</div><div class="btns"><button class="v" onclick="location.href='pasong_checkout.html?songId=${p.id}'">View</button><button class="b" onclick="location.href='pasong_checkout.html?songId=${p.id}'">Buy</button></div></div></div>`).join('')}
let cur=null,btn=null,t=null;
function playIt(id){const a=document.getElementById('a-'+id),b=document.getElementById('b-'+id);if(cur&&cur!==a){cur.pause();cur.currentTime=0;if(btn)btn.textContent='▶'}if(a.paused){a.currentTime=0;a.play();b.textContent='⏸';cur=a;btn=b;clearTimeout(t);t=setTimeout(()=>{a.pause();b.textContent='▶'},20000)}else{a.pause();b.textContent='▶'}}
load();
</script></body></html>
