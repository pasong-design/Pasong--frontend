<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASONG Store</title><style>body{margin:0;font-family:Arial;background:#07090b;color:#fff}header{height:72px;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 5%;gap:20px;background:#07090b;position:sticky;top:0;z-index:10}.logo{font-size:27px;font-weight:900}.logo span{color:#c850ff}.nav{display:flex;gap:18px;font-weight:700}.nav .active{color:#c850ff}.search{margin-left:auto;width:240px;background:#15191e;border:1px solid #333;border-radius:20px;padding:10px 14px;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#111519;border:1px solid #2a2f37;border-radius:12px;overflow:hidden}.cover{height:210px;position:relative;background:#1a1a1a}.cover img{width:100%;height:100%;object-fit:cover}.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);cursor:pointer}.play div{width:66px;height:66px;background:#ffffff;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#000;font-size:28px;font-weight:900;animation:purpleMove 1.8s infinite}@keyframes purpleMove{0%{box-shadow:0 0 0 0 rgba(200,80,255,0.9)}70%{box-shadow:0 0 0 22px rgba(200,80,255,0)}100%{box-shadow:0 0 0 0 rgba(200,80,255,0)}}.body{padding:14px}.price{color:#d07bff;font-weight:900}.btns{display:flex;gap:8px;margin-top:10px}.btns button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:800;cursor:pointer}.btns .v{background:#252a30;color:#fff}.btns .b{background:linear-gradient(90deg,#c850ff,#8a5cff);color:#fff;box-shadow:0 0 15px rgba(200,80,255,.4)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">● PA<span>SONG</span></div><div class="nav"><a href="/">Home</a><a class="active">Music Store</a></div><input id="s" class="search" placeholder="Search..." oninput="render()"></header><div style="width:92%;max-width:1250px;margin:auto;padding:25px 0"><h1>Music Store</h1><div id="grid" class="grid"></div></div><script>const API="https://pasong-api.vercel.app";let all=[];async function load(){let r=await fetch(API+"/api/songs");let d=await r.json();all=d.songs||[];render()}function render(){let q=document.getElementById('s').value.toLowerCase();let f=all.filter(x=>x.title.toLowerCase().includes(q));document.getElementById('grid').innerHTML=f.map(p=>`<div class="card"><div class="cover">${p.cover_url?`<img src="${p.cover_url}">`:''}<div class="play" onclick="playIt('${p.id}')"><div id="b-${p.id}">▶</div></div><audio id="a-${p.id}" src="${p.audio_url||p.preview_url}"></audio></div><div class="body"><b>${p.title}</b><div style="color:#888;font-size:13px">${p.genre||'Afrobeats'}</div><div class="price">UGX ${p.price||500}</div><div class="btns"><button class="v" onclick="location.href='pasong_checkout.html?songId=${p.id}'">View</button><button class="b" onclick="location.href='pasong_checkout.html?songId=${p.id}'">Buy</button></div></div></div>`).join('')}let cur=null,bb=null,t=null;function playIt(id){let a=document.getElementById('a-'+id),b=document.getElementById('b-'+id);if(cur&&cur!=a){cur.pause();cur.currentTime=0;if(bb)bb.textContent='▶'}if(a.paused){a.currentTime=0;a.play();b.textContent='⏸';cur=a;bb=b;clearTimeout(t);t=setTimeout(()=>{a.pause();b.textContent='▶'},20000)}else{a.pause();b.textContent='▶'}}load();</script></body></html>
