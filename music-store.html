<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PASONG — Music Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07090b;color:#fff}
a{text-decoration:none;color:inherit}button,input{font:inherit}
header{height:76px;border-bottom:1px solid #272b30;display:flex;align-items:center;padding:0 5%;gap:22px;position:sticky;top:0;background:#07090b;z-index:20}
.logo{font-size:27px;font-weight:900}.logo span{color:#ffb414}.logo small{display:block;font-size:7px;letter-spacing:4px;color:#888}
.nav{display:flex;gap:20px;font-size:14px;font-weight:700}.nav a:hover,.nav.active{color:#ffb414}
.search{margin-left:auto;width:260px;background:#15191e;border:1px solid #343941;border-radius:25px;padding:11px 16px;color:#fff;outline:none}
.cart{font-size:22px;cursor:pointer}.count{background:#ffb414;color:#111;border-radius:50%;font-size:10px;padding:2px 5px;vertical-align:top}
.container{width:90%;max-width:1250px;margin:auto}.title{padding:42px 0 20px}.title h1{font-size:42px;margin:0 0 8px}.title p{color:#999}
.filters{display:flex;gap:12px;margin-bottom:25px;flex-wrap:wrap}.filter{background:#15191e;border:1px solid #30353b;color:#ddd;border-radius:20px;padding:9px 16px;cursor:pointer}
.filter.active,.filter:hover{background:#ffb414;color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.card{background:#111519;border:1px solid #292f35;border-radius:13px;overflow:hidden;position:relative}
.cover{height:220px;padding:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#ffb414;background:linear-gradient(135deg,#44210b,#101b29);background-size:cover;background-position:center;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;transition:.2s;cursor:pointer}
.card:hover.play-overlay{opacity:1}.play-btn{width:60px;height:60px;background:#ffb414;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#111;font-weight:900}
.body{padding:15px}.body h3{margin:0}.artist{color:#999;font-size:13px;margin:4px 0 10px}.price{color:#ffb414;font-weight:900}
.actions{display:flex;gap:8px}.actions button{border:0;border-radius:9px;padding:10px;cursor:pointer;font-weight:800;flex:1}.preview{background:#252a30;color:#fff}.buy{background:#ffb414;color:#111}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}
.box{width:100%;max-width:760px;background:#111519;border:1px solid #343941;border-radius:16px;padding:25px;position:relative}.close{position:absolute;right:18px;top:14px;background:none;border:0;color:#aaa;font-size:25px;cursor:pointer}
.detail{display:grid;grid-template-columns:260px 1fr;gap:25px}.detail-cover{height:260px;border-radius:12px;background:linear-gradient(135deg,#ffb414,#211306);display:flex;align-items:center;justify-content:center;font-size:35px;font-weight:900;color:#111;background-size:cover;background-position:center}
.detail h2{font-size:30px;margin:0}.muted{color:#999}.buybig{margin-top:20px;background:#ffb414;border:0;border-radius:10px;padding:13px 22px;font-weight:900;cursor:pointer;width:100%}
.cartpanel{display:none;position:fixed;right:20px;top:85px;width:340px;background:#111519;border:1px solid #3a3f45;border-radius:14px;padding:20px;z-index:40;box-shadow:0 15px 50px #000}.cartpanel.show{display:block}
.cartrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292e34}.checkout{width:100%;margin-top:15px;padding:13px;background:#ffb414;border:0;border-radius:10px;font-weight:900}
#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#ffb414;color:#111;padding:13px 20px;border-radius:10px;font-weight:800;display:none;z-index:100}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.nav{display:none}.detail{grid-template-columns:1fr}.detail-cover{height:190px}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.search{width:170px}.title h1{font-size:32px}}
</style>
</head>
<body>
<header>
<a class="logo" href="index.html">◉ PA<span>SONG</span><small>MUSIC MARKETPLACE</small></a>
<nav class="nav"><a href="index.html">Home</a><a class="active" href="#">Music Store</a><a href="upload.html">Upload Song</a></nav>
<input id="search" class="search" placeholder="Search music..." oninput="render()">
<div class="cart" onclick="toggleCart()">🛒 <span id="count" class="count">0</span></div>
</header>

<main class="container">
<section class="title"><h1>Music Store</h1><p>Discover and buy songs from independent artists on PASONG.</p></section>
<div class="filters">
<button class="filter active" onclick="setFilter('all',this)">All</button>
<button class="filter" onclick="setFilter('songs',this)">Songs</button>
<button class="filter" onclick="setFilter('albums',this)">Albums</button>
<button class="filter" onclick="setFilter('beats',this)">Beats</button>
</div>
<section id="grid" class="grid"></section>
</main>

<div id="detailModal" class="modal" onclick="if(event.target===this)closeDetail()">
<div class="box"><button class="close" onclick="closeDetail()">×</button><div class="detail">
<div id="detailCover" class="detail-cover"></div>
<div>
<p class="muted">PASONG MUSIC STORE</p>
<h2 id="detailTitle"></h2>
<p id="detailArtist" class="muted"></p>
<p id="detailType"></p>
<h3 id="detailPrice" style="color:#ffb414"></h3>
<audio id="player" controls style="width:100%;margin-top:10px"></audio>
<button id="detailBuy" class="buybig">Buy Now</button>
</div>
</div></div></div>

<div id="cartPanel" class="cartpanel">
<h2>Your Cart</h2><div id="cartItems"></div><h3 id="total"></h3>
<button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>
<div id="toast"></div>

<script>
const API_BASE="https://pasong-api.vercel.app";
let products=[],filter="all",cart=[];
let currentAudio=null, currentBtn=null, previewTimer=null;

function money(n){return "UGX "+Number(n||500).toLocaleString();}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

async function loadProducts(){
 try{
  const r=await fetch(API_BASE+"/api/songs");
  const d=await r.json();
  // FIXED: Use real API field names - title, cover_url, audio_url
  products=(d.songs||[]).map((s,i)=>({
   id:s.id||("song-"+i),
   title:s.title||"Untitled Song",
   artist:s.genre || "Afrobeats • Bobley Nsubuga",
   price:Number(s.price||500),
   type:(s.genre||"songs").toLowerCase(),
   coverUrl:s.cover_url||s.coverUrl||"",
   previewUrl:s.preview_url||s.audio_url||s.previewUrl||"",
   audioUrl:s.audio_url||s.audioUrl||""
  }));
  render();
 }catch(e){grid.innerHTML="<p style='color:#999'>Could not load songs. Please refresh.</p>";console.error(e);}
}

function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=products.filter(p=>(filter==="all"||p.type.includes(filter)||filter==="songs")&&(`${p.title} ${p.artist}`.toLowerCase().includes(q)));
 document.getElementById('grid').innerHTML=list.map(p=>`
 <article class="card">
  <div class="cover">
   ${p.coverUrl?`<img src="${esc(p.coverUrl)}">`:`<span>${esc(p.title)}</span>`}
   <div class="play-overlay" onclick="playPreview('${esc(p.id)}', this)">
     <div class="play-btn" id="btn-${esc(p.id)}">▶</div>
   </div>
   <audio id="audio-${esc(p.id)}" src="${esc(p.previewUrl)}" preload="none"></audio>
  </div>
  <div class="body">
   <h3>${esc(p.title)}</h3><div class="artist">${esc(p.artist)}</div>
   <div class="price">${money(p.price)}</div>
   <div class="actions">
    <button class="preview" onclick="openDetail('${encodeURIComponent(p.id)}')">View</button>
    <button class="buy" onclick="buyNow('${encodeURIComponent(p.id)}')">Buy Now</button>
   </div>
  </div>
 </article>`).join("")||"<p>No music found.</p>";
}

function playPreview(id, overlay){
 const audio=document.getElementById('audio-'+id);
 const btn=document.getElementById('btn-'+id);
 if(!audio) return;
 if(currentAudio && currentAudio!==audio){ currentAudio.pause(); currentAudio.currentTime=0; if(currentBtn) currentBtn.textContent='▶'; }
 if(audio.paused){
   audio.currentTime=0; audio.play(); btn.textContent='⏸'; currentAudio=audio; currentBtn=btn;
   clearTimeout(previewTimer);
   previewTimer=setTimeout(()=>{ audio.pause(); btn.textContent='▶'; toast('Preview ended - Buy for full song'); }, 20000);
 } else {
   audio.pause(); btn.textContent='▶'; clearTimeout(previewTimer);
 }
}

function setFilter(f,el){filter=f;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));el.classList.add("active");render();}
function getProduct(id){return products.find(x=>x.id===id);}
function openDetail(encoded){
 const p=getProduct(decodeURIComponent(encoded));if(!p)return;
 document.getElementById('detailTitle').textContent=p.title;document.getElementById('detailArtist').textContent="By "+p.artist;document.getElementById('detailType').textContent="Category: "+p.type;document.getElementById('detailPrice').textContent=money(p.price);
 const dc=document.getElementById('detailCover'); dc.textContent=p.coverUrl?"":p.title; dc.style.backgroundImage=p.coverUrl?`url('${p.coverUrl}')`:"";
 const pl=document.getElementById('player'); pl.pause(); pl.removeAttribute("src");
 if(p.previewUrl){pl.src=p.previewUrl; pl.load();}
 document.getElementById('detailBuy').onclick=()=>buyNow(encodeURIComponent(p.id));
 document.getElementById('detailModal').classList.add("show");
}
function closeDetail(){document.getElementById('detailModal').classList.remove("show");document.getElementById('player').pause();}
function buyNow(encoded){location.href="pasong_checkout.html?songId="+encodeURIComponent(decodeURIComponent(encoded));}
function updateCart(){
 document.getElementById('count').textContent=cart.length;
 document.getElementById('cartItems').innerHTML=cart.length?cart.map(id=>{const p=getProduct(id);return p?`<div class="cartrow"><span>${esc(p.title)}<br><small class="muted">${esc(p.artist)}</small></span><b>${money(p.price)}</b></div>`:"";}).join(""):"<p class='muted'>Your cart is empty.</p>";
 document.getElementById('total').textContent=cart.length?"Total: "+money(cart.reduce((s,id)=>{const p=getProduct(id);return s+(p?p.price:0)},0)):"";
}
function toggleCart(){document.getElementById('cartPanel').classList.toggle("show");updateCart();}
function checkout(){if(!cart.length)return toast("Your cart is empty");location.href="pasong_checkout.html?songId="+encodeURIComponent(cart[0]);}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
loadProducts();
</script>
</body>
</html>
