<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PASONG Music Store</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

/* =========================
   NAVIGATION
========================= */

nav{
  display:flex;
  align-items:center;
  gap:24px;
  padding:15px 22px;
  background:#0a0a14;
  border-bottom:1px solid rgba(255,255,255,.06);
  position:sticky;
  top:0;
  z-index:1000;
  flex-wrap:wrap;
}

nav b{
  font-size:22px;
  font-weight:800;
}

nav b span{
  color:#c084fc;
}

nav a{
  color:#888;
  text-decoration:none;
  font-size:13px;
}

nav a:hover{
  color:#c084fc;
}

nav a.active{
  color:#c084fc;
  border-bottom:2px solid #a855f7;
  padding-bottom:4px;
}

.nav-right{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.nav-icon{
  color:#aaa;
  text-decoration:none;
  font-size:19px;
}

/* =========================
   PAGE
========================= */

.wrap{
  max-width:900px;
  margin:auto;
  padding:28px 18px 60px;
}

h1{
  font-size:32px;
  font-weight:800;
}

h1 span{
  color:#c026d3;
}

.sub{
  color:#888;
  font-size:13px;
  margin-top:6px;
}

.line{
  width:48px;
  height:3px;
  background:#c026d3;
  border-radius:10px;
  margin:12px 0 25px;
}

/* =========================
   FLYERS
========================= */

.flyers-section{
  margin-bottom:32px;
}

.flyers-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.flyers-title h2{
  font-size:17px;
  font-weight:700;
}

.flyers-title span{
  color:#777;
  font-size:11px;
}

.flyers{
  display:flex;
  gap:14px;
  overflow-x:auto;
  padding-bottom:8px;
  scroll-snap-type:x mandatory;
}

.flyers::-webkit-scrollbar{
  height:5px;
}

.flyers::-webkit-scrollbar-thumb{
  background:#2a2035;
  border-radius:10px;
}

.flyer{
  flex:0 0 270px;
  height:135px;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:#11111d;
  border:1px solid rgba(255,255,255,.06);
  scroll-snap-align:start;
}

.flyer img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* TRANSPARENT FLYER PLAY BUTTON */

.flyer-play{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  width:62px;
  height:62px;

  display:flex !important;
  align-items:center;
  justify-content:center;

  z-index:30;

  border-radius:50%;

  background:rgba(8,8,16,.30);
  border:2px solid rgba(255,255,255,.9);

  color:#fff;
  font-size:23px;

  cursor:pointer;

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);

  box-shadow:0 4px 20px rgba(0,0,0,.5);

  transition:.2s ease;
}

.flyer-play:hover{
  background:rgba(168,85,247,.35);
  border-color:#c084fc;
  transform:translate(-50%,-50%) scale(1.08);
}

.flyer-play:active{
  transform:translate(-50%,-50%) scale(.94);
}

.flyer-overlay{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  z-index:10;

  padding:30px 12px 10px;

  background:linear-gradient(
    transparent,
    rgba(0,0,0,.85)
  );
}

.flyer-overlay strong{
  font-size:13px;
}

.flyer-overlay small{
  display:block;
  color:#bbb;
  font-size:10px;
  margin-top:2px;
}

/* =========================
   SONG LIST
========================= */

.list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.item{
  background:rgba(14,14,25,.7);
  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.05);

  border-radius:16px;

  padding:14px 16px;

  display:flex;
  align-items:center;
  gap:16px;

  transition:.2s;
}

.item:hover{
  border-color:rgba(168,85,247,.25);
  transform:translateY(-1px);
}

.cover{
  width:84px;
  height:84px;
  min-width:84px;

  border-radius:12px;

  object-fit:cover;

  background:#111;

  border:1px solid rgba(255,255,255,.06);
}

/* =========================
   SONG PLAY BUTTON
========================= */

.play-wrap{
  width:58px;
  height:58px;
  min-width:58px;

  display:flex !important;

  align-items:center;
  justify-content:center;
}

.play-btn{
  width:48px;
  height:48px;

  border-radius:50%;

  background:transparent;

  border:2px solid #a855f7;

  display:flex !important;

  align-items:center;
  justify-content:center;

  cursor:pointer;

  box-shadow:
    0 0 12px rgba(168,85,247,.4);

  transition:.2s;
}

.play-btn:hover{
  transform:scale(1.05);
  background:rgba(168,85,247,.15);
}

.play-btn.playing{
  background:rgba(168,85,247,.25);
}

.play-btn svg{
  width:20px;
  height:20px;

  fill:white;

  margin-left:2px;
}

/* =========================
   SONG INFO
========================= */

.info{
  flex:1;
  min-width:0;
}

.info h3{
  font-size:15px;
  font-weight:700;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info p{
  font-size:13px;
  color:#999;

  margin:2px 0;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info small{
  color:#777;
  font-size:12px;
}

/* =========================
   PRICE + BUY
========================= */

.right{
  text-align:right;

  display:flex;
  flex-direction:column;
  align-items:flex-end;

  gap:8px;

  min-width:90px;
}

.price{
  color:#c084fc;

  font-weight:700;

  font-size:14px;
}

.buy{
  position:relative;

  z-index:1;

  border:none;

  background:#151525;

  color:#c4b5fd;

  border-radius:20px;

  padding:7px 14px;

  font-size:12px;

  font-weight:600;

  display:flex;

  align-items:center;

  gap:6px;

  cursor:pointer;

  overflow:hidden;

  isolation:isolate;
}

.buy::before{
  content:'';

  position:absolute;

  z-index:-2;

  width:200%;
  height:200%;

  left:-50%;
  top:-50%;

  background:
    conic-gradient(
      from 0deg,
      transparent 0%,
      transparent 55%,
      #a855f7 70%,
      #ec4899 82%,
      #60a5fa 92%,
      transparent 100%
    );

  animation:spin 1.4s linear infinite;
}

.buy::after{
  content:'';

  position:absolute;

  inset:1px;

  border-radius:20px;

  background:#151525;

  z-index:-1;
}

.buy span{
  position:relative;
  z-index:2;
}

.buy:hover{
  color:white;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   MESSAGES
========================= */

.message{
  color:#666;

  text-align:center;

  padding:35px 20px;

  font-size:13px;
}

.error{
  color:#ff6b9d;
}

.retry{
  margin-top:12px;

  padding:8px 16px;

  border-radius:20px;

  border:1px solid #a855f7;

  background:#151525;

  color:#c4b5fd;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  nav{
    gap:16px;
    padding:14px 16px;
  }

  nav a{
    font-size:12px;
  }

  nav b{
    width:100%;
  }

  .nav-right{
    position:absolute;
    right:16px;
    top:14px;
  }

  .wrap{
    padding:22px 14px 40px;
  }

  h1{
    font-size:28px;
  }

  .flyer{
    flex-basis:245px;
    height:125px;
  }

  .flyer-play{
    width:58px;
    height:58px;
    font-size:22px;

    display:flex !important;
  }

  .item{
    gap:10px;
    padding:12px;
  }

  .cover{
    width:65px;
    height:65px;
    min-width:65px;
  }

  .play-wrap{
    width:48px;
    height:48px;
    min-width:48px;

    display:flex !important;
  }

  .play-btn{
    width:42px;
    height:42px;

    display:flex !important;
  }

  .right{
    min-width:72px;
  }

  .price{
    font-size:12px;
  }

  .buy{
    padding:7px 10px;
    font-size:11px;
  }
}

/* SMALL PHONES */

@media(max-width:380px){

  .item{
    flex-wrap:wrap;
  }

  .info{
    min-width:120px;
  }

  .play-wrap{
    display:flex !important;
  }

  .buy{
    margin-left:auto;
  }

}

</style>

</head>

<body>

<!-- =========================
     NAVIGATION
========================= -->

<nav>

  <b>
    PA<span>SONG</span>
  </b>

  <a href="index.html">
    Home
  </a>

  <a class="active" href="store.html">
    Music Store
  </a>

  <a href="charts.html">
    Charts
  </a>

  <a href="artists.html">
    Artists
  </a>

  <a href="playlists.html">
    Playlists
  </a>

  <div class="nav-right">

    <a
      class="nav-icon"
      href="search.html"
      aria-label="Search"
    >
      🔍
    </a>

    <a
      class="nav-icon"
      href="account.html"
      aria-label="Account"
    >
      👤
    </a>

  </div>

</nav>

<!-- =========================
     MAIN
========================= -->

<div class="wrap">

  <h1>
    Music <span>Store</span>
  </h1>

  <p class="sub">
    20-second preview, then purchase for UGX 500.
  </p>

  <div class="line"></div>

  <!-- =========================
       FLYERS
  ========================= -->

  <section class="flyers-section">

    <div class="flyers-title">

      <h2>
        🔥 PASONG Promotions
      </h2>

      <span>
        Swipe →
      </span>

    </div>

    <div class="flyers">

      <!-- FLYER 1 -->

      <div class="flyer">

        <img
          src="assets/flyer1.jpg"
          alt="PASONG Buy Music"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured song"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            Buy Music • Support Artists
          </strong>

          <small>
            Discover new music
          </small>

        </div>

      </div>

      <!-- FLYER 2 -->

      <div class="flyer">

        <img
          src="assets/flyer2.jpg"
          alt="Free Beat of the Week"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured song"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            Free Beat of the Week
          </strong>

          <small>
            Check PASONG every week
          </small>

        </div>

      </div>

      <!-- FLYER 3 -->

      <div class="flyer">

        <img
          src="assets/flyer3.jpg"
          alt="PASONG Music Store"
          onerror="this.style.display='none'"
        >

        <button
          class="flyer-play"
          onclick="playFlyer(this)"
          aria-label="Play featured song"
        >
          ▶
        </button>

        <div class="flyer-overlay">

          <strong>
            PASONG Music Store
          </strong>

          <small>
            New music • New artists
          </small>

        </div>

      </div>

    </div>

  </section>

  <!-- =========================
       SONGS
  ========================= -->

  <div id="songList" class="list">

    <p class="message">
      Loading songs...
    </p>

  </div>

</div>

<script>

/* =========================
   PASONG API
========================= */

const API_URL =
  "https://pasong-api.vercel.app";

/* =========================
   AUDIO
========================= */

let currentAudio = null;
let currentButton = null;
let currentFlyerButton = null;
let previewTimer = null;

/* =========================
   SVG ICONS
========================= */

const PLAY_ICON = `
<svg viewBox="0 0 24 24">
  <path d="M8 5.14v14l11-7-11-7z"/>
</svg>
`;

const PAUSE_ICON = `
<svg viewBox="0 0 24 24">
  <path d="M7 5h4v14H7zM13 5h4v14h-4z"/>
</svg>
`;

/* =========================
   ESCAPE HTML
========================= */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

/* =========================
   GET AUDIO URL
========================= */

function getAudioURL(song){

  return (
    song.preview_url ||
    song.audio_url ||
    song.audioUrl ||
    song.url ||
    song.audio ||
    ""
  );

}

/* =========================
   RENDER SONGS
========================= */

function renderSongs(songs){

  const list =
    document.getElementById("songList");

  if(!songs.length){

    list.innerHTML = `
      <p class="message">
        No songs yet
      </p>
    `;

    return;
  }

  list.innerHTML = "";

  songs.forEach(song => {

    const div =
      document.createElement("div");

    div.className =
      "item";

    const title =
      song.title ||
      song.name ||
      "Untitled";

    const artist =
      song.artist_name ||
      song.artist ||
      "Unknown Artist";

    const duration =
      song.duration ||
      "3:42";

    const cover =
      song.cover_url ||
      song.image ||
      song.cover ||
      "assets/default-cover.jpg";

    const price =
      Number(song.price || 500);

    div.innerHTML = `

      <img
        class="cover"
        src="${esc(cover)}"
        alt=""
        onerror="
          this.src='assets/default-cover.jpg'
        "
      >

      <div class="play-wrap">

        <button
          class="play-btn"
          aria-label="Play 20 second preview"
        >
          ${PLAY_ICON}
        </button>

      </div>

      <div class="info">

        <h3>
          ${esc(title)}
        </h3>

        <p>
          ${esc(artist)}
        </p>

        <small>
          🕒 ${esc(duration)}
        </small>

      </div>

      <div class="right">

        <div class="price">
          UGX ${price.toLocaleString()}
        </div>

        <button
          class="buy"
          aria-label="Buy song"
        >

          <span>
            🛒 Buy Now
          </span>

        </button>

      </div>

    `;

    const playButton =
      div.querySelector(".play-btn");

    const buyButton =
      div.querySelector(".buy");

    playButton.onclick =
      () => playPreview(
        song,
        playButton
      );

    buyButton.onclick =
      () => buySong(song);

    list.appendChild(div);

  });

}

/* =========================
   LOAD SONGS
========================= */

async function loadSongs(){

  const list =
    document.getElementById("songList");

  /*
    Clear old cache so the Store
    always gets the newest songs.
  */

  try{

    const response =
      await fetch(
        `${API_URL}/api/songs`,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "API returned " +
        response.status
      );

    }

    const data =
      await response.json();

    console.log(
      "PASONG API RESPONSE:",
      data
    );

    const songs =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(data.songs)
              ? data.songs
              : []
          );

    /*
      Save songs globally for
      flyer playback.
    */

    window.pasongSongs =
      songs;

    renderSongs(songs);

  }catch(error){

    console.error(
      "PASONG LOAD ERROR:",
      error
    );

    list.innerHTML = `

      <div class="message error">

        Unable to load songs.

        <br><br>

        <small>
          ${esc(error.message)}
        </small>

        <br>

        <button
          class="retry"
          onclick="loadSongs()"
        >
          Try Again
        </button>

      </div>

    `;

  }

}

/* =========================
   SONG PREVIEW
========================= */

function playPreview(song,button){

  const url =
    getAudioURL(song);

  console.log(
    "Playing audio:",
    url
  );

  if(!url){

    alert(
      "This song has no audio file yet."
    );

    return;
  }

  /*
    If same song is playing,
    stop it.
  */

  if(
    currentButton === button &&
    currentAudio
  ){

    stopPreview();

    return;
  }

  stopPreview();

  const audio =
    new Audio();

  audio.src =
    url;

  audio.preload =
    "auto";

  currentAudio =
    audio;

  currentButton =
    button;

  button.innerHTML =
    PAUSE_ICON;

  button.classList.add(
    "playing"
  );

  audio.play()

    .then(() => {

      console.log(
        "Preview started"
      );

      previewTimer =
        setTimeout(
          () => {

            stopPreview();

          },
          20000
        );

    })

    .catch(error => {

      console.error(
        "Audio playback failed:",
        error
      );

      stopPreview();

      alert(
        "Unable to play this audio file."
      );

    });

  audio.onended =
    () => {

      stopPreview();

    };

  audio.onerror =
    () => {

      console.error(
        "Audio file error:",
        url
      );

      stopPreview();

      alert(
        "This audio file could not be played."
      );

    };

}

/* =========================
   STOP PREVIEW
========================= */

function stopPreview(){

  if(previewTimer){

    clearTimeout(
      previewTimer
    );

    previewTimer =
      null;

  }

  if(currentAudio){

    currentAudio.pause();

    try{

      currentAudio.currentTime =
        0;

    }catch(e){}

  }

  if(currentButton){

    currentButton.innerHTML =
      PLAY_ICON;

    currentButton.classList.remove(
      "playing"
    );

  }

  if(currentFlyerButton){

    currentFlyerButton.textContent =
      "▶";

    currentFlyerButton.dataset.playing =
      "false";

  }

  currentAudio =
    null;

  currentButton =
    null;

  currentFlyerButton =
    null;

}

/* =========================
   FLYER PLAY
========================= */

function playFlyer(button){

  /*
    If this flyer is already playing,
    stop it.
  */

  if(
    button.dataset.playing === "true"
  ){

    stopPreview();

    return;

  }

  /*
    Stop any other audio first.
  */

  stopPreview();

  const songs =
    window.pasongSongs || [];

  if(!songs.length){

    alert(
      "No songs are available yet."
    );

    return;

  }

  /*
    Use the first available song
    for the featured flyer.
  */

  const song =
    songs[0];

  const url =
    getAudioURL(song);

  if(!url){

    alert(
      "The featured song has no audio file yet."
    );

    return;

  }

  const audio =
    new Audio();

  audio.src =
    url;

  audio.preload =
    "auto";

  currentAudio =
    audio;

  currentFlyerButton =
    button;

  button.dataset.playing =
    "true";

  button.textContent =
    "❚❚";

  audio.play()

    .then(() => {

      console.log(
        "Flyer preview started"
      );

      previewTimer =
        setTimeout(
          () => {

            stopPreview();

          },
          20000
        );

    })

    .catch(error => {

      console.error(
        "Flyer playback error:",
        error
      );

      stopPreview();

      alert(
        "Unable to play the featured song."
      );

    });

  audio.onended =
    () => {

      stopPreview();

    };

  audio.onerror =
    () => {

      console.error(
        "Featured audio error:",
        url
      );

      stopPreview();

      alert(
        "The featured audio file could not be played."
      );

    };

}

/* =========================
   BUY SONG
========================= */

function buySong(song){

  const title =
    song.title ||
    song.name ||
    "this song";

  const price =
    Number(song.price || 500);

  const confirmed =
    confirm(
      "🛒 Buy " +
      title +
      "\n\n" +
      "Price: UGX " +
      price.toLocaleString() +
      "\n\n" +
      "Continue?"
    );

  if(!confirmed){

    return;

  }

  /*
    REAL PAYMENT WILL BE CONNECTED
    TO MTN MOMO / AIRTEL MONEY LATER.
  */

  alert(
    "Payment system is being connected.\n\n" +
    "Song: " +
    title +
    "\n" +
    "Price: UGX " +
    price.toLocaleString()
  );

}

/* =========================
   START
========================= */

window.pasongSongs = [];

loadSongs();

</script>

</body>
</html>
