<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasong Music Store</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:white;font-family:Inter,sans-serif;min-height:100vh;padding:40px 20px;display:flex;flex-direction:column;align-items:center}
h1{font-size:42px;font-weight:800;margin-bottom:40px;letter-spacing:-1px}
.list{width:100%;max-width:600px;display:flex;flex-direction:column;gap:16px}
.item{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:16px}
.play-btn{width:52px;height:52px;min-width:52px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;cursor:pointer}
.play-btn::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,#a855f7,#ec4899,#8b5cf6,#a855f7);animation:spin 2s linear infinite;z-index:-1}
.play-btn::after{content:'';position:absolute;inset:0;border-radius:50%;background:white;z-index:-1}
.play-btn svg{width:20px;height:20px;fill:black;margin-left:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.play-btn{box-shadow:0 0 18px rgba(168,85,247,0.6)}
.info h3{font-size:15px;margin-bottom:2px}
.info p{font-size:12px;color:#888}
</style>
</head>
<body>
<h1>Pasong</h1>
<div class="list">
<div class="item"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><div class="info"><h3>Midnight Vibes</h3><p>Kivumbi • 3:42</p></div></div>
<div class="item"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><div class="info"><h3>Urban Dreams</h3><p>Pasong • 2:58</p></div></div>
<div class="item"><div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5.14v14l11-7-11-7z"/></svg></div><div class="info"><h3>Neon Lights</h3><p>DJ Lenz • 4:11</p></div></div>
</div>
</body>
</html>
