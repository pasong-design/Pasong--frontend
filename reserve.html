<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Reserve Studio - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input,select,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#2563eb;border:none;border-radius:30px;font-weight:bold;color:#fff;cursor:pointer}</style>
</head>
<body>
<div class="card">
<h2 style="color:#fbbf24">Reserve a Studio Session</h2>
<p>Fee: UGX 5,000 reservation to confirm booking</p>
<form id="reserveForm">
<input type="text" name="name" placeholder="Your Name" required>
<input type="tel" name="phone" placeholder="Phone / WhatsApp" required>
<select name="studio" required><option value="">Select Studio</option><option>KV Beats Studio - UGX 50k</option><option>Elite Sound - UGX 80k</option><option>Producer Point - UGX 150k</option></select>
<input type="date" name="date" required>
<textarea name="message" placeholder="Song type, hours needed..."></textarea>
<button type="submit">Request Booking - UGX 5,000</button>
</form>
</div>
<script>
document.getElementById('reserveForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `RESERVE REQUEST:\nName:${data.name}\nPhone:${data.phone}\nStudio:${data.studio}\nDate:${data.date}\nMsg:${data.message}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
 // To connect to backend: fetch('/api/studio/reserve',{method:'POST',body:JSON.stringify(data)})
}
</script>
</body>
</html>
