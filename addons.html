<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Add-ons - PASONG</title>
<style>body{background:#0a0a0f;color:#fff;font-family:sans-serif;padding:20px}.card{background:#14141c;padding:25px;border-radius:16px;max-width:500px;margin:auto}input,select{width:100%;padding:12px;margin:8px 0;border-radius:8px;background:#000;border:1px solid #333;color:#fff}button{width:100%;padding:14px;background:#ea580c;border:none;border-radius:30px;font-weight:bold;color:#fff;cursor:pointer}</style>
</head><body>
<div class="card">
<h2 style="color:#fb923c">Production Add-ons</h2>
<p>Mix & Master: UGX 40,000<br>Producer Beat: UGX 70,000</p>
<form id="addonForm">
<input type="text" name="name" placeholder="Your Name" required>
<input type="tel" name="phone" placeholder="Phone" required>
<select name="addon" required><option value="">Select Add-on</option><option>Mix & Master - UGX 40k</option><option>Producer Beat - UGX 70k</option><option>Both - UGX 110k</option></select>
<input type="text" name="studio" placeholder="Preferred Studio / Producer (KV Beats etc)">
<button type="submit">Request Add-on</button>
</form>
</div>
<script>
document.getElementById('addonForm').onsubmit = function(e){
 e.preventDefault();
 let data = Object.fromEntries(new FormData(e.target));
 let msg = `ADD-ON REQUEST:\nName:${data.name}\nPhone:${data.phone}\nAddon:${data.addon}\nStudio:${data.studio}`;
 window.location.href = `https://wa.me/256783000000?text=${encodeURIComponent(msg)}`;
}
</script>
</body></html>
