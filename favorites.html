<!DOCTYPE html><html lang="en">

<title>PASONG — Favorites</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:Arial,sans-serif;
  background:#09090f;

}

a{

header{
  position:sticky;

  z-index:1000;
  background:rgba(9,9,15,.96);

}

.header-inner{
  max-width:1250px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:18px
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
  white-space:nowrap
}

.logo span{

}

.search-box{
  flex:1;

}

.search-box input{
  width:100%;
  background:#15151e;
  border:1px solid #2a2a38;
  color:#fff;
  padding:11px 14px 11px 40px;
  border-radius:10px;
  outline:none
}

.search-box input:focus{
  border-color:#8b5cf6
}

.search-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);

}

.account-box{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#191923;
  border:1px solid #30303d;

  align-items:center;

.account-box img{
  width:100%;
  height:100%;

}

.account-letter{

}

main{
  max-width:1250px;

.back{

.back:hover{

}

.hero{
  background:
    radial-gradient(
      circle at 10% 10%,
      rgba(139,92,246,.22),
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 90%,
      rgba(236,72,153,.12),
      transparent 35%

    #12121a;

}

.eyebrow{

  font-weight:900;

  margin-bottom:10px
}

h1{
  font-size:42px;
  letter-spacing:-1.5px;
  margin-bottom:10px
}

.hero p{
  color:#9999a8;
  max-width:650px;
  line-height:1.6
}

.stats{
  margin-top:22px
}

.stat{
  display:inline-block;
  min-width:130px;
  padding:14px 17px;
  background:#181821;
  border:1px solid #2a2a36;

}

.stat strong{
  display:block;
  font-size:22px
}

.stat span{
  color:#858592;
  font-size:11px
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px
}

.section-header h2{
  font-size:21px
}

.clear-btn{
  border:1px solid #353541;
  background:#15151e;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer
}

.clear-btn:hover{
  border-color:#ec4899;
  color:#ec4899
}

.song-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px
}

.song-card{
  display:flex;
  gap:14px;
  align-items:center;
  background:#12121a;
  border:1px solid #252531;
  border-radius:14px;
  padding:12px;
  transition:.2s
}

.song-card:hover{
  border-color:#494958;
  transform:translateY(-1px)
}

.cover{
  width:82px;
  height:82px;
  flex:0 0 82px;
  border-radius:10px;
  object-fit:cover;
  background:#1b1b25
}

.cover-placeholder{
  width:82px;
  height:82px;
  flex:0 0 82px;
  border-radius:10px;
  background:#1b1b25;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px
}

.song-info{
  min-width:0;
  flex:1
}

.song-title{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.song-artist{
  color:#9696a5;
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.song-meta{
  color:#6f6f7e;
  font-size:11px;
  margin-top:7px
}

.actions{
  display:flex;
  flex-direction:column;
  gap:6px
}

.action{
  border:1px solid #343440;
  background:#181821;
  color:#fff;
  border-radius:8px;
  padding:8px 10px;
  font-size:11px;
  cursor:pointer;
  text-align:center;
  white-space:nowrap
}

.action:hover{
  border-color:#8b5cf6
}

.play{
  background:#8b5cf6;
  border-color:#8b5cf6
}

.remove:hover{
  border-color:#ec4899;
  color:#ec4899
}

.state{
  padding:65px 20px;
  text-align:center;
  background:#12121a;
  border:1px dashed #30303c;
  border-radius:16px
}

.state-icon{
  font-size:42px;
  margin-bottom:14px
}

.state h3{
  font-size:18px;
  margin-bottom:8px
}

.state p{
  color:#90909f;
  font-size:13px;
  line-height:1.6;
  margin-bottom:20px
}

.primary{
  display:inline-flex;
  background:#8b5cf6;
  padding:11px 17px;
  border-radius:9px;
  font-size:13px;
  font-weight:800
}

footer{
  border-top:1px solid #20202b;
  padding:30px 18px;
  text-align:center;
  color:#777785;
  font-size:12px
}

.mini-player{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:2000;
  background:rgba(12,12,18,.98);
  border-top:1px solid #292936;
  min-height:65px;
  display:none;
  align-items:center;
  gap:12px;
  padding:8px 15px
}

.mini-player.active{
  display:flex
}

.mini-cover{
  width:48px;
  height:48px;
  border-radius:7px;
  object-fit:cover;
  background:#191923
}

.mini-info{
  flex:1;
  min-width:0
}

.mini-title{
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.mini-artist{
  color:#888896;
  font-size:11px;
  margin-top:3px
}

.mini-controls{
  display:flex;
  gap:7px
}

.mini-controls button{
  width:38px;
  height:38px;
  border-radius:50%;
  border:1px solid #30303c;
  background:#171720;
  color:#fff;
  cursor:pointer
}

@media(max-width:800px){

  .song-grid{
    grid-template-columns:1fr
  }

  .search-box{
    display:none
  }

}

@media(max-width:520px){

  main{
    padding-left:12px;
    padding-right:12px
  }

  .hero{
    padding:23px 18px
  }

  h1{
    font-size:32px
  }

  .song-card{
    gap:10px
  }

  .cover,
  .cover-placeholder{
    width:65px;
    height:65px;
    flex-basis:65px
  }

  .actions{
    flex-direction:row;
    flex-wrap:wrap
  }

  .action{
    padding:7px 8px
  }

}

<script>

const SUPABASE_URL =
  "https://mtufczmjlkvycarxylgh.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

const API_BASE =
  "https://pasong-api.onrender.com";

let currentUser = null;
let favoriteRows = [];
let favoriteSongs = [];
let currentPlayingSong = null;

const content =
  document.getElementById(
    "content"
  );

const favoriteCount =
  document.getElementById(
    "favoriteCount"
  );

const clearBtn =
  document.getElementById(
    "clearBtn"
  );

const audioPlayer =
  document.getElementById(
    "audioPlayer"
  );

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getArtistName(song){

  return (
    song.performing_name ||
    song.stage_name ||
    song.artist_name ||
    song.artist_profiles?.performing_name ||
    song.artist_profiles?.stage_name ||
    song.artist?.performing_name ||
    song.artist?.stage_name ||
    "Unknown Artist"
  );

}

function getCover(song){

  return (
    song.cover_url ||
    song.cover_image_url ||
    song.cover ||
    song.image_url ||
    ""
  );

}

function getPreview(song){

  return (
    song.preview_url ||
    song.audio_preview_url ||
    song.audio_url ||
    ""
  );

}

function showState(
  icon,
  title,
  message,
  buttonText,
  buttonHref
){

  content.innerHTML = `

    <div class="state">

      <div class="state-icon">
        ${icon}
      </div>

      <h3>
        ${escapeHtml(title)}
      </h3>

      <p>
        ${escapeHtml(message)}
      </p>

      ${
        buttonText
        ?
        `
          <a
            class="primary"
            href="${buttonHref}"
          >
            ${escapeHtml(buttonText)}
          </a>
        `
        :
        ""
      }

    </div>

  `;

}

async function loadAccount(){

  const {
    data:{
      user
    }
  } =
    await supabaseClient
      .auth
      .getUser();

  const accountBox =
    document.getElementById(
      "accountBox"
    );

  if(!user){

    accountBox.href =
      "login.html";

    accountBox.innerHTML =
      `
        <span class="account-letter">
          U
        </span>
      `;

    return;
  }

  currentUser =
    user;

  accountBox.href =
    "account.html";

  let profile =
    null;

  const {
    data
  } =
    await supabaseClient
      .from("artist_profiles")
      .select("*")
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();

  profile =
    data || null;

  const image =
    profile?.profile_image_url ||
    user.user_metadata?.avatar_url ||
    user.user_metadata?.picture ||
    "";

  const name =
    profile?.performing_name ||
    profile?.stage_name ||
    user.user_metadata?.name ||
    user.email ||
    "User";

  if(image){

    accountBox.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(name)}"
      >

    `;

  }else{

    accountBox.innerHTML = `

      <span class="account-letter">
        ${escapeHtml(
          name
            .charAt(0)
            .toUpperCase()
        )}
      </span>

    `;

  }

}

async function loadFavorites(){

  const {
    data:{
      user
    },
    error
  } =
    await supabaseClient
      .auth
      .getUser();

  if(error){

    console.error(
      "Auth error:",
      error
    );

    showState(
      "!",
      "Login check failed",
      error.message
    );

    return;
  }

  currentUser =
    user;

  if(!user){

    favoriteCount.textContent =
      "0";

    clearBtn.style.display =
      "none";

    showState(
      "♡",
      "Login required",
      "Please log in to see and manage your favorite songs.",
      "Login",
      "login.html"
    );

    return;
  }

  const {
    data,
    error:favoriteError
  } =
    await supabaseClient
      .from("favorites")
      .select(
        "id,song_id,created_at"
      )
      .eq(
        "user_id",
        user.id
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(favoriteError){

    console.error(
      "Favorites loading error:",
      favoriteError
    );

    showState(
      "!",
      "Could not load favorites",
      favoriteError.message
    );

    return;
  }

  favoriteRows =
    data || [];

  favoriteCount.textContent =
    favoriteRows.length;

  clearBtn.style.display =
    favoriteRows.length
      ? "block"
      : "none";

  if(!favoriteRows.length){

    showState(
      "♡",
      "No favorites yet",
      "Songs you favorite will appear here.",
      "Explore Music",
      "store.html"
    );

    return;
  }

  await loadFavoriteSongs();

}

async function loadFavoriteSongs(){

  const ids =
    favoriteRows
      .map(
        row => row.song_id
      )
      .filter(Boolean);

  if(!ids.length){

    showState(
      "♡",
      "No favorites yet",
      "Your favorite list is empty."
    );

    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("songs")
      .select("*")
      .in(
        "id",
        ids
      );

  if(error){

    console.error(
      "Song loading error:",
      error
    );

    showState(
      "!",
      "Could not load favorite songs",
      error.message
    );

    return;
  }

  const songs =
    data || [];

  favoriteSongs =
    ids
      .map(
        id =>
          songs.find(
            song =>
              String(song.id) ===
              String(id)
          )
      )
      .filter(Boolean);

  renderFavorites();

}

function renderFavorites(){

  if(!favoriteSongs.length){

    showState(
      "♡",
      "No favorite songs found",
      "The songs saved in your favorites could not be found."
    );

    return;
  }

  content.innerHTML = `

    <div class="song-grid">

      ${
        favoriteSongs
          .map(
            song =>
              createSongCard(song)
          )
          .join("")
      }

    </div>

  `;

}

function createSongCard(song){

  const title =
    song.title ||
    "Untitled";

  const artist =
    getArtistName(song);

  const cover =
    getCover(song);

  const preview =
    getPreview(song);

  const songId =
    song.id;

  return `

    <article
      class="song-card"
    >

      ${
        cover
        ?
        `
          <img
            class="cover"
            src="${escapeHtml(cover)}"
            alt="${escapeHtml(title)}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
          >

          <div
            class="cover-placeholder"
            style="display:none"
          >
            ♫
          </div>
        `
        :
        `
          <div class="cover-placeholder">
            ♫
          </div>
        `
      }

      <div class="song-info">

        <div class="song-title">
          ${escapeHtml(title)}
        </div>

        <div class="song-artist">
          ${escapeHtml(artist)}
        </div>

        <div class="song-meta">
          ${escapeHtml(
            song.genre ||
            "Music"
          )}
        </div>

      </div>

      <div class="actions">

        ${
          preview
          ?
          `
            <button
              class="action play"
              onclick="playSong('${escapeHtml(songId)}')"
            >
              ▶ Play
            </button>
          `
          :
          ""
        }

        <a
          class="action"
          href="song.html?id=${encodeURIComponent(songId)}"
        >
          View
        </a>

        <button
          class="action remove"
          onclick="removeFavorite('${escapeHtml(songId)}')"
        >
          ♥ Remove
        </button>

      </div>

    </article>

  `;

}

async function removeFavorite(songId){

  if(!currentUser){

    window.location.href =
      "login.html";

    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("favorites")
      .delete()
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "song_id",
        songId
      );

  if(error){

    alert(
      error.message
    );

    return;
  }

  await loadFavorites();

}

async function clearFavorites(){

  if(!currentUser){

    window.location.href =
      "login.html";

    return;
  }

  const confirmed =
    window.confirm(
      "Remove all your favorite songs?"
    );

  if(!confirmed){
    return;
  }

  const {
    error
  } =
    await supabaseClient
      .from("favorites")
      .delete()
      .eq(
        "user_id",
        currentUser.id
      );

  if(error){

    alert(
      error.message
    );

    return;
  }

  await loadFavorites();

}

async function playSong(songId){

  const song =
    favoriteSongs.find(
      item =>
        String(item.id) ===
        String(songId)
    );

  if(!song){
    return;
  }

  const preview =
    getPreview(song);

  if(!preview){

    window.location.href =
      "song.html?id=" +
      encodeURIComponent(songId);

    return;
  }

  currentPlayingSong =
    song;

  audioPlayer.src =
    preview;

  document.getElementById(
    "miniCover"
  ).src =
    getCover(song);

  document.getElementById(
    "miniTitle"
  ).textContent =
    song.title ||
    "Untitled";

  document.getElementById(
    "miniArtist"
  ).textContent =
    getArtistName(song);

  document.getElementById(
    "miniPlayer"
  ).classList.add(
    "active"
  );

  document.getElementById(
    "miniPlay"
  ).textContent =
    "❚❚";

  try{

    await audioPlayer.play();

  }catch(error){

    console.error(
      error
    );

  }

}

document
  .getElementById(
    "clearBtn"
  )
  .addEventListener(
    "click",
    clearFavorites
  );

document
  .getElementById(
    "globalSearch"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key !==
        "Enter"
      ){
        return;
      }

      const value =
        this.value.trim();

      if(!value){
        return;
      }

      window.location.href =
        "store.html?search=" +
        encodeURIComponent(value);

    }
  );

document
  .getElementById(
    "miniPlay"
  )
  .addEventListener(
    "click",
    function(){

      if(
        !currentPlayingSong
      ){
        return;
      }

      if(
        audioPlayer.paused
      ){

        audioPlayer
          .play()
          .catch(
            () => {}
          );

        this.textContent =
          "❚❚";

      }else{

        audioPlayer.pause();

        this.textContent =
          "▶";

      }

    }
  );

document
  .getElementById(
    "miniClose"
  )
  .addEventListener(
    "click",
    function(){

      audioPlayer.pause();

      audioPlayer.removeAttribute(
        "src"
      );

      document
        .getElementById(
          "miniPlayer"
        )
        .classList.remove(
          "active"
        );

      currentPlayingSong =
        null;

    }
  );

supabaseClient.auth.onAuthStateChange(
  function(){

    loadAccount();
    loadFavorites();

  }
);

async function init(){

  await loadAccount();

  await loadFavorites();

  if(
    "serviceWorker" in navigator
  ){

    navigator.serviceWorker
      .register(
        "/sw.js"
      )
      .catch(
        error =>
          console.error(
            "Service worker error:",
            error
          )
      );

  }

}

init();

</script></body>
