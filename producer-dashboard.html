<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#8b5cf6">
<title>PASONG Producer Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#090612;color:#fff;min-height:100vh}
header{background:#10091c;border-bottom:1px solid #28153d;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;position:sticky;top:0;z-index:20}
.logo{color:#c084fc;font-size:24px;font-weight:800;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:12px}
.header-right a{color:#ddd;text-decoration:none;font-size:14px}
.header-right a:hover{color:#c084fc}
.account{background:#1d1230;border:1px solid #38205a;padding:8px 12px;border-radius:20px;font-size:13px}
.container{width:min(1180px,94%);margin:auto}
.hero{margin-top:25px;padding:28px;border:1px solid #38205a;border-radius:20px;background:linear-gradient(135deg,#160b27,#0d0715)}
.hero h1{font-size:30px;margin-bottom:8px}
.hero p{color:#aaa;line-height:1.6}
.producer-name{color:#c084fc}
.dashboard{display:grid;grid-template-columns:280px 1fr;gap:20px;margin:20px 0 40px}
.sidebar{background:#10091c;border:1px solid #28153d;border-radius:18px;padding:18px;height:max-content}
.sidebar button{width:100%;text-align:left;padding:13px 14px;margin-bottom:8px;border:0;border-radius:10px;background:transparent;color:#ddd;cursor:pointer;font-size:14px}
.sidebar button:hover,.sidebar button.active{background:#241238;color:#fff}
.content{min-width:0}
.card{background:#10091c;border:1px solid #28153d;border-radius:18px;padding:22px;margin-bottom:20px}
.card h2{font-size:21px;margin-bottom:7px}
.card-subtitle{color:#999;font-size:13px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:#160d24;border:1px solid #2d1944;border-radius:14px;padding:18px}
.stat-number{font-size:25px;font-weight:700;color:#c084fc}
.stat-label{color:#999;font-size:12px;margin-top:5px}
.earnings-top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.balance-card{background:linear-gradient(135deg,#1b0d2d,#241238);border:1px solid #4b2870;border-radius:16px;padding:20px;flex:1;min-width:220px}
.balance-label{color:#aaa;font-size:13px;margin-bottom:7px}
.balance-number{color:#c084fc;font-size:28px;font-weight:800}
.withdraw-btn{border:0;border-radius:10px;padding:13px 18px;cursor:pointer;font-weight:700;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.earnings-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.earning-stat{background:#160d24;border:1px solid #2d1944;border-radius:14px;padding:17px}
.earning-number{color:#c084fc;font-size:22px;font-weight:700}
.earning-label{color:#999;font-size:12px;margin-top:6px}
.table-wrap{width:100%;overflow-x:auto}
.earnings-table{width:100%;border-collapse:collapse;min-width:650px}
.earnings-table th,.earnings-table td{padding:13px 12px;text-align:left;border-bottom:1px solid #28153d;font-size:13px}
.earnings-table th{color:#aaa;font-weight:600}
.earnings-table td{color:#ddd}
.earnings-table td:last-child{color:#c084fc;font-weight:700}
.split-note{margin-top:15px;color:#888;font-size:12px;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
label{font-size:13px;color:#ccc}
input,select,textarea{width:100%;background:#0b0611;border:1px solid #392151;border-radius:10px;padding:13px;color:#fff;outline:none}
textarea{min-height:100px;resize:vertical;font-family:Arial,Helvetica,sans-serif}
input:focus,select:focus,textarea:focus{border-color:#8b5cf6}
input[type="file"]{padding:10px}
.price-help{color:#888;font-size:11px}
.btn{border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700}
.btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-secondary{background:#241238;color:#fff;border:1px solid #452567}
.form-actions{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}
.message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px}
.message.success{display:block;background:#102617;border:1px solid #245d32;color:#9ae6a8}
.message.error{display:block;background:#2a1017;border:1px solid #6c2636;color:#ff9caf}
.profile-preview{display:flex;align-items:center;gap:18px;padding:15px;background:#160d24;border:1px solid #2d1944;border-radius:14px;margin-bottom:20px}
.profile-preview img{width:90px;height:90px;border-radius:50%;object-fit:cover;border:2px solid #8b5cf6;background:#21122f}
.profile-preview-text{min-width:0}
.profile-preview-text strong{display:block;font-size:18px;margin-bottom:5px}
.profile-preview-text span{color:#999;font-size:12px}
.agreement-box{background:#0b0611;border:1px solid #392151;border-radius:12px;padding:16px;margin-top:20px;max-height:360px;overflow-y:auto}
.agreement-box h3{font-size
