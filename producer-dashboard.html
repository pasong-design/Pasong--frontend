<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASONG Producer Dashboard - FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#090612;color:#fff;font-family:Arial;padding:20px}button{padding:12px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:700;cursor:pointer}input,textarea{width:100%;background:#0b0611;border:1px solid #392151;border-radius:10px;padding:12px;color:#fff;margin:6px 0}.card{background:#10091c;border:1px solid #28153d;border-radius:16px;padding:20px;margin:15px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:600px){.grid{grid-template-columns:1fr}}.beat{background:#160d24;border:1px solid #2d1944;border-radius:12px;padding:12px;margin:8px 0}</style>
</head><body>
<h1>🎛️ PASONG Producer Dashboard - FIXED</h1>
<div id="status" class="card">Loading...</div>
<div class="card">
<h3>Upload Beat - FAST</h3>
<input id="title" placeholder="Beat Title *">
<div class="grid"><input id="genre" placeholder="Genre - Afrobeat"><input id="bpm" type="number" placeholder="BPM"></div>
<div class="grid"><input id="mp3" type="number" value="10000"><input id="wav" type="number" value="25000"></div>
<div class="grid"><input id="stems" type="number" value="50000"><input id="exclusive" type="number" value="500000"></div>
<input id="audio" type="file" accept="audio/*">
<input id="cover" type="file" accept="image/*">
<label><input id="agree" type="checkbox"> I agree 75/25</label><br><br>
<button id="uploadBtn" disabled>Upload Beat</button>
<div id="msg" style="margin-top:10px"></div>
</div>
<div class="card"><h3>My Beats</h3><div id="beats">Loading...</div></div>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const API_URL="https://pasong-api.onrender.com";
const CLOUD_URL="https://api.cloudinary.com/v1_1/vuehnvkp/auto/upload";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function init(){
 const {data:{user}}=await supabase.auth.getUser();
 if(!user){ document.getElementById("status").innerHTML="❌ Not logged in - <a href='login.html' style='color:#c084fc'>Login</a>"; return; }
 document.getElementById("status").innerHTML="✅ Logged in as "+user.email;
 loadBeats();
}
async function uploadToCloudinary(file,folder,token){
 const sigRes=await fetch(API_URL+"/api/cloudinary/signature",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify({folder})});
 const sig=await sigRes.json(); if(!sigRes.ok) throw new Error(sig.error);
 const fd=new FormData(); fd.append("file",file); fd.append("api_key",sig.api_key); fd.append("timestamp",sig.timestamp); fd.append("signature",sig.signature); fd.append("folder",sig.folder);
 const up=await fetch(CLOUD_URL,{method:"POST",body:fd}); const j=await up.json(); if(!up.ok) throw new Error(j.error?.message||"Upload failed"); return j.secure_url;
}
async function loadBeats(){
 const {data:{session}}=await supabase.auth.getSession(); if(!session) return;
 try{
  const res=await fetch(API_URL+"/api/beats",{headers:{Authorization:"Bearer "+session.access_token}});
  const j=await res.json();
  const myBeats=(j.beats||[]).filter(b=>b.producer_user_id===session.user.id);
  document.getElementById("beats").innerHTML=myBeats.length? myBeats.map(b=>`<div class="beat"><b>${b.title}</b> - ${b.status} - UGX ${b.lease_mp3_price||b.beat_packages?.[0]?.price||0}</div>`).join("") : "No beats yet";
 }catch(e){ document.getElementById("beats").innerHTML="Error: "+e.message; }
}
document.getElementById("agree").addEventListener("change", e=>{ document.getElementById("uploadBtn").disabled=!e.target.checked; });
document.getElementById("uploadBtn").addEventListener("click", async()=>{
 const btn=document.getElementById("uploadBtn"); btn.disabled=true; btn.textContent="Uploading...";
 try{
  const {data:{session}}=await supabase.auth.getSession(); if(!session) throw new Error("Login expired");
  const title=document.getElementById("title").value.trim(); const audioFile=document.getElementById("audio").files[0]; const coverFile=document.getElementById("cover").files[0];
  if(!title||!audioFile) throw new Error("Title + audio required");
  const audioUrl=await uploadToCloudinary(audioFile,"pasong-beats/audio",session.access_token);
  const preview=audioUrl.replace("/upload/","/upload/so_0,du_60/");
  let coverUrl=null; if(coverFile){ btn.textContent="Uploading cover..."; coverUrl=await uploadToCloudinary(coverFile,"pasong-beats/covers",session.access_token); }
  btn.textContent="Saving...";
  const payload={title, genre:document.getElementById("genre").value||"Afrobeat", bpm:document.getElementById("bpm").value? Number(document.getElementById("bpm").value):null, cover_url:coverUrl, audio_url_preview:preview, audio_url_mp3:audioUrl, audio_url_wav:audioUrl, lease_mp3_price:Number(document.getElementById("mp3").value), lease_wav_price:Number(document.getElementById("wav").value), stems_price:Number(document.getElementById("stems").value), exclusive_price:Number(document.getElementById("exclusive").value)};
  const res=await fetch(API_URL+"/api/beats/create",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(payload)});
  const j=await res.json(); if(!res.ok) throw new Error(j.error||"Save failed");
  document.getElementById("msg").innerHTML="✅ Beat uploaded: "+j.beat.id; document.getElementById("title").value=""; loadBeats();
 }catch(e){ document.getElementById("msg").innerHTML="❌ "+e.message; console.error(e); }
 finally{ btn.textContent="Upload Beat"; btn.disabled=!document.getElementById("agree").checked; }
});
init();
</script>
</body></html>
