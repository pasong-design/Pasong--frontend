<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
<style>body{background:#0f1219;color:#fff;font-family:Inter} .card{background:#171e2e;border:1px solid #243045}</style>
</head>
<body>
<header class="p-5 flex justify-between items-center max-w-[1120px] mx-auto"><div class="font-black">♪ PASONG</div><a href="/" class="bg-white text-black px-4 py-2 rounded-full text-xs font-bold">Home</a></header>
<main class="max-w-[1120px] mx-auto px-5 pb-20">
<h1 class="text-[36px] font-black leading-none mt-6">Book a <span class="text-purple-400">Studio</span></h1>
<p class="text-slate-400 text-sm mt-2">Find producers, recording studios in Kampala, mix & mastering.</p>
<div class="mt-6 grid md:grid-cols-3 gap-4">
<div class="card rounded-[20px] p-5"><div class="w-12 h-12 bg-purple-600 rounded-xl flex items-center justify-center text-xl">🎙️</div><h3 class="font-black mt-3">KV Beats Studio</h3><p class="text-xs text-slate-400">Makindye • Recording + Beats</p><p class="text-purple-400 font-black mt-2">UGX 50k / session</p><button class="mt-3 w-full bg-white text-black py-2 rounded-full font-bold text-xs">Book Now</button></div>
<div class="card rounded-[20px] p-5"><div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-xl">🎧</div><h3 class="font-black mt-3">Elite Sound</h3><p class="text-xs text-slate-400">Kansanga • Mix & Master</p><p class="text-blue-400 font-black mt-2">UGX 80k / song</p><button class="mt-3 w-full bg-white text-black py-2 rounded-full font-bold text-xs">Book Now</button></div>
<div class="card rounded-[20px] p-5"><div class="w-12 h-12 bg-pink-600 rounded-xl flex items-center justify-center text-xl">🎹</div><h3 class="font-black mt-3">Producer Point</h3><p class="text-xs text-slate-400">Wakiso • Full Package</p><p class="text-pink-400 font-black mt-2">UGX 150k / day</p><button class="mt-3 w-full bg-white text-black py-2 rounded-full font-bold text-xs">Book Now</button></div>
</div>
</main>
<div id="pasong-footer"></div><script src="pasong-footer-loader.js"></script>
</body>
</html>
