<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Studio - PASONG</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{font-family:Inter,sans-serif;background:#0a0a0f;color:white;margin:0}.wrap{width:min(900px,calc(100% - 28px));margin:auto}#map{height:280px;border-radius:12px;border:1px solid #2a2a3a}input,select{width:100%;background:#1e1e2e;border:1px solid #2a2a3a;border-radius:8px;padding:12px;color:white;font-size:12px;margin-bottom:10px}</style>
</head>
<body>
<div class="wrap" style="padding:20px 0">
<a href="studio.html" style="color:#9ca3af;font-size:12px;text-decoration:none">← Back to Studios</a>
<div style="margin-top:16px;background:#15151f;border:1px solid #2a2a3a;border-radius:16px;padding:20px">
<h1 id="studioName" style="font-size:24px;font-weight:900;margin:0">Studio</h1>
<p id="studioMeta" style="font-size:12px;color:#9ca3af;margin-top:6px">Loading...</p>
<div id="map" style="margin-top:14px"></div>

<div style="margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div><label style="font-size:11px;color:#d1d5db">Your Name *</label><input id="clientName" required placeholder="Your name"></div>
<div><label style="font-size:11px;color:#d1d5db">Your Phone *</label><input id="clientPhone" required placeholder="070..."></div>
<div><label style="font-size:11px;color:#d1d5db">Date *</label><input id="bookDate" type="date" required></div>
<div><label style="font-size:11px;color:#d1d5db">Time *</label><input id="bookTime" type="time" required></div>
</div>
<label style="font-size:11px;color:#d1d5db">Service</label><select id="bookService"><option>Recording + Beats</option><option>Mix & Master</option><option>Full Package</option></select>

<button onclick="confirmBooking()" style="width:100%;margin-top:12px;background:linear-gradient(100deg,#b10cff,#4e4dff,#00b8f5);border:0;border-radius:99px;padding:13px;color:white;font-weight:800;cursor:pointer">Book via WhatsApp →</button>
<p id="status" style="font-size:11px;color:#22c55e;margin-top:10px"></p>
</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const studio = params.get('studio') || 'Studio';
const producer = params.get('producer') || studio;
const phone = params.get('phone') || '0700471406';
const locationName = params.get('location') || '';
const price = params.get('price') || '';
const lat = parseFloat(params.get('lat') || '0.3476');
const lng = parseFloat(params.get('lng') || '32.5825');
const service = params.get('service') || '';

document.getElementById('studioName').textContent = studio;
document.getElementById('studioMeta').innerHTML = `📍 ${locationName} • ${price}<br>👤 Producer: ${producer} • 📞 ${phone} • 🎚 ${service}`;
document.getElementById('bookService').value = service || 'Recording + Beats';

setTimeout(()=>{
 const map = L.map('map').setView([lat,lng],14);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
 L.marker([lat,lng]).addTo(map).bindPopup(studio).openPopup();
},300);

function confirmBooking(){
 const name = document.getElementById('clientName').value;
 const cPhone = document.getElementById('clientPhone').value;
 const date = document.getElementById('bookDate').value;
 const time = document.getElementById('bookTime').value;
 const svc = document.getElementById('bookService').value;
 if(!name || !cPhone || !date || !time){ alert('Fill all fields'); return; }
 const msg = `Hello ${producer}, I want to book ${studio} %0A📍 ${locationName}%0A🎚 ${svc}%0A📅 ${date} at ${time}%0A👤 My name: ${name}%0A📞 My phone: ${cPhone}%0ABooked via PASONG`;
 let cleanPhone = phone.replace(/[^0-9]/g,'');
 if(cleanPhone.startsWith('0')) cleanPhone = '256' + cleanPhone.substring(1);
 if(!cleanPhone.startsWith('256') && cleanPhone.length<12) cleanPhone = '256'+cleanPhone;
 window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
 document.getElementById('status').textContent = '✅ Opening WhatsApp to producer...';
}
</script>

<footer style="background:#0a0a0f;border-top:1px solid #1f1f2a;padding:35px 0 20px;margin-top:30px"><div class="wrap"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;font-size:11px;color:#9ca3af"><div><b style="color:#c4b5fd">◆ PASONG</b><br><br>Company<br><a href="#" style="color:#9ca3af;text-decoration:none">About</a><br><a href="#" style="color:#9ca3af;text-decoration:none">Jobs</a></div><div>Communities<br><a href="#" style="color:#9ca3af;text-decoration:none">For Artists</a><br><a href="#" style="color:#9ca3af;text-decoration:none">For Creators</a></div><div>Useful links<br><a href="#" style="color:#9ca3af;text-decoration:none">Support</a><br><a href="#" style="color:#9ca3af;text-decoration:none">Free Mobile App</a></div><div>PASONG Plans<br><a href="#" style="color:#9ca3af;text-decoration:none">Music Store</a><br><a href="#" style="color:#9ca3af;text-decoration:none">Charts</a></div></div><div style="text-align:center;margin-top:30px;font-size:9px;color:#4b5563">© 2026 PASONG</div></div></footer>
</body>
</html>
