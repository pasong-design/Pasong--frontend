
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<meta name="description" content="Discover and play real music on PASONG.">
<title>Discover Music | PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--line:#30243e;--purple:#a78bfa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#201233 0,#0b0912 50%);color:#f8f5ff;font-family:Inter,system-ui,sans-serif;padding-bottom:100px}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;background:#0d0a15ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ticker{white-space:nowrap;overflow:hidden;background:#7c3aed;color:#fff;font-size:13px;font-weight:800;padding:10px 0;border-bottom:1px solid #a78bfa}
.ticker-track{display:inline-block;animation:ticker 60s linear infinite;padding-left:100%}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.top-inner{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:950;font-size:21px;white-space:nowrap}.brand span{color:var(--purple)}
.search{flex:1;max-width:580px;position:relative}
.search input{width:100%;padding:12px 16px;background:#171222;border:1px solid #3b2b4f;border-radius:13px;color:#fff;outline:none}
.search input:focus{border-color:#a78bfa}
.cart-link{border:1px solid #49325f;border-radius:11px;padding:10px 12px;color:#e9ddff;font-size:13px;white-space:nowrap}
.wrap{max-width:1200px;margin:auto;padding:18px 20px 90px}
.hero{border:1px solid #49325f;border-radius:22px;padding:26px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:center;background:linear-gradient(115deg,#2b1744,#171020 58%,#321331)}
.hero h1{font-size:clamp(30px,5vw,48px);line-height:1.1;margin:12px 0}
.hero p{color:#d0c5df}
.vinyl{width:150px;height:150px;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 4px,#24202c 5px 7px);border:8px solid #1a1a2e;box-shadow:0 0 40px #7c3aed55;display:grid;place-items:center;animation:spin 8s linear infinite;margin:auto}
.vinyl::after{content:'♫';width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#7c3aed,#ec4899);display:grid;place-items:center;color:#fff;font-size:25px}
@keyframes spin{to{transform:rotate(360deg)}}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.pill{border:1px solid #3a2b4a;background:#171221;color:#ddd2ec;padding:9px 14px;border-radius:999px;cursor:pointer;font-size:13px}
.pill.active{background:#7c3aed;color:#fff;border-color:#a78bfa}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.song{min-width:0;border:1px solid var(--line);background:linear-gradient(160deg,#191323,#100d17);border-radius:16px;padding:10px;transition:.2s}
.song:hover{transform:translateY(-3px);border-color:#8b5cf6;box-shadow:0 12px 30px #7c3aed33}
.art{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#261b35}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;right:9px;bottom:9px;width:44px;height:44px;border-radius:50%;border:1px solid #ffffff59;background:#0008;backdrop-filter:blur(10px);color:#fff;font-size:16px;font-weight:900;cursor:pointer;display:grid;place-items:center;z-index:2}
.play.playing{background:#fff;color:#000;border-color:#fff}
.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 3px}
.artist{font-size:12px;color:#bdb1cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-main{margin-top:8px;font-weight:950;font-size:14px;color:#fff}
.price-sub{font-size:11px;color:#c4b5fd;margin-top:2px}
.add-cart-btn{width:100%;margin-top:9px;padding:10px;border:1px solid #8051bd;border-radius:10px;background:linear-gradient(100deg,#51258b,#8b5cf6);color:#fff;font-size:12px;font-weight:800;cursor:pointer}
.genre{display:inline-block;margin-top:7px;font-size:10px;color:#d8b4fe;background:#352344;border-radius:999px;padding:4px 8px}
.message{grid-column:1/-1;text-align:center;padding:28px 18px;color:#cfc4dd;border:1px solid var(--line);border-radius:14px;background:#15101f}
.retry{margin-top:12px;padding:10px 16px;border:1px solid #8051bd;border-radius:10px;background:#51258b;color:#fff;cursor:pointer}
.player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#0f0a19ed;backdrop-filter:blur(18px);border-top:1px solid #3a2b4a;padding:10px 14px;display:flex;align-items:center;gap:12px;transform:translateY(110%);transition:transform .3s}
.player.show{transform:translateY(0)}
.player-cover{width:48px;height:48px;border-radius:8px;background:#261b35;overflow:hidden;flex-shrink:0}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-info{flex:1;min-width:0}
.player-title{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:11px;color:#bdb1cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls{display:flex;align-items:center;gap:10px}
.pbtn{width:36px;height:36px;border-radius:50%;border:1px solid #4a3360;background:#1e1630;color:#fff;cursor:pointer;display:grid;place-items:center;font-size:14px}
.pbtn.play-main{width:42px;height:42px;background:#fff;color:#000;border-color:#fff;font-size:16px}
.progress{position:absolute;top:0;left:0;right:0;height:3px;background:#2a1f3a;cursor:pointer}
.progress-bar{height:100%;width:0%;background:#a78bfa}
.player-status{font-size:10px;color:#c4b5fd;margin-top:3px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:20px}.vinyl{width:115px;height:115px}}
@media(max-width:420px){.top-inner{padding:10px 12px;gap:9px}.search{order:3;flex-basis:100%;max-width:none}.wrap{padding:14px 12px 80px}.hero{grid-template-columns:1fr}.vinyl{display:none}.grid{gap:9px}.song{padding:7px}.player{gap:8px;padding:10px 8px}.player-controls{gap:5px}.pbtn{width:32px;height:32px}.pbtn.play-main{width:38px;height:38px}}
</style>
</head>
<body>
<header class="top">
  <div class="ticker"><div class="ticker-track" id="tickerTrack">🎧 PASONG • Loading music…</div></div>
  <div class="top-inner">
    <a class="brand" href="index.html">◈ PASONG<span>.</span></a>
    <label class="search"><input id="searchInput" type="search" placeholder="Search songs or artists…" autocomplete="off" aria-label="Search songs or artists"></label>
    <a class="cart-link" href="cart.html">🛒 Cart</a>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <div style="color:#d8b4fe;font-size:11px;font-weight:800;letter-spacing:2px">PASONG DISCOVER • REAL MUSIC</div>
      <h1>Discover music.<br><span style="color:#c4b5fd">Find your sound.</span></h1>
      <p>Tap ▶ to play. Discover music from PASONG artists.</p>
    </div>
    <div class="vinyl" id="vinylIcon" aria-hidden="true"></div>
  </section>

  <nav class="pills" id="filters" aria-label="Filter by genre">
    <button class="pill active" data-filter="all">All Music</button>
    <button class="pill" data-filter="Afrobeats">Afrobeats</button>
    <button class="pill" data-filter="Dancehall">Dancehall</button>
    <button class="pill" data-filter="Hip Hop">Hip Hop</button>
    <button class="pill" data-filter="Gospel">Gospel</button>
  </nav>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:15px 0">
    <h2 style="margin:0">Explore music</h2>
    <span id="songCount" style="color:#c4b5fd;font-size:12px;text-align:right"></span>
  </div>
  <div class="grid" id="songGrid" aria-live="polite">
    <div class="message">Loading PASONG music…</div>
  </div>
</main>

<div class="player" id="player" aria-label="Music player">
  <div class="progress" id="progressTrack" title="Seek through song">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="player-cover"><img id="playerCover" src="https://placehold.co/200x200/241633/ffffff?text=PASONG" alt="Current song cover"></div>
  <div class="player-info">
    <div class="player-title" id="playerTitle">No song selected</div>
    <div class="player-artist" id="playerArtist">Choose a song to play</div>
    <div class="player-status" id="playerStatus">PASONG player</div>
  </div>
  <div class="player-controls">
    <button class="pbtn" id="prevBtn" aria-label="Previous song">⏮</button>
    <button class="pbtn play-main" id="playPauseBtn" aria-label="Play or pause">▶</button>
    <button class="pbtn" id="nextBtn" aria-label="Next song">⏭</button>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<script>
"use strict";

/* PASONG configuration */
const API_BASE = "https://pasong-api.vercel.app";
const SUPABASE_URL = "https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const FX_API = "https://open.er-api.com/v6/latest/USD";
const CART_KEY = "pasong_cart_v1";
const PLACEHOLDER = "https://placehold.co/500x500/241633/ffffff?text=PASONG";

const COUNTRY_CURRENCY = {
  UG:"UGX",KE:"KES",TZ:"TZS",RW:"RWF",BI:"BIF",SS:"SSP",ET:"ETB",
  NG:"NGN",GH:"GHS",ZA:"ZAR",EG:"EGP",MA:"MAD",DZ:"DZD",TN:"TND",
  ZM:"ZMW",MW:"MWK",MZ:"MZN",BW:"BWP",NA:"NAD",SZ:"SZL",LS:"LSL",
  AO:"AOA",CM:"XAF",SN:"XOF",CI:"XOF",BF:"XOF",ML:"XOF",NE:"XOF",
  TG:"XOF",BJ:"XOF",GN:"GNF",LR:"LRD",SL:"SLL",GM:"GMD",MR:"MRU",
  CV:"CVE",MU:"MUR",SC:"SCR",KM:"KMF",DJ:"DJF",ER:"ERN",GB:"GBP",
  US:"USD"
};
const OTHER_AFRICA = [
  "NG","GH","ZA","EG","MA","DZ","TN","ZM","MW","MZ","BW","NA","SZ",
  "LS","AO","CM","SN","CI","BF","ML","NE","TG","BJ","GN","LR","SL",
  "GM","MR","CV","MU","SC","KM","DJ","ER","SD","LY","SO"
];
const EAST_AFRICA = ["KE","TZ","RW","BI","SS","ET"];
const UK_CODES = ["GB","GG","IM","JE"];

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[ch]));

let db = null;
try {
  if (window.supabase?.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (error) {
  console.error("PASONG Supabase initialization failed:", error);
}

let songs = [];
let artistMap = {};
let activeFilter = "all";
let query = "";
let currentIndex = -1;
let currentList = [];
let fxRates = null;
let currentPricing = {
  amount:700,currency:"UGX",label:"UGX 700",country:"UG",
  sub:"Uganda",base:700,baseCur:"UGX"
};

const audio = $("audio");
const player = $("player");
const audioPlayButton = $("playPauseBtn");

function firstValue(...values) {
  for (const value of values) {
    if (value !== null && value !== undefined && String(value).trim() !== "") {
      return value;
    }
  }
  return "";
}

function getArtistObject(song) {
  return song?.artist ||
    song?.artist_profile ||
    song?.artistProfile ||
    song?.artist_data ||
    song?.artistData ||
    song?.artist_info ||
    song?.artistInfo ||
    null;
}

function getArtistProfile(song) {
  const artist = getArtistObject(song);
  return song?.artist_profile ||
    song?.artistProfile ||
    artist?.profile ||
    artist?.artist_profile ||
    artist?.artistProfile ||
    artist ||
    null;
}

function getArtistId(song) {
  const artist = getArtistObject(song);
  const profile = getArtistProfile(song);
  return firstValue(
    song?.artist_id,song?.artistId,
    song?.artist_profile_id,song?.artistProfileId,
    song?.artist_user_id,song?.user_id,
    profile?.id,profile?.artist_id,profile?.artistId,
    profile?.user_id,artist?.id,artist?.artist_id,artist?.artistId
  );
}

function getArtistName(song) {
  const artist = getArtistObject(song);
  const profile = getArtistProfile(song);

  const direct = firstValue(
    song?.performing_name,song?.performingName,
    song?.stage_name,song?.stageName,
    song?.artist_name,song?.artistName,
    typeof song?.artist === "string" ? song.artist : ""
  );
  if (direct) return String(direct);

  const profileName = firstValue(
    profile?.performing_name,profile?.performingName,
    profile?.stage_name,profile?.stageName,
    profile?.public_name,profile?.publicName,
    profile?.display_name,profile?.displayName,
    profile?.artist_name,profile?.artistName,
    profile?.full_name,profile?.name
  );
  if (profileName) return String(profileName);

  const artistName = firstValue(
    artist?.performing_name,artist?.performingName,
    artist?.stage_name,artist?.stageName,
    artist?.public_name,artist?.publicName,
    artist?.display_name,artist?.displayName,
    artist?.artist_name,artist?.artistName,
    artist?.full_name,artist?.name,artist?.username
  );
  return artistName ? String(artistName) : "";
}

function songArtist(song) {
  const id = getArtistId(song);
  const mapped = id ? artistMap[String(id)] : null;
  const mappedName = firstValue(
    mapped?.performing_name,mapped?.stage_name,mapped?.public_name,
    mapped?.display_name,mapped?.artist_name,mapped?.full_name,
    mapped?.name,mapped?.username
  );
  return String(mappedName || getArtistName(song) || "PASONG Artist");
}

function cover(song) {
  return firstValue(
    song?.cover_url,song?.cover_image_url,song?.cover_image,
    song?.cover, song?.artwork_url,song?.artwork, song?.image_url
  );
}

function audioUrl(song) {
  return firstValue(
    song?.audio_url,song?.file_url,song?.song_url,
    song?.mp3_url,song?.audio_file_url,song?.stream_url,
    song?.audio, song?.url
  );
}

function genre(song) {
  return String(firstValue(song?.genre,song?.music_genre,song?.category,"Other")).trim();
}

/* Currency handling: never display a converted amount if no valid rate exists. */
async function getRates() {
  try {
    const response = await fetch(FX_API,{cache:"no-store"});
    if (!response.ok) throw new Error("Exchange-rate service unavailable");
    const data = await response.json();
    if (data.result === "success" && data.rates && data.rates.USD) {
      fxRates = data.rates;
    }
  } catch (error) {
    console.warn("PASONG exchange rates unavailable:",error);
  }
}

function convertAmount(amount,fromCurrency,toCurrency) {
  if (fromCurrency === toCurrency) return amount;
  if (!fxRates) return null;

  const fromRate = fromCurrency === "USD" ? 1 : Number(fxRates[fromCurrency]);
  const toRate = toCurrency === "USD" ? 1 : Number(fxRates[toCurrency]);

  if (!fromRate || !toRate || !Number.isFinite(fromRate) || !Number.isFinite(toRate)) {
    return null;
  }
  const converted = (Number(amount) / fromRate) * toRate;
  return Number.isFinite(converted) ? converted : null;
}

function formatPrice(amount,currency) {
  try {
    return new Intl.NumberFormat(undefined,{
      style:"currency",currency,maximumFractionDigits:2
    }).format(amount);
  } catch {
    return `${Number(amount).toFixed(2)} ${currency}`;
  }
}

function getPriceForCountry(country) {
  const cc = String(country || "UG").toUpperCase();
  const localCurrency = COUNTRY_CURRENCY[cc] || "USD";

  if (cc === "UG") {
    return {amount:700,currency:"UGX",label:"UGX 700",country:cc,sub:"Uganda",base:700,baseCur:"UGX"};
  }

  if (EAST_AFRICA.includes(cc)) {
    const converted = convertAmount(1000,"UGX",localCurrency);
    if (converted !== null) {
      return {
        amount:converted,currency:localCurrency,label:formatPrice(converted,localCurrency),
        country:cc,sub:"East Africa",base:1000,baseCur:"UGX"
      };
    }
    return {
      amount:1000,currency:"UGX",label:"UGX 1,000",country:cc,
      sub:"East Africa · base price",base:1000,baseCur:"UGX"
    };
  }

  if (OTHER_AFRICA.includes(cc)) {
    const converted = convertAmount(0.57,"USD",localCurrency);
    if (converted !== null) {
      return {
        amount:converted,currency:localCurrency,label:formatPrice(converted,localCurrency),
        country:cc,sub:"Africa",base:0.57,baseCur:"USD"
      };
    }
    return {
      amount:0.57,currency:"USD",label:"$0.57",country:cc,
      sub:"Africa · base price",base:0.57,baseCur:"USD"
    };
  }

  if (UK_CODES.includes(cc)) {
    return {amount:1,currency:"GBP",label:"£1.00",country:cc,sub:"UK",base:1,baseCur:"GBP"};
  }

  return {amount:1,currency:"USD",label:"$1.00",country:cc,sub:"International",base:1,baseCur:"USD"};
}

async function detectCountryAndPricing() {
  let country = "";

  // Ask the existing PASONG pricing endpoint first.
  try {
    const response = await fetch(`${API_BASE}/api/pricing`,{
      mode:"cors",credentials:"omit",cache:"no-store"
    });
    if (response.ok) {
      const data = await response.json();
      country = firstValue(data?.country,data?.country_code,data?.countryCode);
    }
  } catch (error) {
    console.warn("PASONG pricing endpoint unavailable:",error);
  }

  // Public IP lookup is only a fallback.
  if (!country) {
    try {
      const response = await fetch("https://ipwho.is/",{cache:"no-store"});
      if (response.ok) {
        const data = await response.json();
        if (data.success) country = data.country_code;
      }
    } catch (error) {
      console.warn("Country lookup unavailable:",error);
    }
  }

  country = String(country || "UG").toUpperCase();
  currentPricing = getPriceForCountry(country);

  try {
    localStorage.setItem("pasong_country",country);
    localStorage.setItem("pasong_pricing",JSON.stringify(currentPricing));
  } catch (error) {
    console.warn("Could not save pricing preference:",error);
  }

  document.documentElement.dataset.pasongCountry = country;
  window.dispatchEvent(new CustomEvent("pasong:pricing-ready",{detail:currentPricing}));
  render();
}

/* Support common API response formats without assuming a single shape. */
function extractSongArray(payload) {
  if (Array.isArray(payload)) return payload;
  const candidates = [
    payload?.songs,payload?.data,payload?.result,
    payload?.data?.songs,payload?.result?.songs,
    payload?.items,payload?.results
  ];
  return candidates.find(Array.isArray) || [];
}

async function loadSongsFromAPI() {
  const response = await fetch(`${API_BASE}/api/songs`,{
    method:"GET",
    headers:{Accept:"application/json"},
    cache:"no-store"
  });

  if (!response.ok) throw new Error(`PASONG API returned HTTP ${response.status}`);
  const payload = await response.json();
  const list = extractSongArray(payload);

  if (!list.length) {
    throw new Error("The PASONG API responded, but no songs were found in its response.");
  }
  return list;
}

function buildArtistMap(profiles) {
  const map = {};
  (Array.isArray(profiles) ? profiles : []).forEach(profile => {
    const ids = [
      profile?.id,profile?.user_id,profile?.artist_id,profile?.auth_user_id
    ].filter(value => value !== null && value !== undefined && String(value) !== "");

    ids.forEach(id => { map[String(id)] = profile; });
  });
  return map;
}

async function loadMusic() {
  $("songGrid").innerHTML = '<div class="message">Loading PASONG music…</div>';
  $("songCount").textContent = "";

  let supabaseError = null;

  // Try the existing Supabase tables first.
  if (db) {
    try {
      const songResult = await db
        .from("songs")
        .select("*")
        .order("created_at",{ascending:false})
        .limit(200);

      if (songResult.error) throw songResult.error;

      const profileResult = await db
        .from("artist_profiles")
        .select("*")
        .limit(500);

      if (profileResult.error) {
        console.warn("Artist profiles could not load:",profileResult.error.message);
      }

      songs = Array.isArray(songResult.data) ? songResult.data : [];
      artistMap = buildArtistMap(profileResult.data || []);

      // Use the API if Supabase returns no public songs.
      if (songs.length) {
        finishLoading();
        return;
      }
      supabaseError = new Error("Supabase returned no songs.");
    } catch (error) {
      supabaseError = error;
      console.error("Supabase music loading failed:",error);
    }
  } else {
    supabaseError = new Error("Supabase client could not initialize.");
  }

  // Fallback to the current PASONG API.
  try {
    songs = await loadSongsFromAPI();
    finishLoading();
    return;
  } catch (apiError) {
    console.error("PASONG API music loading failed:",apiError);
  }

  const detail = supabaseError?.message
    ? `Database: ${supabaseError.message}`
    : "Check that your songs are available publicly.";

  $("songGrid").innerHTML =
    `<div class="message">
      <strong>Unable to load PASONG music.</strong>
      <p>We couldn't retrieve the songs from Supabase or the music API.</p>
      <p style="font-size:12px;color:#bdb1cd">${esc(detail)}</p>
      <button class="retry" id="retryButton">Try again</button>
    </div>`;
  $("retryButton")?.addEventListener("click",loadMusic);
  $("tickerTrack").textContent = "🎧 PASONG • Music is temporarily unavailable • Please try again";
  $("songCount").textContent = "Music unavailable";
}

function finishLoading() {
  // Index each song's embedded artist as well as the profile table.
  songs.forEach(song => {
    const artist = getArtistObject(song);
    const profile = getArtistProfile(song);
    [artist,profile].filter(Boolean).forEach(item => {
      const ids = [item?.id,item?.user_id,item?.artist_id,item?.auth_user_id]
        .filter(value => value !== null && value !== undefined && String(value) !== "");
      ids.forEach(id => {
        if (!artistMap[String(id)]) artistMap[String(id)] = item;
      });
    });
  });

  buildRealTicker(songs);
  render();
}

function getPlayCount(song) {
  return Number(firstValue(
    song?.play_count,song?.plays,song?.views,song?.streams,song?.total_plays,0
  )) || 0;
}

function buildRealTicker(list) {
  if (!list.length) {
    $("tickerTrack").textContent = "🎧 PASONG • Discover music • ";
    return;
  }

  const dated = [...list].sort((a,b) =>
    new Date(b?.created_at || 0).getTime() - new Date(a?.created_at || 0).getTime()
  );
  const played = [...list].sort((a,b) => getPlayCount(b) - getPlayCount(a));
  const parts = [];

  dated.slice(0,3).forEach(song => {
    parts.push(`🆕 Latest: ${song?.title || "Untitled"}`);
  });

  const mostPlayed = played[0];
  if (mostPlayed) {
    const count = getPlayCount(mostPlayed);
    parts.push(`🔥 Most Played: ${mostPlayed.title || "Untitled"}${count ? ` (${count.toLocaleString()} plays)` : ""}`);
  }

  played.slice(0,3).forEach(song => {
    const count = getPlayCount(song);
    parts.push(`🎵 Trending: ${song?.title || "Untitled"}${count ? ` · ${count.toLocaleString()} plays` : ""}`);
  });

  parts.push(`🎧 ${list.length} songs on PASONG`);
  $("tickerTrack").textContent = parts.join(" • ") + " • " + parts.join(" • ");
}

function matches(song) {
  const text = [
    song?.title,songArtist(song),genre(song)
  ].join(" ").toLowerCase();

  return (!query || text.includes(query.toLowerCase())) &&
    (activeFilter === "all" || genre(song).toLowerCase().includes(activeFilter.toLowerCase()));
}

function render() {
  const grid = $("songGrid");
  const list = songs.filter(matches);
  $("songCount").textContent = `${list.length} songs · ${currentPricing.label}`;

  if (!list.length) {
    grid.innerHTML = `<div class="message">${
      songs.length
        ? "No songs match your search. Try another search or genre."
        : "No songs are available right now."
    }</div>`;
    return;
  }

  grid.innerHTML = list.map((song,index) => {
    const title = song?.title || "Untitled";
    const image = cover(song) || PLACEHOLDER;
    const artist = songArtist(song);
    const songGenre = genre(song);
    const id = firstValue(song?.id,`song-${index}`);

    return `<article class="song">
      <div class="art">
        <img loading="lazy" src="${esc(image)}" alt="${esc(title)} cover"
          onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
        <button class="play" data-play="${index}" aria-label="Play ${esc(title)}">▶</button>
      </div>
      <div class="title" title="${esc(title)}">${esc(title)}</div>
      <div class="artist" title="${esc(artist)}">${esc(artist)}</div>
      <div class="price-main">${esc(currentPricing.label)}</div>
      <div class="price-sub">${esc(currentPricing.sub)}</div>
      <span class="genre">${esc(songGenre)}</span>
      <button class="add-cart-btn" data-cart="${esc(id)}">＋ Add to Cart</button>
    </article>`;
  }).join("");

  grid.querySelectorAll("[data-play]").forEach(button => {
    button.addEventListener("click",() => {
      const index = Number(button.dataset.play);
      playSongAt(index,list);
    });
  });

  grid.querySelectorAll("[data-cart]").forEach(button => {
    button.addEventListener("click",() => {
      const song = list.find((item,index) =>
        String(firstValue(item?.id,`song-${index}`)) === button.dataset.cart
      );
      if (song) addToCart(song,button);
    });
  });

  updatePlayButtons();
}

function addToCart(song,button) {
  let items = [];

  try {
    const stored = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
    if (Array.isArray(stored)) items = stored;
  } catch (error) {
    console.warn("Could not read PASONG cart:",error);
  }

  const id = String(song?.id ?? "");
  if (!id) {
    button.textContent = "Unavailable";
    return;
  }

  if (items.some(item => String(item?.id) === id)) {
    button.textContent = "✓ In Cart";
    return;
  }

  const item = {
    id,
    title:song?.title || "Untitled",
    artist:songArtist(song),
    cover:cover(song) || PLACEHOLDER,
    price:currentPricing.amount,
    currency:currentPricing.currency,
    basePrice:currentPricing.base,
    baseCurrency:currentPricing.baseCur,
    country:currentPricing.country
  };

  items.push(item);

  try {
    localStorage.setItem(CART_KEY,JSON.stringify(items));
    button.textContent = "✓ Added";
  } catch (error) {
    console.error("Could not save PASONG cart:",error);
    button.textContent = "Cart unavailable";
  }
}

async function playSongAt(index,list) {
  const song = list[index];
  if (!song) return;

  const url = audioUrl(song);
  if (!url) {
    $("playerStatus").textContent = "Audio file unavailable for this song";
    player.classList.add("show");
    $("playerTitle").textContent = song?.title || "Untitled";
    $("playerArtist").textContent = songArtist(song);
    return;
  }

  currentList = list;
  currentIndex = index;

  $("playerCover").src = cover(song) || PLACEHOLDER;
  $("playerTitle").textContent = song?.title || "Untitled";
  $("playerArtist").textContent = songArtist(song);
  $("playerStatus").textContent = "Loading audio…";

  player.classList.add("show");
  $("vinylIcon").style.animationPlayState = "running";

  if (audio.src !== url) {
    audio.pause();
    audio.src = url;
    audio.load();
  }

  updatePlayButtons();

  try {
    await audio.play();
  } catch (error) {
    console.warn("PASONG playback error:",error);
    $("playerStatus").textContent =
      error?.name === "NotAllowedError"
        ? "Tap play to start audio"
        : "Could not play this audio file";
    audioPlayButton.textContent = "▶";
  }
}

function updatePlayButtons() {
  document.querySelectorAll(".play").forEach(button => {
    button.classList.remove("playing");
    button.textContent = "▶";
  });

  if (audio.src && !audio.paused && currentIndex >= 0) {
    const currentSong = currentList[currentIndex];
    const currentId = String(currentSong?.id ?? "");
    document.querySelectorAll("[data-play]").forEach(button => {
      const index = Number(button.dataset.play);
      const visibleSong = currentList[index];
      if (visibleSong && String(visibleSong?.id ?? "") === currentId) {
        button.classList.add("playing");
        button.textContent = "⏸";
      }
    });
  }
}

audio.addEventListener("play",() => {
  audioPlayButton.textContent = "⏸";
  $("playerStatus").textContent = "Now playing";
  updatePlayButtons();
});

audio.addEventListener("pause",() => {
  audioPlayButton.textContent = "▶";
  if (audio.currentTime > 0 && !audio.ended) {
    $("playerStatus").textContent = "Paused";
  }
  updatePlayButtons();
});

audio.addEventListener("waiting",() => {
  $("playerStatus").textContent = "Buffering audio…";
});

audio.addEventListener("canplay",() => {
  if (!audio.paused) $("playerStatus").textContent = "Now playing";
});

audio.addEventListener("error",() => {
  $("playerStatus").textContent = "Audio could not be loaded. Try another song.";
  audioPlayButton.textContent = "▶";
  updatePlayButtons();
});

audio.addEventListener("timeupdate",() => {
  if (audio.duration && Number.isFinite(audio.duration)) {
    $("progressBar").style.width = (audio.currentTime / audio.duration * 100) + "%";
  }
});

audio.addEventListener("ended",() => {
  if (currentIndex + 1 < currentList.length) {
    playSongAt(currentIndex + 1,currentList);
  } else {
    audioPlayButton.textContent = "▶";
    $("playerStatus").textContent = "Song finished";
    updatePlayButtons();
  }
});

audioPlayButton.addEventListener("click",async () => {
  if (!audio.src) {
    $("playerStatus").textContent = "Choose a song first";
    return;
  }

  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      $("playerStatus").textContent = "Playback failed. Try again.";
    }
  } else {
    audio.pause();
  }
});

$("nextBtn").addEventListener("click",() => {
  if (currentIndex + 1 < currentList.length) {
    playSongAt(currentIndex + 1,currentList);
  }
});

$("prevBtn").addEventListener("click",() => {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else if (currentIndex > 0) {
    playSongAt(currentIndex - 1,currentList);
  }
});

$("progressTrack").addEventListener("click",event => {
  if (!audio.duration || !Number.isFinite(audio.duration)) return;
  const rect = event.currentTarget.getBoundingClientRect();
  const fraction = Math.min(1,Math.max(0,(event.clientX - rect.left) / rect.width));
  audio.currentTime = fraction * audio.duration;
});

$("searchInput").addEventListener("input",event => {
  query = event.target.value.trim();
  render();
});

$("filters").querySelectorAll("button").forEach(button => {
  button.addEventListener("click",() => {
    activeFilter = button.dataset.filter;
    $("filters").querySelectorAll("button").forEach(item => {
      item.classList.toggle("active",item === button);
    });
    render();
  });
});

async function initPage() {
  // Load exchange rates separately so a slow FX service cannot block music.
  getRates().then(() => {
    currentPricing = getPriceForCountry(currentPricing.country);
    render();
  });

  detectCountryAndPricing();
  await loadMusic();
}

initPage();
</script>
</body>
</html>
