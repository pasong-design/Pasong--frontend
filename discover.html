<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b1d"><title>Discover Music | PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0912;--line:#30243e;--text:#f8f5ff;--muted:#aaa0b9;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#201233 0,#0b0912 50%);color:var(--text);font-family:Inter,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:20;background:#0d0a15ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ticker{white-space:nowrap;overflow:hidden;background:linear-gradient(90deg,#1e1340,#321331);border-bottom:1px solid #3a2a5a;color:#d9c2ff;font-size:11px;font-weight:800;padding:7px 0}
.ticker-track{display:inline-block;animation:ticker 35s linear infinite;padding-left:100%}@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.top-inner{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:950;font-size:21px}.brand span{color:var(--purple)}
.search{flex:1;max-width:580px;position:relative}.search input{width:100%;padding:12px 16px 12px 42px;background:#171222;border:1px solid #3b2b4f;border-radius:13px;color:#fff;outline:none}
.search:before{content:'⌕';position:absolute;left:15px;top:3px;font-size:26px;color:#c4b5fd}
.cart-link{border:1px solid #49325f;border-radius:11px;padding:10px 12px;color:#e9ddff;font-size:13px}
.wrap{max-width:1200px;margin:auto;padding:20px 20px 90px}
.hero{border:1px solid #49325f;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:center;background:linear-gradient(115deg,#2b1744,#171020 58%,#321331)}
.hero h1{font-size:clamp(32px,5vw,49px);margin:10px 0 8px;line-height:1.05}
.vinyl{width:150px;height:150px;border-radius:50%;background:conic-gradient(#111,#222,#111,#333,#111);border:8px solid #1a1a2e;box-shadow:0 0 40px #7c3aed55;display:grid;place-items:center;animation:spin 8s linear infinite;margin:auto}
.vinyl::after{content:'♫';width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#7c3aed,#ec4899);display:grid;place-items:center;color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.pills{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 26px}.pill{border:1px solid #3a2b4a;background:#171221;color:#ddd2ec;padding:9px 15px;border-radius:999px;cursor:pointer}.pill.active{background:#7c3aed;color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.song{border:1px solid var(--line);background:linear-gradient(160deg,#191323,#100d17);border-radius:16px;padding:10px;transition:.2s}
.song:hover{transform:translateY(-4px);border-color:#8b5cf6;box-shadow:0 12px 30px #7c3aed33}
.art{aspect-ratio:1;border-radius:11px;overflow:hidden;background:#261b35;position:relative}.art img{width:100%;height:100%;object-fit:cover}
.play{position:absolute;right:9px;bottom:9px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-weight:900}
.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 4px}.artist{font-size:12px;color:#bdb1cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{margin-top:8px;font-size:13px;font-weight:800;color:#c4b5fd}
.add-cart-btn{width:100%;margin-top:9px;padding:9px;border-radius:9px;background:linear-gradient(100deg,#51258b,#8b5cf6);color:#fff;font-weight:800;border:1px solid #8051bd;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}.top-inner{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
</style></head><body>
<header class="top">
<div class="ticker"><div class="ticker-track" id="tickerTrack">Loading PASONG activity…</div></div>
<div class="top-inner"><a class="brand" href="index.html">◈ PASONG<span>.</span></a><label class="search"><input id="searchInput" type="search" placeholder="Search songs…"></label><a class="cart-link" href="cart.html">🛒 Cart</a></div>
</header>
<main class="wrap">
<section class="hero"><div><div style="color:#d8b4fe;font-size:11px;font-weight:800;letter-spacing:2px">PASONG DISCOVER</div><h1>Discover music.<br><span style="color:#c4b5fd">Find your sound.</span></h1><p style="color:#d0c5df">Trending sounds from PASONG artists. Prices auto-convert to your local currency.</p></div><div class="vinyl"></div></section>
<nav class="pills" id="filters"><button class="pill active" data-filter="all">All Music</button><button class="pill" data-filter="Afrobeats">Afrobeats</button><button class="pill" data-filter="Dancehall">Dancehall</button><button class="pill" data-filter="Hip Hop">Hip Hop</button><button class="pill" data-filter="Gospel">Gospel</button></nav>
<section><div style="display:flex;justify-content:space-between;margin:20px 0 15px"><h2>Explore music</h2><span id="songCount" style="color:#c4b5fd;font-size:12px"></span></div><div class="grid" id="songGrid"><div style="grid-column:1/-1;text-align:center;padding:26px;color:#aaa">Loading music…</div></div></section>
</main>

<script>
// ========= YOUR PASONG GLOBAL PRICE CONTROLLER - KEPT 100% UNTOUCHED =========
/* =========================================================
   PASONG GLOBAL PRICE CONTROLLER
   Detects visitor country and provides local-currency helpers.
   Display conversion only — never authorizes payment amounts.
   ========================================================= */
(function () {
  "use strict";
  if (window.PASONGGlobalPriceController) return;
  const API_BASE = "https://pasong-api.vercel.app";
  const FX_API = "https://open.er-api.com/v6/latest/USD";
  const COUNTRY_CURRENCY = {UG:"UGX",KE:"KES",TZ:"TZS",RW:"RWF",BI:"BIF",SS:"SSP",ET:"ETB",NG:"NGN",GH:"GHS",ZA:"ZAR",EG:"EGP",MA:"MAD",DZ:"DZD",TN:"TND",ZM:"ZMW",MW:"MWK",MZ:"MZN",BW:"BWP",NA:"NAD",SZ:"SZL",LS:"LSL",AO:"AOA",CM:"XAF",SN:"XOF",CI:"XOF",BF:"XOF",ML:"XOF",NE:"XOF",TG:"XOF",BJ:"XOF",GN:"GNF",LR:"LRD",SL:"SLL",GM:"GMD",MR:"MRU",CV:"CVE",MU:"MUR",SC:"SCR",KM:"KMF",DJ:"DJF",ER:"ERN",US:"USD",GB:"GBP",FR:"EUR",DE:"EUR",IT:"EUR",ES:"EUR",PT:"EUR",NL:"EUR",BE:"EUR",IE:"EUR",AT:"EUR",FI:"EUR",GR:"EUR",LU:"EUR",CY:"EUR",MT:"EUR",SK:"EUR",SI:"EUR",EE:"EUR",LV:"EUR",LT:"EUR",AU:"AUD",NZ:"NZD",CA:"CAD",CH:"CHF",SE:"SEK",NO:"NOK",DK:"DKK",PL:"PLN",CZ:"CZK",HU:"HUF",RO:"RON",BG:"BGN",TR:"TRY",IN:"INR",PK:"PKR",BD:"BDT",LK:"LKR",NP:"NPR",CN:"CNY",JP:"JPY",KR:"KRW",SG:"SGD",MY:"MYR",ID:"IDR",PH:"PHP",TH:"THB",VN:"VND",HK:"HKD",TW:"TWD",AE:"AED",SA:"SAR",QA:"QAR",KW:"KWD",BH:"BHD",OM:"OMR",IL:"ILS",JO:"JOD",MX:"MXN",BR:"BRL",AR:"ARS",CL:"CLP",CO:"COP",PE:"PEN",UY:"UYU",PA:"PAB",CR:"CRC",DO:"DOP",JM:"JMD",TT:"TTD",BS:"BSD",BB:"BBD",GD:"XCD",AG:"XCD",DM:"XCD",LC:"XCD",VC:"XCD",KN:"XCD"};
  const COUNTRY_NAMES = {UG:"Uganda",KE:"Kenya",TZ:"Tanzania",RW:"Rwanda",BI:"Burundi",SS:"South Sudan",ET:"Ethiopia",GB:"United Kingdom",US:"United States",FR:"France",DE:"Germany",AU:"Australia",CA:"Canada"};
  const state = {ready:false,country:null,countryName:null,currency:null,rates:null,source:null,error:null};
  let initPromise = null;
  function safeJSON(response){if(!response.ok){throw new Error("Request failed: "+response.status);}return response.json();}
  async function fetchCountry(){
    try{
      const response = await fetch(API_BASE+"/api/pricing",{method:"GET",mode:"cors",credentials:"omit",cache:"no-store",headers:{"Accept":"application/json"}});
      const data = await safeJSON(response);
      const country = String(data.country||"").trim().toUpperCase();
      if(/^[A-Z]{2}$/.test(country)){state.country=country;state.countryName=COUNTRY_NAMES[country]||country;state.currency=COUNTRY_CURRENCY[country]||"USD";state.source="PASONG API";return;}
    }catch(error){console.warn("[PASONG currency] Backend country detection failed:",error.message);}
    try{
      const response = await fetch("https://ipwho.is/",{method:"GET",mode:"cors",credentials:"omit",cache:"no-store"});
      const data = await safeJSON(response);
      if(data.success && data.country_code){const country=String(data.country_code).trim().toUpperCase();if(/^[A-Z]{2}$/.test(country)){state.country=country;state.countryName=data.country||COUNTRY_NAMES[country]||country;state.currency=COUNTRY_CURRENCY[country]||"USD";state.source="IP fallback";return;}}
    }catch(error){console.warn("[PASONG currency] IP fallback failed:",error.message);}
    state.country=null;state.countryName="International";state.currency="USD";state.source="Default";
  }
  async function fetchExchangeRates(){
    try{
      const response = await fetch(FX_API,{method:"GET",mode:"cors",credentials:"omit",cache:"no-store"});
      const data = await safeJSON(response);
      if(data.result==="success" && data.rates && typeof data.rates.USD==="number"){state.rates=data.rates;return;}
      throw new Error("Exchange rates were unavailable.");
    }catch(error){console.warn("[PASONG currency] Exchange-rate request failed:",error.message);state.rates=null;}
  }
  async function init(){
    if(initPromise) return initPromise;
    initPromise = (async function(){
      await fetchCountry();await fetchExchangeRates();state.ready=true;
      document.documentElement.dataset.pasongCountry=state.country||"unknown";
      document.documentElement.dataset.pasongCurrency=state.currency||"USD";
      window.dispatchEvent(new CustomEvent("pasong:currency-ready",{detail:getInfo()}));
      return getInfo();
    })();
    return initPromise;
  }
  function getInfo(){return{ready:state.ready,country:state.country,countryName:state.countryName,currency:state.currency,ratesAvailable:!!state.rates,source:state.source,error:state.error};}
  function convert(amount,fromCurrency,toCurrency){
    const value=Number(amount);const from=String(fromCurrency||"").toUpperCase();const to=String(toCurrency||"").toUpperCase();
    if(!Number.isFinite(value)) throw new Error("Invalid amount.");if(!from||!to) throw new Error("Currency code is required.");if(from===to) return value;
    if(!state.rates) throw new Error("Exchange rates are unavailable.");
    const fromRate=from==="USD"?1:state.rates[from];const toRate=to==="USD"?1:state.rates[to];
    if(typeof fromRate!=="number"||typeof toRate!=="number"||fromRate<=0||toRate<=0) throw new Error("A required exchange rate is unavailable.");
    return (value/fromRate)*toRate;
  }
  function format(amount,currency){
    const code=String(currency||state.currency||"USD").toUpperCase();const value=Number(amount);
    if(!Number.isFinite(value)) return String(amount);
    try{return new Intl.NumberFormat(undefined,{style:"currency",currency:code,maximumFractionDigits:2}).format(value);}catch(error){return value.toFixed(2)+" "+code;}
  }
  function convertAndFormat(amount,fromCurrency,toCurrency){const target=toCurrency||state.currency||"USD";return format(convert(amount,fromCurrency,target),target);}
  function renderPriceElement(element){
    if(!element||!element.dataset) return;if(!element.hasAttribute("data-pasong-price")) return;
    const amount=Number(element.dataset.amount);const sourceCurrency=element.dataset.currency;
    if(!Number.isFinite(amount)||!sourceCurrency) return;
    try{const output=convertAndFormat(amount,sourceCurrency,state.currency);element.textContent=output;element.dataset.displayCurrency=state.currency;}catch(error){console.warn("[PASONG currency] Price not converted:",error.message);}
  }
  function renderMarkedPrices(root){
    const container=root||document;
    if(container.matches && container.matches("[data-pasong-price]")) renderPriceElement(container);
    if(container.querySelectorAll) container.querySelectorAll("[data-pasong-price]").forEach(renderPriceElement);
  }
  function observeMarkedPrices(){
    renderMarkedPrices(document);
    if(!document.body||!window.MutationObserver) return;
    const observer=new MutationObserver(function(records){
      for(const record of records){for(const node of record.addedNodes){if(node.nodeType===Node.ELEMENT_NODE){renderMarkedPrices(node);}}}
    });
    observer.observe(document.body,{childList:true,subtree:true});
  }
  window.PASONGGlobalPriceController={init,getInfo,convert,format,convertAndFormat,renderMarkedPrices};
  init().then(observeMarkedPrices).catch(function(error){state.error=error.message;console.error("[PASONG currency]",error);});
})();
// ========= END OF YOUR CONTROLLER =========

// Discover logic
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cover=s=>s.cover_url||s.cover_image_url||'';let songs=[],artistMap={},activeFilter='all',query='';

async function loadRealTicker(){
  try{
    const [cnt,latest]=await Promise.all([db.from('songs').select('*',{count:'exact',head:true}),db.from('songs').select('title').order('created_at',{ascending:false}).limit(1).single()]);
    const total=cnt.count||0;const title=latest.data?.title||'New music';
    $('tickerTrack').textContent=`🎧 REAL: ${total} songs • 🆕 ${title} • 🌍 Prices auto-convert to your currency • 🎧 ${total} songs • 🆕 ${title} • `;
  }catch{$('tickerTrack').textContent='🎧 PASONG • Discover music • ';}
}
function songArtist(s){return artistMap[s.artist_id]?.performing_name||s.artist_name||'Unknown';}
function genre(s){return String(s.genre||'Other').trim();}
function matches(s){const txt=[s.title,songArtist(s),genre(s)].join(' ').toLowerCase();return (!query||txt.includes(query.toLowerCase())) && (activeFilter==='all'||genre(s).toLowerCase().includes(activeFilter.toLowerCase()));}
function addToCart(s,btn){
  const key='pasong_cart_v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')||[]}catch{};
  if(items.some(x=>String(x.id)===String(s.id))){btn.textContent='✓ In Cart';return;}
  items.push({id:String(s.id),title:s.title,artist:songArtist(s),cover:cover(s),price:700,currency:'UGX'});localStorage.setItem(key,JSON.stringify(items));btn.textContent='✓ Added';
}
function render(){
  const grid=$('songGrid'),list=songs.filter(matches);$('songCount').textContent=list.length+' songs';
  if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;padding:26px;text-align:center;color:#aaa">No songs found</div>';return;}
  grid.innerHTML=list.map(s=>`<article class="song"><div class="art"><img src="${esc(cover(s)||'https://placehold.co/500x500/241633/ffffff?text=PASONG')}"><button class="play">▶</button></div><div class="title">${esc(s.title||'Untitled')}</div><div class="artist">${esc(songArtist(s))}</div><div class="price" data-pasong-price data-amount="700" data-currency="UGX">UGX 700</div><button class="add-cart-btn" data-cart="${esc(s.id)}">＋ Add to Cart</button></article>`).join('');
  grid.querySelectorAll('[data-cart]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=list.find(x=>String(x.id)===b.dataset.cart);if(s)addToCart(s,b)});
  window.PASONGGlobalPriceController.renderMarkedPrices(grid);
}
async function initPage(){
  loadRealTicker();
  const [sr,ar]=await Promise.all([db.from('songs').select('*').order('created_at',{ascending:false}).limit(200),db.from('artist_profiles').select('*').limit(200)]);
  songs=sr.data||[];(ar.data||[]).forEach(a=>artistMap[a.id]=a);
  render();
  window.addEventListener('pasong:currency-ready',()=>window.PASONGGlobalPriceController.renderMarkedPrices());
}
$('searchInput').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()}));
initPage();
</script>
</body></html>
