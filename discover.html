<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100b1d"><title>Discover Music | PASONG</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0912;--panel:#151120;--line:#30243e;--text:#f8f5ff;--muted:#aaa0b9;--purple:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#201233 0,#0b0912 50%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#0d0a15ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.ticker{white-space:nowrap;overflow:hidden;background:linear-gradient(90deg,#1e1340,#321331);border-bottom:1px solid #3a2a5a;color:#d9c2ff;font-size:11px;font-weight:800;letter-spacing:.5px;padding:7px 0}
.ticker-track{display:inline-block;animation:ticker 35s linear infinite;padding-left:100%}@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.top-inner{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{font-weight:950;letter-spacing:1.5px;font-size:21px;color:#fff}.brand span{color:var(--purple)}
.search{flex:1;max-width:580px;position:relative}.search input{width:100%;padding:12px 16px 12px 42px;background:#171222;border:1px solid #3b2b4f;border-radius:13px;color:#fff;outline:none}
.search:before{content:'⌕';position:absolute;left:15px;top:3px;font-size:26px;color:#c4b5fd}
.cart-link{border:1px solid #49325f;border-radius:11px;padding:10px 12px;color:#e9ddff;font-size:13px}
.wrap{max-width:1200px;margin:auto;padding:20px 20px 90px}
.hero{border:1px solid #49325f;border-radius:22px;padding:28px;display:grid;grid-template-columns:1.2fr .8fr;gap:14px;align-items:center;background:linear-gradient(115deg,#2b1744,#171020 58%,#321331);position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#a78bfa33,transparent 70%)}
.eyebrow{color:#d8b4fe;text-transform:uppercase;letter-spacing:2px;font-weight:800;font-size:11px}
.hero h1{font-size:clamp(32px,5vw,49px);margin:10px 0 8px;line-height:1.05}.hero p{color:#d0c5df;max-width:600px;line-height:1.6;margin:0}
.ip-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#1a142b;border:1px solid #3d2b56;border-radius:999px;padding:6px 11px;font-size:11px;color:#c4b5fd}
.vinyl-wrap{display:grid;place-items:center}.vinyl{width:160px;height:160px;border-radius:50%;background:conic-gradient(from 0deg,#111,#222,#111,#333,#111);border:8px solid #1a1a2e;box-shadow:0 0 0 6px #0a0e27,0 0 40px #7c3aed55;display:grid;place-items:center;animation:spin 8s linear infinite}
.vinyl::after{content:'♫';width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#7c3aed,#ec4899);display:grid;place-items:center;color:white;font-size:20px;border:3px solid #0a0e27}
@keyframes spin{to{transform:rotate(360deg)}}
.pills{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 26px}.pill{border:1px solid #3a2b4a;background:#171221;color:#ddd2ec;padding:9px 15px;border-radius:999px;cursor:pointer}.pill.active,.pill:hover{background:#7c3aed;border-color:#a78bfa;color:white}
.section{margin-top:30px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.count{color:#c4b5fd;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.song{border:1px solid var(--line);background:linear-gradient(160deg,#191323,#100d17);border-radius:16px;padding:10px;transition:.2s;cursor:pointer;position:relative;overflow:hidden}
.song:hover{transform:translateY(-4px);border-color:#8b5cf6;box-shadow:0 12px 30px #7c3aed33}
.art{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:#261b35}.art img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}.song:hover .art img{transform:scale(1.05)}
.play{position:absolute;right:9px;bottom:9px;width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#111;font-weight:900;cursor:pointer;box-shadow:0 5px 18px #0007;opacity:.9;transition:.2s}.song:hover .play{transform:scale(1.1);background:#a78bfa}
.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:10px 0 4px}.artist{font-size:12px;color:#bdb1cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price-line{margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#c4b5fd}.price-line b{color:#fff;font-size:13px}
.add-cart-btn{width:100%;margin-top:9px;padding:9px;border:1px solid #8051bd;border-radius:9px;background:linear-gradient(100deg,#51258b,#8b5cf6);color:#fff;font-size:12px;font-weight:800;cursor:pointer;transition:.2s}.add-cart-btn:hover{box-shadow:0 0 18px #8b5cf677}
.genre{display:inline-block;margin-top:8px;font-size:10px;color:#d8b4fe;background:#352344;border-radius:999px;padding:4px 8px}
.empty,.loading{border:1px dashed #443451;border-radius:15px;padding:26px;color:var(--muted);text-align:center;grid-column:1/-1}
.mini{position:fixed;z-index:30;left:50%;bottom:15px;transform:translateX(-50%);width:min(650px,calc(100% - 22px));display:none;align-items:center;gap:12px;padding:10px 13px;border:1px solid #57416c;border-radius:16px;background:#171020f5;box-shadow:0 15px 45px #0009}.mini.on{display:flex}.mini img{width:45px;height:45px;border-radius:9px;object-fit:cover}.mini-info{flex:1;min-width:0}.mini-info b,.mini-info span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-info span{font-size:12px;color:var(--muted);margin-top:3px}.mini button{border:0;border-radius:10px;background:#a78bfa;color:#190e29;padding:10px 13px;font-weight:900;cursor:pointer}.mini button.close{background:#30243e;color:#fff}
.skeleton{background:linear-gradient(90deg,#1a1430 25%,#2a1f4a 50%,#1a1430 75%);background-size:200% 100%;animation:shim 1.2s infinite}@keyframes shim{to{background-position:-200% 0}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.vinyl{width:120px;height:120px}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:11px}.top-inner{flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}}
</style></head><body>
<header class="top">
<div class="ticker"><div class="ticker-track" id="tickerTrack">Loading real PASONG activity…</div></div>
<div class="top-inner"><a class="brand" href="index.html">◈ PASONG<span>.</span></a><label class="search"><input id="searchInput" type="search" placeholder="Search songs, artists, genres…" autocomplete="off"></label><a class="cart-link" href="cart.html">🛒 Cart</a><a class="cart-link" href="index.html">← Home</a></div>
</header>
<main class="wrap">
<section class="hero">
<div>
<div class="eyebrow">PASONG DISCOVER — EVERYTHING @700 UGX</div>
<h1>Discover music.<br><span style="color:#c4b5fd">Find your sound.</span></h1>
<p>All singles fixed at UGX 700. No hidden fees. Buy and download instantly.</p>
<div class="ip-badge" id="ipBadge">🌍 Detecting location…</div>
</div>
<div class="vinyl-wrap"><div class="vinyl"></div></div>
</section>
<nav class="pills" id="filters"><button class="pill active" data-filter="all">All Music</button><button class="pill" data-filter="Afrobeats">Afrobeats</button><button class="pill" data-filter="Dancehall">Dancehall</button><button class="pill" data-filter="Hip Hop">Hip Hop</button><button class="pill" data-filter="Gospel">Gospel</button><button class="pill" data-filter="R&B">R&B</button><button class="pill" data-filter="Other">Other</button></nav>
<section class="section"><div class="section-head"><div><h2 id="musicHeading">Explore music</h2><p style="color:#aaa0b9;font-size:13px">Fixed UGX 700 each</p></div><span class="count" id="songCount"></span></div><div class="grid" id="songGrid"><div class="loading">Loading music…</div></div></section>
</main>
<div class="mini" id="miniPlayer"><img id="miniCover"><div class="mini-info"><b id="miniTitle">Now playing</b><span id="miniArtist"></span></div><button id="togglePlay">Ⅱ</button><button class="close" id="closePlayer">×</button></div><audio id="audioPlayer" preload="none"></audio>
<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cover=s=>s.cover_url||s.cover_image_url||'';let songs=[],artistMap={},activeFilter='all',query='',currentSong=null,previewTimer=null;const audio=$('audioPlayer');

// === IP ADDRESS DETECTION - KEPT + REAL ===
async function detectIP(){
  try{
    const res=await fetch('https://ipapi.co/json/').then(r=>r.json());
    $('ipBadge').textContent=`🌍 ${res.city||''} ${res.country_name||''} • IP ${res.ip||''} • ${res.org||''}`;
    localStorage.setItem('pasong_ip_country', res.country_code||'UG');
    localStorage.setItem('pasong_ip_data', JSON.stringify(res));
  }catch{
    try{
      const ip=await fetch('https://api.ipify.org?format=json').then(r=>r.json());
      $('ipBadge').textContent=`🌍 IP ${ip.ip} • Uganda • PASONG`;
    }catch{$('ipBadge').textContent='🌍 PASONG • Uganda • Discover @700 UGX';}
  }
}

// === REAL TICKER - REAL DATA FROM SUPABASE ===
async function loadRealTicker(){
  try{
    const today=new Date().toISOString().split('T')[0];
    const [purchases,songsCount,latest]=await Promise.all([
      db.from('purchases').select('*',{count:'exact',head:true}).gte('created_at',today),
      db.from('songs').select('*',{count:'exact',head:true}),
      db.from('songs').select('title').order('created_at',{ascending:false}).limit(1).single()
    ]);
    const sold=purchases.count||0;
    const total=songsCount.count||0;
    const newTitle=latest.data?.title||'New music';
    $('tickerTrack').textContent=`🔥 REAL: ${sold} sold today • 🎧 ${total} songs in store • 🆕 New Drop: ${newTitle} • 💿 Everything @700 UGX • 🌍 PASONG Uganda • 🔥 REAL: ${sold} sold today • 🎧 ${total} songs • 🆕 ${newTitle} • `;
  }catch{
    $('tickerTrack').textContent='🎧 PASONG • Everything @700 UGX • Discover fresh Ugandan music • All songs same price • ';
  }
}

function songArtist(s){const p=artistMap[s.artist_id]||{};return s.performing_name||p.performing_name||s.artist_name||'Unknown Artist'}
function genre(s){return String(s.genre||'Other').trim()||'Other'}
function matches(s){const text=[s.title,songArtist(s),genre(s)].join(' ').toLowerCase();const qok=!query||text.includes(query.toLowerCase());const g=genre(s).toLowerCase();const fok=activeFilter==='all'||g.includes(activeFilter.toLowerCase())||(activeFilter==='Afrobeats'&&g.includes('afrobeat'));return qok&&fok}
function play(s){const url=s.preview_url||s.audio_url;if(!url){location.href='song.html?id='+s.id;return}currentSong=s;audio.src=url;audio.play().then(()=>{$('togglePlay').textContent='Ⅱ'}).catch(()=>location.href='song.html?id='+s.id);$('miniCover').src=cover(s)||'https://placehold.co/100x100/241633/ffffff?text=PASONG';$('miniTitle').textContent=s.title||'Untitled';$('miniArtist').textContent=songArtist(s);$('miniPlayer').classList.add('on');clearInterval(previewTimer);previewTimer=setInterval(()=>{if(audio.currentTime>=20){audio.pause();clearInterval(previewTimer);$('togglePlay').textContent='▶'}},300)}
function addSongToCart(s,b){const key='pasong_cart_v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')||[]}catch{}if(items.some(x=>String(x.id)===String(s.id))){b.textContent='✓ Already in Cart';b.disabled=true;setTimeout(()=>{b.textContent='＋ Add to Cart';b.disabled=false},1200);return}items.push({id:String(s.id),title:s.title||'Untitled',artist:songArtist(s),cover:cover(s),price:700,currency:'UGX'});localStorage.setItem(key,JSON.stringify(items));b.textContent='✓ Added';b.disabled=true;setTimeout(()=>{b.textContent='＋ Add to Cart';b.disabled=false},1200)}

function renderSongs(){const grid=$('songGrid'),list=songs.filter(matches);$('songCount').textContent=list.length+' songs @700';if(!list.length){grid.innerHTML='<div class="empty">No songs found.</div>';return}grid.innerHTML=list.map(s=>`<article class="song" data-id="${esc(s.id)}"><div class="art"><img loading="lazy" src="${esc(cover(s)||'https://placehold.co/500x500/241633/ffffff?text=PASONG')}"><button class="play" data-play="${esc(s.id)}">▶</button></div><div class="title">${esc(s.title||'Untitled')}</div><div class="artist">${esc(songArtist(s))}</div><div class="price-line"><b>UGX 700</b><span>Fixed</span></div><span class="genre">${esc(genre(s))}</span><button class="add-cart-btn" data-cart="${esc(s.id)}">＋ Add to Cart</button></article>`).join('');grid.querySelectorAll('[data-cart]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=list.find(x=>String(x.id)===b.dataset.cart);if(s)addSongToCart(s,b)});grid.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=list.find(x=>String(x.id)===b.dataset.play);if(s)play(s)});grid.querySelectorAll('.song').forEach(c=>c.onclick=e=>{if(!e.target.closest('button'))location.href='song.html?id='+c.dataset.id})}

async function init(){
  detectIP(); loadRealTicker();
  $('songGrid').innerHTML='<div class="skeleton" style="height:180px;border-radius:12px"></div><div class="skeleton" style="height:180px;border-radius:12px"></div><div class="skeleton" style="height:180px;border-radius:12px"></div><div class="skeleton" style="height:180px;border-radius:12px"></div>';
  try{
    const [sr,ar]=await Promise.all([db.from('songs').select('*').order('created_at',{ascending:false}).limit(200),db.from('artist_profiles').select('*').limit(200)]);
    songs=sr.data||[]; (ar.data||[]).forEach(a=>{artistMap[a.id]=a; if(a.user_id)artistMap[a.user_id]=a;});
    renderSongs();
  }catch(e){$('songGrid').innerHTML='<div class="empty">Music could not load. Refresh.</div>'}
}
$('searchInput').addEventListener('input',e=>{query=e.target.value.trim();renderSongs()});
$('filters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.filter;$('filters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderSongs()}));
$('togglePlay').onclick=()=>{if(audio.paused){audio.play().then(()=>$('togglePlay').textContent='Ⅱ')}else{audio.pause();$('togglePlay').textContent='▶'}};
$('closePlayer').onclick=()=>{audio.pause();$('miniPlayer').classList.remove('on');clearInterval(previewTimer)};
init();
</script></body></html>
