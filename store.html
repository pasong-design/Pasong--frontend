<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASONG - Music Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#fff;font-family:Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:100;background:#080810;border-bottom:1px solid #1e1e2a;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}
nav{display:flex;gap:18px}nav a{color:#777;font-size:13px;font-weight:600}nav a.active{color:#fff}
.wrap{width:min(1150px,92%);margin:auto;padding:30px 0 80px}
h1{font-size:42px;line-height:1;letter-spacing:-1px}h1 span{color:#a855f7}
.sub{color:#8888a0;margin-top:8px;font-size:13px}
.search{margin-top:20px;background:#12121a;border:1px solid #23233a;border-radius:12px;padding:12px;display:flex;gap:10px;max-width:520px}
.search input{flex:1;background:transparent;border:0;outline:none;color:#fff}
.section{margin-top:32px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-head h2{font-size:18px}
.section-head a{font-size:11px;color:#a78bfa;border:1px solid #2a2440;padding:6px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{display:flex;gap:12px;background:#11111c;border:1px solid #23233a;border-radius:16px;padding:12px;align-items:center}
.card:hover{border-color:#6b46a3}
.cover{width:72px;height:72px;border-radius:12px;object-fit:cover;background:#1c1630;flex-shrink:0}
.info{flex:1;min-width:0}
.title{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:#999;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#c084fc;font-weight:900;font-size:12px;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:6px}
.btn{border:0;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;cursor:pointer}
.btn-play{background:#1e1a2e;color:#fff;border:1px solid #4a3a6a}
.btn-buy{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.empty{grid-column:1/-1;padding:18px;text-align:center;color:#666;background:#11111c;border-radius:12px;border:1px solid #222}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}nav{display:none}}
@media(max-width:500px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>

<header>
<div class="logo">PASONG</div>
<nav>
<a href="index.html">Home</a>
<a class="active" href="store.html">Music Store</a>
<a href="charts.html">Charts</a>
<a href="beats.html">Beats</a>
<a href="mixes.html">Mixes</a>
</nav>
<div></div>
</header>

<main class="wrap">
<h1>Music <span>Store</span></h1>
<p class="sub">Browse everything we sell on PASONG.</p>

<div class="search">
<span>Search</span>
<input id="searchInput" placeholder="Search songs or artists...">
</div>

<!-- TRENDING -->
<div class="section">
<div class="section-head"><h2>Trending Songs</h2><a href="charts.html">View All</a></div>
<div class="grid" id="trendingGrid"></div>
</div>

<!-- LATEST -->
<div class="section">
<div class="section-head"><h2>Latest Uploads</h2><a href="latest.html">View All</a></div>
<div class="grid" id="latestGrid"></div>
</div>

<!-- PRODUCER BEATS -->
<div class="section">
<div class="section-head"><h2>Producer Beats</h2><a href="beats.html">View All</a></div>
<div class="grid" id="beatsGrid"></div>
</div>

<!-- DJ MIXES -->
<div class="section">
<div class="section-head"><h2>DJ Mixes</h2><a href="mixes.html">View All</a></div>
<div class="grid" id="mixesGrid"></div>
</div>

</main>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const COUNTRY_CURRENCY={UG:"UGX",KE:"KES",TZ:"TZS",RW:"RWF",BI:"BIF",SS:"SSP",ET:"ETB",NG:"NGN",GH:"GHS",ZA:"ZAR",GB:"GBP",US:"USD"};
let currentPricing={label:"UGX 700",amount:700,currency:"UGX"};
let fxRates=null;
async function getRates(){try{let r=await fetch("https://open.er-api.com/v6/latest/USD");let j=await r.json();if(j.result==="success")fxRates=j.rates;}catch(e){}}
function convert(a,f,t){if(f===t)return a;if(!fxRates)return a;let fr=f==="USD"?1:fxRates[f];let tr=t==="USD"?1:fxRates[t];if(!fr||!tr)return a;return (a/fr)*tr;}
function formatPrice(a,c){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c,maximumFractionDigits:2}).format(a);}catch(e){return a.toFixed(2)+" "+c;}}
function getPriceForCountry(cc){
cc=(cc||"UG").toUpperCase();let lc=COUNTRY_CURRENCY[cc]||"USD";
if(cc==="UG")return{amount:700,currency:"UGX",label:"UGX 700"};
if(["KE","TZ","RW","BI","SS","ET"].includes(cc)){let conv=convert(1000,"UGX",lc);return{amount:conv,currency:lc,label:formatPrice(conv,lc)};}
if(["NG","GH","ZA","EG"].includes(cc)){let conv=convert(0.57,"USD",lc);return{amount:conv,currency:lc,label:formatPrice(conv,lc)};}
if(["GB"].includes(cc))return{amount:1,currency:"GBP",label:"£1.00"};
return{amount:1,currency:"USD",label:"$1.00"};
}
async function detectPrice(){
await getRates();let country="UG";try{let r=await fetch("https://ipwho.is/");let j=await r.json();if(j.success)country=j.country_code;}catch(e){}
currentPricing=getPriceForCountry(country);
renderAll();
}

let allSongs=[];
let query="";

function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cover(s){return s.cover_url||s.cover_image_url||"";}
function getArtist(s){return s.artist_name||"Unknown";}
function getPlays(s){return Number(s.play_count||s.plays||0);}
function isBeat(s){let g=(s.genre||s.category||"").toLowerCase();return g.includes("beat")||g.includes("instrumental");}
function isMix(s){let g=(s.genre||s.category||"").toLowerCase();return g.includes("mix")||g.includes("dj");}

function cardHTML(s){
return `
<div class="card">
<img class="cover" src="${esc(cover(s)||'https://placehold.co/400x400/241633/fff?text=PASONG')}">
<div class="info">
<div class="title">${esc(s.title||"Untitled")}</div>
<div class="artist">${esc(getArtist(s))}</div>
<div class="price">${esc(currentPricing.label)}</div>
</div>
<div class="actions">
<button class="btn btn-play" onclick="previewSong('${esc(s.id)}')">Preview</button>
<button class="btn btn-buy" onclick="buySong('${esc(s.id)}')">BUY NOW</button>
</div>
</div>`;
}

function renderGrid(elId, list){
let el=document.getElementById(elId);
if(!list.length){el.innerHTML='<div class="empty">No songs in this category yet</div>';return;}
el.innerHTML=list.slice(0,6).map(cardHTML).join("");
}

function renderAll(){
let q=query.toLowerCase();
let filtered=allSongs.filter(s=>{
if(!q) return true;
return (s.title+" "+getArtist(s)).toLowerCase().includes(q);
});

let trending=[...filtered].sort((a,b)=>getPlays(b)-getPlays(a));
let latest=[...filtered].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
let beats=filtered.filter(isBeat);
let mixes=filtered.filter(isMix);

if(!beats.length) beats=filtered.slice(0,3);
if(!mixes.length) mixes=filtered.slice(3,6);

renderGrid("trendingGrid", trending);
renderGrid("latestGrid", latest);
renderGrid("beatsGrid", beats);
renderGrid("mixesGrid", mixes);
}

function previewSong(id){
let s=allSongs.find(x=>String(x.id)===String(id));
let url=s.audio_url||s.file_url||s.song_url||"";
if(!url){alert("No audio");return;}
new Audio(url).play();
}
function buySong(id){
let s=allSongs.find(x=>String(x.id)===String(id));
let key="pasong_cart_v1";let items=[];
try{items=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
if(!items.find(x=>String(x.id)===String(id))){
items.push({id:String(id),title:s.title,artist:getArtist(s),cover:cover(s),price:currentPricing.amount,currency:currentPricing.currency});
localStorage.setItem(key,JSON.stringify(items));
}
location.href="song.html?id="+encodeURIComponent(id);
}

async function init(){
await detectPrice();
let res=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(150);
allSongs=res.data||[];
renderAll();
}
document.getElementById("searchInput").addEventListener("input",e=>{query=e.target.value;renderAll();});
init();
</script>
</body>
</html>
