<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASONG - Music Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#fff;font-family:Inter,Arial,sans-serif}
header{position:sticky;top:0;z-index:100;background:#080810;border-bottom:1px solid #1e1e2a;padding:14px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:20px}
nav{display:flex;gap:18px}
nav a{color:#777;font-size:13px;font-weight:600}
nav a.active{color:#fff}
.pill{padding:6px 12px;border-radius:999px;background:#1b1628;border:1px solid #3a2a5a;color:#d8b4fe;font-size:11px;font-weight:700}
.wrap{width:min(1100px,92%);margin:auto;padding:30px 0 80px}
h1{font-size:42px;line-height:1;letter-spacing:-1px}
h1 span{color:#a855f7}
.sub{color:#8888a0;margin-top:8px;font-size:13px}
.search{margin-top:20px;background:#12121a;border:1px solid #23233a;border-radius:12px;padding:12px;display:flex;gap:10px;max-width:520px}
.search input{flex:1;background:transparent;border:0;outline:none;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.card{display:flex;gap:12px;background:#11111c;border:1px solid #23233a;border-radius:16px;padding:12px;align-items:center}
.card:hover{border-color:#6b46a3}
.cover{width:78px;height:78px;border-radius:12px;object-fit:cover;background:#1c1630;flex-shrink:0}
.info{flex:1;min-width:0}
.title{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:#999;font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#c084fc;font-weight:900;font-size:13px;margin-top:6px}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}
.btn-play{background:#1e1a2e;color:#fff;border:1px solid #4a3a6a}
.btn-buy{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.count{color:#777;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>

<header>
<div class="logo">PASONG</div>
<nav>
<a href="index.html">Home</a>
<a class="active" href="store.html">Music Store</a>
<a href="charts.html">Charts</a>
<a href="artists.html">Artists</a>
</nav>
<div class="pill" id="pricePill">UGX 700 Uganda</div>
</header>

<main class="wrap">
<h1>Music <span>Store</span></h1>
<p class="sub">Listen preview then support artist. <span id="yourPrice"></span></p>

<div class="search">
<span>Search</span>
<input id="searchInput" placeholder="KUBE, WOMAN, KWATA AWO">
</div>

<div style="display:flex;justify-content:space-between;margin-top:28px">
<h3>Trending Music</h3>
<span class="count" id="songCount">Loading</span>
</div>

<div class="grid" id="songList">
<div style="grid-column:1/-1;padding:30px;text-align:center;color:#777">Loading...</div>
</div>
</main>

<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const COUNTRY_CURRENCY={UG:"UGX",KE:"KES",TZ:"TZS",RW:"RWF",BI:"BIF",SS:"SSP",ET:"ETB",NG:"NGN",GH:"GHS",ZA:"ZAR",GB:"GBP",US:"USD"};
let currentPricing={label:"UGX 700",amount:700,currency:"UGX",country:"UG",sub:"Uganda"};
let fxRates=null;

async function getRates(){try{let r=await fetch("https://open.er-api.com/v6/latest/USD");let j=await r.json();if(j.result==="success")fxRates=j.rates;}catch(e){}}
function convert(a,f,t){if(f===t)return a;if(!fxRates)return a;let fr=f==="USD"?1:fxRates[f];let tr=t==="USD"?1:fxRates[t];if(!fr||!tr)return a;return (a/fr)*tr;}
function formatPrice(a,c){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c,maximumFractionDigits:2}).format(a);}catch(e){return a.toFixed(2)+" "+c;}}
function getPriceForCountry(cc){
cc=(cc||"UG").toUpperCase();
let lc=COUNTRY_CURRENCY[cc]||"USD";
if(cc==="UG"){return{amount:700,currency:"UGX",label:"UGX 700",sub:"Uganda",country:cc,base:700,baseCur:"UGX"};}
if(["KE","TZ","RW","BI","SS","ET"].includes(cc)){let conv=convert(1000,"UGX",lc);return{amount:conv,currency:lc,label:formatPrice(conv,lc),sub:"East Africa",country:cc,base:1000,baseCur:"UGX"};}
if(["NG","GH","ZA","EG"].includes(cc)){let conv=convert(0.57,"USD",lc);return{amount:conv,currency:lc,label:formatPrice(conv,lc),sub:"Africa",country:cc,base:0.57,baseCur:"USD"};}
if(["GB"].includes(cc)){return{amount:1,currency:"GBP",label:"GBP 1.00",sub:"UK",country:cc,base:1,baseCur:"GBP"};}
return{amount:1,currency:"USD",label:"USD 1.00",sub:"Intl",country:cc,base:1,baseCur:"USD"};
}

async function detectPrice(){
await getRates();
let country="UG";
try{let r=await fetch("https://ipwho.is/");let j=await r.json();if(j.success)country=j.country_code;}catch(e){}
currentPricing=getPriceForCountry(country);
document.getElementById("pricePill").textContent=currentPricing.label+" "+currentPricing.sub;
document.getElementById("yourPrice").textContent="Your price: "+currentPricing.label;
render();
}

let songs=[];
let query="";

function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cover(s){return s.cover_url||s.cover_image_url||"";}
function getArtist(s){return s.artist_name||"Unknown";}

function render(){
let list=songs.filter(s=>{
let txt=(s.title+" "+getArtist(s)).toLowerCase();
return !query || txt.includes(query.toLowerCase());
});
let el=document.getElementById("songList");
let count=document.getElementById("songCount");
count.textContent=list.length+" songs "+currentPricing.label;
if(!list.length){el.innerHTML='<div style="grid-column:1/-1;padding:20px;text-align:center;color:#777">No songs</div>';return;}
el.innerHTML=list.map(s=>`
<div class="card">
<img class="cover" src="${esc(cover(s)||'https://placehold.co/400x400/241633/fff?text=PASONG')}">
<div class="info">
<div class="title">${esc(s.title||"Untitled")}</div>
<div class="artist">${esc(getArtist(s))}</div>
<div class="price">${esc(currentPricing.label)}</div>
</div>
<div class="actions">
<button class="btn btn-play" onclick="previewSong('${esc(s.id)}')">Preview</button>
<button class="btn btn-buy" onclick="buySong('${esc(s.id)}')">BUY NOW</button>
</div>
</div>
`).join("");
}

function previewSong(id){
let s=songs.find(x=>String(x.id)===String(id));
if(!s)return;
let url=s.audio_url||s.file_url||s.song_url||"";
if(!url){alert("No audio for "+s.title);return;}
let a=new Audio(url);
a.play();
}

function buySong(id){
let s=songs.find(x=>String(x.id)===String(id));
if(!s)return;
let key="pasong_cart_v1";
let items=[];
try{items=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}
if(!items.find(x=>String(x.id)===String(id))){
items.push({id:String(id),title:s.title,artist:getArtist(s),cover:cover(s),price:currentPricing.amount,currency:currentPricing.currency});
localStorage.setItem(key,JSON.stringify(items));
}
window.location.href="song.html?id="+encodeURIComponent(id);
}

async function init(){
await detectPrice();
let res=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(100);
songs=res.data||[];
render();
}

document.getElementById("searchInput").addEventListener("input",e=>{query=e.target.value;render();});
init();
</script>

</body>
</html>
