<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASONG - Music Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:50;background:#000;border-bottom:1px solid #1a1a1a;padding:12px 4%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:1px}.hdr-icons{display:flex;gap:8px}.icon-btn{position:relative;background:#1a1a1a;border:1px solid #2a2a2a;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.badge-count{position:absolute;top:-5px;right:-5px;background:#1DB954;color:#000;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:999px;display:grid;place-items:center}
.wrap{width:96%;margin:auto;padding:10px 0 0}
.hero{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
.hero img{width:56px;height:56px;border-radius:8px;object-fit:cover}.hero h2{font-size:13px}.hero p{font-size:10px;color:#aaa}
.promo{margin-top:10px;background:#1DB954;border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;color:#000;font-size:11px;font-weight:800}
.search{margin-top:10px;background:#121212;border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center}.search input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:13px}
.chips{margin-top:10px;display:flex;gap:6px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap;background:#232323;padding:6px 12px;border-radius:999px;font-size:11px;cursor:pointer;color:#ccc}.chip.active{background:#fff;color:#000}
.top-producers{display:flex;gap:12px;overflow:auto;margin:14px 0;padding-bottom:6px}.prod{flex:0 0 auto;text-align:center}.prod img{width:64px;height:64px;border-radius:999px;object-fit:cover}.prod div{font-size:11px;margin-top:4px;color:#fff}

/* SPOTIFY SIZE - 2 PER ROW LIKE YOUR SCREENSHOT */
.section{margin-top:22px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-head h2{font-size:18px;font-weight:800}.section-head a{font-size:11px;color:#aaa;text-decoration:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:10px}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}

.card{width:100%;background:transparent;border:0;padding:0;cursor:pointer}
.cover-wrap{position:relative;width:100%;aspect-ratio:1/1}
.cover{width:100%;height:100%;border-radius:6px;object-fit:cover;background:#181818;display:block}
.play-overlay{position:absolute;inset:0;background:rgba(0,0,0,.3);border-radius:6px;display:grid;place-items:center;opacity:0;transition:.2s;font-size:24px}.card:hover .play-overlay{opacity:1}
.badge-abs{position:absolute;top:6px;left:6px;font-size:8px;font-weight:900;padding:3px 6px;border-radius:999px}.badge-abs.hot{background:#ff184d;color:#fff}.badge-abs.new{background:#1DB954;color:#000}
.info{padding:8px 0 0}.title{font-weight:400;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#a7a7a7;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.meta-line,.row-actions,.btn-buy-small{display:none}

.empty{font-size:12px;color:#666;padding:10px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#181818;border-top:1px solid #282828;padding:10px 4%;display:none;gap:10px;align-items:center}.player.show{display:flex}.player img{width:44px;height:44px;border-radius:4px}.p-info{flex:1}.p-title{font-size:12px;font-weight:700}.p-artist{font-size:10px;color:#aaa}.progress{position:absolute;top:0;left:0;height:2px;background:#1DB954;width:0%}
</style>
</head>
<body>
<header><div class="logo">PASONG</div><div class="hdr-icons"><div class="icon-btn" onclick="location.href='wishlist.html'">❤️<span class="badge-count" id="wishCount" style="display:none">0</span></div><div class="icon-btn" onclick="location.href='cart.html'">🛒<span class="badge-count" id="cartCount" style="display:none">0</span></div></div></header>
<main class="wrap">
<div class="hero" id="featuredHero" style="display:none"><img id="heroCover"><div><h2 id="heroTitle">Featured</h2><p id="heroSub"></p></div></div>
<div class="promo"><span>🔥 BUNDLE: Buy 3 Get 1 FREE</span><span onclick="location.href='beats.html'" style="background:#000;color:#fff;padding:4px 10px;border-radius:999px;font-size:9px">CLAIM</span></div>
<div class="search">🔍<input id="searchInput" placeholder="Search..."></div>
<div class="chips" id="chips"></div>
<div class="top-producers" id="topProds"></div>

<div class="section"><div class="section-head"><h2>Trending songs</h2><a href="charts.html">View All</a></div><div class="grid" id="trendingGrid"></div></div>
<div class="section"><div class="section-head"><h2>Latest Uploads</h2><a href="latest.html">View All</a></div><div class="grid" id="latestGrid"></div></div>
<div class="section"><div class="section-head"><h2>Producer Beats</h2><a href="beats.html">View All</a></div><div class="grid" id="beatsGrid"></div></div>
<div class="section"><div class="section-head"><h2>Free Beat of the Week</h2><a href="beats.html">View All</a></div><div class="grid" id="freeGrid"></div></div>
<div class="section" id="mixesSec"><div class="section-head"><h2>DJ Mixes</h2><a href="mixes.html">View All</a></div><div class="grid" id="mixesGrid"></div></div>
</main>
<div class="player" id="player"><div class="progress" id="progress"></div><img id="pCover"><div class="p-info"><div class="p-title" id="pTitle"></div><div class="p-artist" id="pArtist"></div></div><button onclick="closePlayer()" style="background:none;border:0;color:#fff">✕</button><audio id="audio" preload="none"></audio></div>
<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let allSongs=[],allBeats=[],allMixes=[],query="",activeGenre="All";
const GENRES=["All","Afrobeat","Hip-Hop","Dancehall","Amapiano","Gospel"];
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cover(s){return s.cover_url||s.cover_image_url||s.image||"";}
function getArtistRaw(s){return (s.artist_name||s.producer_name||s.producer||s.artist||"").trim();}
function isRealArtist(a){if(!a) return false;let l=a.toLowerCase();return l!=="unknown" && l!=="pasong" && l!=="p" && l.length>1;}
function spotifyCard(s,i,type){
let badge=i===0?`<span class="badge-abs hot">HOT</span>`:"";
let playFn=type==="beat"?`previewBeat('${esc(s.id)}')`:type==="mix"?`previewMix('${esc(s.id)}')`:`previewSong('${esc(s.id)}')`;
return `<div class="card" onclick="${playFn}">
<div class="cover-wrap"><img class="cover" src="${esc(cover(s)||'https://placehold.co/400x400/181818/fff?text=PASONG')}">${badge}<div class="play-overlay">▶</div></div>
<div class="info"><div class="title">${esc(s.title||s.beat_name||"Untitled")}</div></div>
</div>`;
}
function renderGrid(id,list,type){let el=document.getElementById(id);if(!list.length){el.innerHTML='';return;}el.innerHTML=list.map((x,i)=>spotifyCard(x,i,type)).join("");}
function renderAll(){
let q=query.toLowerCase();
let songsF=allSongs.filter(s=>{let t=(s.title||"").toLowerCase();if(t.includes("unknown")) return false;return !q||t.includes(q);});
let beatsF=allBeats.filter(b=>{let t=(b.title||b.beat_name||"").toLowerCase();if(t.includes("unknown")) return false;return !q||t.includes(q);});
renderGrid("trendingGrid",[...songsF].sort((a,b)=>(b.play_count||0)-(a.play_count||0)).slice(0,6),"song");
renderGrid("latestGrid",[...songsF].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,6),"song");
renderGrid("beatsGrid",beatsF.slice(0,6),"beat");
renderGrid("freeGrid",beatsF.slice(0,2),"beat");
if(allMixes.length)renderGrid("mixesGrid",allMixes.slice(0,6),"mix");
let allArtists=[...allSongs.map(getArtistRaw),...allBeats.map(getArtistRaw)].filter(a=>isRealArtist(a));
let prods=[...new Set(allArtists)].slice(0,10);
let topEl=document.getElementById("topProds");
if(prods.length===0){topEl.style.display="none";}else{topEl.style.display="flex";topEl.innerHTML=prods.map(n=>`<div class="prod"><img src="https://placehold.co/200x200/181818/fff?text=${esc(n[0])}"><div>${esc(n)}</div></div>`).join("");}
if(beatsF.length){let fb=beatsF[0];document.getElementById("featuredHero").style.display="flex";document.getElementById("heroCover").src=cover(fb)||'';document.getElementById("heroTitle").textContent=fb.title||"Featured";document.getElementById("heroSub").textContent=getArtistRaw(fb)||"";}
}
function playUrl(url,obj){let a=document.getElementById("audio");a.src=url;a.play();document.getElementById("player").classList.add("show");document.getElementById("pCover").src=cover(obj)||'';document.getElementById("pTitle").textContent=obj.title||"";document.getElementById("pArtist").textContent=getArtistRaw(obj)||"";a.ontimeupdate=()=>{document.getElementById("progress").style.width=(a.currentTime/a.duration*100)+"%";};}
function previewSong(id){let s=allSongs.find(x=>String(x.id)===String(id));playUrl(s.audio_url||s.file_url||"",s);setTimeout(()=>{location.href="song.html?id="+id},500);}
function previewBeat(id){let b=allBeats.find(x=>String(x.id)===String(id));playUrl(b.audio_url||b.file_url||"",b);setTimeout(()=>{location.href="beats.html?id="+id},500);}
function previewMix(id){let m=allMixes.find(x=>String(x.id)===String(id));playUrl(m.audio_url||m.file_url||"",m);}
function closePlayer(){document.getElementById("audio").pause();document.getElementById("player").classList.remove("show");}
async function init(){
document.getElementById("chips").innerHTML=GENRES.map(g=>`<div class="chip ${g===activeGenre?'active':''}" onclick="setGenre('${g}')">${g}</div>`).join("");
let sRes=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(100);allSongs=sRes.data||[];
let bRes=await db.from("beats").select("*").limit(50);if(!bRes.data||!bRes.data.length){let b2=await db.from("producer_beats").select("*").limit(50);bRes=b2;}allBeats=bRes.data||[];
let mRes=await db.from("mixes").select("*").limit(50);if(!mRes.data||!mRes.data.length){let m2=await db.from("dj_mixes").select("*").limit(50);if(m2.data)mRes=m2;}allMixes=mRes.data||[];
renderAll();
}
function setGenre(g){activeGenre=g;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.textContent===g));renderAll();}
document.getElementById("searchInput").addEventListener("input",e=>{query=e.target.value;renderAll();});
init();
</script>
</body>
</html>
