<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PASONG — Music Store</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080810;
  color:#fff;
  font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}

nav{
  height:70px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#0b0b14;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:22px;
  font-weight:800;
}

.nav-links{
  display:flex;
  gap:22px;
  align-items:center;
}

.nav-links a{
  color:#aaa;
  text-decoration:none;
  font-size:14px;
}

.nav-links a:hover{
  color:#fff;
}

.nav-icons{
  display:flex;
  gap:16px;
  font-size:23px;
}

.container{
  width:min(1100px,92%);
  margin:35px auto 60px;
}

.hero{
  margin-bottom:35px;
}

.hero h1{
  font-size:38px;
  margin-bottom:8px;
}

.hero p{
  color:#999;
  font-size:15px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.section-title h2{
  font-size:22px;
}

.section-title span{
  color:#888;
  font-size:13px;
}

.songs{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:20px;
}

.song-card{
  overflow:hidden;
  background:#11111b;
  border:1px solid rgba(255,255,255,.07);
  border-radius:18px;
  transition:.2s;
}

.song-card:hover{
  transform:translateY(-3px);
  border-color:rgba(168,85,247,.35);
}

.cover-wrap{
  position:relative;
  background:#171722;
}

.cover{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.no-cover{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#c9a8e8;
  font-weight:800;
  background:linear-gradient(135deg,#251536,#11111c);
}

.song-info{
  padding:17px;
}

.song-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist{
  color:#d3a1ff;
  font-size:14px;
  margin-bottom:5px;
}

.genre{
  color:#777;
  font-size:12px;
  margin-bottom:15px;
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.price{
  font-size:15px;
  font-weight:800;
}

.buy{
  border:0;
  border-radius:10px;
  padding:10px 13px;
  background:#8b5cf6;
  color:#fff;
  font-weight:800;
  font-size:12px;
  cursor:pointer;
}

.buy:hover{
  background:#a855f7;
}

.loading{
  text-align:center;
  color:#888;
  padding:60px 20px;
}

.error{
  text-align:center;
  color:#ff8f8f;
  padding:40px 20px;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#888;
  background:#10101a;
  border-radius:18px;
}

footer{
  text-align:center;
  color:#666;
  font-size:12px;
  padding:25px;
}

@media(max-width:650px){

  nav{
    padding:0 5%;
  }

  .nav-links{
    display:none;
  }

  .container{
    width:94%;
    margin-top:25px;
  }

  .hero h1{
    font-size:30px;
  }

  .songs{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .song-info{
    padding:13px;
  }

  .song-title{
    font-size:15px;
  }

  .buy{
    padding:8px 10px;
  }

}

@media(max-width:390px){

  .songs{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<nav>

  <div class="logo">
    ◈ PASONG
  </div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="store.html">Music Store</a>
    <a href="charts.html">Charts</a>
    <a href="artists.html">Artists</a>
    <a href="playlists.html">Playlists</a>
    <a href="promotion.html">Promotion</a>
    <a href="account.html">Account</a>
  </div>

  <div class="nav-icons">
    <span>⌕</span>
    <span>◉</span>
  </div>

</nav>


<main class="container">

  <section class="hero">

    <h1>
      Music Store
    </h1>

    <p>
      Discover music and directly support the creators behind every song.
    </p>

  </section>


  <div class="section-title">

    <h2>
      🔥 Trending Music
    </h2>

    <span>
      Listen before you buy
    </span>

  </div>


  <div
    id="loading"
    class="loading"
  >
    Loading songs...
  </div>


  <div
    id="error"
    class="error"
    style="display:none;"
  ></div>


  <div
    id="songs"
    class="songs"
    style="display:none;"
  ></div>


</main>


<footer>
  PASONG © 2026 • Music • Artists • Opportunity
</footer>


<script>

const API_URL =
  "https://pasong-api.vercel.app";


const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const songsContainer =
  document.getElementById("songs");


/* ==============================
   OPEN SONG PAGE
   ============================== */

function openSong(songId){

  if(!songId){

    return;

  }

  window.location.href =
    "song.html?id=" +
    encodeURIComponent(songId);

}


/* ==============================
   CREATE SONG CARD
   ============================== */

function createSongCard(song){

  const card =
    document.createElement("article");

  card.className =
    "song-card";


  /* COVER */

  const coverWrap =
    document.createElement("div");

  coverWrap.className =
    "cover-wrap";


  if(song.cover_url){

    const img =
      document.createElement("img");

    img.className =
      "cover";

    img.src =
      song.cover_url;

    img.alt =
      song.title || "Song";


    img.onerror =
      function(){

        coverWrap.innerHTML = `
          <div class="no-cover">
            PASONG MUSIC
          </div>
        `;

      };


    coverWrap.appendChild(img);

  }else{

    coverWrap.innerHTML = `
      <div class="no-cover">
        PASONG MUSIC
      </div>
    `;

  }


  /* OPEN SONG WHEN COVER IS CLICKED */

  coverWrap.style.cursor =
    "pointer";

  coverWrap.addEventListener(
    "click",
    function(){

      openSong(song.id);

    }
  );


  /* INFO */

  const info =
    document.createElement("div");

  info.className =
    "song-info";


  const title =
    document.createElement("div");

  title.className =
    "song-title";

  title.textContent =
    song.title ||
    "Untitled Song";


  const artist =
    document.createElement("div");

  artist.className =
    "artist";

  artist.textContent =
    song.artist_name ||
    song.artist?.stage_name ||
    song.artist?.artist_name ||
    "Unknown Artist";


  const genre =
    document.createElement("div");

  genre.className =
    "genre";

  genre.textContent =
    song.genre ||
    "Music";


  /* BOTTOM */

  const bottom =
    document.createElement("div");

  bottom.className =
    "bottom";


  const price =
    document.createElement("div");

  price.className =
    "price";

  const amount =
    Number(song.price) || 500;

  const currency =
    song.currency || "UGX";

  price.textContent =
    amount.toLocaleString() +
    " " +
    currency;


  const buy =
    document.createElement("button");

  buy.className =
    "buy";

  buy.textContent =
    "🛒 BUY NOW";


  buy.addEventListener(
    "click",
    function(){

      openSong(song.id);

    }
  );


  bottom.appendChild(price);

  bottom.appendChild(buy);


  info.appendChild(title);

  info.appendChild(artist);

  info.appendChild(genre);

  info.appendChild(bottom);


  card.appendChild(coverWrap);

  card.appendChild(info);


  return card;

}


/* ==============================
   LOAD SONGS
   ============================== */

async function loadSongs(){

  try{

    const response =
      await fetch(
        API_URL + "/api/songs"
      );


    if(!response.ok){

      throw new Error(
        "PASONG API connection failed."
      );

    }


    const result =
      await response.json();


    const songs =
      result.songs || [];


    loading.style.display =
      "none";


    if(!songs.length){

      songsContainer.style.display =
        "block";

      songsContainer.innerHTML = `
        <div class="empty">
          No songs are available yet.
        </div>
      `;

      return;

    }


    songsContainer.innerHTML =
      "";


    songs.forEach(
      function(song){

        songsContainer.appendChild(
          createSongCard(song)
        );

      }
    );


    songsContainer.style.display =
      "grid";


  }catch(error){

    console.error(
      "PASONG:",
      error
    );


    loading.style.display =
      "none";


    errorBox.textContent =
      "Unable to load songs. Please try again.";

    errorBox.style.display =
      "block";

  }

}


loadSongs();

</script>

</body>
</html>
