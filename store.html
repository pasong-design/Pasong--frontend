<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PASONG - Music Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080810;color:#fff;font-family:Inter,sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:50;background:rgba(8,8,16,.9);backdrop-filter:blur(12px);border-bottom:1px solid #1e1e2a;padding:12px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900}nav{display:flex;gap:16px}nav a{color:#666;font-size:12px;font-weight:700;text-decoration:none}nav a.active{color:#fff}
.hdr-icons{display:flex;gap:10px}.icon-btn{position:relative;background:#16162a;border:1px solid #2a2a4a;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;cursor:pointer}
.badge-count{position:absolute;top:-6px;right:-6px;background:#a855f7;color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:999px;display:grid;place-items:center}
.wrap{width:min(1180px,92%);margin:auto;padding:14px 0 0}
.search{margin-top:10px;background:#12121a;border:1px solid #23233a;border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center}.search input{flex:1;background:transparent;border:0;outline:none;color:#fff;font-size:13px}
.chips{margin-top:10px;display:flex;gap:6px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid #2a2a4a;background:#12122a;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:700;cursor:pointer;color:#888}.chip.active{background:#fff;color:#000;border-color:#fff}
.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:14px}
.grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.grid::-webkit-scrollbar{display:none}

/* SPOTIFY BOX - SMALL */
.card{
  min-width:112px;
  max-width:112px;
  flex:0 0 auto;
  background:transparent;
  border:0;
  padding:0;
  display:block;
}
.cover-wrap{position:relative;width:100%;height:112px}
.cover{
  width:100%;
  height:112px;
  border-radius:8px;
  object-fit:cover;
  background:#1c1630;
  display:block;
}
.play-overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,.35);
  border-radius:8px;
  display:grid;place-items:center;
  opacity:0;transition:.2s;
  font-size:20px;cursor:pointer;
}
.card:hover .play-overlay{opacity:1}
.info{padding:6px 2px 0}
.title{font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:#999;font-size:9px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:4px;align-items:center;margin-top:4px}
.price{color:#c084fc;font-weight:800;font-size:9px}
.badge{font-size:6px;padding:2px 4px;border-radius:999px;background:#1e1a2e;border:1px solid #3a2a6a;color:#a78bfa;font-weight:800}
.row-actions{display:flex;gap:4px;margin-top:5px}
.btn-icon{width:22px;height:22px;border-radius:999px;border:1px solid #4a4a7a;background:#2f2f55;display:grid;place-items:center;cursor:pointer;font-size:10px;color:#fff}
.btn-icon.wished{background:#ff184d22;border-color:#ff184d;color:#ff184d}
.btn-buy-small{margin-top:5px;width:100%;border:0;border-radius:999px;padding:4px 0;font-size:8px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;cursor:pointer}
.player{position:fixed;left:0;right:0;bottom:0;z-index:100;background:rgba(15,15,28,.96);backdrop-filter:blur(14px);border-top:1px solid #2a2a4a;padding:10px 5%;display:none;gap:10px;align-items:center}.player.show{display:flex}.player img{width:44px;height:44px;border-radius:8px}.p-info{flex:1;min-width:0}.p-title{font-size:11px;font-weight:800}.p-artist{font-size:9px;color:#999}.progress{position:absolute;top:0;left:0;height:2px;background:#a855f7;width:0%}
@media(max-width:900px){nav{display:none}}
</style>
</head>
<body>
<header><div class="logo">PASONG</div><nav><a href="index.html">Home</a><a class="active" href="store.html">Music Store</a><a href="charts.html">Charts</a><a href="beats.html">Beats</a><a href="mixes.html">Mixes</a></nav><div class="hdr-icons"><div class="icon-btn" onclick="location.href='wishlist.html'">❤️<span class="badge-count" id="wishCount" style="display:none">0</span></div><div class="icon-btn" onclick="location.href='cart.html'">🛒<span class="badge-count" id="cartCount" style="display:none">0</span></div></div></header>
<main class="wrap">
<div class="search">🔍<input id="searchInput" placeholder="Search songs, artists..."></div>
<div class="chips" id="chips"></div>
<div class="section"><div class="section-head"><h2>Trending Songs</h2></div><div class="grid" id="trendingGrid"></div></div>
<div class="section"><div class="section-head"><h2>Latest Uploads</h2></div><div class="grid" id="latestGrid"></div></div>
<div class="section"><div class="section-head"><h2>Producer Beats</h2></div><div class="grid" id="beatsGrid"></div></div>
<div class="section"><div class="section-head"><h2>DJ Mixes</h2></div><div class="grid" id="mixesGrid"></div></div>
</main>
<div class="player" id="player"><div class="progress" id="progress"></div><img id="pCover"><div class="p-info"><div class="p-title" id="pTitle"></div><div class="p-artist" id="pArtist"></div></div><button class="btn-icon" id="pPlay">⏸</button><button class="btn-icon" onclick="closePlayer()">✕</button><audio id="audio"></audio></div>
<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let allSongs=[],allBeats=[],allMixes=[],query="",activeGenre="All";const GENRES=["All","Afrobeat","Hip-Hop","Dancehall","Amapiano","Gospel","RnB"];
function esc(t){return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function cover(s){return s.cover_url||s.cover_image_url||s.image||"";}function getArtist(s){return s.artist_name||s.producer_name||s.producer||"Unknown";}function getGenre(s){return s.genre||s.category||"Afrobeat";}
function isInWishlist(id){try{let w=JSON.parse(localStorage.getItem("pasong_wish_v1")||"[]");return w.some(x=>String(x.id)===String(id));}catch(e){return false;}}
function spotifyCard(s,type="song"){
let isWished=isInWishlist(s.id);
let price=type==="beat"?"BEAT":"UGX 700";
let action=type==="beat"?`goToBeatsStore('${esc(s.id)}')`:type==="mix"?`buyMix('${esc(s.id)}')`:`buySong('${esc(s.id)}')`;
let playFn=type==="beat"?`previewBeat('${esc(s.id)}')`:type==="mix"?`previewMix('${esc(s.id)}')`:`previewSong('${esc(s.id)}')`;
return `<div class="card">
<div class="cover-wrap" onclick="${playFn}"><img class="cover" src="${esc(cover(s)||'https://placehold.co/400x400/241633/fff?text=PASONG')}"><div class="play-overlay">▶</div></div>
<div class="info"><div class="title">${esc(s.title||"Untitled")}</div><div class="artist">${esc(getArtist(s))}</div>
<div class="meta"><span class="price">${price}</span></div>
<div class="row-actions"><button class="btn-icon ${isWished?'wished':''}" onclick="toggleWish('${esc(s.id)}','${type}')">${isWished?'❤️':'🤍'}</button><button class="btn-icon" onclick="shareItem('${esc(s.id)}','${type}')">↗</button></div>
<button class="btn-buy-small" onclick="${action}">${type==="beat"?"BUY BEAT":"BUY NOW"}</button>
</div></div>`;
}
function renderGrid(id,list,type){let el=document.getElementById(id);if(!list.length){el.innerHTML='<div style=\"font-size:11px;color:#666;padding:10px\">No items</div>';return;}el.innerHTML=list.map(x=>spotifyCard(x,type)).join("");}
function renderAll(){let q=query.toLowerCase();let songsF=allSongs.filter(s=>{let okQ=!q||(s.title+" "+getArtist(s)).toLowerCase().includes(q);let okG=activeGenre==="All"||getGenre(s).toLowerCase().includes(activeGenre.toLowerCase());return okQ&&okG;});let beatsF=allBeats.filter(b=>!q||(b.title+" "+getArtist(b)).toLowerCase().includes(q));let mixesF=allMixes.filter(m=>!q||(m.title+" "+getArtist(m)).toLowerCase().includes(q));renderGrid("trendingGrid",songsF.slice(0,10),"song");renderGrid("latestGrid",[...songsF].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,10),"song");renderGrid("beatsGrid",beatsF.slice(0,10),"beat");renderGrid("mixesGrid",mixesF.slice(0,10),"mix");updateCounts();}
let currentAudioId=null;
function setPlayer(s){document.getElementById("player").classList.add("show");document.getElementById("pCover").src=cover(s)||'';document.getElementById("pTitle").textContent=s.title;document.getElementById("pArtist").textContent=getArtist(s);}
function playUrl(url,obj){let audio=document.getElementById("audio");audio.src=url;audio.play();setPlayer(obj);audio.ontimeupdate=()=>{document.getElementById("progress").style.width=(audio.currentTime/audio.duration*100)+"%";};document.getElementById("pPlay").textContent="⏸";document.getElementById("pPlay").onclick=()=>{if(audio.paused){audio.play();document.getElementById("pPlay").textContent="⏸";}else{audio.pause();document.getElementById("pPlay").textContent="▶";}};audio.onended=()=>closePlayer();}
function previewSong(id){let s=allSongs.find(x=>String(x.id)===String(id));let url=s.audio_url||s.file_url||"";if(!url)return alert("No audio");playUrl(url,s);}function previewBeat(id){let b=allBeats.find(x=>String(x.id)===String(id));let url=b.audio_url||b.file_url||b.preview_url||"";if(!url)return alert("No preview");playUrl(url,b);}function previewMix(id){let m=allMixes.find(x=>String(x.id)===String(id));let url=m.audio_url||m.file_url||"";if(!url)return alert("No audio");playUrl(url,m);}
function closePlayer(){document.getElementById("audio").pause();document.getElementById("player").classList.remove("show");}
function buySong(id){let s=allSongs.find(x=>String(x.id)===String(id));let items=[];try{items=JSON.parse(localStorage.getItem("pasong_cart_v1")||"[]")}catch(e){}items.push({id,title:s.title,artist:getArtist(s),cover:cover(s),price:700,currency:"UGX",type:"song"});localStorage.setItem("pasong_cart_v1",JSON.stringify(items));location.href="song.html?id="+id;}
function goToBeatsStore(id){location.href="beats.html?id="+id;}function buyMix(id){let m=allMixes.find(x=>String(x.id)===String(id));let items=[];try{items=JSON.parse(localStorage.getItem("pasong_cart_v1")||"[]")}catch(e){}items.push({id,title:m.title,artist:getArtist(m),cover:cover(m),price:700,currency:"UGX",type:"mix"});localStorage.setItem("pasong_cart_v1",JSON.stringify(items));location.href="mix.html?id="+id;}
function toggleWish(id,type){let key="pasong_wish_v1";let items=[];try{items=JSON.parse(localStorage.getItem(key)||"[]")}catch(e){}let idx=items.findIndex(x=>String(x.id)===String(id));if(idx>=0)items.splice(idx,1);else{let obj=type==="beat"?allBeats.find(x=>String(x.id)===String(id)):type==="mix"?allMixes.find(x=>String(x.id)===String(id)):allSongs.find(x=>String(x.id)===String(id));items.push({id,title:obj.title,type});}localStorage.setItem(key,JSON.stringify(items));renderAll();}
function shareItem(id,type){let url=location.origin+location.pathname.replace("store.html","")+(type==="beat"?"beats.html":type==="mix"?"mix.html":"song.html")+"?id="+id;if(navigator.share){navigator.share({title:"PASONG",url});}else{window.open("https://wa.me/?text="+encodeURIComponent("Check PASONG: "+url),"_blank");}}
function updateCounts(){try{let c=JSON.parse(localStorage.getItem("pasong_cart_v1")||"[]");let el=document.getElementById("cartCount");if(c.length){el.style.display="grid";el.textContent=c.length;}else el.style.display="none";}catch(e){}try{let w=JSON.parse(localStorage.getItem("pasong_wish_v1")||"[]");let el=document.getElementById("wishCount");if(w.length){el.style.display="grid";el.textContent=w.length;}else el.style.display="none";}catch(e){}}
async function init(){let chipsEl=document.getElementById("chips");chipsEl.innerHTML=GENRES.map(g=>`<div class="chip ${g===activeGenre?'active':''}" onclick="setGenre('${g}')">${g}</div>`).join("");let sRes=await db.from("songs").select("*").order("created_at",{ascending:false}).limit(100);allSongs=sRes.data||[];let bRes=await db.from("beats").select("*").limit(50);if(!bRes.data||!bRes.data.length){let b2=await db.from("producer_beats").select("*").limit(50);bRes=b2;}allBeats=bRes.data||[];let mRes=await db.from("mixes").select("*").limit(50);if(!mRes.data||!mRes.data.length){let m2=await db.from("dj_mixes").select("*").limit(50);if(m2.data)mRes=m2;}allMixes=mRes.data||[];renderAll();}
function setGenre(g){activeGenre=g;document.querySelectorAll(".chip").forEach(c=>{c.classList.toggle("active",c.textContent===g);});renderAll();}
document.getElementById("searchInput").addEventListener("input",e=>{query=e.target.value;renderAll();});init();
</script>
</body>
</html>
