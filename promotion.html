<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PASONG Promotion Center</title>

*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;color:#fff;background:#09050e;min-height:100vh}
header{position:sticky;top:0;z-index:100;height:62px;background:#09050eee;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}
.nav{max-width:1180px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;gap:25px}
.logo{text-decoration:none;font-weight:900;font-size:16px;color:#fff;display:flex;align-items:center;gap:8px}
.logo-mark{width:23px;height:23px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.nav-links{display:flex;gap:20px;flex:1}.nav-links a{text-decoration:none;color:#918b98;font-size:12px;font-weight:800}.nav-links a.active{color:#c084fc}
main{max-width:1120px;margin:auto;padding:25px 18px 90px}
.hero{border:1px solid #35205a;border-radius:24px;padding:36px 28px;background:linear-gradient(135deg,#160c25,#0c0712 60%,#160b22)}
.hero h1{font-size:38px;line-height:1.1;margin:10px 0}.hero h1 span{background:linear-gradient(135deg,#c084fc,#f472b6);-webkit-background-clip:text;color:transparent}
.hero p{max-width:700px;color:#a79eaf;font-size:13px;line-height:1.6}.hero-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#8b5cf622;border:1px solid #8b5cf644;color:#d8b4fe;font-size:9px;font-weight:900;margin-bottom:12px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:900;font-size:11px;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}.btn-secondary{background:#21102f;color:#ddd;border:1px solid #442761}
.section{margin-top:28px}.section-head h2{font-size:19px;margin-bottom:4px}.section-head p{color:#777;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#120a1b;border:1px solid #2d1944;border-radius:17px;padding:18px}
.package-icon{font-size:25px;margin-bottom:8px}.package h3{font-size:15px;margin-bottom:6px}.package-desc{font-size:10px;color:#92899a;line-height:1.5;min-height:40px}.package-price{font-size:20px;font-weight:900;color:#c084fc;margin:12px 0 3px}.package-duration{font-size:9px;color:#777}
.features{list-style:none;margin:12px 0}.features li{font-size:9px;color:#aaa;margin:6px 0}.features li:before{content:"✓ ";color:#c084fc;font-weight:900}
.goals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.goal{padding:12px 6px;text-align:center;border-radius:12px;background:#120a1b;border:1px solid #2d1944;color:#91899a;cursor:pointer;font-size:9px;font-weight:900}.goal span{display:block;font-size:18px;margin-bottom:4px}.goal.selected{border-color:#8b5cf6;color:#e9d5ff;background:#8b5cf622}
.preview{display:grid;grid-template-columns:170px 1fr;gap:16px;align-items:center}.preview-art{width:170px;height:96px;border-radius:12px;overflow:hidden;background:#100918;border:1px solid #352052;position:relative}.preview-art img{width:100%;height:100%;object-fit:cover}.preview-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,#000000a6)}.preview-play{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.preview-info h3{font-size:15px}.preview-info p{color:#89818f;font-size:10px;line-height:1.5}.pill{padding:5px 8px;border-radius:999px;background:#21102f;color:#c4b5fd;font-size:8px;font-weight:900;margin-right:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:10px;font-weight:900;color:#c9c0d0}
