<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PASONG Promotion - 3 IDs Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;color:#fff;background:#09050e;min-height:100vh}
header{position:sticky;top:0;z-index:100;height:62px;background:#09050eee;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}
.nav{max-width:1180px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;gap:25px}
.logo{text-decoration:none;font-weight:900;font-size:16px;color:#fff;display:flex;align-items:center;gap:8px}
.logo-mark{width:23px;height:23px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.nav-links{display:flex;gap:20px;flex:1}.nav-links a{text-decoration:none;color:#918b98;font-size:12px;font-weight:800}.nav-links a.active{color:#c084fc}
main{max-width:1120px;margin:auto;padding:20px 14px 90px}
.hero{border:1px solid #35205a;border-radius:20px;padding:20px;background:linear-gradient(135deg,#160c25,#0c0712 60%,#160b22)}
.hero h1{font-size:28px;margin:8px 0}.hero h1 span{background:linear-gradient(135deg,#c084fc,#f472b6);-webkit-background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:768px){.grid{grid-template-columns:1fr}}
.card{background:#120a1b;border:1px solid #2d1944;border-radius:16px;padding:16px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:900;font-size:11px;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}.btn-secondary{background:#21102f;color:#ddd;border:1px solid #442761}
.preview{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}.preview-art{width:110px;height:70px;border-radius:10px;overflow:hidden;background:#100918;position:relative}.preview-art img{width:100%;height:100%;object-fit:cover}
.goals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.goal{padding:10px 4px;text-align:center;border-radius:12px;background:#120a1b;border:1px solid #2d1944;color:#91899a;cursor:pointer;font-size:9px;font-weight:900}.goal span{display:block;font-size:16px;margin-bottom:3px}.goal.selected{border-color:#8b5cf6;color:#e9d5ff;background:#8b5cf622}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:10px;font-weight:900;color:#c9c0d0}
input,select,textarea{width:100%;background:#0b0611;border:1px solid #392151;border-radius:10px;padding:10px;color:#fff;font-size:12px}
.status{display:none;padding:10px;border-radius:10px;margin-top:10px;font-size:10px}.status.show{display:block}.status.error{background:#2a1017;border:1px solid #6c2636;color:#ff9caf}.status.success{background:#0d2115;border:1px solid #245d32;color:#9ae6a8}
.notice{margin-top:8px;padding:9px;border-radius:10px;background:#8b5cf612;border:1px solid #8b5cf62b;color:#9c91a7;font-size:9px}
.pill{padding:4px 7px;border-radius:999px;background:#21102f;color:#c4b5fd;font-size:8px;font-weight:900;margin-right:4px}
.promo-row{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #2d1944;border-radius:12px;background:#120a1b;margin-bottom:8px;font-size:11px}
</style>
</head>
<body>
<header><div class="nav"><a href="index.html" class="logo"><span class="logo-mark"></span>PASONG</a><nav class="nav-links"><a href="store.html">Music Store</a><a href="promotion.html" class="active">Promotion</a></nav></div></header>
<main>
<section class="hero"><h1>Put your music <span>in front of more people.</span></h1><p id="userInfo" style="font-size:10px;color:#9c91a7;margin-top:6px"></p><p id="foundCount" style="font-size:11px;color:#c084fc;margin-top:8px;font-weight:900">Loading your 4 works...</p></section>
<section class="section" style="margin-top:18px"><div class="grid">
<div class="card"><div style="font-size:20px">🚀</div><h3 style="font-size:13px;margin:6px 0">Starter Boost</h3><div style="color:#c084fc;font-weight:900">UGX 50,000</div><div style="font-size:9px;color:#777">7 days</div><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="selectPackage('starter',50000,7)">Choose Starter</button></div>
<div class="card" style="border-color:#ec489970"><div style="font-size:20px">🔥</div><h3 style="font-size:13px;margin:6px 0;color:#f9a8d4">TikTok Viral Boost</h3><div style="color:#f472b6;font-weight:900">UGX 150,000</div><div style="font-size:9px;color:#777">14 days</div><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="selectPackage('tiktok',150000,14)">Choose TikTok</button></div>
<div class="card"><div style="font-size:20px">💎</div><h3 style="font-size:13px;margin:6px 0">Homepage Hero</h3><div style="color:#c084fc;font-weight:900">UGX 300,000</div><div style="font-size:9px;color:#777">30 days</div><button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="selectPackage('hero',300000,30)">Choose Hero</button></div>
</div></section>
<section class="section" style="margin-top:18px"><div class="goals"><button class="goal selected" onclick="chooseGoal(this,'streams')"><span>🎧</span>Streams</button><button class="goal" onclick="chooseGoal(this,'sales')"><span>💰</span>Sales</button><button class="goal" onclick="chooseGoal(this,'fans')"><span>👥</span>Fans</button><button class="goal" onclick="chooseGoal(this,'exposure')"><span>🔥</span>Exposure</button><button class="goal" onclick="chooseGoal(this,'release')"><span>🚀</span>Release</button></div></section>
<section class="section" style="margin-top:18px"><div class="card preview"><div class="preview-art"><img id="previewCover" src="https://ui-avatars.com/api/?name=PASONG&background=171022&color=c084fc&bold=true&size=600"></div><div><h3 id="previewTitle" style="font-size:13px">Select your work</h3><p id="previewArtist" style="font-size:10px;color:#aaa;margin-top:3px"></p><div style="margin-top:6px"><span class="pill" id="previewPackage">No package</span><span class="pill" id="previewDuration"></span></div></div></div></section>
<section class="section" style="margin-top:18px" id="createPromotion"><div class="card"><div class="form-grid"><div class="field full"><label>🎵 What to promote? (3 songs + 1 beat)</label><select id="songSelect"><option>Loading your 4 works...</option></select></div><div class="field"><label>📦 Package</label><select id="packageSelect"><option value="">Select package</option><option value="starter">Starter - 50k</option><option value="tiktok">TikTok Viral - 150k</option><option value="hero">Homepage Hero - 300k</option></select></div><div class="field"><label>📅 Start Date</label><input id="startDate" type="date"></div><div class="field"><label>🔗 TikTok Link</label><input id="tiktokUrl" type="url" placeholder="https://tiktok.com/..."></div><div class="field full"><label>📝 Note</label><textarea id="campaignNote"></textarea></div></div><div id="packageSummary" class="notice">Select work and package</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-primary" id="submitBtn" onclick="submitPromotion()" style="flex:1">🚀 Start Promotion</button><button class="btn btn-secondary" onclick="resetForm()">Clear</button></div><div id="status" class="status"></div></div></section>
<section class="section" style="margin-top:18px"><h2 style="font-size:14px;margin-bottom:8px">📊 My Promotions</h2><div class="card"><div id="promotionList">Loading...</div></div></section>
</main>
<script>
const SUPABASE_URL="https://mtufczmjlkvycarxylgh.supabase.co";
const SUPABASE_KEY="sb_publishable_XDIZ0_nd4PAYJy2Oz4VaxQ_R4Trs3VP";
let supabaseClient=null;try{if(window.supabase)supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
let currentUser=null,currentArtist=null,songs=[],selectedGoal="streams",selectedPackage=null,selectedAmount=50000,selectedDays=7,packageMap={};
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function chooseGoal(btn,g){document.querySelectorAll(".goal").forEach(x=>x.classList.remove("selected"));btn.classList.add("selected");selectedGoal=g;}
function selectPackage(id,amount,days){selectedPackage=id;selectedAmount=amount;selectedDays=days;$("packageSelect").value=id;$("previewPackage").textContent=id+" UGX "+amount.toLocaleString();$("previewDuration").textContent=days+" days";$("packageSummary").textContent="Selected: "+id+" = UGX "+amount.toLocaleString()+" for "+days+" days";}
$("packageSelect").addEventListener("change",e=>{const v=e.target.value;if(v==='starter')selectPackage('starter',50000,7);if(v==='tiktok')selectPackage('tiktok',150000,14);if(v==='hero')selectPackage('hero',300000,30);});
async function loadPackages(){for(let t of ['packages','promotion_packages']){try{let {data}=await supabaseClient.from(t).select('id, name, slug, code');if(data&&data.length){data.forEach(p=>{let k=(p.slug||p.code||p.name||'').toLowerCase();if(k.includes('start'))packageMap['starter']=p.id;if(k.includes('tiktok')||k.includes('viral'))packageMap['tiktok']=p.id;if(k.includes('hero')||k.includes('home'))packageMap['hero']=p.id;});break;}}catch(e){}}}
async function checkLogin(){try{const {data:{session}} = await supabaseClient.auth.getSession();const user = session?.user || (await supabaseClient.auth.getUser()).data?.user;if(!user)return false;currentUser=user;$("userInfo").textContent=`Logged: ${user.email} - 1 email / 3 IDs system - spending tracked separately`;try{const {data:artist}=await supabaseClient.from('artists').select('id').eq('user_id', currentUser.id).maybeSingle();if(artist)currentArtist=artist;}catch(e){}return true;}catch(e){return false}}
async function loadArtistSongs(){
  if(!currentUser)return;
  const sel=$("songSelect"); sel.innerHTML='<option>Loading 3 songs + 1 beat...</option>';
  let allWorks=[]; const uid=currentUser.id;
  let allProducerIds = [];
  try{ const {data} = await supabaseClient.from('artists').select('id').eq('user_id', uid); if(data) allProducerIds.push(...data.map(x=>x.id)); }catch(e){}
  try{ const {data} = await supabaseClient.from('producers').select('id').eq('user_id', uid); if(data) allProducerIds.push(...data.map(x=>x.id)); }catch(e){}
  try{ const {data} = await supabaseClient.from('djs').select('id').eq('user_id', uid); if(data) allProducerIds.push(...data.map(x=>x.id)); }catch(e){}
  allProducerIds.push('119e7b2d-4115-44e9-ba0f-e47d4a3fa332');
  allProducerIds = [...new Set(allProducerIds)];
  console.log("All 3 IDs for 1 email:", allProducerIds);
  try{
    let combined = [];
    let {data:byUser} = await supabaseClient.from('songs').select('id, title, cover_url, artist_id').or(`uploader_user_id.eq.${uid},artist_user_id.eq.${uid}`).limit(100);
    if(byUser) combined.push(...byUser);
    for(let pid of allProducerIds){
      let {data:byArtist} = await supabaseClient.from('songs').select('id, title, cover_url, artist_id').eq('artist_id', pid).limit(100);
      if(byArtist) combined.push(...byArtist);
    }
    combined = [...new Map(combined.map(m=>[m.id,m])).values()];
    if(combined.length) allWorks.push(...combined.map(x=>({...x,type:'Song',label:`🎵 ${x.title} (Song)`})));
  }catch(e){console.log(e);}
  for(let pid of allProducerIds){
    try{
      let {data:beats} = await supabaseClient.from('beats').select('id, title, cover_url, producer_id').eq('producer_id', pid).limit(100);
      if(beats && beats.length){
        console.log("FOUND BEAT for", pid, beats[0].title);
        allWorks.push(...beats.map(x=>({...x,type:'Beat',label:`🎹 ${x.title} (Beat)`,artist_id: pid})));
      }
    }catch(e){}
  }
  allWorks = [...new Map(allWorks.map(m=>[m.id,m])).values()];
  songs = allWorks;
  const cSong = songs.filter(x=>x.type==='Song').length;
  const cBeat = songs.filter(x=>x.type==='Beat').length;
  $("foundCount").textContent = `Found ${songs.length}: ${cSong} Songs + ${cBeat} Beats (includes Nyange) - 1 Email 3 IDs`;
  if(!songs.length){ sel.innerHTML='<option>No works</option>'; return; }
  sel.innerHTML = '<option value="">Select what to promote (3 songs + 1 beat)</option>' + songs.map(x=>`<option value="${x.id}">${escapeHtml(x.label)}</option>`).join("");
  sel.onchange=()=>{
    const w=songs.find(z=>z.id==sel.value);
    if(w){ $("previewCover").src=w.cover_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(w.title)}&background=171022&color=c084fc&bold=true&size=600`; $("previewTitle").textContent=w.title; $("previewArtist").textContent=`${w.type} - ${w.label}`; }
  };
}
async function submitPromotion(){
  const status=$("status");function show(m,t){status.className="status show "+t;status.textContent=m;status.scrollIntoView();}
  const songId=$("songSelect").value,pkg=$("packageSelect").value,start=$("startDate").value;
  if(!currentUser){show("Login first","error");return} if(!songId||!pkg||!start){show("Select work, package and date","error");return}
  const b=$("submitBtn");b.disabled=true;b.textContent="Creating...";
  try{
    const work=songs.find(s=>s.id==songId); const startDate=new Date(start); const endDate=new Date(startDate);endDate.setDate(endDate.getDate()+selectedDays);
    let insertData={song_id:work.type==='Song'?songId:null, beat_id:work.type==='Beat'?songId:null, artist_id:currentArtist?.id||work?.artist_id||work?.producer_id||null, package_id:packageMap[pkg]||null, start_date:startDate.toISOString(), end_date:endDate.toISOString(), amount:selectedAmount, currency:'UGX', status:'pending', payment_status:'pending', user_id:currentUser.id, song_title:work?.title||'Promo', content_type:work?.type||'Song', goal:selectedGoal, tiktok_url:$("tiktokUrl").value||null, campaign_note:$("campaignNote").value||null, notes:`Package: ${pkg} - ${work?.type} - ${work?.title}`};
    const {data,error}=await supabaseClient.from('promotions').insert([insertData]).select().single(); if(error)throw error;
    const params=new URLSearchParams({promotion_id:data.id,song_id:songId,song:work?.title||"",type:work?.type||"Song",package:pkg,amount:selectedAmount,currency:'UGX',start_date:start}); window.location.href=`pasong_checkout.html?${params.toString()}`;
  }catch(e){show("Error: "+e.message+" - Run RLS fix SQL if blocked","error");b.disabled=false;b.textContent="🚀 Start Promotion";}
}
async function loadMyPromotions(){const box=$("promotionList");if(!currentUser)return;box.textContent="Loading...";try{const {data:rows}=await supabaseClient.from('promotions').select('*').eq('user_id', currentUser.id).order('created_at',{ascending:false}).limit(20);if(!rows||!rows.length){box.innerHTML="No campaigns yet.";return}box.innerHTML=rows.map(p=>`<div class="promo-row"><div><b>${escapeHtml(p.song_title||p.song_id||p.beat_id)}</b><br><small>${p.content_type||''} • UGX ${p.amount||''} • ${p.goal||''}</small></div><div>${escapeHtml(p.status)}</div></div>`).join("")}catch(e){box.textContent="Error: "+e.message}}
function resetForm(){$("songSelect").value="";$("packageSelect").value="";$("startDate").value=todayStr();}
(async function(){if($("startDate"))$("startDate").value=todayStr();await checkLogin();await loadPackages();await loadArtistSongs();await loadMyPromotions();})();
</script>
</body>
</html>
