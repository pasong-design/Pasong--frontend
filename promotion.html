<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#09050e">
<title>PASONG Promotion Center</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at 15% 0%,#8b5cf622,transparent 30%),radial-gradient(circle at 90% 20%,#ec489918,transparent 28%),#09050e;min-height:100vh}
header{position:sticky;top:0;z-index:100;height:62px;background:#09050eee;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff12}
.nav{max-width:1180px;height:100%;margin:auto;padding:0 18px;display:flex;align-items:center;gap:25px}
.logo{text-decoration:none;font-weight:900;font-size:16px;letter-spacing:.8px;display:flex;align-items:center;gap:8px;white-space:nowrap;color:#fff}
.logo-mark{width:23px;height:23px;border-radius:7px;background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 0 20px #8b5cf655}
.nav-links{display:flex;align-items:center;gap:20px;flex:1}
.nav-links a{text-decoration:none;color:#918b98;font-size:12px;font-weight:800}.nav-links a:hover,.nav-links a.active{color:#c084fc}
.account-btn{border:1px solid #392151;background:#160d22;color:#c084fc;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:900}
main{max-width:1120px;margin:auto;padding:35px 18px 80px}
.hero{position:relative;overflow:hidden;border:1px solid #35205a;border-radius:24px;padding:42px 30px;background:radial-gradient(circle at 82% 10%,#ec48992e,transparent 30%),linear-gradient(135deg,#160c25,#0c0712 60%,#160b22);box-shadow:0 25px 80px #00000059}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin-bottom:12px}.hero h1 span{background:linear-gradient(135deg,#c084fc,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:700px;color:#a79eaf;font-size:13px;line-height:1.7}.hero-badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#8b5cf622;border:1px solid #8b5cf644;color:#d8b4fe;font-size:9px;font-weight:900;letter-spacing:1px;margin-bottom:14px}
.hero-actions,.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{border:0;border-radius:11px;padding:12px 17px;cursor:pointer;font-weight:900;font-size:11px}.btn-primary{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}.btn-secondary{background:#21102f;color:#ddd;border:1px solid #442761}.btn:disabled{opacity:.45;cursor:not-allowed}
.section{margin-top:28px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:13px}.section-head h2{font-size:20px}.section-head p{color:#777;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#120a1bf2;border:1px solid #2d1944;border-radius:17px;padding:18px}
.package{position:relative;overflow:hidden;transition:.22s}.package:hover{transform:translateY(-3px);border-color:#68409a;box-shadow:0 18px 45px #00000040}.hero-package{border-color:#ec489970;background:linear-gradient(160deg,#24102e,#130a1c)}
.package-tag{position:absolute;top:12px;right:12px;padding:5px 8px;border-radius:999px;font-size:7px;font-weight:900;background:#ec489922;color:#f9a8d4;border:1px solid #ec489944}
.package-icon{font-size:25px;margin-bottom:10px}.package h3{font-size:16px;margin-bottom:7px}.package-desc{font-size:10px;color:#92899a;line-height:1.6;min-height:48px}.package-price{font-size:22px;font-weight:900;color:#c084fc;margin:15px 0 4px}.package-duration{font-size:9px;color:#777}
.features{list-style:none;margin:14px 0 17px}.features li{font-size:9px;color:#aaa;margin:8px 0}.features li:before{content:"✓";color:#c084fc;font-weight:900;margin-right:7px}
.goals{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.goal{padding:13px 8px;text-align:center;border-radius:13px;background:#120a1b;border:1px solid #2d1944;color:#91899a;cursor:pointer;font-size:9px;font-weight:900;transition:.2s}.goal span{display:block;font-size:20px;margin-bottom:6px}.goal.selected{border-color:#8b5cf6;color:#e9d5ff;background:#8b5cf622}
.preview{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:center}.preview-art{width:190px;height:107px;border-radius:12px;overflow:hidden;background:#100918;border:1px solid #352052;position:relative}.preview-art img{width:100%;height:100%;object-fit:cover;display:block}.preview-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent,#000000a6)}.preview-play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#ec4899);font-size:13px}.preview-info h3{font-size:16px;margin-bottom:5px}.preview-info p{color:#89818f;font-size:10px;line-height:1.6}.preview-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 8px;border-radius:999px;background:#21102f;color:#c4b5fd;font-size:8px;font-weight:900}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:10px;font-weight:900;color:#c9c0d0}
input,select,textarea{width:100%;background:#0b0611;border:1px solid #392151;border-radius:10px;padding:12px;color:#fff;outline:none;font-size:11px}select option{background:#120a1b}input:focus,select:focus,textarea:focus{border-color:#8b5cf6}textarea{min-height:75px;resize:vertical}.help{font-size:9px;color:#716978;line-height:1.5}
.status{display:none;padding:12px;border-radius:11px;margin-top:14px;font-size:10px;line-height:1.5}.status.show{display:block}.status.success{background:#0d2115;border:1px solid #245d32;color:#9ae6a8}.status.error{background:#2a1017;border:1px solid #6c2636;color:#ff9caf}.status.info{background:#17112a;border:1px solid #4b2870;color:#d8c6ff}
.promo-list{display:grid;gap:9px}.promo-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 14px;border:1px solid #2d1944;border-radius:12px;background:#120a1b}.promo-title{font-size:11px;font-weight:900}.promo-meta{font-size:8px;color:#777;margin-top:4px}.promo-status{padding:6px 9px;border-radius:999px;font-size:7px;font-weight:900;text-transform:uppercase;background:#21102f;color:#c4b5fd}.promo-price{font-size:10px;color:#c084fc;font-weight:900}.empty{text-align:center;color:#777;font-size:10px;padding:20px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{text-align:center;padding:16px 10px}.step-num{width:32px;height:32px;border-radius:50%;margin:0 auto 9px;display:grid;place-items:center;background:#8b5cf622;border:1px solid #4b2870;color:#c084fc;font-weight:900;font-size:11px}.step h3{font-size:10px;margin-bottom:5px}.step p{font-size:8px;color:#777;line-height:1.5}
.notice{margin-top:12px;padding:11px 13px;border-radius:10px;background:#8b5cf612;border:1px solid #8b5cf62b;color:#9c91a7;font-size:9px;line-height:1.6}
.mobile-nav{display:none}
@media(max-width:800px){.nav-links{display:none}.nav{justify-content:space-between}main{padding:20px 12px 100px}.hero{padding:28px 20px}.grid{grid-template-columns:1fr}.goals{grid-template-columns:repeat(2,1fr)}.preview{grid-template-columns:1fr}.preview-art{width:100%;height:auto;aspect-ratio:16/9}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.steps{grid-template-columns:1fr 1fr}.promo-row{grid-template-columns:1fr auto}.promo-price{grid-column:2;grid-row:1}}
@media(max-width:420px){.hero h1{font-size:29px}.steps{grid-template-columns:1fr 1fr}.promo-row{grid-template-columns:1fr}.promo-price{grid-column:auto;grid-row:auto}.mobile-nav{position:fixed;display:flex;left:9px;right:9px;bottom:10px;z-index:150;height:54px;border-radius:17px;background:#120a1bf7;backdrop-filter:blur(18px);border:1px solid #ffffff14;align-items:center;justify-content:space-around;box-shadow:0 15px 40px #00000073}.mobile-nav a{font-size:8px;color:#817887;text-decoration:none;text-align:center;font-weight:900}.mobile-nav a.active{color:#c084fc}.mobile-nav span{display:block;font-size:17px;line-height:19px}}
</style>
</head>
<body>
<header><div class="nav">
<a href="index.html" class="logo"><span class="logo-mark"></span>PASONG</a>
<nav class="nav-links">
<a href="index.html">Home</a><a href="store.html">Music Store</a><a href="charts.html">Charts</a><a href="artists.html">Artists</a><a href="playlists.html">Playlists</a><a href="promotion.html" class="active">Promotion</a>
</nav>
<button class="account-btn" onclick="location.href='account.html'">●</button>
</div></header>
<main>
<section class="hero">
<div class="hero-badge">🚀 PASONG PROMOTION CENTER</div>
<h1>Put your music <span>in front of more people.</span></h1>
<p>Promote your songs across PASONG with professional campaign packages. Choose your goal, select your music, preview your promotion and submit your campaign.</p>
<div class="hero-actions"><button class="btn btn-primary" onclick="document.getElementById('packages').scrollIntoView()">Explore Packages</button><button class="btn btn-secondary" onclick="document.getElementById('myPromotions').scrollIntoView()">My Promotions</button></div>
</section>
